<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="../../assets/icons/favicon-64.png">
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../../style2.css"><link rel="stylesheet" href="../../piclearn.css"><link rel="stylesheet" href="../../l1.css"><link rel="stylesheet" href="../../fx2.css">
<link rel="stylesheet" href="common.css"><link rel="stylesheet" href="engine.css">
<script src="dur.js"></script><script src="clips.js"></script><script src="common.js"></script><script src="engine.js"></script>
<title>เหล่าซือลามา · บท 0-3</title>
</head><body>
<script>
const BA=w('八','bā','แปด'),FO=w('佛像','fóxiàng','พระพุทธรูป'),E_=w('饿','è','หิว'),HE=w('喝','hē','ดื่ม'),BB=w('爸爸','bàba','พ่อ'),KL=w('可乐','kělè','โคล่า');
const MC=(list)=>`<div class="mcards3">${list.map(([m,l,k,s])=>`<button class="press" data-play="${k}">${mouth(m,'',84)}<span class="py">${l}</span><small>${s}</small></button>`).join('')}</div>`;
LESSON({no:3,goal:{do:'อ่าน <span class="gz">爸爸喝可乐</span> ได้',sub:'สระ 3 ตัวแรก a o e ผ่านคำจริง',min:5},steps:[
 hook({q:'ฟัง 2 เสียงนี้<br>เสียงใดแปลว่า "แปด"',pic:BA,cards:[BA.k,E_.k],ans:0,fb:'เสียง A คือ <b>bā</b> <span class="zh">八</span> = แปด · เสียง B คือ <b>è</b> <span class="zh">饿</span> = หิว'}),
 teach({title:'สระจีน 3 ตัวแรก',text:'สามเสียงนี้ต่างกันที่รูปปาก แตะเพื่อฟังทีละเสียง',html:MC([['a','a','a1-f','อ้าปากกว้าง'],['o','o','o1-f','ห่อปากกลม'],['e','e','e1-f','อ้าปากครึ่งเดียว']])}),
 word({n:'คำที่ 1/4',w:BA,py:'b[ā]',aid:{mouth:'a'},hint:'เหมือน <b>"อา"</b> ในภาษาไทย อ้าปากกว้าง',sk:'a1-f',sl:'a'}),
 mouthQ({tag:'ลองเอง · รูปปาก',k:'a1-f',opts:[['o','o'],['a','a']],ans:1,fb:'เสียง <b>a</b> อ้าปากกว้าง เหมือน "อา"'}),
 rec({n:'คำที่ 1/4',w:BA}),
 word({n:'คำที่ 2/4',w:FO,py:'f[ó]xiàng',aid:{mouth:'o'},hint:'ห่อปากกลม เริ่มที่ <b>"โอ"</b> แล้วคลายเป็น <b>"ออ"</b> เล็กน้อย',sk:'o2-f',sl:'o'}),
 mouthQ({tag:'ลองเอง · รูปปาก',k:'o1-f',opts:[['a','a'],['o','o'],['e','e']],ans:1,fb:'เสียง <b>o</b> ห่อปากกลม'}),
 rec({n:'คำที่ 2/4',w:FO,keys:['o2-f',FO.k],say:'fó · fóxiàng'}),
 ask({rv:2,q:'ฟังแล้วเลือกเส้นเสียงที่ได้ยิน',k:'ma4',opts:[{tone:1,lab:'mā'},{tone:4,lab:'mà'}],ans:1,fb:'<b class="t4">mà</b> <span class="zh">骂</span> = ดุ · เสียง 4 ตกลงเร็ว'}),
 word({n:'คำที่ 3/4',w:E_,py:'[è]',aid:{mouth:'e'},hint:'ไม่มีในภาษาไทย ทำปาก <b>"เออ"</b> แล้วดึงเสียงลงลำคอ · ห้ามอ่านเป็น <b>"เอ"</b>',sk:'e1-f',sl:'e'}),
 word({n:'คำที่ 4/4',w:HE,py:'h[ē]',aid:{mouth:'e'},hint:'สระเดียวกับ <span class="zh">饿</span> ออกเสียงคล้าย <b>"เฮอ"</b> สูงค้างไว้'}),
 mouthQ({tag:'ลองเอง · รูปปาก',k:'e1-f',opts:[['a','a'],['o','o'],['e','e']],ans:2,fb:'เสียง <b>e</b> อ้าปากครึ่งเดียว เสียง "เออ" ในลำคอ'}),
 rec({n:'คำที่ 3–4',ws:[E_,HE]}),
 ask({tag:'ตรวจ · 3 สระ',q:'ฟังเสียง แล้วเลือกภาพที่ตรงกับความหมาย',k:E_.k,opts:[{img:BA.img},{img:E_.img},{img:FO.img}],ans:1,fb:'<b>è</b> <span class="zh">饿</span> = หิว'}),
 ask({rv:1,q:'ข้อใดคือพินอิน',opts:['bàba','爸爸'],ans:0,fb:'<b>bàba</b> คือพินอินของ <span class="zh">爸爸</span> (พ่อ)'}),
 ask({tag:QZ(1,4),q:'ฟังเสียง แล้วเลือกพินอิน',k:'a4-f',opts:['à','è','ò'],ans:0,fb:'<b>à</b> สระ a เสียง 4'}),
 mouthQ({tag:QZ(2,4),k:'o1-f',opts:[['e',''],['o',''],['a','']],ans:1,fb:'<b>ō</b> ห่อปากกลม'}),
 ask({tag:QZ(3,4),q:'ฟังเสียง แล้วเลือกภาพ',k:HE.k,opts:[{img:HE.img},{img:BA.img},{img:FO.img}],ans:0,fb:'<b>hē</b> <span class="zh">喝</span> = ดื่ม'}),
 ask({tag:QZ(4,4),q:'ฟังเสียง แล้วเลือกพินอิน',k:'o2-f',opts:['ó','é'],ans:0,fb:'<b>ó</b> สระ o เสียง 2'}),
 fin({title:'อ่านประโยคของคุณ',pics:[BB,KL],chips:[{zh:'爸爸',py:'bàba',th:'พ่อ',k:BB.k},{zh:'喝',py:'hē',th:'ดื่ม',k:HE.k},{zh:'可乐',py:'kělè',th:'โคล่า',k:KL.k}],th:'พ่อดื่มโคล่า',note:'แตะแต่ละคำเพื่อฟัง · 爸 ตัวที่สองอ่านเบา ๆ',k:'g:L03'})]});

</script>
</body></html>
