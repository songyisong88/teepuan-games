<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="../../assets/icons/favicon-64.png">
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../../style2.css"><link rel="stylesheet" href="../../piclearn.css"><link rel="stylesheet" href="../../l1.css"><link rel="stylesheet" href="../../fx2.css">
<link rel="stylesheet" href="common.css"><link rel="stylesheet" href="engine.css">
<script src="dur.js"></script><script src="clips.js"></script><script src="common.js"></script><script src="engine.js"></script>
<title>เหล่าซือลามา · บท 0-9</title>
</head><body>
<script>
const MA=w('马','mǎ','ม้า'),MI=w('米','mǐ','ข้าวสาร'),GG=w('哥哥','gēge','พี่ชาย'),LV=w('绿','lǜ','สีเขียว'),QI=w('七','qī','เจ็ด'),XX=w('谢谢','xièxie','ขอบคุณ'),LS=w('老师','lǎoshī','ครู');
const T=['พยัญชนะ','สระ','วรรณยุกต์'];
LESSON({no:9,goal:{do:'อ่าน <span class="gz">谢谢老师</span> ได้',sub:'ต่อ พยัญชนะ + สระ + วรรณยุกต์ เป็นพยางค์',min:6},steps:[
 hook({q:'m + a + เสียง 3<br>ฟังแล้วเลือก เสียงใดถูกต้อง',show:partsH(['m','a',3]),cards:['ma3','ma1'],ans:0,fb:'m + a + เสียง 3 = <b class="t3">mǎ</b> <span class="zh">马</span> = ม้า'}),
 teach({title:'พยางค์จีน = 3 ชิ้น',text:'พยัญชนะ + สระ + วรรณยุกต์ ต่อกันเป็นเสียงเดียว เหมือนการสะกดคำภาษาไทย',html:`${partsH(['m','a',3])}<div class="center" style="margin-top:12px"><button class="mbtn2 press" style="margin:0 auto" data-play="ma3">${SPK}ฟัง mǎ</button></div>`,note:'บทนี้ลองต่อเองทีละคำ'}),
 word({n:'คำที่ 1/5',w:MA,py:'mǎ',aid:{parts:['m','a',3]},hcap:'วิธีต่อเสียง',hint:'<b>"ม"</b> + <b>"อา"</b> + เสียง 3 ลงแล้วขึ้น'}),
 build({n:'คำที่ 1/5',w:MA,syl:[['m','a',3]],extra:['b',1],res:'mǎ'}),
 word({n:'คำที่ 2/5',w:MI,py:'mǐ',aid:{parts:['m','i',3]},hcap:'วิธีต่อเสียง',hint:'<b>"ม"</b> + <b>"อี"</b> + เสียง 3'}),
 build({n:'คำที่ 2/5',w:MI,syl:[['m','i',3]],extra:['u',4],res:'mǐ'}),
 rec({n:'คำที่ 1–2',ws:[MA,MI]}),
 ask({rv:8,q:'ฟังเสียง แล้วเลือกพยัญชนะ',k:'si1-f',opts:['s','sh'],ans:0,fb:'<b>s</b> ลิ้นแบน'}),
 word({n:'คำที่ 3/5',w:GG,py:'gēge',aid:{parts:['g','e',1]},hcap:'วิธีต่อเสียง',hint:'<b>"ก"</b> + <b>"เออ"</b> + เสียง 1 · ตัวที่สองอ่านเบา ๆ'}),
 build({n:'คำที่ 3/5',w:GG,syl:[['g','e',1],['g','e',0]],extra:['k'],res:'gēge',prompt:'ต่อทีละพยางค์ · พยางค์ที่สองอ่านเบา'}),
 word({n:'คำที่ 4/5',w:LV,py:'lǜ',aid:{parts:['l','ü',4]},hcap:'วิธีต่อเสียง',hint:'<b>"ล"</b> + <b>ü</b> + เสียง 4 ตกลงเร็ว'}),
 build({n:'คำที่ 4/5',w:LV,syl:[['l','ü',4]],extra:['u','n'],res:'lǜ'}),
 rec({n:'คำที่ 3–4',ws:[GG,LV]}),
 word({n:'คำที่ 5/5',w:QI,py:'qī',aid:{parts:['q','i',1]},hcap:'วิธีต่อเสียง',hint:'<b>"ช"</b> แบบยิ้ม มีลม + <b>"อี"</b> + เสียง 1'}),
 build({n:'คำที่ 5/5',w:QI,syl:[['q','i',1]],extra:['j',4],res:'qī'}),
 rec({n:'คำที่ 5',w:QI}),
 ask({tag:'ตรวจ · ต่อเสียง',q:'ฟังเสียง แล้วเลือกภาพที่ตรงกับความหมาย',k:QI.k,opts:[{img:MI.img},{img:QI.img},{img:MA.img}],ans:1,fb:'<b>qī</b> <span class="zh">七</span> = เจ็ด'}),
 ask({rv:5,q:'ฟังเสียง แล้วเลือกพยัญชนะ',k:'te4-f',opts:['d','t'],ans:1,fb:'<b>t</b> มีลม'}),
 ask({tag:QZ(1,4),q:'l + ü + เสียง 4 อ่านว่าอะไร',show:partsH(['l','ü',4]),opts:['lǜ','lù','lǚ'],ans:0,fb:'<b>lǜ</b> <span class="zh">绿</span>'}),
 ask({tag:QZ(2,4),q:'ฟังเสียง แล้วเลือกพินอิน',k:MI.k,opts:['mǐ','mǎ'],ans:0,fb:'<b>mǐ</b> <span class="zh">米</span>'}),
 ask({tag:QZ(3,4),q:'ฟังเสียง แล้วเลือกภาพ',k:GG.k,opts:[{img:GG.img},{img:LV.img}],ans:0,fb:'<b>gēge</b> <span class="zh">哥哥</span>'}),
 ask({tag:QZ(4,4),q:'q + i + เสียง 1 อ่านว่าอะไร',show:partsH(['q','i',1]),opts:[{img:QI.img},{img:MI.img}],ans:0,fb:'<b>qī</b> <span class="zh">七</span> = เจ็ด'}),
 fin({title:'อ่านประโยคของคุณ',pics:[XX,LS],chips:[{zh:'谢谢',py:'xièxie',th:'ขอบคุณ',k:XX.k},{zh:'老师',py:'lǎoshī',th:'ครู',k:LS.k}],th:'ขอบคุณครับ/ค่ะ คุณครู',note:'ทุกพยางค์ต่อจาก 3 ชิ้นเหมือนกัน · แตะเพื่อฟัง',k:'g:L09'})]});

</script>
</body></html>
