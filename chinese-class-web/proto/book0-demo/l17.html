<style>
.scene{position:relative;height:250px;border-radius:16px;overflow:hidden;border:1.5px solid var(--ink);background:linear-gradient(#F6EAD8 0 68%,#E8D8C1 68%)}

.readc .py span.hl{color:var(--ink);transform:translateY(-4px)}

.nbtn.on{border-color:var(--ok);background:var(--oksoft)}
.nbtn.play{border-color:var(--red);background:var(--redsoft)}
.vsel{display:flex;gap:6px;justify-content:center}
.vsel button{border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:5px 14px;font-size:13px;cursor:pointer;color:var(--sub)}
.vsel button.on{border-color:var(--red);color:var(--red);background:var(--redsoft);font-weight:600}
.rhyme{display:flex;flex-wrap:nowrap;justify-content:center;gap:0 1px;font-size:22px}
.rhyme span{padding:0 3px;border-radius:6px;transition:background .15s,color .15s}
.rhyme span.hl{background:var(--red);color:#fff}
.hands{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.hbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px 2px;cursor:pointer;text-align:center;animation:rise .35s ease-out both}
.hbtn svg{width:100%;height:auto;display:block}
.hbtn b{font-family:Inter,sans-serif;font-size:16px}
.hbtn.on{border-color:var(--ok);background:var(--oksoft)}
.hbtn.cur{border-color:var(--red)}
.hbig{display:flex;gap:12px;align-items:center}
.hbig svg{width:118px;height:auto;flex:none;animation:pop .35s ease-out both}
.hbig .t{font-size:14.5px;line-height:1.5}
.hbig .t .zh{font-size:30px;color:var(--ink)}
.opt svg{width:72px;height:auto;display:block;margin:0 auto}
.opts.three{grid-template-columns:repeat(3,1fr)}
.timer{height:6px;background:var(--line);border-radius:4px;overflow:hidden}.timer i{display:block;height:100%;background:var(--gold);width:100%}
.sec{font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.comic .basket{position:absolute;left:36%;bottom:8px;width:74px}
.comic .tag{right:auto;left:40%;top:auto;bottom:70px;font-size:18px}
.tag.bump{animation:good .5s ease}
.nbook{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.nbook div{background:#F3ECE4;border-radius:10px;padding:4px 0;text-align:center;color:#B9ACA0;transition:all .4s}
.nbook div .zh{font-size:20px;display:block}
.nbook div small{font-family:Inter,sans-serif;font-size:11px}
.nbook div.on{background:var(--redsoft);color:var(--red)}
</style>
