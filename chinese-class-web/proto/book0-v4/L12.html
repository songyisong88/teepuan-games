<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="../../assets/icons/favicon-64.png">
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../../style2.css"><link rel="stylesheet" href="../../piclearn.css"><link rel="stylesheet" href="../../l1.css"><link rel="stylesheet" href="../../fx2.css">
<link rel="stylesheet" href="common.css"><link rel="stylesheet" href="engine.css">
<script src="dur.js"></script><script src="clips.js"></script><script src="common.js"></script><script src="engine.js"></script>
<title>ต้นแบบ · บท 0-12</title>
</head><body>
<script>
const YI=w('一','yī','หนึ่ง'),WU=w('五','wǔ','ห้า'),YU=w('鱼','yú','ปลา'),QU=w('去','qù','ไป'),CHI=w('吃','chī','กิน'),ZI=w('字','zì','ตัวอักษร'),QI=w('七','qī','เจ็ด'),MM=w('妈妈','māma','แม่'),NH=w('你好','nǐ hǎo','สวัสดี'),BKQ=w('不客气','bú kèqi','ไม่เป็นไร'),YY=w('一样','yíyàng','เหมือนกัน'),YQ=w('一起','yìqǐ','ด้วยกัน'),XX=w('谢谢','xièxie','ขอบคุณ');
LESSON({no:12,goal:{do:'โต้ตอบ <span class="gz">谢谢 — 不客气</span> ได้',sub:'กติกาการเขียนและเสียงที่เปลี่ยนในคำจริง',min:7},steps:[
 hook({q:'ฟังคำนี้<br>พยางค์แรก ได้ยินเป็นเสียงใด',pic:NH,k:NH.k,opts:[{tone:3,lab:'nǐ'},{tone:2,lab:'ní'}],ans:1,fb:'เขียน <b>nǐ hǎo</b> แต่พูดจริงเป็น <b class="t2">ní</b> hǎo · บทนี้จะรู้เหตุผล'}),
 teach({title:'กติกาพิเศษ 3 กลุ่ม',text:'พินอินบางคำเขียนต่างจากที่เรียน และบางคำเปลี่ยนเสียงเมื่ออยู่ติดกัน',html:`<div class="rule"><span>1 · การเขียน y w</span><span>2 · พยางค์ที่อ่านทั้งพยางค์</span><span>3 · เสียงที่เปลี่ยน</span></div>`,note:'แบ่งเป็น 3 ช่วงสั้น ๆ'}),
 part({no:1,of:3,title:'การเขียน y และ w',chips:['i → yi','u → wu','ü → yu'],note:'เมื่อสระอยู่ต้นพยางค์ · สระผสมก็เช่นกัน เช่น ia → ya · uo → wo · iou → you'}),
 word({n:'ช่วงที่ 1 · yi',w:YI,py:'[y]ī',aid:{mouth:'i'},hcap:'กติกา',hint:'สระ <b>i</b> อยู่ต้นพยางค์ เขียนเป็น <b>yi</b> · ยังอ่าน <b>"อี"</b> เหมือนเดิม'}),
 word({n:'ช่วงที่ 1 · wu',w:WU,py:'[w]ǔ',aid:{mouth:'u'},hcap:'กติกา',hint:'สระ <b>u</b> อยู่ต้นพยางค์ เขียนเป็น <b>wu</b> · ยังอ่าน <b>"อู"</b>'}),
 word({n:'ช่วงที่ 1 · yu',w:YU,py:'[y]ú',aid:{mouth:'v'},hcap:'กติกา',hint:'สระ <b>ü</b> อยู่ต้นพยางค์ เขียนเป็น <b>yu</b> ไม่มีจุด · อ่าน <b>ü</b>'}),
 word({n:'ช่วงที่ 1 · qu',w:QU,py:'q[ù]',aid:{mouth:'v'},hcap:'กติกา',hint:'หลัง <b>j q x</b> เขียน u แต่อ่านเป็น <b>ü</b> เสมอ'}),
 ask({tag:'ลองเอง · กติกา',q:'ฟังเสียง <b>qù</b> สระที่ได้ยินคือตัวใด',k:QU.k,opts:[{mouth:'u',lab:'u'},{mouth:'v',lab:'ü'}],ans:1,fb:'หลัง q อ่านเป็น <b>ü</b>'}),
 rec({n:'ช่วงที่ 1',ws:[YI,WU,YU]}),
 part({no:2,of:3,title:'i ที่ไม่อ่าน "อี"',chips:['zhi chi shi ri','zi ci si'],note:'i หลังพยัญชนะ 7 ตัวนี้ ไม่อ่าน "อี"'}),
 word({n:'ช่วงที่ 2 · chi',w:CHI,py:'ch[ī]',aid:{mouth:'curl'},hcap:'กติกา',hint:'ไม่อ่าน <b>"ชี"</b> · ยกปลายลิ้นค้างไว้ แล้วเปล่งเสียงต่อ'}),
 word({n:'ช่วงที่ 2 · zi',w:ZI,py:'z[ì]',aid:{mouth:'flat'},hcap:'กติกา',hint:'ไม่อ่าน <b>"จี"</b> · ลิ้นแบนค้างไว้ คล้าย <b>"จือ"</b>'}),
 pair({n:'',title:'i สองแบบ',text:'แตะฟังทั้งสองคำ · qī อ่าน "อี" แต่ chī ไม่ใช่',items:[{mouth:'smile',py:'qī',zh:'七',sub:'"อี" ตามปกติ',k:QI.k},{mouth:'curl',py:'chī',zh:'吃',sub:'ม้วนลิ้นค้าง',k:CHI.k}]}),
 rec({n:'ช่วงที่ 2',ws:[CHI,ZI]}),
 ask({tag:'ตรวจ · ช่วงที่ 2',q:'ฟังเสียง แล้วเลือกภาพที่ตรงกับความหมาย',k:CHI.k,opts:[{img:QI.img},{img:CHI.img}],ans:1,fb:'<b>chī</b> <span class="zh">吃</span> = กิน'}),
 ask({rv:11,q:'ฟังเสียง แล้วเลือกพินอิน',k:'w:龙',opts:['lón','lóng'],ans:1,fb:'<b>lóng</b> ตัวสะกด -ng'}),
 part({no:3,of:3,title:'เสียงที่เปลี่ยนในคำจริง',chips:['เสียงเบา','3+3','不','一'],note:'4 กติกา พร้อมคำตัวอย่าง'}),
 word({n:'ช่วงที่ 3 · เสียงเบา',w:MM,py:'mā[ma]',aid:{parts:['m','a',0]},hcap:'กติกา',hint:'พยางค์ที่ไม่มีเครื่องหมาย อ่าน <b>สั้นและเบา</b>'}),
 word({n:'ช่วงที่ 3 · 3+3',w:NH,py:'[nǐ] hǎo',aid:{tone:2,cap:'เสียง 3 สองตัวติดกัน ตัวแรกเปลี่ยนเป็นเสียง 2'},hcap:'กติกา',hint:'เขียนตามเสียงเดิมเสมอ <b>nǐ hǎo</b> แต่พูดเป็น <b>ní hǎo</b>'}),
 word({n:'ช่วงที่ 3 · 不',w:BKQ,py:'[bú] kèqi',aid:{tone:2,cap:'不 หน้าเสียง 4 เปลี่ยนเป็นเสียง 2'},hcap:'กติกา',hint:'<span class="zh">不</span> ปกติเป็น bù · หน้าเสียง 4 อ่านเป็น <b>bú</b><br><small>หนังสือเรียนส่วนใหญ่เขียนตามเสียงที่อ่าน (bú yí yì) แต่พจนานุกรมเขียน bù yī</small>'}),
 ask({tag:'ลองเอง · กติกา',q:'不 + 是 (shì เสียง 4) อ่านว่าอะไร',big:1,opts:['bù shì','bú shì'],ans:1,fb:'หน้าเสียง 4 อ่าน <b>bú</b> · bú shì'}),
 word({n:'ช่วงที่ 3 · 一',w:YY,py:'[yí]yàng',aid:{tone:2,cap:'一 หน้าเสียง 4 เปลี่ยนเป็นเสียง 2'},hcap:'กติกา',hint:'<span class="zh">一</span> หน้าเสียง 4 อ่าน <b>yí</b>'}),
 word({n:'ช่วงที่ 3 · 一',w:YQ,py:'[yì]qǐ',aid:{tone:4,cap:'一 หน้าเสียง 1 2 3 เปลี่ยนเป็นเสียง 4'},hcap:'กติกา',hint:'<span class="zh">一</span> หน้าเสียง 1 2 3 อ่าน <b>yì</b> · อยู่เดี่ยว ๆ หรือนับลำดับ อ่าน <b>yī</b>'}),
 ask({tag:'ลองเอง · กติกา',q:'ฟังเสียง แล้วเลือกพินอินที่ได้ยินจริง',k:YQ.k,opts:['yīqǐ','yìqǐ','yíqǐ'],ans:1,fb:'<b>yìqǐ</b> <span class="zh">一起</span> = ด้วยกัน'}),
 rec({n:'ช่วงที่ 3',ws:[NH,BKQ]}),
 ask({rv:10,q:'ฟังเสียง แล้วเลือกภาพ',k:'w:鸟',opts:[{img:ART('牛')},{img:ART('鸟')}],ans:1,fb:'<b>niǎo</b> <span class="zh">鸟</span> = นก'}),
 ask({tag:QZ(1,4),q:'ฟังเสียง แล้วเลือกภาพ',k:WU.k,opts:[{img:YI.img},{img:WU.img},{img:YU.img}],ans:1,fb:'<b>wǔ</b> <span class="zh">五</span>'}),
 ask({tag:QZ(2,4),q:'ฟังเสียง แล้วเลือกพินอินที่ได้ยินจริง',k:YY.k,opts:['yíyàng','yīyàng'],ans:0,fb:'<b>yíyàng</b>'}),
 ask({tag:QZ(3,4),q:'ฟังเสียง แล้วเลือกพินอิน',k:QU.k,opts:['qù','qì'],ans:0,fb:'<b>qù</b> <span class="zh">去</span>'}),
 ask({tag:QZ(4,4),q:'你好 พูดจริงอ่านว่าอะไร',big:1,opts:['ní hǎo','nǐ háo'],ans:0,fb:'<b>ní hǎo</b>'}),
 fin({title:'โต้ตอบได้แล้ว',pics:[XX],chips:[{zh:'谢谢',py:'xièxie',th:'ขอบคุณ',k:XX.k},{zh:'不客气',py:'bú kèqi',th:'ไม่เป็นไร',k:BKQ.k}],th:'ขอบคุณ — ไม่เป็นไร',note:'xie ตัวที่สองเบา · 不 อ่าน bú (พจนานุกรมเขียน bù)',k:'g:L12'})]});

</script>
</body></html>
