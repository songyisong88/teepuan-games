<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="../../assets/icons/favicon-64.png">
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../../style2.css"><link rel="stylesheet" href="../../piclearn.css"><link rel="stylesheet" href="../../l1.css"><link rel="stylesheet" href="../../fx2.css">
<link rel="stylesheet" href="common.css"><link rel="stylesheet" href="engine.css"><link rel="stylesheet" href="book1.css">
<script src="dur.js"></script><script src="clips.js"></script><script src="common.js"></script><script src="engine.js"></script><script src="book1.js"></script>
<title>ต้นแบบ · บท 1-1 ทักทาย ขอบคุณ บอกลา</title>
</head><body>
<script>
const NH=w('你好','nǐ hǎo','สวัสดี'),XX=w('谢谢','xièxie','ขอบคุณ'),ZJ=w('再见','zàijiàn','ลาก่อน');
const GIFT=ART('礼物'),SCH=ART('学校'),BOOK=ART('书');
/* บทสนทนาเปิดบท */
const D=[{who:'f',zh:'你好！',py:'nǐ hǎo!',th:'สวัสดี',k:'nihao-s-m'},{who:'me',zh:'你好！',py:'nǐ hǎo!',th:'สวัสดี',k:'nihao-s-f'},
 {sit:'คุณให้ของขวัญเพื่อน',img:GIFT},{who:'f',zh:'谢谢！',py:'xièxie!',th:'ขอบคุณ',k:'xiexie-s-m'},
 {sit:'ถึงเวลากลับบ้าน',img:SCH},{who:'f',zh:'再见！',py:'zàijiàn!',th:'ลาก่อน',k:'zaijian-s-m'},{who:'me',zh:'再见！',py:'zàijiàn!',th:'ลาก่อน',k:'zaijian-s-f'}];
const R={nh:{zh:'你好！',py:'nǐ hǎo!',th:'สวัสดี',k:'nihao-s-f'},xx:{zh:'谢谢！',py:'xièxie!',th:'ขอบคุณ',k:'xiexie-s-f'},zj:{zh:'再见！',py:'zàijiàn!',th:'ลาก่อน',k:'zaijian-s-f'}};
const MQ=(i)=>`ภารกิจ ${i}/3 · ไม่มีตัวช่วยภาษาไทย`;
LESSON({no:1,goal:{do:'ทักทาย ขอบคุณ และบอกลาเป็นภาษาจีนได้',sub:'พูด <span class="gz">你好 谢谢 再见</span> ให้ถูกสถานการณ์',min:6},steps:[
 sceneHook({scene:SC('l1-p1'),line:D[0],q:'ทุกคนในภาพกำลังเจอกัน<br>เพื่อนพูดว่า 你好！ แปลว่าอะไร',opts:['สวัสดี','ขอบคุณ'],ans:0,fb:'<span class="zh">你好</span> <b>nǐ hǎo</b> = สวัสดี · ใช้ตอนเจอกัน'}),
 dialog({title:'เจอเพื่อนที่โรงเรียน',text:'ฟังบทสนทนาทั้งหมดก่อน แตะฟองเพื่อฟังซ้ำได้',lines:D,note:'บทนี้มี 3 คำ เรียนทีละคำ แล้วคุณจะพูดบทนี้ได้เอง'}),
 word({n:'คำที่ 1/3',cap:'ใช้ตอนเจอกัน',w:NH,py:'n[í] hǎo',aid:{rule:['nǐ hǎo','ní hǎo'],cap:'เสียง 3 สองตัวติดกัน ตัวแรกอ่านเป็นเสียง 2'},hint:'คล้าย <b>"หนี๋ ห่าว"</b> · พยางค์แรกเสียงขึ้น',sk:'nihao-fs',sl:'ช้า'}),
 syl({n:'คำที่ 1/3',w:NH,chars:[{zh:'你',py:'ní',t:2,k:'g:ni2'},{zh:'好',py:'hǎo',t:3,k:'g:hao3'}],done:'ní + hǎo = ní hǎo'}),
 rec({n:'คำที่ 1/3',w:NH,keys:['nihao-fs',NH.k]}),
 ask({rv:12,q:'你 nǐ + 好 hǎo<br>อ่านต่อกันจริงว่าอะไร',k:NH.k,opts:['ní hǎo','nǐ hǎo'],ans:0,fb:'<b>ní hǎo</b> · เสียง 3 + เสียง 3 ตัวแรกเปลี่ยนเป็นเสียง 2'}),
 word({n:'คำที่ 2/3',cap:'ใช้ตอนได้รับของหรือความช่วยเหลือ',w:XX,aid:{parts:['xiè',4,'xie',0],cap:'พยางค์แรกเสียง 4 · พยางค์ที่สองอ่านเบา'},hint:'คล้าย <b>"เซี่ย เซี่ย"</b> · พยางค์ที่สองพูดเบาและสั้น',sk:'xiexie-fs',sl:'ช้า'}),
 syl({n:'คำที่ 2/3',w:XX,chars:[{zh:'谢',py:'xiè',t:4,k:'g:xie4'},{zh:'谢',py:'xie',t:0}],done:'xiè + xie เบา = xièxie'}),
 rec({n:'คำที่ 2/3',w:XX,keys:['xiexie-fs',XX.k]}),
 ask({tag:'ตรวจ · ฟังแล้วเลือกความหมาย',q:'ฟังเสียง แล้วเลือกความหมาย',k:XX.k,opts:['สวัสดี','ขอบคุณ'],ans:1,fb:'<span class="zh">谢谢</span> <b>xièxie</b> = ขอบคุณ'}),
 word({n:'คำที่ 3/3',cap:'ใช้ตอนแยกจากกัน',w:ZJ,aid:{parts:['zài',4,'jiàn',4],cap:'เสียง 4 ทั้งสองพยางค์ ตกลงเร็ว'},hint:'คล้าย <b>"ไจ้ เจี้ยน"</b> · พูดสั้นและหนักแน่น',sk:'zaijian-fs',sl:'ช้า'}),
 syl({n:'คำที่ 3/3',w:ZJ,chars:[{zh:'再',py:'zài',t:4,k:'g:zai4'},{zh:'见',py:'jiàn',t:4,k:'g:jian4'}],done:'zài + jiàn = zàijiàn'}),
 ask({rv:2,q:'ฟังพยางค์ 再 แล้วเลือกเส้นเสียง',k:'g:zai4',opts:[{tone:1,lab:'เสียง 1'},{tone:4,lab:'เสียง 4'}],ans:1,fb:'<b class="t4">zài</b> <span class="zh">再</span> · เสียง 4 ตกเร็ว'}),
 rec({n:'คำที่ 3/3',w:ZJ,keys:['zaijian-fs',ZJ.k]}),
 part({lab:'ฝึกในบทสนทนา',of:0,title:'คุณเป็นฝ่ายตอบ',chips:['你好','谢谢','再见'],note:'เพื่อนพูดก่อน แล้วคุณเลือกว่าจะตอบอะไร'}),
 reply({tag:'ฝึกในบทสนทนา 1/3',q:'เพื่อนทักคุณ คุณจะตอบว่าอะไร',line:D[0],opts:[R.nh,R.zj],ans:0,why:'ตอบทักทายด้วยคำเดียวกัน'}),
 reply({tag:'ฝึกในบทสนทนา 2/3',q:'เพื่อนให้ของขวัญคุณ คุณจะพูดว่าอะไร',hist:[D[0],{who:'me',...R.nh}],sit:'เพื่อนให้ของขวัญคุณ',simg:GIFT,opts:[R.nh,R.xx],ans:1,why:'ได้รับของ ต้องขอบคุณ'}),
 reply({tag:'ฝึกในบทสนทนา 3/3',q:'เพื่อนบอกลา คุณจะตอบว่าอะไร',hist:[{who:'me',...R.xx}],sit:'ถึงเวลากลับบ้าน',simg:SCH,line:D[5],opts:[R.xx,R.zj],ans:1,why:'บอกลาตอบด้วยคำเดียวกัน'}),
 ask({rv:8,q:'ฟัง 再见 แล้วเลือกพยัญชนะตัวแรก',k:ZJ.k,opts:['z','zh'],ans:0,fb:'<b>z</b>ài · ลิ้นแบน ไม่ม้วนลิ้น'}),
 part({lab:'ภารกิจท้ายบท',of:0,title:'วันแรกในห้องเรียน',chips:['ทักครู','ขอบคุณครู','บอกลาครู'],note:'ไม่มีคำแปลภาษาไทย ฟังแล้วเลือกคำตอบให้ถูกทั้ง 3 ข้อ'}),
 reply({tag:MQ(1),noTh:1,q:'ครูทักคุณ',sit:'เข้าห้องเรียนตอนเช้า',simg:SCH,line:{who:'t',zh:'你好！',py:'nǐ hǎo!',th:'สวัสดี',k:'nihao-s-m'},opts:[R.xx,R.zj,R.nh],ans:2}),
 reply({tag:MQ(2),noTh:1,q:'คุณจะพูดว่าอะไร',sit:'ครูยื่นหนังสือให้คุณ',simg:BOOK,opts:[R.xx,R.nh,R.zj],ans:0}),
 reply({tag:MQ(3),noTh:1,q:'เลิกเรียนแล้ว ครูพูดกับคุณ',sit:'เลิกเรียน',simg:SCH,line:{who:'t',zh:'再见！',py:'zàijiàn!',th:'ลาก่อน',k:'zaijian-s-m'},opts:[R.nh,R.zj,R.xx],ans:1}),
 fin({title:'ทักทาย ขอบคุณ และบอกลาได้แล้ว',html:dlgH(D,{noTh:1}),chips:[{zh:'你好',py:'nǐ hǎo',th:'สวัสดี',k:NH.k},{zh:'谢谢',py:'xièxie',th:'ขอบคุณ',k:XX.k},{zh:'再见',py:'zàijiàn',th:'ลาก่อน',k:ZJ.k}],note:'แตะฟองหรือคำเพื่อฟังอีกครั้ง',k:'g:dlg',kl:'ฟังทั้งบทสนทนา'})]});

</script>
</body></html>
