<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="../../assets/icons/favicon-64.png">
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../../style2.css"><link rel="stylesheet" href="../../piclearn.css"><link rel="stylesheet" href="../../l1.css"><link rel="stylesheet" href="../../fx2.css">
<link rel="stylesheet" href="common.css"><link rel="stylesheet" href="engine.css"><link rel="stylesheet" href="book1.css">
<script src="dur.js"></script><script src="clips.js"></script><script src="common.js"></script><script src="engine.js"></script><script src="book1.js"></script>
<title>ต้นแบบ · บท 1-1 ทักทาย ขอบคุณ บอกลา</title>
</head><body>
<script>
/* บท 1-1 v2 (ซ้งอี้ 4 พ.ย. 2026): คำศัพท์ใหม่ → อธิบายทีละคำ → เทคนิคการใช้ → แบบทดสอบท้ายบท → จบบท */
const NH=w('你好','nǐ hǎo','สวัสดี'),XX=w('谢谢','xièxie','ขอบคุณ'),ZJ=w('再见','zàijiàn','ลาก่อน');
const NIN=w('您好','nín hǎo','สวัสดี (สุภาพ)'),BKQ=w('不客气','bú kèqi','ไม่เป็นไร'),MTJ=w('明天见','míngtiān jiàn','พรุ่งนี้เจอกัน');
const GIFT=ART('礼物'),SCH=ART('学校'),BOOK=ART('书'),HAND=ART('手'),MATE=ART('同学'),FRIEND=ART('朋友'),DOOR=ART('门'),TCH=ART('老师'),BOY=ART('男孩'),TMR=ART('明天');
const D=[{who:'f',zh:'你好！',py:'nǐ hǎo!',th:'สวัสดี',k:'nihao-s-m'},{who:'me',zh:'你好！',py:'nǐ hǎo!',th:'สวัสดี',k:'nihao-s-f'},
 {sit:'คุณให้ของขวัญเพื่อน',img:GIFT},{who:'f',zh:'谢谢！',py:'xièxie!',th:'ขอบคุณ',k:'xiexie-s-m'},{who:'me',zh:'不客气！',py:'bú kèqi!',th:'ไม่เป็นไร',k:'bkq-f'},
 {sit:'ถึงเวลากลับบ้าน',img:SCH},{who:'f',zh:'再见！',py:'zàijiàn!',th:'ลาก่อน',k:'zaijian-s-m'},{who:'me',zh:'再见！',py:'zàijiàn!',th:'ลาก่อน',k:'zaijian-s-f'}];
const R={nh:{zh:'你好！',py:'nǐ hǎo!',th:'สวัสดี',k:'nihao-s-f'},xx:{zh:'谢谢！',py:'xièxie!',th:'ขอบคุณ',k:'xiexie-s-f'},zj:{zh:'再见！',py:'zàijiàn!',th:'ลาก่อน',k:'zaijian-s-f'},
 bkq:{zh:'不客气！',py:'bú kèqi!',th:'ไม่เป็นไร',k:'bkq-f'},lsh:{zh:'老师好！',py:'lǎoshī hǎo!',th:'สวัสดีคุณครู',k:'lsh-f'},xxls:{zh:'谢谢老师！',py:'xièxie lǎoshī!',th:'ขอบคุณคุณครู',k:'xxls-f'},
 mtj:{zh:'明天见！',py:'míngtiān jiàn!',th:'พรุ่งนี้เจอกัน',k:'mtj-f'}};
const TQ=i=>`แบบทดสอบ ${i}/5 · มีคำแปลช่วย`,MQ=i=>`ภารกิจ ${i}/3 · ไม่มีตัวช่วยภาษาไทย`;
LESSON({no:1,goal:{do:'ทักทาย ขอบคุณ และบอกลาเป็นภาษาจีนได้',sub:'รู้ว่าใช้ <span class="gz">你好 谢谢 再见</span> เมื่อไร และตอบกลับได้สุภาพ',min:9},steps:[
 /* 1 · เปิดบท + คำศัพท์ใหม่ */
 intro({scene:SC('l1-p1'),cap:'สถานการณ์ของบทนี้',title:'วันแรกที่โรงเรียน',line:D[0],note:'แตะฟองเพื่อฟังเพื่อนทักคุณ · บทนี้คุณจะได้ทักทาย ขอบคุณ และบอกลา'}),
 vocab({title:'3 คำที่จะได้เรียน',text:'แตะการ์ดเพื่อฟังเสียงทีละคำ',items:[{w:NH,img:MATE},{w:XX,img:GIFT},{w:ZJ,img:HAND}]}),
 /* 2 · เรียนทีละคำ */
 part({lab:'ช่วงที่ 1/3',no:1,of:3,title:'เรียนทีละคำ',chips:['你好','谢谢','再见'],note:'ฟังเสียง ดูวิธีออกเสียง และดูว่าใช้เมื่อไร'}),
 word({n:'คำที่ 1/3',cap:'ใช้ตอนเจอกัน',w:NH,py:'n[í] hǎo',aid:{rule:['nǐ hǎo','ní hǎo'],cap:'เสียง 3 สองตัวติดกัน ตัวแรกอ่านเป็นเสียง 2'},hint:'คล้าย <b>"หนี๋ ห่าว"</b> · พยางค์แรกเสียงขึ้น',sk:'nihao-fs',sl:'ช้า'}),
 syl({n:'คำที่ 1/3',w:NH,chars:[{zh:'你',py:'ní',t:2,k:'g:ni2'},{zh:'好',py:'hǎo',t:3,k:'g:hao3'}],done:'ní + hǎo = ní hǎo'}),
 use({n:'คำที่ 1/3',w:NH,when:[{img:MATE,t:'เจอเพื่อน'},{img:SCH,t:'มาถึงโรงเรียน'},{img:FRIEND,t:'เจอคนรู้จัก'}],lines:[D[0],D[1]],tip:'<b>ตอบกลับด้วยคำเดิม</b> 你好 ได้เลย · ใช้ได้ทุกช่วงเวลาของวัน'}),
 rec({n:'คำที่ 1/3',w:NH,keys:['nihao-fs',NH.k]}),
 word({n:'คำที่ 2/3',cap:'ใช้ตอนได้รับของหรือความช่วยเหลือ',w:XX,aid:{parts:['xiè',4,'xie',0],cap:'พยางค์แรกเสียง 4 · พยางค์ที่สองอ่านเบา'},hint:'คล้าย <b>"เซี่ย เซี่ย"</b> · พยางค์ที่สองพูดเบาและสั้น',sk:'xiexie-fs',sl:'ช้า'}),
 syl({n:'คำที่ 2/3',w:XX,chars:[{zh:'谢',py:'xiè',t:4,k:'g:xie4'},{zh:'谢',py:'xie',t:0}],done:'xiè + xie เบา = xièxie'}),
 use({n:'คำที่ 2/3',w:XX,when:[{img:GIFT,t:'ได้รับของขวัญ'},{img:BOOK,t:'มีคนยื่นของให้'}],lines:[{sit:'เพื่อนยื่นหนังสือให้คุณ',img:BOOK},{who:'me',...R.xx}],tip:'อยากบอกว่าขอบคุณใคร ให้เติมไว้ข้างหลัง เช่น <span class="zh">谢谢老师</span> ขอบคุณคุณครู'}),
 rec({n:'คำที่ 2/3',w:XX,keys:['xiexie-fs',XX.k]}),
 word({n:'คำที่ 3/3',cap:'ใช้ตอนแยกจากกัน',w:ZJ,aid:{parts:['zài',4,'jiàn',4],cap:'เสียง 4 ทั้งสองพยางค์ ตกลงเร็ว'},hint:'คล้าย <b>"ไจ้ เจี้ยน"</b> · พูดสั้นและหนักแน่น',sk:'zaijian-fs',sl:'ช้า'}),
 syl({n:'คำที่ 3/3',w:ZJ,chars:[{zh:'再',py:'zài',t:4,k:'g:zai4'},{zh:'见',py:'jiàn',t:4,k:'g:jian4'}],done:'zài + jiàn = zàijiàn'}),
 use({n:'คำที่ 3/3',w:ZJ,when:[{img:SCH,t:'เลิกเรียน'},{img:DOOR,t:'แยกกันกลับบ้าน'}],lines:[{sit:'เลิกเรียนแล้ว',img:SCH},D[6],D[7]],tip:'ฝ่ายหนึ่งพูด 再见 อีกฝ่าย<b>ตอบ 再见 กลับ</b> · พูดพร้อมโบกมือได้'}),
 rec({n:'คำที่ 3/3',w:ZJ,keys:['zaijian-fs',ZJ.k]}),
 /* 3 · เทคนิคการใช้ (เรียน ไม่ใช่ทดสอบ) */
 part({lab:'ช่วงที่ 2/3',no:2,of:3,title:'เทคนิคการใช้',chips:['บทสนทนา','您好','不客气','明天见'],note:'ดูว่าคนจีนใช้คำเหล่านี้อย่างไรในชีวิตจริง'}),
 dialog({cap:'เทคนิค 1/5 · บทสนทนาที่โรงเรียน',title:'เจอเพื่อน ให้ของ แล้วกลับบ้าน',text:'ฟังทั้งบทสนทนา แตะฟองเพื่อฟังซ้ำได้',lines:D,note:'สังเกตว่าคำทักทายและคำบอกลา ตอบกลับด้วยคำเดิม'}),
 cmp({cap:'เทคนิค 2/5 · ทักใครใช้คำไหน',title:'你好 กับ 您好',text:'ความหมายเหมือนกัน ต่างกันที่ความสุภาพ',a:{who:'กับเพื่อน',img:BOY,zh:'你好',py:'nǐ hǎo',th:'สวัสดี',k:NH.k},b:{who:'กับครู ผู้ใหญ่',img:TCH,zh:'您好',py:'nín hǎo',th:'สวัสดี (สุภาพ)',k:NIN.k},
  tip:'<span class="zh">您</span> nín คือ "คุณ" แบบให้เกียรติ · ทักครูพูดอีกแบบได้ว่า <span class="zh">老师好</span>',chips:[{zh:'老师好',py:'lǎoshī hǎo',th:'สวัสดีคุณครู',k:'lsh-f'}]}),
 talk({cap:'เทคนิค 3/5 · ตอบคำขอบคุณ',title:'谢谢 แล้วตอบด้วย 不客气',text:'不客气 bú kèqi แปลว่า ไม่เป็นไร ยินดี',lines:[{who:'f',zh:'谢谢！',py:'xièxie!',th:'ขอบคุณ',k:'xiexie-s-m'},{who:'me',...R.bkq},{sit:'ครูยื่นหนังสือให้คุณ',img:BOOK},{who:'me',...R.xxls},{who:'t',zh:'不客气！',py:'bú kèqi!',th:'ไม่เป็นไร',k:'bkq-m'}],tip:'ขอบคุณครู ใช้ <span class="zh">谢谢老师</span> จะสุภาพและอบอุ่นกว่า'}),
 cmp({cap:'เทคนิค 4/5 · บอกลาแบบไหนดี',title:'再见 กับ 明天见',text:'见 jiàn แปลว่า เจอ',a:{who:'ลาทั่วไป',img:HAND,zh:'再见',py:'zàijiàn',th:'ลาก่อน',k:ZJ.k},b:{who:'พรุ่งนี้เจอกันอีก',img:TMR,zh:'明天见',py:'míngtiān jiàn',th:'พรุ่งนี้เจอกัน',k:MTJ.k},
  tip:'明天 míngtiān = พรุ่งนี้ · บอกลาครูพูดว่า <span class="zh">老师再见</span>',chips:[{zh:'老师再见',py:'lǎoshī zàijiàn',th:'ลาก่อนคุณครู',k:'lszj-f'}]}),
 tips({cap:'เทคนิค 5/5 · ข้อควรระวัง',title:'ผิดบ่อยและมารยาท',items:[
  {h:'谢谢 พยางค์ที่สองอ่านเบา',bad:'xiè xiè หนักทั้งสองพยางค์',good:'xièxie',k:XX.k},
  {h:'再见 ลิ้นแบน ไม่ม้วนลิ้น',bad:'zhàijiàn',good:'zàijiàn',k:ZJ.k},
  {h:'ตอนแยกกัน ไม่ใช้ 你好',bad:'你好 ตอนกลับบ้าน',good:'再见 zàijiàn',k:'zaijian-s-f'},
  {h:'ทักครูหรือผู้ใหญ่',bad:'เรียกครูว่า 你 nǐ',good:'老师好 หรือ 您好',k:'lsh-f',note:'ใช้ 您 กับผู้ใหญ่ ฟังสุภาพกว่า'}]}),
 /* 4 · แบบทดสอบท้ายบท (ทบทวนเล่ม 0 แทรกในช่วงนี้เท่านั้น) */
 part({lab:'ช่วงที่ 3/3',no:3,of:3,title:'แบบทดสอบท้ายบท',chips:['ฟังแล้วเลือก','จับคู่','ตอบในบทสนทนา'],note:'ตอบผิดไม่เป็นไร ระบบจะเฉลยแล้วให้ลองข้อเดิมอีกครั้ง'}),
 ask({tag:TQ(1),q:'ฟังเสียง แล้วเลือกความหมาย',k:ZJ.k,opts:['สวัสดี','ขอบคุณ','ลาก่อน'],ans:2,fb:'<span class="zh">再见</span> <b>zàijiàn</b> = ลาก่อน'}),
 ask({rv:12,q:'你 nǐ + 好 hǎo<br>อ่านต่อกันจริงว่าอะไร',k:NH.k,opts:['ní hǎo','nǐ hǎo'],ans:0,fb:'<b>ní hǎo</b> · เสียง 3 + เสียง 3 ตัวแรกเปลี่ยนเป็นเสียง 2'}),
 match({tag:TQ(2),pairs:[NH,XX,ZJ,BKQ]}),
 reply({tag:TQ(3),q:'เพื่อนให้ของขวัญคุณ คุณจะพูดว่าอะไร',sit:'เพื่อนให้ของขวัญคุณ',simg:GIFT,opts:[R.nh,R.xx,R.zj],ans:1,why:'ได้รับของ ต้องขอบคุณ'}),
 ask({rv:2,q:'ฟังพยางค์ 再 แล้วเลือกเส้นเสียง',k:'g:zai4',opts:[{tone:1,lab:'เสียง 1'},{tone:4,lab:'เสียง 4'}],ans:1,fb:'<b class="t4">zài</b> <span class="zh">再</span> · เสียง 4 ตกเร็ว'}),
 reply({tag:TQ(4),q:'เพื่อนขอบคุณคุณ คุณจะตอบว่าอะไร',line:D[3],opts:[R.xx,R.bkq],ans:1,why:'มีคนขอบคุณ ตอบว่า 不客气'}),
 reply({tag:TQ(5),q:'เจอครูตอนเช้า ทักแบบสุภาพ',sit:'เจอครูตอนเช้า',simg:TCH,opts:[R.zj,R.lsh,R.bkq],ans:1,why:'ทักครูใช้ 老师好 หรือ 您好'}),
 ask({rv:8,q:'ฟัง 再见 แล้วเลือกพยัญชนะตัวแรก',k:ZJ.k,opts:['z','zh'],ans:0,fb:'<b>z</b>ài · ลิ้นแบน ไม่ม้วนลิ้น'}),
 part({lab:'ภารกิจท้ายบท',of:0,title:'วันแรกในห้องเรียน',chips:['ทักครู','ขอบคุณครู','บอกลาเพื่อน'],note:'ไม่มีคำแปลภาษาไทยแล้ว ฟังแล้วเลือกคำตอบให้ถูกทั้ง 3 ข้อ'}),
 reply({tag:MQ(1),noTh:1,q:'ครูทักคุณ',sit:'เข้าห้องเรียนตอนเช้า',simg:SCH,line:{who:'t',zh:'你好！',py:'nǐ hǎo!',th:'สวัสดี',k:'nihao-s-m'},opts:[R.xx,R.zj,R.lsh],ans:2}),
 reply({tag:MQ(2),noTh:1,q:'คุณจะพูดว่าอะไร',sit:'ครูยื่นหนังสือให้คุณ',simg:BOOK,opts:[R.bkq,R.xxls,R.nh],ans:1}),
 reply({tag:MQ(3),noTh:1,q:'เลิกเรียนแล้ว เพื่อนพูดกับคุณ',sit:'เลิกเรียน',simg:SCH,line:{who:'f',zh:'明天见！',py:'míngtiān jiàn!',th:'พรุ่งนี้เจอกัน',k:'mtj-m'},opts:[R.nh,R.xx,R.mtj],ans:2}),
 /* 5 · จบบท */
 fin({title:'ทักทาย ขอบคุณ และบอกลาได้แล้ว',html:dlgH(D,{noTh:1}),chips:[NH,XX,ZJ,NIN,BKQ,MTJ].map(x=>({zh:x.zh,py:x.py,th:x.th.replace(' (สุภาพ)',''),k:x.k})),note:'แตะฟองหรือคำเพื่อฟังอีกครั้ง',k:'g:dlg',kl:'ฟังทั้งบทสนทนา'})]});

</script>
</body></html>
