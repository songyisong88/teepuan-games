<title>ต้นแบบ · บท 1-4 เพื่อนร่วมชั้นและเพื่อน</title>
</head><body>
<script>
/* บท 1-4 (ซ้งอี้ 4 พ.ย. 2026): เพื่อนร่วมชั้นและเพื่อน · กิจกรรมเฉพาะบท: เรียงบทสนทนา (แตะฟองตามลำดับที่ควรพูด) และทักคนเดียว/หลายคน */
const TX=w('同学','tóngxué','เพื่อนร่วมชั้น'),PY=w('朋友','péngyou','เพื่อน'),DJH=w('大家好','dàjiā hǎo','สวัสดีทุกคน');
const DJ=w('大家','dàjiā','ทุกคน'),BOY=w('男孩','nánhái','เด็กผู้ชาย'),CLS=ART('教室'),TCH=w('老师','lǎoshī','ครู').img;
const R={nh:{zh:'你好！',py:'nǐ hǎo!',th:'สวัสดี',k:'nihao-s-f'},djh:{zh:'大家好！',py:'dàjiā hǎo!',th:'สวัสดีทุกคน',k:'djh-f'},lsh:{zh:'老师好！',py:'lǎoshī hǎo!',th:'สวัสดีคุณครู',k:'lsh-f'},
 zj:{zh:'再见！',py:'zàijiàn!',th:'ลาก่อน',k:'zaijian-s-f'},dbq:{zh:'对不起！',py:'duìbuqǐ!',th:'ขอโทษ',k:'dbq-f'},txmh:{zh:'同学们好！',py:'tóngxuémen hǎo!',th:'สวัสดีนักเรียนทุกคน',k:'txmh-f'}};
const L={txmh:{who:'t',zh:'同学们好！',py:'tóngxuémen hǎo!',th:'สวัสดีนักเรียนทุกคน',k:'txmh-t'},lsh:{who:'me',...R.lsh},tswpy:{who:'g',zh:'他是我朋友。',py:'tā shì wǒ péngyou.',th:'เขาเป็นเพื่อนของฉัน',k:'tswpy-g'},
 djhm:{who:'f',zh:'大家好！',py:'dàjiā hǎo!',th:'สวัสดีทุกคน',k:'djh-m'},nhme:{who:'me',...R.nh},nhg:{who:'g',zh:'你好！',py:'nǐ hǎo!',th:'สวัสดี',k:'nihao-g'},nhtx:{who:'f',zh:'你好，同学！',py:'nǐ hǎo, tóngxué!',th:'สวัสดีเพื่อน',k:'nhtx-m'}};
const D=[{sit:'ครูเข้าห้องเรียนตอนเช้า',img:CLS},L.txmh,L.lsh,{sit:'เพื่อนพาเพื่อนใหม่มาแนะนำ',img:PY.img},L.tswpy,L.djhm,L.nhme];
const TQ=i=>`แบบทดสอบ ${i}/5 · มีคำแปลช่วย`,MQ=i=>`ภารกิจ ${i}/3 · ไม่มีตัวช่วยภาษาไทย`;
const Z=(zh,th,noTh)=>`<span class="zh">${zh}</span>${noTh?'':` ${th}`}`;
LESSON({no:4,goal:{do:'ทักทายเพื่อน ทั้งคนเดียวและหลายคนได้',sub:'ใช้ <span class="gz">同学 朋友 大家好</span> และเติม <span class="gz">们</span> เมื่อมีหลายคน',min:8},steps:[
 /* 1 · เปิดบท + คำศัพท์ใหม่ */

 vgrid({title:'3 คำที่จะได้เรียน',text:'แตะการ์ดเพื่อฟังเสียงทีละคำ',items:[TX,PY,DJH]}),
 /* 2 · เรียนทีละคำ */
 part({lab:'ช่วงที่ 1/3',no:1,of:3,title:'เรียนทีละคำ',chips:['同学','朋友','大家好'],note:'ฟังเสียง ดูวิธีออกเสียง และดูว่าใช้เมื่อไร'}),
 wcard({no:1,of:3,cap:'คนที่เรียนด้วยกัน',w:TX,aid:{parts:['tóng',2,'xué',2],cap:'เสียง 2 ทั้งสองพยางค์ ขึ้นทั้งคู่'},hint:'คล้าย <b>"ถง เสวีย"</b> · xué ห่อปากแบบสระ ü',sk:'tx-fs',
  use:'ใช้เรียกคนที่เรียนห้องเดียวกันหรือโรงเรียนเดียวกัน ครูก็ใช้เรียกนักเรียน',ex:[{zh:'你好，同学！',py:'nǐ hǎo, tóngxué!',th:'สวัสดีเพื่อน',k:'nhtx-m'},{zh:'同学们好！',py:'tóngxuémen hǎo!',th:'สวัสดีนักเรียนทุกคน',k:'txmh-t'}]}),
 syl({n:'คำที่ 1/3',w:TX,chars:[{zh:'同',py:'tóng',t:2,k:'g:tong2'},{zh:'学',py:'xué',t:2,k:'g:xue2'}],done:'tóng + xué = tóngxué'}),
 rec({n:'คำที่ 1/3',w:TX,keys:['tx-fs',TX.k]}),
 wcard({no:2,of:3,cap:'คนที่สนิทกัน',w:PY,aid:{parts:['péng',2,'you',0],cap:'เสียง 2 · พยางค์ที่สองอ่านเบา'},hint:'คล้าย <b>"เผิง โหยว"</b> · you พูดเบาและสั้น',sk:'py-fs',
  use:'ใช้เรียกเพื่อนที่สนิทกัน ไม่จำเป็นต้องเรียนห้องเดียวกัน',ex:[L.tswpy,{zh:'她是我朋友。',py:'tā shì wǒ péngyou.',th:'เธอเป็นเพื่อนของฉัน',k:'taswpy-m'}]}),
 rec({n:'คำที่ 2/3',w:PY,keys:['py-fs',PY.k]}),
 wcard({no:3,of:3,cap:'ทักหลายคนพร้อมกัน',w:DJH,aid:{parts:['dà',4,'jiā',1,'hǎo',3],cap:'เสียง 4 · เสียง 1 · เสียง 3'},hint:'คล้าย <b>"ต้า เจีย ห่าว"</b> · 大家 แปลว่าทุกคน',sk:'djh-fs',
  use:'ใช้ทักคนหลายคนพร้อมกัน เช่น ยืนพูดหน้าห้อง หรือเดินเข้าไปในกลุ่มเพื่อน',ex:[{zh:'大家好！',py:'dàjiā hǎo!',th:'สวัสดีทุกคน',k:'djh-m'},{zh:'老师好，大家好！',py:'lǎoshī hǎo, dàjiā hǎo!',th:'สวัสดีคุณครู สวัสดีทุกคน',k:'lsdjh-f'}]}),
 rec({n:'คำที่ 3/3',w:DJH,keys:['djh-fs',DJH.k]}),
 /* 3 · เทคนิคการใช้ */
 part({lab:'ช่วงที่ 2/3',no:2,of:3,title:'เทคนิคการใช้',chips:['บทสนทนา','同学 กับ 朋友','เติม 们','เรียงบทสนทนา'],note:'ดูว่าทักคนเดียวกับทักหลายคนต่างกันอย่างไร'}),
 dialog({cap:'เทคนิค 1/5 · บทสนทนาในห้องเรียน',title:'ครูทักทั้งห้อง แล้วเพื่อนพาเพื่อนใหม่มา',text:'ฟังทั้งบทสนทนา แตะฟองเพื่อฟังซ้ำได้',lines:D,note:'เพื่อนใหม่ทัก 大家好 เพราะพูดกับหลายคน'}),
 cmp({cap:'เทคนิค 2/5 · เพื่อน 2 แบบ',title:'同学 กับ 朋友',text:'ภาษาไทยเรียกว่าเพื่อนทั้งคู่ แต่ภาษาจีนแยกกัน',
  a:{who:'เรียนด้วยกัน',img:TX.img,zh:'同学',py:'tóngxué',th:'เพื่อนร่วมชั้น',k:TX.k},b:{who:'สนิทกัน',img:PY.img,zh:'朋友',py:'péngyou',th:'เพื่อน',k:PY.k},
  tip:'同学 อาจเป็น 朋友 ด้วยก็ได้ · แต่ 朋友 ไม่จำเป็นต้องเรียนด้วยกัน'}),
 talk({cap:'เทคนิค 3/5 · หลายคน',title:'เติม 们 = หลายคน',text:'เติม 们 men ท้ายคำที่หมายถึงคน จะกลายเป็นหลายคน',

  tip:'们 อ่านเบา · ใช้กับคนเท่านั้น'}),

 tips({cap:'ข้อควรระวัง',title:'ผิดบ่อยและมารยาท',items:[
  {h:'大家好 ใช้กับหลายคน',bad:'เจอเพื่อนคนเดียว ทัก 大家好',good:'คนเดียว ทัก 你好',k:'nihao-s-f'},
  {h:'同学 ไม่เหมือน 学生',bad:'学生 = เพื่อน',good:'学生 = นักเรียน · 同学 = เพื่อนร่วมชั้น',k:TX.k},
  {h:'朋友 พยางค์ที่สองเบา',bad:'péng yǒu หนักทั้งคู่',good:'péngyou',k:PY.k},
  {h:'们 อ่านเบา',bad:'tóngxué mén',good:'tóngxuémen',k:'txm-f'}]}),
 /* 4 · แบบทดสอบท้ายบท */
 part({lab:'ช่วงที่ 3/3',no:3,of:3,title:'แบบทดสอบท้ายบท',chips:['ดูภาพเลือกคำทักทาย','เรียงบทสนทนา','ตอบในบทสนทนา'],note:'ตอบผิดไม่เป็นไร ระบบจะเฉลยแล้วให้ลองข้อเดิมอีกครั้ง'}),
 ask({tag:TQ(1),q:'ดูภาพ แล้วเลือกคำทักทายที่เหมาะ',pic:BOY,opts:[Z('大家好！','สวัสดีทุกคน'),Z('你好！','สวัสดี'),Z('再见！','ลาก่อน')],ans:1,fb:'เจอคนเดียว ทัก <span class="zh">你好！</span>'}),
 ask({rv:4,q:'ฟัง 学 xué แล้วเลือกสระ',k:'g:xue2',opts:['u','ü'],ans:1,fb:'x j q ตามด้วย ü จะเขียนเป็น u แต่อ่านเป็น ü'}),
 lineup({tag:TQ(2),sit:'เพื่อนพาเพื่อนใหม่มาแนะนำ',lines:[L.nhg,L.nhme,L.tswpy,L.djhm]}),
 ask({tag:TQ(3),q:'ฟังเสียง แล้วเลือกความหมาย',k:PY.k,opts:['ครู','เพื่อน','นักเรียน'],ans:1,fb:'<span class="zh">朋友</span> <b>péngyou</b> = เพื่อน'}),
 ask({rv:2,q:'ฟังพยางค์ 同 tóng แล้วเลือกเส้นเสียง',k:'g:tong2',opts:[{tone:2,lab:'เสียง 2'},{tone:3,lab:'เสียง 3'}],ans:0,fb:'<b class="t2">tóng</b> <span class="zh">同</span> · เสียง 2 ขึ้น'}),
 reply({tag:TQ(4),q:'ครูทักทั้งห้อง คุณจะตอบว่าอะไร',line:L.txmh,opts:[R.lsh,R.txmh,R.zj],ans:0,why:'ครูทักนักเรียน นักเรียนตอบ 老师好'}),
 reply({tag:TQ(5),q:'คุณยืนหน้าห้อง จะทักเพื่อนทุกคน',sit:'ยืนหน้าห้องเรียน เพื่อนนั่งอยู่หลายคน',simg:DJ.img,opts:[R.nh,R.djh,R.dbq],ans:1,why:'ทักหลายคน ใช้ 大家好'}),
 part({lab:'ภารกิจท้ายบท',of:0,title:'พักกลางวันกับเพื่อน',chips:['ทักทาย','เรียงบทสนทนา','ตอบเพื่อน'],note:'ไม่มีคำแปลภาษาไทยแล้ว ฟังแล้วตอบให้ถูกทั้ง 3 ข้อ'}),
 ask({tag:MQ(1),noTh:1,q:'ดูภาพ แล้วเลือกคำทักทายที่เหมาะ',pic:DJ,opts:[Z('你好！','',1),Z('大家好！','',1),Z('谢谢！','',1)],ans:1,fb:'<span class="zh">大家好！</span>'}),
 lineup({tag:MQ(2),noTh:1,sit:'เพื่อนทักคุณ แล้วคุณแนะนำเพื่อนผู้หญิงให้รู้จัก',lines:[L.nhtx,L.nhme,{who:'me',zh:'她是我朋友。',py:'tā shì wǒ péngyou.',th:'เธอเป็นเพื่อนของฉัน',k:'taswpy-f'},{who:'g',zh:'大家好！',py:'dàjiā hǎo!',th:'สวัสดีทุกคน',k:'djh-g'}]}),
 reply({tag:MQ(3),noTh:1,q:'เพื่อนพูดกับคุณ',line:L.nhtx,opts:[R.nh,R.djh,R.dbq],ans:0}),
 /* 5 · จบบท */
 fin({title:'ทักเพื่อนได้ทั้งคนเดียวและหลายคน',html:dlgH(D,{noTh:1}),chips:[{zh:'同学',py:'tóngxué',th:'เพื่อนร่วมชั้น',k:TX.k},{zh:'朋友',py:'péngyou',th:'เพื่อน',k:PY.k},{zh:'大家好',py:'dàjiā hǎo',th:'สวัสดีทุกคน',k:DJH.k},{zh:'们',py:'men',th:'หลายคน',k:'txm-f'}],note:'แตะฟองหรือคำเพื่อฟังอีกครั้ง',k:'g:dlg4',kl:'ฟังทั้งบทสนทนา'})]});

</script>
