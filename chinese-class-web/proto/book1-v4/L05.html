<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="../../assets/icons/favicon-64.png">
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../../style2.css"><link rel="stylesheet" href="../../piclearn.css"><link rel="stylesheet" href="../../l1.css"><link rel="stylesheet" href="../../fx2.css">
<link rel="stylesheet" href="common.css"><link rel="stylesheet" href="engine.css"><link rel="stylesheet" href="book1.css">

<title>ต้นแบบ · บท 1-5 ชื่อของฉัน</title>
</head><body>
<script>
/* บท 1-5 (ซ้งอี้ 4 พ.ย. 2026): ชื่อของฉัน · กิจกรรมเฉพาะบท: บัตรชื่อของฉัน (พิมพ์ชื่อตัวเอง) และเช็กชื่อในห้อง */
const JIAO=w('叫','jiào','ชื่อ (เรียกว่า)'),MZ=w('名字','míngzi','ชื่อ'),SM=w('什么','shénme','อะไร');
const BOY=ART('男孩'),GIRL=ART('女孩'),STU=ART('学生'),CLS=ART('教室');
const S=(zh,py,th,k,who)=>({who,zh,py,th,k});
const QN={nj:S('你叫什么名字？','nǐ jiào shénme míngzi?','คุณชื่ออะไร','njsmmz-t','t'),ta:S('他叫什么名字？','tā jiào shénme míngzi?','เขาชื่ออะไร','tajsmmz-t','t'),
 ta2:S('她叫什么名字？','tā jiào shénme míngzi?','เธอชื่ออะไร','tajsmmz-t','t'),ta2f:S('她叫什么名字？','tā jiào shénme míngzi?','เธอชื่ออะไร','tjsmmz-m','f')};
const A={ml:S('我叫玛莉。','wǒ jiào Mǎlì.','ฉันชื่อมะลิ','wjml-f','me'),wm:S('我叫王明。','wǒ jiào Wáng Míng.','ฉันชื่อหวังหมิง','wjwm-m','f'),ln:S('我叫李娜。','wǒ jiào Lǐ Nà.','ฉันชื่อหลี่น่า','wjln-g','g'),
 twm:S('他叫王明。','tā jiào Wáng Míng.','เขาชื่อหวังหมิง','tjwm-f','me'),tln:S('她叫李娜。','tā jiào Lǐ Nà.','เธอชื่อหลี่น่า','tjln-f','me'),nml:S('你叫玛莉。','nǐ jiào Mǎlì.','คุณชื่อมะลิ','njml-f','me')};
const D=[{sit:'วันแรกของเทอม ครูถามชื่อนักเรียน',img:CLS},QN.nj,A.ml,QN.ta,A.twm];
const TQ=i=>`แบบทดสอบ ${i}/5 · มีคำแปลช่วย`,MQ=i=>`ภารกิจ ${i}/3 · ไม่มีตัวช่วยภาษาไทย`;
const tl=(zh,py)=>({zh,py});
const ROLL=[{img:BOY,sit:'ครูถามเด็กผู้ชาย',line:QN.nj,opts:[A.wm,A.twm],ans:0,why:'ตอบชื่อตัวเอง ใช้ 我叫'},
 {img:GIRL,sit:'ครูชี้ที่เด็กผู้หญิง แล้วถามคุณ',line:QN.ta2,opts:[A.ln,A.tln],ans:1,why:'พูดถึงเธอ ใช้ 她叫'},
 {img:STU,sit:'ครูหันมาถามคุณ',line:QN.nj,opts:[A.nml,A.ml],ans:1,why:'ตอบชื่อตัวเอง ใช้ 我叫'}];
LESSON({no:5,goal:{do:'ถามชื่อ และบอกชื่อตัวเองเป็นภาษาจีนได้',sub:'ใช้ <span class="gz">你叫什么名字？</span> และตอบ <span class="gz">我叫…</span>',min:7},steps:[
 /* 1 · เปิดบท + คำศัพท์ใหม่ */
 intro({scene:SC('l4-p5'),cap:'สถานการณ์ของบทนี้',title:'ครูถามชื่อในวันแรก',line:QN.nj,note:'แตะฟองเพื่อฟังครูถาม · จบบทนี้คุณจะตอบชื่อตัวเองได้ และถามชื่อคนอื่นได้'}),
 vgrid({title:'3 คำที่จะได้เรียน',text:'แตะการ์ดเพื่อฟังเสียงทีละคำ',items:[JIAO,MZ,SM]}),
 /* 2 · เรียนทีละคำ */
 part({lab:'ช่วงที่ 1/3',no:1,of:3,title:'เรียนทีละคำ',chips:['叫','名字','什么'],note:'ฟังเสียง ดูวิธีออกเสียง และดูว่าใช้เมื่อไร'}),
 wcard({no:1,of:3,cap:'ใช้บอกชื่อ',w:JIAO,aid:{parts:['jiào',4],cap:'เสียง 4 ตกเร็ว'},hint:'คล้าย <b>"เจี้ยว"</b>',sk:'jiao-fs',
  use:'ใช้บอกชื่อ 我叫… แปลว่า ฉันชื่อ… แล้วตามด้วยชื่อได้เลย',ex:[A.ml,A.twm]}),
 rec({n:'คำที่ 1/3',w:JIAO,keys:['jiao-fs',JIAO.k]}),
 wcard({no:2,of:3,cap:'คำว่าชื่อ',w:MZ,aid:{parts:['míng',2,'zi',0],cap:'เสียง 2 · พยางค์ที่สองอ่านเบา'},hint:'คล้าย <b>"หมิง จึ"</b> · zi พูดเบาและสั้น',sk:'mz-fs',
  use:'แปลว่าชื่อ ใช้ในคำถาม 你叫什么名字 ตอนตอบไม่ต้องพูดคำนี้ซ้ำ',ex:[S('你叫什么名字？','nǐ jiào shénme míngzi?','คุณชื่ออะไร','njsmmz-f'),S('她叫什么名字？','tā jiào shénme míngzi?','เธอชื่ออะไร','tjsmmz-m')]}),
 syl({n:'คำที่ 2/3',w:MZ,chars:[{zh:'名',py:'míng',t:2,k:'g:ming2'},{zh:'字',py:'zi',t:0}],done:'míng + zi เบา = míngzi'}),
 wcard({no:3,of:3,cap:'คำถาม',w:SM,aid:{parts:['shén',2,'me',0],cap:'เสียง 2 · พยางค์ที่สองอ่านเบา'},hint:'คล้าย <b>"เสิน เมอ"</b> · shén ม้วนลิ้นขึ้น',sk:'sm-fs',
  use:'แปลว่าอะไร ใช้ถาม ภาษาจีนวาง 什么 ตรงตำแหน่งที่อยากรู้ ไม่ต้องย้ายไปไว้หน้าประโยค',ex:[QN.nj,S('什么？','shénme?','อะไรนะ','sm-m')]}),
 rec({n:'คำที่ 2–3/3',ws:[MZ,SM]}),
 /* 3 · เทคนิคการใช้ */
 part({lab:'ช่วงที่ 2/3',no:2,of:3,title:'เทคนิคการใช้',chips:['ถามชื่อ ตอบชื่อ','บัตรชื่อของฉัน','ถามชื่อคนอื่น'],note:'ฝึกถามและตอบชื่อในห้องเรียน'}),
 dialog({cap:'เทคนิค 1/4 · บทสนทนาในห้องเรียน',title:'ครูถามชื่อนักเรียน',text:'ฟังทั้งบทสนทนา แตะฟองเพื่อฟังซ้ำได้',lines:D,note:'ถามด้วย 叫 ก็ตอบด้วย 叫'}),
 namecard({cap:'เทคนิค 2/4 · บัตรชื่อของฉัน',title:'เขียนบัตรชื่อของคุณ',text:'พิมพ์ชื่อของคุณ หรือแตะชื่อตัวอย่าง แล้วพูดประโยค 我叫… ดัง ๆ',
  names:[{zh:'玛莉',py:'Mǎlì',th:'มะลิ',k:'wjml-f'},{zh:'王明',py:'Wáng Míng',th:'หวังหมิง',k:'wjwm-m'},{zh:'李娜',py:'Lǐ Nà',th:'หลี่น่า',k:'wjln-g'}],k:'wojiao-f'}),
 talk({cap:'เทคนิค 3/4 · ถามชื่อคนอื่น',title:'เปลี่ยนคนข้างหน้า',text:'ถามถึงใคร ก็ใช้ 你 他 她 ที่เรียนในบทก่อน',lines:[QN.ta,A.twm,QN.ta2f,A.tln],
  chips:[{zh:'我叫',py:'wǒ jiào',th:'ฉันชื่อ',k:'wojiao-f'}],tip:'ถามแบบไหน ตอบแบบนั้น · เอาชื่อมาวางแทน <span class="zh">什么名字</span>'}),
 tips({cap:'เทคนิค 4/4 · ข้อควรระวัง',title:'ผิดบ่อย',items:[
  {h:'ตอบไม่ต้องพูด 名字 ซ้ำ',bad:'我叫名字玛莉。',good:'我叫玛莉。',k:'wjml-f'},
  {h:'什么 อยู่ตรงที่อยากรู้',bad:'什么你叫名字？',good:'你叫什么名字？',k:'njsmmz-f'},
  {h:'什么 ต้องม้วนลิ้น',bad:'sénme',good:'shénme',k:SM.k},
  {h:'名字 พยางค์ที่สองเบา',bad:'míng zì หนักทั้งคู่',good:'míngzi',k:MZ.k}]}),
 /* 4 · แบบทดสอบท้ายบท */
 part({lab:'ช่วงที่ 3/3',no:3,of:3,title:'แบบทดสอบท้ายบท',chips:['เติมคำ','เรียงประโยค','เช็กชื่อ'],note:'ตอบผิดไม่เป็นไร ระบบจะเฉลยแล้วให้ลองข้อเดิมอีกครั้ง'}),
 blank({tag:TQ(1),s:'你叫_名字？',th:'คุณชื่ออะไร',opts:['什么','是','好'],ans:0,k:'njsmmz-f',fb:'<span class="zh">你叫什么名字？</span> = คุณชื่ออะไร'}),
 ask({rv:7,q:'ฟัง 什么 แล้วเลือกพยัญชนะตัวแรก',k:'g:shen2',opts:['s','sh'],ans:1,fb:'<b>sh</b>én · ม้วนลิ้นขึ้น'}),
 order({tag:TQ(2),th:'ฉันชื่อมะลิ',tiles:[tl('我','wǒ'),tl('叫','jiào'),tl('玛莉','Mǎlì'),tl('什么','shénme')],ans:[0,1,2],end:'。',k:'wjml-f'}),
 ask({tag:TQ(3),q:'ฟังประโยค แล้วเลือกความหมาย',k:'njsmmz-t',opts:['คุณชื่ออะไร','คุณเป็นนักเรียน','เธอชื่ออะไร'],ans:0,fb:'<span class="zh">你叫什么名字？</span> = คุณชื่ออะไร'}),
 blank({tag:TQ(4),s:'我_李娜。',th:'ฉันชื่อหลี่น่า',opts:['叫','什么','名字'],ans:0,k:'wjln-g',fb:'<span class="zh">我叫李娜。</span>'}),
 ask({rv:2,q:'ฟังพยางค์ 叫 jiào แล้วเลือกเส้นเสียง',k:'g:jiao4',opts:[{tone:1,lab:'เสียง 1'},{tone:4,lab:'เสียง 4'}],ans:1,fb:'<b class="t4">jiào</b> <span class="zh">叫</span> · เสียง 4 ตกเร็ว'}),
 story({tag:TQ(5)+' · เช็กชื่อ',q:'ครูถามชื่อทีละคน ช่วยตอบให้ถูก',panels:ROLL}),
 part({lab:'ภารกิจท้ายบท',of:0,title:'เช็กชื่อวันแรก',chips:['เติมคำ','เรียงคำถาม','เช็กชื่อ'],note:'ไม่มีคำแปลภาษาไทยแล้ว ฟังแล้วตอบให้ถูกทั้ง 3 ข้อ'}),
 blank({tag:MQ(1),noTh:1,s:'她叫什么_？',opts:['名字','朋友','老师'],ans:0,k:'tjsmmz-m',fb:'<span class="zh">她叫什么名字？</span>'}),
 order({tag:MQ(2),noTh:1,q:'ฟังแล้วเรียงคำให้ตรงกับที่ได้ยิน',tiles:[tl('你','nǐ'),tl('叫','jiào'),tl('什么','shénme'),tl('名字','míngzi'),tl('我','wǒ')],ans:[0,1,2,3],end:'？',k:'njsmmz-m'}),
 story({tag:MQ(3)+' · เช็กชื่อ',noTh:1,q:'ครูถามชื่อทีละคน ช่วยตอบให้ถูก',panels:[ROLL[1],ROLL[0],ROLL[2]].map(p=>Object.assign({},p,{why:''}))}),
 /* 5 · จบบท */
 fin({title:'ถามชื่อและบอกชื่อตัวเองได้แล้ว',html:dlgH(D,{noTh:1}),chips:[JIAO,MZ,SM].map(x=>({zh:x.zh,py:x.py,th:x.th,k:x.k})).concat([{zh:'我叫',py:'wǒ jiào',th:'ฉันชื่อ',k:'wojiao-f'}]),note:'แตะฟองหรือคำเพื่อฟังอีกครั้ง',k:'g:dlg5',kl:'ฟังทั้งบทสนทนา'})]});

</script>
</body></html>
