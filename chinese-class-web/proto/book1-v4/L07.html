<script>

 part({lab:'ภารกิจท้ายหน่วย',of:0,title:'วันที่สองที่โรงเรียน',chips:['ตอบครู','เรียงบทสนทนา','บอกลา'],note:'ไม่มีคำแปลภาษาไทยแล้ว ฟังแล้วตอบให้ถูกทั้ง 3 ข้อ'}),

 lineup({tag:MQ(2),noTh:1,sit:'เพื่อนใหม่เดินชนคุณ',lines:[L.dbq,L.mgx,L.wm,L.hgx]}),
 reply({tag:MQ(3),noTh:1,q:'เลิกเรียนแล้ว ครูพูดกับคุณ',line:L.zjt,opts:[O.bkq,O.lszj,O.lsdbq],ans:1}),
