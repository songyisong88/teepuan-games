<script>

 lineup({tag:TQ(7),sit:'มะลิถามทางที่ท่าเรือ',lines:[L.a,L.b,L.c]}),

 blank({tag:MQ(4),noTh:1,s:'对不起，我不_。',opts:['知道','介绍','进'],ans:0,k:'p01-wbzd-f',fb:'<span class="zh">对不起，我不知道。</span>'}),
 fin({title:'จบหน่วยที่ 1 แล้ว',html:dlgH(D,{noTh:1}),chips:[QW,BHY,MF,KY,DUI,ZD,JS,NAN,NV,JIN,HY,XW].map(x=>({zh:x.zh,py:x.py,th:x.th,k:x.k})),note:'แตะฟองหรือคำเพื่อฟังอีกครั้ง',k:'dlg:L03',kl:'ฟังทั้งบทสนทนา'})]});
