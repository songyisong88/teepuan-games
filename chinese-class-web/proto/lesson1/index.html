<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ต้นแบบบทที่ 1 · 第一步 ก้าวแรก</title>
<link rel="icon" type="image/png" href="../../assets/icons/favicon-64.png">
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
:root{--bg:#FAF7F2;--card:#fff;--ink:#27211E;--mut:#7A6F68;--red:#C8102E;--redsoft:#FBF1EC;--line:#EADFD4;--green:#2E8B57;--greensoft:#EAF6EF;--gold:#D9A21B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#EFE8DF}
body{font-family:'IBM Plex Sans Thai','Inter',system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.5}
.zh{font-family:'Noto Serif SC','Songti SC',serif}
.py{font-family:'Inter',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
.x{border:0;background:none;font-size:22px;color:var(--mut);width:32px;height:32px;cursor:pointer;line-height:1}
.bar{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:8px;transition:width .3s}
.stepn{font-size:13px;color:var(--red);font-weight:600;min-width:44px;text-align:right}
.proto{font-size:11px;color:var(--mut);text-align:center;padding:0 16px}
main{flex:1;padding:8px 18px 12px;display:flex;flex-direction:column;gap:12px}
footer{padding:10px 18px calc(16px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:17px;color:#fff;background:var(--red);cursor:pointer}
.btn:disabled{background:#E8A9B2;cursor:default}
.btn.g{background:var(--green)}
.btn.o{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn+.btn{margin-top:8px}
.kick{font-size:13px;color:var(--mut);text-align:center;margin:0}
h1{font-size:22px;margin:0;text-align:center;line-height:1.35}
h2{font-size:17px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.tip{background:#FFF8EC;border:1px dashed #E9C98F;border-radius:12px;padding:10px 12px;font-size:14px}
.ok{background:var(--greensoft);border:1px solid #BFE3CD;color:#1F6B42;border-radius:12px;padding:10px 12px;font-size:14px}
.bad{background:var(--redsoft);border:1px solid #F0C5CB;color:#9A1026;border-radius:12px;padding:10px 12px;font-size:14px}
.hide{display:none!important}
.lama{display:block;margin:0 auto;height:120px}
.row{display:flex;gap:10px;align-items:center}
.spk{width:52px;height:52px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.spk svg{width:24px;height:24px}
.spk.s{width:38px;height:38px;background:var(--redsoft);color:var(--red)}
.spk.s svg{width:18px;height:18px}
.spk.play{animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .3s ease-out}
/* book */
.bookhd{display:flex;gap:14px;align-items:center}
.cover{width:76px;height:100px;border-radius:8px;background:var(--red);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset -6px 0 0 rgba(0,0,0,.12)}
.cover b{font-size:24px;font-family:'Noto Serif SC',serif;line-height:1.1}
.cover small{font-size:11px}
.les{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.les .n{width:34px;height:34px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut);flex:none}
.les.cur{border:2px solid var(--red)}
.les.cur .n{background:var(--red);color:#fff}
.les.done .n{background:var(--green);color:#fff}
.les .t{flex:1}
.les .t small{display:block;color:var(--mut);font-size:12px}
.lock{color:var(--mut);font-size:12px}
/* path */
.path{display:flex;justify-content:space-between;align-items:center;position:relative;padding:10px 6px}
.path:before{content:"";position:absolute;left:30px;right:30px;top:38px;border-top:3px dotted #D9C9B8}
.stg{position:relative;text-align:center;width:31%;font-size:13px}
.stg .c{width:56px;height:56px;border-radius:50%;margin:0 auto 6px;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:var(--mut)}
.stg.on .c{border-color:var(--red);color:var(--red)}
/* big word */
.big{font-size:84px;text-align:center;line-height:1.1;margin:4px 0}
.rowsel{display:flex;flex-direction:column;gap:10px}
.rbtn{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;font:inherit;text-align:left;width:100%}
.rbtn .w{font-size:34px;min-width:120px}
.rbtn .w.py{font-size:30px;color:var(--red);font-weight:600}
.rbtn .d{font-size:14px;color:var(--mut)}
.rbtn.seen{border-color:#BFE3CD;background:#F7FCF9}
.rbtn.right{border-color:var(--green);background:var(--greensoft)}
.rbtn.wrong{border-color:var(--red);background:var(--redsoft)}
/* tones */
.tones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tone{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;cursor:pointer;font:inherit;position:relative}
.tone.heard{border-color:#BFE3CD}
.tone.act{border-color:var(--red);background:var(--redsoft)}
.tone svg{width:100%;height:46px}
.tone .s{font-size:28px;color:var(--red);font-weight:600}
.tone .e{font-weight:700}
.tone small{display:block;color:var(--mut);font-size:12px;line-height:1.35}
.tone .chk{position:absolute;top:6px;right:8px;color:var(--green);font-weight:700;font-size:14px}
.chips{display:flex;gap:6px;justify-content:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px 6px;text-align:center;font-size:11px;color:var(--mut);width:23%}
.chip svg{width:100%;height:22px}
.chip.on{border-color:var(--red);color:var(--red)}
.pad{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;touch-action:none}
.pad canvas{display:block;width:100%;height:240px;touch-action:none}
.pad .hd{position:absolute;left:12px;top:10px;display:flex;gap:8px;align-items:center;font-weight:600}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:28px;height:6px;border-radius:4px;background:var(--line)}
.dots i.d{background:var(--green)}.dots i.c{background:var(--red)}
/* pictures */
.pics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pic{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px;cursor:pointer;font:inherit;text-align:center}
.pic img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;background:#FFF9F0}
.pic .s{font-size:24px;color:var(--red);font-weight:600}
.pic.right{border-color:var(--green);background:var(--greensoft)}
.pic.wrong{border-color:var(--red);background:var(--redsoft)}
/* build */
.syls{display:flex;gap:14px;justify-content:center}
.syl{text-align:center}
.syl .zh{font-size:36px}
.slots{display:flex;gap:6px;margin-top:6px}
.slot{width:52px;height:52px;border:2px dashed #D9C9B8;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;background:#fff;cursor:pointer}
.slot.f{border-style:solid}
.slot small{font-size:10px}
.lbl{font-size:11px;color:var(--mut);width:52px;text-align:center}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:60px}
.tile{min-width:56px;height:52px;padding:0 10px;border:0;border-radius:12px;font:inherit;font-size:24px;font-weight:600;color:#fff;cursor:pointer}
.tile.used{visibility:hidden}
.c-i{background:#3D7CC9}.c-f{background:#D98324}.c-t{background:#C8102E}
.slot.c-i,.slot.c-f,.slot.c-t{color:#fff;border-color:transparent}
/* speak */
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--red);color:#fff;margin:0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mic svg{width:34px;height:34px}
.mic.rec{animation:pulse .6s infinite;background:#9A1026}
.leg{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mut)}
.leg i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:4px;vertical-align:middle}
/* comic */
.comic{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--ink);height:300px;background:linear-gradient(#F6EAD8 0 62%,#E5D3BA 62%)}
.gate{position:absolute;left:8%;right:8%;top:19%;height:52%;border:10px solid #A0522D;border-bottom:0;border-radius:10px 10px 0 0}
.gate:before{content:"";position:absolute;left:-26px;right:-26px;top:-24px;height:16px;background:#8B3A1E;border-radius:6px}
.gate span{position:absolute;left:50%;top:-50px;transform:translateX(-50%);background:#fff;border:2px solid #8B3A1E;border-radius:6px;padding:0 10px;font-size:13px;font-weight:700;white-space:nowrap}
.friend{position:absolute;left:4%;bottom:8px;height:190px;mix-blend-mode:multiply}
.me{position:absolute;right:8%;bottom:10px;width:84px;height:150px}
.me .hd{width:54px;height:54px;border-radius:50%;background:#F2C9A0;margin:0 auto;border:2px solid var(--ink)}
.me .bd{width:84px;height:92px;border-radius:28px 28px 8px 8px;background:#3D7CC9;margin-top:4px;border:2px solid var(--ink)}
.me small{position:absolute;bottom:-2px;left:0;right:0;text-align:center;color:#fff;font-size:12px;font-weight:700;bottom:30px}
.bub{position:absolute;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:6px 12px;font-size:22px}
.bub.f{left:26%;top:18%}
.bub.m{right:4%;top:29%;min-width:110px;min-height:46px;text-align:center;border-style:dashed;color:var(--mut);font-size:14px;display:flex;align-items:center;justify-content:center}
.bub.m.f2{border-style:solid;color:var(--ink);font-size:22px}
/* reward */
.stars{display:flex;justify-content:center;gap:8px}
.stars svg{width:44px;height:44px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.li b{color:var(--green)}
.sticker{margin:0 auto;border:3px solid var(--gold);border-radius:16px;background:#fff;padding:8px 22px;text-align:center}
.sticker .zh{font-size:44px;line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;width:120px;flex:none}
.grid i{aspect-ratio:1;background:#EFE7DE;border-radius:2px}
.grid i.on{background:var(--gold)}
main[data-step="10"] .lama{height:84px}
</style>
</head>
<body>
<div id="app">
  <header id="hd"><button class="x" id="xbtn" aria-label="กลับสู่หนังสือ">&times;</button><div class="bar"><i id="barfill"></i></div><div class="stepn" id="stepn"></div></header>
  <div class="proto">หน้าต้นแบบทดลอง ไม่บันทึกความคืบหน้า และไม่เชื่อมกับแอปจริง</div>
  <main id="main"></main>
  <footer id="ft"></footer>
</div>
<script>
(function(){
'use strict';
var R='../../';
var AUD={'你好':'440ee085','你':'5630b886','好':'27e4fe4c','妈':'e3918a99','麻':'433ea221','马':'7d39044e','骂':'63437068'};
var TONES=[
 {n:1,s:'mā',zh:'妈',ex:'"อ้าาา"',th:'คล้ายเสียง ปา',hand:'มือเลื่อนตรงไปข้างหน้า ระดับเดียวกันตลอด',d:'M10 14 L90 14',mean:'แม่'},
 {n:2,s:'má',zh:'麻',ex:'"ห๊ะ?!"',th:'คล้ายเสียง ป๋า',hand:'มือยกขึ้นจากกลางไปสูง',d:'M10 34 L90 8',mean:'ป่าน'},
 {n:3,s:'mǎ',zh:'马',ex:'"เอ่อ…"',th:'คล้ายเสียง ป่า',hand:'มือลดลงต่ำ แล้วยกขึ้นเล็กน้อย',d:'M10 22 Q40 52 62 38 T90 14',mean:'ม้า'},
 {n:4,s:'mà',zh:'骂',ex:'"ไม่!"',th:'คล้ายเสียง ป้า',hand:'มือฟันลงจากสูงไปต่ำอย่างเร็ว',d:'M10 6 L90 40',mean:'ดุ'}
];
var SPK='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
var MIC='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg>';
var STAR='<svg viewBox="0 0 24 24"><path fill="#D9A21B" d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg>';
var main=document.getElementById('main'),ft=document.getElementById('ft');
var S={step:1,done:false};
var cur=null;
function $(s,r){return (r||main).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||main).querySelectorAll(s))}
function img(p,cls,alt){return '<img class="'+(cls||'')+'" src="'+R+p+'" alt="'+(alt||'')+'">'}
function play(word,btn){
  try{if(cur){cur.pause();cur=null}}catch(e){}
  var h=AUD[word];
  if(btn){btn.classList.add('play')}
  var stop=function(){if(btn)btn.classList.remove('play')};
  if(!h){tts(word,stop);return}
  var a=new Audio(R+'audio/'+h+'.mp3');cur=a;
  a.onended=stop;a.onerror=function(){stop();tts(word,stop)};
  var p=a.play();if(p&&p.catch)p.catch(function(){stop();tts(word,stop)});
}
function tts(t,cb){try{var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;u.onend=cb;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){cb&&cb()}}
function toneSvg(t,w){return '<svg viewBox="0 0 100 50" preserveAspectRatio="none"><path d="'+t.d+'" fill="none" stroke="#C8102E" stroke-width="'+(w||5)+'" stroke-linecap="round"/></svg>'}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function foot(html){ft.innerHTML=html}
function next(){go(S.step+1)}
function stage(n){return n<=2?'ก่อนเริ่ม':n<=5?'ด่าน 1':n<=8?'ด่าน 2':n<=11?'ด่าน 3':'จบบท'}
function go(n){
  S.step=Math.max(1,Math.min(13,n));
  try{if(cur)cur.pause()}catch(e){}
  stopRec();
  document.getElementById('barfill').style.width=((S.step-1)/12*100)+'%';
  document.getElementById('stepn').textContent=S.step+'/13';
  var hdr=document.getElementById('hd');hdr.style.visibility=(S.step===1||S.step===13)?'hidden':'visible';
  main.innerHTML='';foot('');
  main.setAttribute('data-step',S.step);
  STEPS[S.step]();
  window.scrollTo(0,0);
}
document.getElementById('xbtn').onclick=function(){go(1)};

function bookPage(after){
  var L=[['เสียงแรก และคำว่า 你好','ด่าน 3 ด่าน · ประมาณ 5 นาที'],['พยัญชนะต้น','ชื่อชั่วคราว'],['สระ','ชื่อชั่วคราว'],['วรรณยุกต์และการอ่านพยางค์','ชื่อชั่วคราว']];
  var h='<div class="bookhd"><div class="cover"><b>第一步</b><small>ก้าวแรก</small></div><div><p class="kick" style="text-align:left">หนังสือเล่มที่ 0</p><h1 style="text-align:left">ก้าวแรก</h1><div style="font-size:14px;color:var(--mut)">หน่วย 1 เสียงและพินอิน</div></div></div>';
  h+='<div class="list">';
  L.forEach(function(l,i){
    var cls='les',right='';
    if(i===0){cls+=after?' done':' cur';right=after?'<span style="color:var(--green);font-weight:700">เรียนแล้ว</span>':''}
    else if(i===1&&after){cls+=' cur';right='<span style="color:var(--red);font-weight:700;font-size:13px">พร้อมเรียน</span>'}
    else right='<span class="lock">ยังไม่เปิด</span>';
    var num=(i===0&&after)?'&#10003;':(i+1);
    h+='<div class="'+cls+'"><div class="n">'+num+'</div><div class="t">บทที่ '+(i+1)+' '+l[0]+'<small>'+l[1]+'</small></div>'+right+'</div>';
  });
  return h+'</div>';
}
var STEPS={
1:function(){
  main.innerHTML=bookPage(false)+'<div class="tip">เริ่มที่บทที่ 1 ได้ทันที ไม่ต้องมีพื้นฐานภาษาจีน</div>';
  foot('<button class="btn" id="go">เริ่มบทที่ 1</button>');
  $('#go',ft).onclick=next;
},
2:function(){
  main.innerHTML='<p class="kick">บทที่ 1</p><h1>เสียงแรก และคำว่า <span class="zh">你好</span></h1>'+img('assets/mascot/wave.webp','lama','ลามา')+
  '<div class="path"><div class="stg on"><div class="c">1</div>รู้จักภาษาจีน</div><div class="stg on"><div class="c">2</div>เสียงสูงต่ำ 4 เสียง</div><div class="stg on"><div class="c">3</div>คำแรก <span class="zh">你好</span></div></div>'+
  '<div class="card" style="text-align:center"><div style="font-size:14px;color:var(--mut)">ใช้เวลาประมาณ 5 นาที</div><h2>จบบทนี้ คุณจะพูด <span class="zh">你好</span> ได้</h2></div>';
  foot('<button class="btn" id="go">เริ่มด่าน 1</button>');$('#go',ft).onclick=next;
},
3:function(){
  main.innerHTML='<p class="kick">ด่าน 1 · รู้จักภาษาจีน</p><h1>ฟังคำแรกของคุณ</h1>'+img('assets/art/word/你好.webp','lama','ลามาโบกมือทักทาย')+
  '<div class="big zh">你好</div><div class="row" style="justify-content:center"><button class="spk" id="sp" aria-label="ฟังเสียง">'+SPK+'</button></div>'+
  '<p class="kick" id="hint">แตะปุ่มเพื่อฟังเสียง</p><div class="ok hide" id="mean" style="text-align:center"><b>你好</b> แปลว่า <b>สวัสดี</b></div>';
  foot('<button class="btn" id="go" disabled>ต่อไป</button>');
  $('#sp').onclick=function(){play('你好',this);$('#mean').classList.remove('hide');$('#hint').textContent='ฟังซ้ำได้ตามต้องการ';$('#go',ft).disabled=false};
  $('#go',ft).onclick=next;
},
4:function(){
  main.innerHTML='<p class="kick">ด่าน 1 · รู้จักภาษาจีน</p><h1>คำเดียวกัน เขียนได้สองแถว</h1><p class="kick">แตะทีละแถวเพื่อดูว่าแต่ละแถวมีไว้ทำอะไร</p>'+
  '<div class="rowsel"><button class="rbtn" data-k="zh"><span class="w zh">你好</span><span class="d" id="dzh">แตะเพื่อดู</span></button>'+
  '<button class="rbtn" data-k="py"><span class="w py">nǐ hǎo</span><span class="d" id="dpy">แตะเพื่อดู</span></button></div>'+
  '<div class="tip">พินอินเขียนด้วยอักษรโรมัน เครื่องหมายบนสระบอกเสียงสูงต่ำ</div>';
  foot('<button class="btn" id="go" disabled>ต่อไป</button>');

function stopRec(){try{if(REC.timer)clearInterval(REC.timer);if(REC.stream)REC.stream.getTracks().forEach(function(t){t.stop()});if(REC.ctx)REC.ctx.close()}catch(e){}REC.on=false;REC.stream=REC.ctx=REC.timer=null}
function record(ms,status,cb){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!(window.AudioContext||window.webkitAudioContext)){cb(null);return}
  status('กำลังขอใช้ไมค์…');REC.on=true;
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    var AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),src=ac.createMediaStreamSource(st),an=ac.createAnalyser();an.fftSize=2048;src.connect(an);
    REC.stream=st;REC.ctx=ac;var buf=new Float32Array(an.fftSize),out=[],t0=Date.now();status('กำลังฟัง… พูด 你好');
    REC.timer=setInterval(function(){an.getFloatTimeDomainData(buf);out.push(pitch(buf,ac.sampleRate));if(Date.now()-t0>ms){stopRec();status('');cb(out)}},40);
  }).catch(function(){stopRec();cb(null)});
}
function pitch(b,sr){var n=b.length,rms=0;for(var i=0;i<n;i++)rms+=b[i]*b[i];rms=Math.sqrt(rms/n);if(rms<.015)return null;
  var minL=Math.floor(sr/400),maxL=Math.floor(sr/75),best=0,bl=-1;
  for(var l=minL;l<=maxL;l++){var c=0;for(var j=0;j<n-l;j++)c+=b[j]*b[j+l];if(c>best){best=c;bl=l}}
  return bl>0?12*Math.log2(sr/bl/100):null}
function drawPitch(cv,arr,demo){var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1,W=r.width,H=r.height;cv.width=W*d;cv.height=H*d;var c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,W,H);
  // model: ní (rising) + hǎo (dip-rise)
  c.save();c.setLineDash([2,10]);c.lineCap='round';c.strokeStyle='#C9B8A6';c.lineWidth=8;c.beginPath();c.moveTo(W*.08,H*.6);c.lineTo(W*.42,H*.22);c.moveTo(W*.55,H*.5);c.quadraticCurveTo(W*.72,H*.98,W*.92,H*.3);c.stroke();c.restore();
  c.fillStyle='#7A6F68';c.font='13px Inter,sans-serif';c.fillText('ní',W*.22,H*.95);c.fillText('hǎo',W*.7,H*.2);
  var pts=[];
  if(demo){c.strokeStyle='#C8102E';c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(W*.1,H*.58);c.lineTo(W*.4,H*.27);c.moveTo(W*.56,H*.52);c.quadraticCurveTo(W*.72,H*.9,W*.9,H*.36);c.stroke();return}
  if(!arr||!arr.length)return;var v=arr.filter(function(x){return x!=null});if(!v.length)return;var mn=Math.min.apply(0,v),mx=Math.max.apply(0,v),rg=Math.max(mx-mn,4);
  c.strokeStyle='#C8102E';c.lineWidth=5;c.lineCap='round';c.beginPath();var pen=false;
  arr.forEach(function(x,i){if(x==null){pen=false;return}var X=W*.06+W*.88*i/(arr.length-1),Y=H*.88-(x-mn)/rg*H*.76;if(pen)c.lineTo(X,Y);else c.moveTo(X,Y);pen=true});c.stroke()}
