<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>第一步 ก้าวแรก · การ์ดเรียงห้าใบ</title>
<link rel="stylesheet" href="../../../fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#FAF7F2;--red:#C8102E;--ink:#27211E;--sub:#6B625B;--soft:#FBF1EC;--mute:#B5ABA1}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
.zh{font-family:'Noto Serif SC',serif}
.app{position:relative;max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.top{display:flex;align-items:center;gap:12px;padding:16px 18px 6px}
.bk{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(39,33,30,.08)}
.tt b{font-size:19px;font-weight:700;display:block;line-height:1.2}.tt small{font-size:12.5px;color:var(--sub)}
.secs{display:flex;gap:6px;padding:8px 18px 0;overflow:hidden}
.sc{flex:1;border:0;background:#fff;border-radius:12px;padding:6px 4px;font:inherit;font-size:11.5px;color:var(--sub);text-align:center;box-shadow:0 1px 3px rgba(39,33,30,.06);line-height:1.3}
.sc b{display:block;font-size:12.5px;color:var(--ink)}
.sc.on{background:var(--red);color:#FBD5D0}.sc.on b{color:#fff}
.sc.dn b:after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#3E9A55;margin-left:4px;vertical-align:2px}
.sc.on.dn b:after{background:#fff}
.stage{position:relative;flex:1;min-height:380px;touch-action:pan-y}
.cd{position:absolute;left:50%;top:14px;width:184px;margin-left:-92px;background:#fff;border-radius:22px;padding:9px 9px 13px;box-shadow:0 10px 26px rgba(39,33,30,.10);transform-origin:50% 70%;will-change:transform}
.cd .pic{height:200px;border-radius:15px;background:#FFF8EE;overflow:hidden;position:relative}
.cd .pic img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cd.lock .pic img{filter:grayscale(1) opacity(.45)}
.cd .no{position:absolute;left:7px;top:7px;background:rgba(255,255,255,.94);border-radius:9px;font-size:11.5px;font-weight:700;padding:1px 8px}
.cd.cur .no{background:var(--red);color:#fff}
.cd .st{position:absolute;right:7px;top:7px;height:24px;min-width:24px;padding:0 6px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:1px;background:rgba(255,255,255,.94);color:#A79D93}
.cd.done .st{color:#E9A23B}
.cd .k{font-size:11.5px;color:var(--sub);margin-top:9px;padding:0 4px}
.cd .ti{font-size:18px;font-weight:700;line-height:1.25;padding:0 4px}
.cd .py{font-size:21px;font-weight:700;color:var(--red);letter-spacing:.3px;padding:0 4px;line-height:1.3}
.cd.lock .py{color:#C9A9A2}
.cd .ln,.cd .rw,.cd .k{transition:opacity .2s}.cd.side .ln,.cd.side .rw,.cd.side .k{opacity:0}
.cd .ln{font-size:12px;color:var(--sub);line-height:1.45;margin-top:4px;padding:0 4px;min-height:36px}
.cd .rw{display:flex;align-items:center;gap:6px;margin-top:9px;padding:0 4px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);color:var(--red);font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;overflow:hidden;max-width:118px}
.hear{width:30px;height:30px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;margin-left:auto;flex:none}
.cd.lock .hear,.cd.boss .hear{display:none}
.cd.boss .pic{background:#2B2320}.cd.boss{box-shadow:0 0 0 2px #E9A23B,0 10px 26px rgba(39,33,30,.12)}
.cd.final{box-shadow:0 0 0 2px #E9A23B,0 10px 26px rgba(39,33,30,.12)}
.lockmsg{font-size:11.5px;color:#9A9088;display:flex;gap:4px;align-items:center}
.dots{display:flex;justify-content:center;gap:5px;padding:4px 0 10px}.dots i{height:6px;width:6px;border-radius:4px;background:#DDD4C9;transition:width .25s}
.dots i.d{background:#3E9A55}.dots i.on{width:18px;background:var(--red)}
.meta{display:flex;justify-content:center;gap:18px;font-size:13px;color:var(--sub)}.meta span{display:flex;gap:5px;align-items:center}
.go{margin:14px 22px 22px;height:54px;border:0;border-radius:16px;background:var(--red);color:#fff;font:inherit;font-weight:700;font-size:17px;box-shadow:0 4px 0 #9E0C24}
.go.rv{background:#fff;color:var(--red);box-shadow:0 0 0 2px var(--red) inset,0 4px 0 #E9D2CC}
.go.lk{background:#EFE9E1;color:#9A9088;box-shadow:0 4px 0 #E2D9CE}
.hint{text-align:center;font-size:12px;color:var(--mute);padding-bottom:8px}
@media (prefers-reduced-motion:reduce){.cd{transition:none!important}}
</style></head><body><div class="app">
<div class="top"><div class="bk"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="tt" style="flex:1"><b><span class="zh">第一步</span> ก้าวแรก</b><small>เล่ม 0 · เรียนแล้ว 3 จาก 17 บท</small></div></div>
<div class="secs" id="secs"></div>
<div class="stage" id="stage"></div>
<div class="hint">ปัดซ้ายขวา หรือแตะการ์ดข้างๆ เพื่อดูบทอื่น</div><div class="dots" id="dots"></div>
<div class="meta" id="meta"></div>
<button class="go" id="go"></button>
</div>
<script>
const D=[{"tag": "ā á ǎ à", "title": "เสียงวรรณยุกต์ 4 เสียง", "say": "你好", "line": "ฟังเสียงสูงต่ำ แล้วพูด 你好 ได้ทันที", "min": 5, "sp": "你好"}, {"tag": "a o e", "title": "สระ", "say": "八", "line": "ฝึกท่าปาก 3 แบบ และคำว่า 八 แปด", "min": 5, "sp": "八"}, {"tag": "i u ü", "title": "สระ", "say": "鱼", "line": "รู้จักตัว ü ที่สวมหมวก และคำว่า 鱼 ปลา", "min": 5, "sp": "鱼"}, {"tag": "b p m f", "title": "พยัญชนะ", "say": "爸爸 妈妈", "line": "ต่อเสียงครั้งแรก แล้วพูดคำว่า 爸爸 妈妈", "min": 5, "sp": "爸爸，妈妈"}, {"tag": "d t n l", "title": "พยัญชนะ", "say": "大", "line": "ต่อชิ้นพินอิน และคำว่า 大 ใหญ่", "min": 5, "sp": "大"}, {"tag": "g k h", "title": "พยัญชนะ", "say": "我喝可乐", "line": "สั่งเครื่องดื่มเป็นภาษาจีน", "min": 5, "sp": "我喝可乐"}, {"tag": "j q x", "title": "พยัญชนะ", "say": "谢谢", "line": "ตัว ü ถอดหมวก และคำว่า 谢谢", "min": 5, "sp": "谢谢"}, {"tag": "zh ch sh r", "title": "เสียงลิ้นม้วน", "say": "是 十 吃", "line": "ฝึกม้วนลิ้น และคำว่า 是 十 吃", "min": 5, "sp": "是，十，吃"}, {"tag": "z c s", "title": "เสียงลิ้นแบน", "say": "再见", "line": "แยก 四 กับ 十 และคำว่า 再见", "min": 5, "sp": "再见"}, {"tag": "ทบทวน", "title": "ด่านบอส", "say": "10 ข้อ", "line": "ตอบ 10 ข้อ มีหัวใจ 3 ดวง", "min": 8, "boss": 1, "sp": ""}, {"tag": "ai ei ao", "title": "สระผสม", "say": "对不起", "line": "วางวรรณยุกต์ให้ถูกตัว", "min": 5, "sp": "对不起"}, {"tag": "ie üe er", "title": "สระ", "say": "不客气", "line": "ตอบคำขอบคุณด้วย 不客气", "min": 5, "sp": "不客气"}, {"tag": "-n -ng", "title": "สระขึ้นจมูก", "say": "泰国人", "line": "แยกเสียง น กับ ง", "min": 5, "sp": "泰国人"}, {"tag": "yi wu yu", "title": "พยางค์อ่านทั้งคำ", "say": "我叫…", "line": "บอกชื่อตัวเองด้วย 我叫…", "min": 5, "sp": "我叫"}, {"tag": "0–10", "title": "ตัวเลข 0 ถึง 10", "say": "一个", "line": "นับเลขจีนด้วยท่ามือ", "min": 5, "sp": "一，二，三"}, {"tag": "多少钱", "title": "ถามราคา", "say": "太贵了", "line": "ถามราคาและต่อราคาที่ตลาด", "min": 5, "sp": "多少钱"}, {"tag": "จบเล่ม", "title": "ด่านจบเล่ม", "say": "เที่ยวจีนวันแรก", "line": "ใช้ทุกคำ แล้วรับประกาศนียบัตร", "min": 10, "final": 1, "sp": "你好，中国"}], S=[{"n": "ช่วงที่ 1", "name": "วรรณยุกต์และสระเดี่ยว", "short": "สระเดี่ยว", "a": 0, "b": 3}, {"n": "ช่วงที่ 2", "name": "พยัญชนะ", "short": "พยัญชนะ", "a": 3, "b": 10}, {"n": "ช่วงที่ 3", "name": "สระผสม", "short": "สระผสม", "a": 10, "b": 13}, {"n": "ช่วงที่ 4", "name": "ใช้จริง", "short": "ใช้จริง", "a": 13, "b": 17}], IC={"check": "<svg viewBox=\"0 0 24 24\" width=\"{s}\" height=\"{s}\"><path d=\"M5 12.5l4.2 4.2L19 7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "lock": "<svg viewBox=\"0 0 24 24\" width=\"{s}\" height=\"{s}\"><rect x=\"5\" y=\"10.5\" width=\"14\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><path d=\"M8.5 10.5V8a3.5 3.5 0 017 0v2.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"/></svg>", "play": "<svg viewBox=\"0 0 24 24\" width=\"{s}\" height=\"{s}\"><path d=\"M8 5.5v13l10.5-6.5z\" fill=\"currentColor\"/></svg>", "star": "<svg viewBox=\"0 0 24 24\" width=\"{s}\" height=\"{s}\"><path d=\"M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z\" fill=\"currentColor\"/></svg>", "clock": "<svg viewBox=\"0 0 24 24\" width=\"{s}\" height=\"{s}\"><circle cx=\"12\" cy=\"12\" r=\"8.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><path d=\"M12 7.5V12l3 2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/></svg>", "back": "<svg viewBox=\"0 0 24 24\" width=\"{s}\" height=\"{s}\"><path d=\"M15 5l-7 7 7 7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "ear": "<svg viewBox=\"0 0 24 24\" width=\"{s}\" height=\"{s}\"><path d=\"M4 9v6h4l5 4V5L8 9z\" fill=\"currentColor\"/><path d=\"M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/></svg>", "mic": "<svg viewBox=\"0 0 24 24\" width=\"{s}\" height=\"{s}\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\" fill=\"currentColor\"/><path d=\"M6 11a6 6 0 0012 0M12 17v4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/></svg>", "game": "<svg viewBox=\"0 0 24 24\" width=\"{s}\" height=\"{s}\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"11\" rx=\"5\" fill=\"currentColor\"/><path d=\"M8 10.5v4M6 12.5h4\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><circle cx=\"15.5\" cy=\"11.5\" r=\"1.2\" fill=\"#fff\"/><circle cx=\"17.5\" cy=\"13.8\" r=\"1.2\" fill=\"#fff\"/></svg>"}, DONE=3, CUR=3, STARS=[3,3,2];
const ic=(n,s)=>IC[n].replaceAll('{s}',s);
const st=i=>i<DONE?'done':i===CUR?'cur':'lock';
const stage=document.getElementById('stage');
const cards=D.map((d,i)=>{const t=st(i),el=document.createElement('div');
 el.className='cd '+t+(d.boss?' boss':'')+(d.final?' final':'');
 const badge=t==='done'?[0,1,2].map(k=>`<span style="color:${k<STARS[i]?'#E9A23B':'#E6DDD3'};display:flex">${ic('star',11)}</span>`).join(''):t==='lock'?ic('lock',13):'';
 const bottom=t==='lock'?`<div class="lockmsg">${ic('lock',12)} จบบทที่ ${i} เพื่อเปิด</div>`:`<span class="chip">พูดได้ <span class="zh">${d.say}</span></span>`;
 el.innerHTML=`<div class="pic"><img src="img/${i+1}.webp" alt=""><span class="no">${i+1}</span>${badge?`<span class="st">${badge}</span>`:''}</div>
 <div class="k">บทที่ ${i+1} จาก 17 · ${d.min} นาที</div><div class="ti">${d.title}</div><div class="py">${d.tag}</div><div class="ln">${d.line}</div>
 <div class="rw">${bottom}<button class="hear" aria-label="ฟังเสียง">${ic('ear',15)}</button></div>`;
 el.querySelector('.hear').addEventListener('click',e=>{e.stopPropagation();speak(d.sp)});
 el.addEventListener('click',()=>{if(!moved&&Math.round(pos)!==i) goTo(i)});
 stage.appendChild(el);return el;});
function speak(t){if(!t||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;speechSynthesis.speak(u);}
const dots=document.getElementById('dots');dots.innerHTML=D.map((_,i)=>`<i class="${i<DONE?'d':''}"></i>`).join('');
const secs=document.getElementById('secs');
secs.innerHTML=S.map((s,k)=>`<button class="sc ${s.b<=DONE?'dn':''}" data-a="${s.a}"><b>${s.n}</b>${s.short}</button>`).join('');
secs.querySelectorAll('.sc').forEach(b=>b.addEventListener('click',()=>goTo(+b.dataset.a)));
document.getElementById('meta').innerHTML=`<span id="mt">${ic('clock',15)} 5 นาที</span><span>${ic('ear',15)} ฟัง</span><span>${ic('mic',15)} พูด</span><span>${ic('game',15)} เกม</span>`;
let pos=CUR, anim=null, moved=false;
function place(){const h=stage.clientHeight,ch=cards[CUR].offsetHeight;cards.forEach(el=>el.style.top=Math.max(8,(h-ch)/2)+"px")}
addEventListener("resize",place);
function layout(){cards.forEach((el,i)=>{const o=i-pos,a=Math.abs(o);
 if(a>2.7){el.style.visibility='hidden';return}el.style.visibility='visible';
 const sgn=Math.sign(o), x=a<=1?o*80:sgn*(80+(a-1)*62), sc=a<=1?1-a*.25:Math.max(.3,.75-(a-1)*.2), y=a*8, r=o*2.5;
 el.style.transform=`translateX(${x}px) translateY(${y}px) rotate(${r}deg) scale(${sc})`;
 el.style.zIndex=100-Math.round(a*10); el.style.opacity=a<1?1-a*.08:a<=2?.92-(a-1)*.22:Math.max(0,.7-(a-2)*1.2);
 el.classList.toggle('side',a>.5);el.style.filter=a>.5?`saturate(${1-Math.min(a,2)*.2})`:'none';});
 const c=Math.max(0,Math.min(D.length-1,Math.round(pos)));
 dots.querySelectorAll('i').forEach((d,i)=>d.classList.toggle('on',i===c));
 const s=S.findIndex(s=>c>=s.a&&c<s.b);secs.querySelectorAll('.sc').forEach((b,k)=>b.classList.toggle('on',k===s));
 document.getElementById('mt').innerHTML=`${ic('clock',15)} ${D[c].min} นาที`;
 const g=document.getElementById('go'),t=st(c);
 g.className='go'+(t==='done'?' rv':t==='lock'?' lk':'');
 g.textContent=t==='cur'?`เริ่มบทที่ ${c+1}`:t==='done'?`ทบทวนบทที่ ${c+1}`:`จบบทที่ ${CUR+1} ก่อนเพื่อเปิดบทนี้`;}
function goTo(t){t=Math.max(0,Math.min(D.length-1,t));cancelAnimationFrame(anim);const s=pos,t0=performance.now(),dur=matchMedia('(prefers-reduced-motion: reduce)').matches?1:340;
 (function f(n){const k=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-k,3);pos=s+(t-s)*e;layout();if(k<1)anim=requestAnimationFrame(f)})(t0);}
let sx=null,sp=0,lx=0,lt=0,v=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sp=pos;lx=e.clientX;lt=performance.now();v=0;moved=false;cancelAnimationFrame(anim);});
addEventListener('pointermove',e=>{if(sx===null)return;const dx=e.clientX-sx;if(Math.abs(dx)>6)moved=true;
 const n=performance.now();v=(e.clientX-lx)/Math.max(1,n-lt);lx=e.clientX;lt=n;
 pos=Math.max(-.4,Math.min(D.length-.6,sp-dx/110));layout();});
addEventListener('pointerup',()=>{if(sx===null)return;sx=null;if(!moved)return;goTo(Math.round(pos-v*1.2));setTimeout(()=>moved=false,0);});
document.getElementById('go').addEventListener('click',()=>{});
place();layout();document.fonts&&document.fonts.ready.then(place);
</script></body></html>
