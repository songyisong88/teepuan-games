<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>第一步 ก้าวแรก · แบบ A1 ครีมเรียบ</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="../map.css">
<style>
:root{--accent:#d9402b;--accent-dark:#8f2414;--accent-grad:linear-gradient(180deg,#ef5a3c,#c8341f);--glow:rgba(255,230,150,.95);--sec-bg:linear-gradient(180deg,#b6402c,#8f2414)}
.mist{position:absolute;left:-20%;width:140%;height:150px;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse 40% 50% at 30% 50%,rgba(255,255,255,.55),transparent 70%),radial-gradient(ellipse 35% 45% at 75% 55%,rgba(255,255,255,.45),transparent 70%);
  animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
.temple-glow{position:absolute;left:50%;width:220px;height:160px;margin-left:-110px;pointer-events:none;z-index:1;background:radial-gradient(ellipse,rgba(255,220,140,.45),transparent 70%);animation:tg 5s ease-in-out infinite}
@keyframes tg{50%{opacity:.6}}
.foot{background:linear-gradient(0deg,rgba(250,247,242,.95),rgba(250,247,242,0))}
</style></head><body>
<div class="app">
  <div class="scroller"><div class="map"></div></div>
  <div class="hdr">
    <div class="row">
      <div class="back"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="#3a2c1e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <img class="cover" src="../../../assets/art/books/b0.webp" alt="">
      <div class="t"><div class="zh">第一步<span>ก้าวแรก</span></div><div class="sub">เล่ม 0 · พินอินทีละขั้น</div></div>
    </div>
    <div class="prog"><div class="bar"><div class="fill"></div></div><div class="n">3/17 บท</div></div>
  </div>
  <div class="foot"><button class="cta"><b>เริ่มบทที่ 4</b><small>ราว 5 นาที</small></button></div>
</div>

<script src="../data.js"></script>
<script>
window.THEME={
  bg:'../img/bgA1.svg', mapH:1780, move:'walk', tension:.2,
  pts:[[.50,1700],[.70,1612],[.58,1522],[.32,1446],[.24,1352],[.46,1268],[.72,1196],[.74,1104],[.50,1024],[.30,928],[.30,826],[.56,750],[.74,668],[.64,580],[.38,506],[.30,414],[.50,300]],
  pathSvg:(d,k)=>`
   <path d="${d}" fill="none" stroke="#4a3418" stroke-opacity=".28" stroke-width="${34*k}" stroke-linecap="round" transform="translate(0,${3*k})"/>
   <path class="measure" d="${d}" fill="none" stroke="#e6cf9c" stroke-width="${28*k}" stroke-linecap="round"/>
   <path d="${d}" fill="none" stroke="#f7ebcc" stroke-width="${18*k}" stroke-linecap="butt" stroke-dasharray="${13*k} ${9*k}"/>
   <path class="prog" d="${d}" fill="none" stroke="#f5b82e" stroke-width="${7*k}" stroke-linecap="round" style="filter:drop-shadow(0 0 4px rgba(255,200,60,.9))"/>`,
};
</script>
<script src="../map.js"></script>
</body></html>
