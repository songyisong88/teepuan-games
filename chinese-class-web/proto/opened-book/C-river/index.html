<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>第一步 ก้าวแรก · แบบ C ล่องลำธาร</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="../map.css">
<style>
:root{--accent:#0f9d8a;--accent-dark:#086356;--accent-grad:linear-gradient(180deg,#1fb9a3,#0c8a78);--glow:rgba(190,255,240,.9);--sec-bg:linear-gradient(180deg,#169f8c,#0a6b5e)}
.pad{position:absolute;left:50%;top:50%;width:96px;height:44px;margin:-6px 0 0 -48px;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at 45% 40%,#9be07a,#4fa83c 60%,#2f7a26);box-shadow:0 6px 10px rgba(0,40,30,.35),inset 0 -3px 0 rgba(0,0,0,.15);
  -webkit-mask:conic-gradient(from 150deg at 50% 50%,#000 0 330deg,transparent 330deg 360deg);mask:conic-gradient(from 150deg at 50% 50%,#000 0 330deg,transparent 330deg 360deg)}
.node.big .pad{width:124px;height:56px;margin-left:-62px}
.node.current .glow{inset:auto;left:50%;top:50%;width:120px;height:56px;margin:-10px 0 0 -60px;border-radius:50%;background:none;border:2px solid rgba(255,255,255,.85);animation:ripple 2.8s ease-out infinite}
@keyframes ripple{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.splash{position:absolute;width:90px;height:36px;margin:-8px 0 0 -45px;border-radius:50%;border:2px solid rgba(255,255,255,.9);pointer-events:none;z-index:4}
.ray{position:absolute;top:0;width:120px;height:700px;pointer-events:none;z-index:2;background:linear-gradient(180deg,rgba(255,250,200,.28),rgba(255,250,200,0));transform:skewX(-14deg);animation:ray 7s ease-in-out infinite}
@keyframes ray{50%{opacity:.45}}
</style></head><body>
<div class="app">
  <div class="scroller"><div class="map"></div></div>
  <div class="hdr">
    <div class="row">
      <div class="back"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="#3a2c1e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <img class="cover" src="../../../assets/art/books/b0.webp" alt="">
      <div class="t"><div class="zh">第一步<span>ก้าวแรก</span></div><div class="sub">เล่ม 0 · พินอินทีละขั้น</div></div>
    </div>
    <div class="prog"><div class="bar"><div class="fill"></div></div><div class="n">3/17 บท</div></div>
  </div>
  <div class="foot"><button class="cta"><b>เริ่มบทที่ 4</b><small>ราว 5 นาที</small></button></div>
</div>

<script src="../data.js"></script>
<script>
window.THEME={
  bg:'../img/jg.webp', mapH:1780, move:'hop', hopH:40, tension:.2,
  pts:[[.44,1700],[.58,1606],[.44,1520],[.56,1432],[.44,1344],[.56,1254],[.46,1166],[.56,1080],[.46,994],[.52,896],[.44,800],[.56,716],[.46,634],[.56,552],[.44,468],[.56,384],[.50,170]],
  under:(L,st)=>`<div class="pad"></div>`,
  pathSvg:(d,k)=>`
   <path class="measure" d="${d}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="${4*k}" stroke-linecap="round" stroke-dasharray="0.1 ${11*k}"/>
   <path class="prog" d="${d}" fill="none" stroke="#ffe27a" stroke-width="${4*k}" stroke-linecap="round" style="filter:drop-shadow(0 0 4px rgba(255,220,100,.9))"/>`,
  decor:(m,P,k)=>{ [[150,560],[60,0]].forEach(([x,y])=>{const r=document.createElement('div');r.className='ray';r.style.left=(x*k)+'px';r.style.top=(y*k)+'px';m.appendChild(r);}); },
  onLand:(m,b,k)=>{ const s=document.createElement('div'); s.className='splash'; s.style.left=b[0]+'px'; s.style.top=b[1]+'px'; m.appendChild(s);
    s.animate([{transform:'scale(.6)',opacity:.9},{transform:'scale(1.4)',opacity:0}],{duration:600,easing:'ease-out'}).onfinish=()=>s.remove(); }
};
</script>
<script src="../map.js"></script>
</body></html>
