:root{--bg:#120a24;--panel:#1d1238;--panel2:#2a1a52;--line:#55399e;--ink:#f8f0dc;--dim:#ada3d2;--gold:#ffc83d;--cyan:#3de0ff;--pink:#ff5fa8;--green:#5dff8a;--red:#ff5a5a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:"Kanit","Noto Sans Thai","Leelawadee UI",Thonburi,Tahoma,system-ui,sans-serif;color:var(--ink);font-weight:600;background:#08040f;background-image:radial-gradient(circle at 50% 0,#2b1460 0,#08040f 70%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 60px rgba(255,95,168,.12)}
#top{padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:var(--panel);border-bottom:3px solid var(--line)}
.row{display:flex;align-items:center;gap:8px}
.cur{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;background:#120a2a;padding:4px 8px;display:flex;align-items:center;gap:8px;min-height:48px}
.cur .v{font-size:22px;font-weight:800;line-height:1;color:var(--gold)}
.cur .l{font-size:11px;color:var(--dim);line-height:1.15}
.ic{width:22px;height:22px;flex:none;image-rendering:pixelated}
.sq{width:48px;height:48px;border:2px solid var(--line);border-radius:12px;background:var(--panel2);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.sq:active{transform:translateY(2px)}
.gear i{width:20px;height:20px;border:4px solid var(--ink);border-radius:50%;display:block;box-shadow:0 0 0 3px var(--panel2),0 0 0 6px var(--ink)}
#wrap{flex:1;position:relative;min-height:0}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#chips{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:6px;z-index:3;pointer-events:none}
.chip{pointer-events:auto;width:66px;min-height:58px;border:2px solid var(--gold);border-radius:12px;background:rgba(29,18,56,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;font-size:11px;line-height:1.1;color:var(--gold);text-align:center}
.chip b{font-size:14px;font-weight:800}
.chip.cd{border-color:var(--line);color:var(--dim)}
.chip.act{border-color:var(--green);color:var(--green)}
.tv{display:inline-block;width:18px;height:13px;border:2px solid currentColor;border-radius:3px;position:relative;vertical-align:-1px;margin-right:4px;flex:none}
.tv:after{content:"";position:absolute;left:4px;top:2px;border-left:6px solid currentColor;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
#combo{position:absolute;left:8px;top:8px;z-index:3;font-size:15px;font-weight:800;color:var(--gold);background:rgba(18,10,36,.85);border:2px solid var(--gold);border-radius:10px;padding:2px 8px;display:none;pointer-events:none}
#combo.on{display:block;animation:pulse 1s infinite}
#grip{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:3;font-size:16px;font-weight:800;color:var(--ink);background:rgba(18,10,36,.88);border:2px solid var(--line);border-radius:10px;padding:4px 10px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#grip.on{opacity:1}
#hint{position:absolute;left:0;right:0;bottom:20px;text-align:center;font-size:13px;color:var(--dim);pointer-events:none;z-index:2;padding:0 10px}
#credit{position:absolute;right:8px;bottom:6px;font-size:10px;color:rgba(173,163,210,.5);pointer-events:none;z-index:2}
@keyframes pulse{50%{transform:scale(1.05)}}
#bottom{padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:var(--panel);border-top:3px solid var(--line)}
#ctl{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px}
.mv{min-height:64px;border-radius:14px;background:var(--panel2);border:2px solid var(--line);font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;touch-action:none}
.mv.on{background:#3a2a72;border-color:var(--cyan);transform:translateY(2px)}
.mv i{width:0;height:0;border-top:13px solid transparent;border-bottom:13px solid transparent}
#bL i{border-right:18px solid var(--ink)}#bR i{border-left:18px solid var(--ink)}
#bDrop{min-height:64px;border-radius:14px;background:var(--pink);color:#2a0618;font-size:20px;font-weight:800;line-height:1.05;box-shadow:0 5px 0 #a8306a;display:flex;flex-direction:column;align-items:center;justify-content:center}
#bDrop small{font-size:12px;font-weight:600}
#bDrop:active{transform:translateY(3px);box-shadow:0 2px 0 #a8306a}
#bDrop.no{background:#3a3560;color:#9c95c8;box-shadow:0 5px 0 #24204a}
#nav{display:flex;gap:6px;margin-top:8px}
#nav button{flex:1;min-height:50px;border:2px solid var(--line);border-radius:12px;background:var(--panel2);font-size:13px;line-height:1.15;position:relative;padding:2px}
#nav button:active{transform:translateY(2px)}
.dot{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--red);border:2px solid var(--panel);display:none}
.dot.on{display:block}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 10px);background:rgba(4,2,12,.8)}
.modal.on{display:flex}
.sheet{width:100%;max-width:440px;max-height:100%;overflow:auto;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:14px;animation:pop .25s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.sheet h2{font-size:22px;font-weight:800;text-align:center;line-height:1.2}
.sheet .sub{font-size:14px;color:var(--dim);text-align:center;margin-top:4px;line-height:1.4}
.big{font-size:28px;font-weight:800;color:var(--gold);text-align:center;margin:8px 0 2px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:14px;font-size:17px;font-weight:800;background:var(--panel2);border:2px solid var(--line);margin-top:10px;line-height:1.15;padding:4px 8px;text-align:center}
.btn:active{transform:translateY(2px)}
.btn.go{background:var(--green);color:#082010;border-color:#1f8a45}
.btn.ad{background:var(--gold);color:#2a1a00;border-color:#b8860b}
.btn[disabled]{opacity:.45;pointer-events:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pair .btn{margin-top:0;height:100%;min-height:64px;font-size:clamp(13px,4.2vw,16px);padding:4px 6px}
.pair .btn .tv{margin-right:5px}
.note{font-size:12px;color:var(--dim);text-align:center;margin-top:10px;line-height:1.4}
.list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:#120a2a;border:2px solid var(--line);border-radius:12px;padding:8px}
.item .tx{flex:1;min-width:0}
.item .nm{font-size:15px;line-height:1.2}
.item .ds{font-size:12px;color:var(--dim);line-height:1.3;margin-top:2px}
.item .btn{width:auto;min-width:100px;min-height:52px;margin:0;font-size:15px}
.ico{width:48px;height:48px;flex:none;image-rendering:pixelated}
.rh{font-size:14px;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.rh i{width:14px;height:14px;border-radius:3px;display:inline-block;flex:none}
.rh span{flex:1}
.rh em{font-style:normal;font-size:12px;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cell{border:2px solid var(--line);border-radius:10px;background:#120a2a;padding:4px 2px;text-align:center;font-size:10px;line-height:1.15;color:var(--dim);min-height:84px}
.cell canvas{width:52px;height:52px;display:block;margin:0 auto 2px;image-rendering:pixelated}
.cell.got{color:var(--ink)}
.prev{display:block;margin:8px auto 0;width:144px;height:144px;image-rendering:pixelated}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.days div{border:2px solid var(--line);border-radius:8px;text-align:center;font-size:11px;padding:4px 0;color:var(--dim)}
.days div.now{border-color:var(--gold);color:var(--gold)}
.days div.got{background:#1d3a26;color:var(--green);border-color:#2a6b3e}
.bar2{height:10px;border-radius:5px;background:#120a2a;border:2px solid var(--line);overflow:hidden;margin-top:8px}
.bar2 i{display:block;height:100%;background:var(--gold)}
#toast{position:fixed;left:50%;top:20%;transform:translate(-50%,-10px);z-index:80;background:#000;border:2px solid var(--gold);color:var(--gold);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.fl{position:absolute;z-index:4;font-size:18px;font-weight:800;color:var(--gold);pointer-events:none;white-space:nowrap;transform:translate(-50%,0);animation:fl 1.3s ease-out forwards;text-shadow:0 2px 0 #000}
@keyframes fl{to{transform:translate(-50%,-60px);opacity:0}}
#adov{position:fixed;inset:0;z-index:100;background:#05040f;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#adov.on{display:flex}
#adov .lab{font-size:14px;color:#000;background:#ffe066;padding:6px 12px;border-radius:6px}
#adov .kind{font-size:14px;margin-top:12px;color:var(--ink);line-height:1.4}
#adov .stage{width:100%;max-width:420px;aspect-ratio:16/10;margin-top:14px;border:2px dashed #555;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#aaa}
#adov .num{font-size:56px;font-weight:800;color:#fff}
#adov .s2{font-size:12px;color:#888;padding:0 14px;line-height:1.4}
#adov .bar{width:100%;max-width:420px;height:8px;background:#222;margin-top:10px;border-radius:4px;overflow:hidden}
#adov .bar i{display:block;height:100%;width:0;background:#ffe066}
#adov .btn{max-width:420px;min-height:60px}
#adov .btn.done{background:var(--green);color:#082010}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="row">
      <div class="cur"><canvas class="ic" id="icCoin" width="11" height="11"></canvas><div><div class="v" id="coins">0</div><div class="l" id="coinsL"></div></div></div>
      <div class="cur"><canvas class="ic" id="icTix" width="11" height="11"></canvas><div><div class="v" id="tix">0</div><div class="l" id="tixL"></div></div></div>
      <button class="sq" id="bLang" aria-label="language">EN</button>
      <button class="sq gear" id="bSet" aria-label="settings"><i></i></button>
    </div>
  </div>

    <div id="combo"></div>

    <div id="grip"></div>

  </div>

      <button class="mv" id="bR" aria-label="right"><i></i></button>
    </div>
    <div id="nav">
      <button id="nAlb"><span id="nAlbT"></span></button>
      <button id="nUp"><span id="nUpT"></span><span class="dot" id="dUp"></span></button>
      <button id="nTh"><span id="nThT"></span></button>
      <button id="nDay"><span id="nDayT"></span><span class="dot" id="dDay"></span></button>
    </div>
  </div>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="adov" role="dialog" aria-modal="true">
  <div class="lab" id="adLab"></div>
  <div class="kind" id="adKind"></div>
  <div class="stage"><div id="adS1"></div><div class="num" id="adNum">5</div><div class="s2" id="adS2"></div></div>
  <div class="bar"><i id="adBar"></i></div>
  <button class="btn" id="adClose"></button>
</div>
<div id="toast"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const now=()=>Date.now();
const KEY='clawtron95.save',VERSION=1;
let S=null;

/* ---------------- language ---------------- */
let LANG=(()=>{try{const s=localStorage.getItem(KEY+'.lang');if(s==='th'||s==='en')return s}catch(e){}
  const ls=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en'];return ls.some(l=>/^th\b/i.test(l||''))?'th':'en'})();
let langPicked=false;try{langPicked=!!localStorage.getItem(KEY+'.lang')}catch(e){}
const T=(th,en)=>LANG==='th'?th:en;
function setLang(l,remember){LANG=l;document.documentElement.lang=l;if(remember){langPicked=true;try{localStorage.setItem(KEY+'.lang',l)}catch(e){}}renderAll();if(MODAL.open&&MODAL.re){RR=true;try{MODAL.re()}finally{RR=false}}try{Ads.relabel()}catch(e){}}
function ftime(s){s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60),r=s%60;if(m<60)return m+':'+String(r).padStart(2,'0');const h=Math.floor(m/60);return h+T(' ชม. ','h ')+(m%60)+T(' น.','m')}
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}

/* ---------------- audio (WebAudio, generated) ---------------- */
const AU={c:null};
let adOn=false;
function auInit(){if(AU.c){if(AU.c.state==='suspended'&&!adOn)AU.c.resume().catch(()=>{});return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{const c=AU.c=new C();AU.m=c.createGain();AU.m.gain.value=S&&S.set.sfx?.45:0;AU.m.connect(c.destination)}catch(e){AU.c=null}}
function tone(type,f0,f1,dur,vol,dl=0){const c=AU.c;if(!c||!S||!S.set.sfx||adOn)return;const t=c.currentTime+dl,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AU.m);o.start(t);o.stop(t+dur+.03)}
function noise(dur,vol,f,dl=0){const c=AU.c;if(!c||!S||!S.set.sfx||adOn)return;const n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=b;fl.type='bandpass';fl.frequency.value=f||1200;g.gain.value=vol;s.connect(fl);fl.connect(g);g.connect(AU.m);s.start(c.currentTime+dl)}
const SFX={
  coin(){tone('square',988,988,.06,.08);tone('square',1319,1319,.12,.08,.06)},
  move(){tone('triangle',180,200,.05,.035)},
  drop(){tone('sawtooth',420,160,.5,.05)},
  clack(){noise(.06,.35,2500);tone('square',300,180,.06,.07)},
  lift(){tone('sawtooth',160,380,.5,.04)},
  slip(){tone('triangle',600,150,.35,.12);noise(.08,.2,700,.25)},
  thud(){noise(.07,.25,400)},
  win(r){const base=[523,587,659,784,1047][r]||523;[0,4,7,12].forEach((k,i)=>tone('square',base*Math.pow(2,k/12),base*Math.pow(2,k/12),.13,.11,i*.08));if(r>=3)[12,16,19,24].forEach((k,i)=>tone('triangle',base*Math.pow(2,k/12),base*Math.pow(2,k/12),.16,.1,.36+i*.09))},
  miss(){tone('square',330,300,.12,.07);tone('square',262,220,.2,.07,.12)},
  ui(){tone('triangle',660,660,.04,.06)},
  err(){tone('square',180,120,.18,.09)},
  buy(){tone('square',520,780,.08,.1);tone('square',780,1040,.08,.08,.06)},
  claim(){[0,7,12,19].forEach((k,i)=>tone('triangle',523*Math.pow(2,k/12),523*Math.pow(2,k/12),.12,.11,i*.07))},
  spawn(){tone('triangle',800,1200,.06,.05)}
};
const vib=p=>{if(S&&S.set.vib&&navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))try{navigator.vibrate(p)}catch(e){}};

/* =====================================================================
   ADS ADAPTER  — one switch: PROVIDER = 'fake' (GitHub Pages demo) | 'y8' (Y8 build)
   Game calls:  Ads.available()                     -> show ad buttons only when true
                Ads.rewarded(name, rewardText, onReward, onNone)   (ONLY from the player's own tap)
                Ads.interstitial(name, done)        (only at natural breaks, >= 3 min apart)
   Reward is granted ONLY when the ad was watched to the end (fake: countdown done / Y8: adViewed).
   Game is paused + muted while any ad is on screen.
   ===================================================================== */
const PROVIDER='fake';
const Ads=(()=>{
  const INTER_GAP=180000,AD_SECONDS=5,NO_START_MS=8000;
  let busy=false,lastAdAt=0,H={pause(){},resume(){}};   /* lastAdAt=0: first break ad no earlier than 3 min into the session */
  let y8Sdk=null,inited=false;
  const Y=window.Y8_CONFIG||{};
  const CONFIGURED=!!(Y.APP_ID&&Y.GAME_ID&&!/^REPLACE_WITH_/.test(Y.APP_ID)&&!/^REPLACE_WITH_/.test(Y.GAME_ID));
  function y8init(){
    if(inited)return;
    if(!CONFIGURED){console.warn('[Y8] APP_ID / GAME_ID not set yet - ads disabled, game runs normally');return}
    if(!window.y8||typeof window.y8.sdk!=='function')return;
    try{y8Sdk=y8.sdk();y8Sdk.init({appId:Y.APP_ID,autoLogin:true},{gameId:Y.GAME_ID,preloadAdBreaks:'on',sound:'on',onReady:()=>{}});
      try{y8Sdk.onAuth(()=>{})}catch(e){}
      inited=true;renderAll();
      try{const loc=y8Sdk.getPlatformLocale&&y8Sdk.getPlatformLocale();const f=l=>{if(!langPicked&&/^th/i.test(l||''))setLang('th',false)};if(loc&&loc.then)loc.then(f).catch(()=>{});else f(loc)}catch(e){}
      try{const b=y8Sdk.isBlacklisted&&y8Sdk.isBlacklisted();if(b&&b.then)b.then(v=>{if(v)blocked()}).catch(()=>{})}catch(e){}
    }catch(e){console.warn('[Y8] init failed',e);y8Sdk=null;inited=false}
  }
  function blocked(){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:999;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px';d.textContent=T('เกมนี้เล่นได้ที่ Y8.com เท่านั้น','This game can only be played on Y8.com');document.body.appendChild(d)}
  if(PROVIDER==='y8'){window.addEventListener('y8sdk.ready',y8init,{once:true});if(window.y8&&window.y8.emitReadyEvent){try{window.y8.emitReadyEvent()}catch(e){}}}
  function y8brk(type,name,onViewed,cb){
    let started=false,done=false,paused=false,viewed=false,afterT=0;
    const pause=()=>{if(!paused){paused=true;H.pause()}},resume=()=>{if(paused){paused=false;H.resume()}};
    const finish=st=>{if(done)return;done=true;clearTimeout(wd);clearTimeout(afterT);resume();busy=false;if(started)lastAdAt=performance.now();try{cb({viewed,shown:started,st})}catch(e){console.error(e)}};
    const wd=setTimeout(()=>{if(!started)finish('timeout')},NO_START_MS);
    busy=true;
    try{const o={type,name,beforeAd:()=>{started=true;clearTimeout(wd);pause()},afterAd:()=>{resume();afterT=setTimeout(()=>finish('afterAd'),1500)},adBreakDone:i=>finish((i&&i.breakStatus)||'other')};
      if(type==='reward'){o.beforeReward=f=>f();o.adViewed=()=>{if(viewed)return;viewed=true;try{onViewed()}catch(e){console.error(e)}};o.adDismissed=()=>{}}
      const p=y8Sdk.showAd(o);if(p&&p.catch)p.catch(()=>finish('error'))}catch(e){finish('error')}
  }
  let relabelAd=null;
  function fake(kind,rewardText,cb){const rt=()=>typeof rewardText==='function'?rewardText():(rewardText||'');
    const ov=$('adov'),num=$('adNum'),bar=$('adBar'),cl=$('adClose');
    const labels=()=>{$('adLab').textContent=T('โฆษณาตัวอย่าง (ยังไม่ใช่โฆษณาจริง)','SAMPLE AD (not a real ad)');
    $('adKind').textContent=kind==='reward'?T('โฆษณาแลกรางวัล · รางวัล: ','Rewarded ad · reward: ')+rt():T('โฆษณาคั่น (ไม่มีรางวัล)','Break ad (no reward)');
    $('adS1').textContent=T('พื้นที่แสดงคลิปโฆษณา','Ad video area');
    $('adS2').textContent=T('บนเว็บเกมจริง (เช่น Y8) ตรงนี้จะเป็นคลิปโฆษณา เดโมนี้ไม่เรียกเครือข่ายโฆษณาและไม่เก็บข้อมูลใดๆ','On a real game portal (e.g. Y8) an ad video plays here. This demo calls no ad network and collects no data.')};
    const t0=performance.now();let fin=false,closed=false;
    const paint=()=>{labels();const el=(performance.now()-t0)/1000,left=Math.max(0,AD_SECONDS-el);fin=left<=0;num.textContent=fin?'OK':String(Math.ceil(left));bar.style.width=Math.min(100,el/AD_SECONDS*100)+'%';
      if(kind==='reward'){cl.disabled=false;cl.textContent=fin?T('ปิด และรับรางวัล','Close & get reward'):T('ปิด (ไม่ได้รับรางวัล)','Close (no reward)')}
      else{cl.disabled=!fin;cl.textContent=fin?T('ปิดโฆษณา','Close ad'):T('ปิดได้ใน ','Close in ')+Math.ceil(left)+T(' วินาที','s')}
      cl.classList.toggle('done',fin)};
    paint();const iv=setInterval(paint,100);relabelAd=paint;
    cl.onclick=()=>{if(closed||cl.disabled)return;closed=true;clearInterval(iv);relabelAd=null;ov.classList.remove('on');cl.onclick=null;cb(fin)};
    ov.classList.add('on');
  }
  return{
    setHooks(h){H=h},
    relabel(){if(relabelAd)relabelAd()},
    available(){return PROVIDER==='fake'||(inited&&!!y8Sdk)},
    busy:()=>busy,
    rewarded(name,rewardText,onReward,onNone){
      if(busy)return;
      if(!Ads.available()){onNone&&onNone('unavailable');return}
      if(PROVIDER==='fake'){busy=true;H.pause();fake('reward',rewardText,ok=>{busy=false;lastAdAt=performance.now();H.resume();ok?onReward():(onNone&&onNone('dismissed'))});return}
      y8brk('reward',name,onReward,r=>{if(!r.viewed&&onNone)onNone(r.shown?'dismissed':'unavailable')});
    },
    interstitial(name,done){
      const go=()=>{try{done&&done()}catch(e){console.error(e)}};
      if(busy||!Ads.available()||performance.now()-lastAdAt<INTER_GAP){go();return}
      try{adStat(name,'o');adStat(name,'w')}catch(e){}
      if(PROVIDER==='fake'){busy=true;H.pause();fake('inter','',()=>{busy=false;lastAdAt=performance.now();H.resume();go()});return}
      y8brk('next',name,null,()=>go());
    },
    _dbg:{age(ms){lastAdAt-=ms},canInter:()=>!busy&&performance.now()-lastAdAt>=INTER_GAP}
  };
})();
Ads.setHooks({
  pause(){adOn=true;held.L=held.R=false;if(AU.c){try{AU.m.gain.setValueAtTime(0,AU.c.currentTime);AU.c.suspend()}catch(e){}}},
  resume(){adOn=false;lastT=performance.now();if(AU.c){try{AU.c.resume();AU.m.gain.setValueAtTime(S.set.sfx?.45:0,AU.c.currentTime)}catch(e){}}}
});

/* ---------------- data ---------------- */
const RAR=[
 {th:'ธรรมดา',en:'Common',col:'#b8c0d8',w:.5,tix:5,r:9,set:40},
 {th:'ไม่ธรรมดา',en:'Uncommon',col:'#5dff8a',w:.62,tix:12,r:10,set:90},
 {th:'หายาก',en:'Rare',col:'#3de0ff',w:.76,tix:30,r:10,set:200},
 {th:'สุดยอด',en:'Epic',col:'#c77dff',w:.92,tix:75,r:11,set:400},
 {th:'ตำนาน',en:'Legendary',col:'#ffc83d',w:1.1,tix:200,r:12,set:1000}
];
/* [kind, rarity, th, en, main colour, second colour] — all original designs */
const PZ=[
 ['mochi',0,'โมจิหนึบหนับ','Mochi Blob','#f4f0f8','#ff9ec4'],
 ['chick',0,'ลูกเจี๊ยบในไข่','Egg Chick','#ffe14d','#ffffff'],
 ['bear',0,'หมีถั่วแดง','Bean Bear','#b0703c','#e8c090'],
 ['fish',0,'ปลาทูน้อย','Lil\u2019 Mackerel','#7fa8d8','#dfe8f8'],
 ['cloud',0,'ก้อนเมฆง่วงนอน','Sleepy Cloud','#dce6ff','#9fb2e8'],
 ['frog',0,'กบกลมดิ๊ก','Round Froggy','#6cd66c','#c8f5a8'],
 ['bun',0,'ซาลาเปายิ้มแป้น','Smile Bun','#fff4e0','#e8c8a0'],
 ['cat',0,'แมวส้มอ้วนกลม','Chonky Ginger','#ff9a3c','#ffd8a8'],
 ['bunny',1,'กระต่ายขนฟู','Fluff Bunny','#ffe0ee','#ff8fbf'],
 ['ghost',1,'ผีน้อยขี้อาย','Shy Ghost','#eef2ff','#ff9ec4'],
 ['squid',1,'หมึกชมพูหน้าบาน','Pink Squid','#ff7fb4','#ffc0da'],
 ['cactus',1,'กระบองเพชรใจดี','Cactus Buddy','#4fbf6a','#ff6fa0'],
 ['penguin',1,'เพนกวินเตาะแตะ','Waddle Penguin','#3a4a78','#ffffff'],
 ['durian',1,'ทุเรียนหนามนุ่ม','Soft Durian','#b6c83c','#f6e07a'],
 ['robot',2,'หุ่นกระป๋องปิ๊บ','Tin Robo','#a8b4c8','#3de0ff'],
 ['ufo',2,'จานบินจิ๋ว','Mini Saucer','#8ef0c0','#c0c8d8'],

function defaults(){return{v:VERSION,coins:15,tix:0,coinAt:now(),album:{},sets:{},up:{grip:0,speed:0,bank:0,luck:0},themes:['pink'],theme:'pink',
  daily:{last:'',streak:0},caps:{day:'',n:{},at:{}},combo:0,best:0,stats:{tries:0,wins:0,legend:0,playSec:0},ads:{},adLog:[],set:{sfx:true,vib:true},tut:0,created:now()}}
function load(){let d=null;try{const raw=localStorage.getItem(KEY);if(raw)d=JSON.parse(raw)}catch(e){d=null}
  const b=defaults();if(!d||typeof d!=='object'){S=b;return false}
  S=Object.assign(b,d);for(const k of['up','daily','caps','stats','set'])S[k]=Object.assign(defaults()[k],d[k]||{});
  if(!S.caps.n||typeof S.caps.n!=='object')S.caps.n={};if(!S.caps.at||typeof S.caps.at!=='object')S.caps.at={};
  if(!Array.isArray(S.themes))S.themes=['pink'];if(!THEMES.some(t=>t.id===S.theme))S.theme='pink';
  for(const k of['coins','tix'])if(!Number.isFinite(S[k])||S[k]<0)S[k]=0;
  for(const u of UPS)S.up[u.id]=clamp(S.up[u.id]|0,0,u.max);
  if(!S.album||typeof S.album!=='object')S.album={};return true}
function save(){try{S.v=VERSION;localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function adStat(p,k){const a=S.ads[p]||(S.ads[p]={o:0,w:0});a[k]++;S.adLog.push([now(),p,k]);if(S.adLog.length>60)S.adLog.shift()}
function capRoll(){const d=dayKey();if(S.caps.day!==d){S.caps.day=d;S.caps.n={}}}
function capLeft(p){capRoll();return CAP[p].day-(S.caps.n[p]||0)}
function capWait(p){return Math.max(0,((S.caps.at[p]||0)+CAP[p].cd*1000-now())/1000)}
function capOk(p){return Ads.available()&&capLeft(p)>0&&capWait(p)<=0}
function capUse(p){capRoll();S.caps.n[p]=(S.caps.n[p]||0)+1;S.caps.at[p]=now()}
/* free coin refill (works while away, by wall clock) */
function coinTick(){const cap=coinCap(S.up.bank),iv=coinInt(S.up.bank)*1000;if(S.coins>=cap){S.coinAt=now();return}
  const n=Math.floor((now()-S.coinAt)/iv);if(n>0){S.coins=Math.min(cap,S.coins+n);S.coinAt+=n*iv;if(S.coins>=cap)S.coinAt=now()}}
function coinNext(){return S.coins>=coinCap(S.up.bank)?0:Math.max(0,(S.coinAt+coinInt(S.up.bank)*1000-now())/1000)}

function harden(cv,outline){const g=cv.getContext('2d'),w=cv.width,h=cv.height,im=g.getImageData(0,0,w,h),d=im.data;
  for(let i=3;i<d.length;i+=4)d[i]=d[i]>110?255:0;
  if(outline){const a=new Uint8Array(w*h);for(let i=0;i<w*h;i++)a[i]=d[i*4+3];
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const k=y*w+x;if(a[k])continue;if((x>0&&a[k-1])||(x<w-1&&a[k+1])||(y>0&&a[k-w])||(y<h-1&&a[k+w])){d[k*4]=26;d[k*4+1]=12;d[k*4+2]=42;d[k*4+3]=255}}}
  g.putImageData(im,0,0);return cv}

  document.querySelectorAll('[data-t]').forEach(el=>el.replaceWith(themeCanvas(THEMES.find(t=>t.id===el.dataset.t))));
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const t=THEMES.find(x=>x.id===b.dataset.b);if(!S.themes.includes(t.id)){if(S.tix<t.cost)return;S.tix-=t.cost;S.themes.push(t.id);SFX.buy()}else SFX.ui();S.theme=t.id;save();renderAll();openThemes()});
  $('mX').onclick=()=>closeModal()}
function dayIdx(){const y=new Date(Date.now()-864e5);return S.daily.last===dayKey(y)?S.daily.streak%7:0}
function openDaily(){const ready=dailyReady(),idx=ready?dayIdx():(S.daily.streak-1)%7,R=DAILY[idx];
  let h='<h2>'+T('รางวัลรายวัน','Daily Reward')+'</h2><div class="sub">'+T('เข้ามาทุกวันติดกัน รางวัลยิ่งเยอะ','Come back each day in a row for bigger rewards')+'</div><div class="days">'+
    DAILY.map((d,i)=>'<div class="'+(ready&&i===idx?'now':(!ready&&i<=idx)||(ready&&i<idx)?'got':'')+'">'+T('วัน','Day')+' '+(i+1)+'<br>'+d.c+'c</div>').join('')+'</div>';
  if(!ready){h+='<div class="big">'+T('รับแล้ววันนี้','Claimed today')+'</div><div class="note">'+T('กลับมาใหม่พรุ่งนี้','Come back tomorrow')+'</div><button class="btn" id="mX">'+T('ปิด','Close')+'</button>';setModal(h,openDaily);$('mX').onclick=()=>closeModal();return}
  const txt=k=>'+'+R.c*k+' '+T('เหรียญ','coins')+' · +'+R.t*k+' '+T('ตั๋ว','tickets');
  h+='<div class="big">'+txt(1)+'</div>';
  const adOk=capOk('daily');
  if(Ads.available()){h+='<div class="pair"><button class="btn go" id="dOk">'+T('รับปกติ','Claim')+'</button><button class="btn ad" id="dAd"'+(adOk?'':' disabled')+'>'+adBtnLabel(T('รับ x2 ดูโฆษณา','Claim x2 (ad)'))+'</button></div><div class="note">'+T('ดูโฆษณาเพื่อรับเป็น ','Watch an ad to get ')+txt(2)+T(' · ไม่บังคับ',' · optional')+'</div>'}
  else h+='<button class="btn go" id="dOk">'+T('รับรางวัล','Claim')+'</button>';
  setModal(h,openDaily);
  const claim=k=>{S.daily.streak=idx+1;S.daily.last=dayKey();S.coins+=R.c*k;S.tix+=R.t*k;SFX.claim();vib(25);save();renderAll();toast(txt(k))};
  $('dOk').onclick=()=>{claim(1);closeModal()};
  const b=$('dAd');if(b){if(!RR)adStat('daily','o');b.onclick=()=>{if(!capOk('daily'))return;MODAL.onClose=null;closeModal();Ads.rewarded('daily',()=>txt(2),()=>{capUse('daily');adStat('daily','w');if(dailyReady())claim(2)},()=>{toast(T('ยังไม่ได้รับ x2 · กดรับปกติได้เลย','No x2 this time · you can still claim normally'));openDaily()})}}}
function openSet(){const tg=(on)=>on?T('เปิด','On'):T('ปิด','Off');
  setModal('<h2>'+T('ตั้งค่า','Settings')+'</h2><div class="list"><div class="item"><div class="tx"><div class="nm">'+T('เสียง','Sound')+'</div></div><button class="btn" id="sS">'+tg(S.set.sfx)+'</button></div>'+
    '<div class="item"><div class="tx"><div class="nm">'+T('สั่น','Vibration')+'</div></div><button class="btn" id="sV">'+tg(S.set.vib)+'</button></div>'+
    '<div class="item"><div class="tx"><div class="nm">'+T('ภาษา','Language')+'</div></div><button class="btn" id="sL">'+(LANG==='th'?'English':'ไทย')+'</button></div>'+
    '<div class="item"><div class="tx"><div class="nm">'+T('ลบข้อมูลเกม','Reset progress')+'</div><div class="ds">'+T('เริ่มใหม่ทั้งหมด','Start over from zero')+'</div></div><button class="btn" id="sR">'+T('ลบ','Reset')+'</button></div></div>'+
    '<div class="note">'+T('ปุ่มลัด: ◀ ▶ / A D เลื่อน · Space / Enter คีบ','Keys: ◀ ▶ / A D move · Space / Enter drop')+'<br>'+T('บันทึกความคืบหน้าในเครื่องนี้เท่านั้น ไม่มีการเก็บข้อมูลส่วนตัว','Progress is saved on this device only. No personal data is collected.')+'<br>CLAWTRON \u201995 \u00b7 Kairon Arcade</div><button class="btn" id="mX">'+T('ปิด','Close')+'</button>',openSet);
  $('sS').onclick=()=>{S.set.sfx=!S.set.sfx;if(AU.m)AU.m.gain.value=S.set.sfx?.45:0;save();openSet()};
  $('sV').onclick=()=>{S.set.vib=!S.set.vib;save();openSet()};
  $('sL').onclick=()=>setLang(LANG==='th'?'en':'th',true);
  $('sR').onclick=()=>{const openReset=()=>{setModal('<h2>'+T('ลบข้อมูลทั้งหมด?','Reset everything?')+'</h2><div class="sub">'+T('ตุ๊กตา ตั๋ว และอัปเกรดจะหายหมด','Prizes, tickets and upgrades will be lost')+'</div><div class="pair"><button class="btn" id="rN">'+T('ยกเลิก','Cancel')+'</button><button class="btn" id="rY" style="border-color:#ff5a5a">'+T('ลบเลย','Reset')+'</button></div>',openReset);
    $('rN').onclick=()=>openSet();$('rY').onclick=()=>{S=defaults();save();C.super=false;C.st='idle';C.x=HOME;initialFill();closeModal();toast(T('เริ่มใหม่แล้ว','Fresh start'))}};openReset()};
  $('mX').onclick=()=>closeModal()}

/* ---------------- input ---------------- */
function hold(btn,k){const on=e=>{e.preventDefault();auInit();if(MODAL.open||adOn)return;held[k]=true;C.tx=null;btn.classList.add('on');try{btn.setPointerCapture(e.pointerId)}catch(_){}},off=()=>{held[k]=false;btn.classList.remove('on')};
  btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('lostpointercapture',off);btn.addEventListener('contextmenu',e=>e.preventDefault())}
hold($('bL'),'L');hold($('bR'),'R');
$('bDrop').addEventListener('click',()=>{auInit();startDrop()});
let drag=false;const pt=e=>{const r=cv.getBoundingClientRect();return toWorld(e.clientX-r.left,e.clientY-r.top)};
cv.addEventListener('pointerdown',e=>{auInit();if(MODAL.open||adOn||C.st!=='idle')return;drag=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}C.tx=clamp(pt(e).x,16,GX1-6)});
cv.addEventListener('pointermove',e=>{if(drag&&C.st==='idle')C.tx=clamp(pt(e).x,16,GX1-6)});
const up=()=>{drag=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
window.addEventListener('keydown',e=>{if(adOn)return;const k=e.key;
  if(k==='Escape'){if(MODAL.open){closeModal();e.preventDefault()}return}
  if(MODAL.open)return;
  if(k==='ArrowLeft'||k==='a'||k==='A'){held.L=true;C.tx=null;e.preventDefault()}
  else if(k==='ArrowRight'||k==='d'||k==='D'){held.R=true;C.tx=null;e.preventDefault()}
  else if((k===' '||k==='Enter'||k==='ArrowDown')&&!e.repeat){auInit();startDrop();e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')held.L=false;if(k==='ArrowRight'||k==='d'||k==='D')held.R=false});
window.addEventListener('blur',()=>{held.L=held.R=false});
$('cGrip').onclick=()=>{auInit();SFX.ui();if(C.st!=='idle'&&!C.super){toast(T('รอคีบรอบนี้จบก่อน','Wait for this try to finish'));return}openSuper()};
$('cRadar').onclick=()=>{auInit();SFX.ui();openRadar()};
$('nAlb').onclick=()=>{auInit();SFX.ui();openAlbum()};$('nUp').onclick=()=>{auInit();SFX.ui();openUp()};$('nTh').onclick=()=>{auInit();SFX.ui();openThemes()};$('nDay').onclick=()=>{auInit();SFX.ui();openDaily()};
$('bSet').onclick=()=>{auInit();SFX.ui();openSet()};$('bLang').onclick=()=>{SFX.ui();setLang(LANG==='th'?'en':'th',true)};
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(AU.c&&AU.c.state==='running')AU.c.suspend().catch(()=>{})}else{lastT=performance.now();coinTick();renderAll();if(AU.c&&!adOn)AU.c.resume().catch(()=>{})}});

/* ---------------- loop ---------------- */
let lastT=performance.now(),acc=0,hudT=0;
function loop(t){const dt=Math.min(.1,(t-lastT)/1000);lastT=t;
  if(!adOn){acc+=dt;let n=0;while(acc>=DT&&n<30){physStep(false);clawStep();acc-=DT;n++}if(n>=30)acc=0;if(!document.hidden&&!MODAL.open)sessionSec+=dt}
  hudT+=dt;if(hudT>.5){hudT=0;renderHud();S.stats.playSec+=.5}
  render();requestAnimationFrame(loop)}
load();document.documentElement.lang=LANG;coinTick();initialFill();resize();renderAll();requestAnimationFrame(loop);
setInterval(save,10000);

})();</script></body></html>
