unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
:root{--navy:#0b0e22;--navy2:#141a3e;--navy3:#1d2550;--line:#2f3a78;--yel:#ffd23f;--yel2:#d9a520;--ink:#f4f1e6;--dim:#9aa3cf;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);font-family:Kanit,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.px{font-weight:800;letter-spacing:.02em}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:44px;padding:8px 16px;border-radius:6px;font-weight:800;font-size:16px;line-height:1.15;white-space:nowrap;
 background:var(--yel);color:var(--navy);box-shadow:0 4px 0 var(--yel2),0 6px 0 #05060f;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--yel2),0 2px 0 #05060f}
.btn.ghost{background:var(--navy3);color:var(--ink);box-shadow:0 4px 0 #0a0d24,0 6px 0 #05060f;outline:2px solid var(--line);outline-offset:-2px}
.btn.sm{min-height:36px;font-size:14px;padding:6px 12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ico{width:40px;height:40px;min-height:40px;padding:0;border-radius:6px;background:var(--navy3);outline:2px solid var(--line);outline-offset:-2px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--ink)}
.ico:active{transform:translateY(2px)}
.coins{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--yel);background:var(--navy3);padding:4px 10px;border-radius:20px;outline:2px solid var(--line);outline-offset:-2px;font-size:15px}
.coin{width:14px;height:14px;border-radius:50%;background:var(--yel);box-shadow:inset -2px -2px 0 var(--yel2);display:inline-block}
/* title */
#scr-title{align-items:center;justify-content:center;background:var(--navy)}
#titleBg{position:absolute;inset:0;width:100%;height:100%}
#titleBox{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;text-align:center;width:min(92vw,520px)}
#logo{width:min(88vw,460px);height:auto}
#sub{font-size:clamp(16px,4.6vw,22px);font-weight:800;color:var(--yel);text-shadow:0 2px 0 #05060f}
#tag{font-size:14px;color:var(--ink);opacity:.85;margin-top:-4px}
#titleBtns{display:grid;gap:12px;width:min(78vw,300px);margin-top:12px}
#titleBtns .btn{width:100%;font-size:18px;min-height:52px}
#titleRow{display:flex;gap:10px;justify-content:center}
#brand{position:absolute;bottom:calc(10px + var(--safe-b));left:0;right:0;text-align:center;font-size:13px;color:var(--dim)}
#brand b{color:var(--yel)}
.lang{display:inline-flex;border-radius:6px;overflow:hidden;outline:2px solid var(--line);outline-offset:-2px}
.lang button{min-width:52px;min-height:40px;font-weight:800;font-size:14px;color:var(--dim);background:var(--navy3)}
.lang button.on{background:var(--yel);color:var(--navy)}
/* map */
#scr-map{background:linear-gradient(#0b0e22,#10153a)}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(11,14,34,.92);border-bottom:2px solid var(--line);z-index:2}
.top .ttl{flex:1;min-width:0;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mapScroll{flex:1;overflow-y:auto;padding:12px 12px calc(24px + var(--safe-b));-webkit-overflow-scrolling:touch}
.zone{max-width:760px;margin:0 auto 18px;background:var(--navy2);border-radius:10px;outline:2px solid var(--line);outline-offset:-2px;overflow:hidden}
.zhead{position:relative;height:96px}
.zhead canvas{width:100%;height:100%}
.zhead .zt{position:absolute;left:12px;bottom:8px;right:12px;text-shadow:0 2px 0 #05060f}
.zt .zn{font-size:12px;color:var(--yel);font-weight:800;letter-spacing:.12em}
.zt .zname{font-size:20px;font-weight:800;line-height:1.15}
.zprog{position:absolute;right:10px;top:8px;font-weight:800;color:var(--yel);background:rgba(11,14,34,.8);padding:2px 8px;border-radius:12px;font-size:13px}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px}
.lv{position:relative;aspect-ratio:1/1.05;border-radius:8px;background:var(--navy3);outline:2px solid var(--line);outline-offset:-2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800}
.lv .n{font-size:clamp(16px,4.6vw,22px);color:var(--ink)}
.lv .st{font-size:11px;letter-spacing:1px;color:var(--yel)}
.lv .st i{font-style:normal;opacity:.25}
.lv.cur{outline-color:var(--yel);animation:pulse 1.2s infinite}
.lv.done{background:#222c62}
.lv.lock{opacity:.4}
.lv.lock .n{font-size:16px}
@keyframes pulse{50%{outline-color:#fff4b0}}
.soon{padding:14px 12px 16px;color:var(--dim);font-size:14px;text-align:center}
.soon b{color:var(--yel)}

/* game */
#scr-game{background:var(--navy)}
#hud{display:flex;flex-direction:column;gap:6px;padding:8px 10px 6px;padding-top:max(8px,env(safe-area-inset-top));background:rgba(11,14,34,.95);border-bottom:2px solid var(--line);z-index:3}
#hudRow{display:flex;align-items:center;gap:8px}
#lvName{flex:1;min-width:0;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvName small{color:var(--yel);margin-right:6px}
#tl{display:flex;align-items:center;gap:8px}
#loopTxt{font-weight:800;color:var(--yel);font-size:14px;white-space:nowrap;min-width:62px}
#slots{display:flex;gap:3px}
#slots span{width:12px;height:16px;border-radius:3px;background:#222a58;outline:1px solid var(--line)}
#slots span.used{background:#5fd8f0}
#slots span.now{background:var(--yel)}
#tbar{flex:1;height:14px;border-radius:7px;background:#141a3e;outline:2px solid var(--line);outline-offset:-2px;overflow:hidden;position:relative}
#tfill{position:absolute;left:0;top:0;bottom:0;background:var(--yel);transition:width .12s}
#tbar.low #tfill{animation:blink .5s infinite}
@keyframes blink{50%{opacity:.4}}
#ttxt{font-weight:800;font-variant-numeric:tabular-nums;min-width:48px;text-align:right;font-size:15px;color:var(--ink)}
#loot{font-weight:800;font-size:14px;color:var(--yel);white-space:nowrap}
#main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#board{flex:1;position:relative;min-width:0;min-height:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%}
#ctrl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px calc(10px + var(--safe-b));background:rgba(11,14,34,.95);border-top:2px solid var(--line)}
#dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,52px);gap:4px}
#dpad button{border-radius:8px;background:var(--navy3);outline:2px solid var(--line);outline-offset:-2px;font-size:20px;font-weight:800;color:var(--ink);box-shadow:0 3px 0 #05060f}
#dpad button:active,#dpad button.hold{transform:translateY(2px);box-shadow:none;background:#2a3470}
#dpad .w{font-size:12px;color:var(--yel)}
#acts{display:grid;grid-template-columns:1fr;gap:10px;width:132px}
#acts .btn{width:100%;min-height:54px;font-size:16px}
#acts .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#acts .row .btn{min-height:44px;font-size:13px;padding:4px}
@media (max-height:700px){#dpad{grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,44px)}#acts .btn{min-height:46px}#acts .row .btn{min-height:38px}#ctrl{padding-top:6px}}
@media (min-aspect-ratio:4/3){#scr-game #main{flex-direction:row}#ctrlWrap{display:flex}#ctrl{flex-direction:column;justify-content:center;border-top:0;border-left:2px solid var(--line);width:236px;padding:12px}#acts{width:200px}}
#keys{display:none;font-size:12px;color:var(--dim);text-align:center;line-height:1.5}
@media (min-aspect-ratio:4/3) and (pointer:fine){#keys{display:block}}
/* in-board overlays */
#tip{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(92%,480px);background:rgba(11,14,34,.94);outline:2px solid var(--yel);outline-offset:-2px;border-radius:8px;padding:8px 12px;font-size:14px;text-align:center;display:none;z-index:4}
#tip.on{display:block;animation:pop .25s}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;background:rgba(5,6,18,.45)}

.panel{background:var(--navy2);outline:3px solid var(--yel);outline-offset:-3px;border-radius:10px;padding:16px;width:min(92vw,400px);text-align:center;box-shadow:0 8px 0 #05060f;animation:pop .22s}

.panel .btns.one{grid-template-columns:1fr}

#hintBar.on{display:flex}
#hintBar .lbl{background:rgba(11,14,34,.94);outline:2px solid var(--yel);outline-offset:-2px;padding:8px 12px;border-radius:8px;font-weight:800;color:var(--yel);font-size:14px}

.stars{display:flex;justify-content:center;gap:10px;margin:6px 0 4px}

.goal{font-size:13px;color:var(--dim);margin:-2px 0 10px;line-height:1.5}
.goal .ok{color:var(--yel)}
.set{display:grid;gap:10px;text-align:left;margin:8px 0 14px}

.tog{width:52px;height:30px;border-radius:15px;background:#2a3054;position:relative;outline:2px solid var(--line);outline-offset:-2px;flex:none}
.tog::after{content:'';position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:.15s}
.tog.on{background:var(--yel)}
.tog.on::after{left:26px;background:var(--navy)}
.list{display:grid;gap:8px;margin:8px 0 14px}
.item{display:flex;align-items:center;gap:10px;background:var(--navy3);border-radius:8px;padding:8px;text-align:left}

.item .nm{flex:1;font-weight:800;font-size:15px;line-height:1.2}
.item .btn{min-width:92px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.tabs .btn{width:100%}
.note{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.4}

#cut{position:fixed;inset:0;z-index:15;background:#05060f;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}

#cutBtns .btn{min-width:120px}
/* fake ad */

#adBox{width:min(92vw,420px);background:#f4f1e6;color:#0b0e22;border-radius:10px;padding:16px;text-align:center}

#adKind{font-weight:800;margin:6px 0 10px;font-size:16px}

#adBar{height:100%;width:0;background:#0b0e22}

#toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:var(--navy2);outline:2px solid var(--yel);outline-offset:-2px;color:var(--ink);padding:10px 16px;border-radius:8px;font-weight:800;font-size:15px;z-index:60;display:none;max-width:90vw;text-align:center}
#toast.on{display:block;animation:pop .2s}

<div id="adov"><div id="adBox"><div id="adLab"></div><div id="adKind"></div><div id="adScreen"><div id="adNum">5</div><div id="adS1"></div><div id="adS2"></div></div><div id="adTrack"><div id="adBar"></div></div><button id="adClose"></button></div></div>

<script>
/* DEJAVAULT '97 — deterministic time-loop simulation (shared by game + offline verifier). Kairon Arcade. */
const DV=(()=>{
const DIRS={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0],W:[0,0]};
const PLATE='abc',DOOR='ABC',INV='123',TBTN='xy',TDOOR='XY',LIFT='pq';
function parse(def){
  const rows=def.map,h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const L={def,w,h,g:[],start:null,exit:null,loot:[],plates:{a:[],b:[],c:[]},doors:[],tbtn:{x:[],y:[]},keys:[],lasers:[],guards:[],lifts:[],liftAt:{},paradox:!!def.paradox,T:def.timer||5,steps:def.steps,clones:def.clones==null?5:def.clones};
  for(let y=0;y<h;y++){const row=[];for(let x=0;x<w;x++){let c=rows[y][x]||' ';
    if(c==='S'){L.start={x,y};c='.'}
    else if(c==='E'){L.exit={x,y}}
    else if(c==='$'){L.loot.push({x,y});c='.'}
    else if(c==='k'){L.keys.push({x,y});c='.'}
    else if(PLATE.includes(c))L.plates[c].push({x,y});
    else if(TBTN.includes(c))L.tbtn[c].push({x,y});
    else if(DOOR.includes(c))L.doors.push({x,y,kind:'ch',ch:c.toLowerCase(),i:L.doors.length});
    else if(INV.includes(c))L.doors.push({x,y,kind:'inv',ch:PLATE[INV.indexOf(c)],i:L.doors.length});
    else if(TDOOR.includes(c))L.doors.push({x,y,kind:'tm',ch:c.toLowerCase(),i:L.doors.length});
    else if(c==='K')L.doors.push({x,y,kind:'key',ch:'k',i:L.doors.length});
    else if(LIFT.includes(c)){let P=L.lifts.find(q=>q.ch===c);if(!P){P={ch:c,pads:[]};L.lifts.push(P)}P.pads.push({x,y})}
    row.push(c)}L.g.push(row)}
  L.doorAt={};L.doors.forEach(d=>L.doorAt[d.x+','+d.y]=d);
  L.lifts.forEach(P=>{if(P.pads.length!==2)throw new Error('lift '+P.ch+' needs exactly 2 pads');const [a,b]=P.pads;L.liftAt[a.x+','+a.y]=b;L.liftAt[b.x+','+b.y]=a});
  (def.lasers||[]).forEach(l=>L.lasers.push(Object.assign({},l)));
  (def.guards||[]).forEach(g=>L.guards.push({path:g.path.map(p=>({x:p[0],y:p[1]})),view:g.view||(g.cam?3:4),d:g.d||'D',spin:g.spin||0,cam:!!g.cam}));
  return L;
}
function init(L,nSelves){
  const s={t:0,selves:[],taken:L.loot.map(()=>-1),keyTaken:L.keys.map(()=>-1),kopen:L.doors.map(()=>false),tm:{x:0,y:0},alarm:null,won:false,guards:L.guards.map(g=>({x:g.path[0].x,y:g.path[0].y,pi:0,dir:1,d:g.d,alert:null}))};
  for(let i=0;i<nSelves;i++)s.selves.push({x:L.start.x,y:L.start.y,keys:0,lx:L.start.x,ly:L.start.y,f:'D'});
  return s;
}
function clone(s){return{t:s.t,selves:s.selves.map(o=>({...o})),taken:s.taken.slice(),keyTaken:s.keyTaken.slice(),kopen:s.kopen.slice(),tm:{...s.tm},alarm:s.alarm,won:s.won,guards:s.guards.map(g=>({...g}))}}
function pressed(L,s,ch){const ps=L.plates[ch];for(const p of ps)for(const o of s.selves)if(o.x===p.x&&o.y===p.y)return true;return false}
function occupied(s,x,y){for(const o of s.selves)if(o.x===x&&o.y===y)return true;return false}
function doorOpen(L,s,d){
  if(occupied(s,d.x,d.y))return true;
  if(d.kind==='ch')return pressed(L,s,d.ch);
  if(d.kind==='inv')return !pressed(L,s,d.ch);
  if(d.kind==='tm')return s.tm[d.ch]>0;
  if(d.kind==='key')return s.kopen[d.i];
  return false;
}
function doorStates(L,s){return L.doors.map(d=>doorOpen(L,s,d))}
function solid(L,x,y){if(x<0||y<0||x>=L.w||y>=L.h)return true;const c=L.g[y][x];return c==='#'||c===' '||c==='%'}
function canMove(L,s,ds,o,a){
  if(a==='W')return true;const v=DIRS[a];const nx=o.x+v[0],ny=o.y+v[1];
  if(solid(L,nx,ny))return false;const d=L.doorAt[nx+','+ny];
  if(d&&!ds[d.i]){if(d.kind==='key'&&o.keys>0)return true;return false}
  return true;
}
function laserActive(L,s,l){
  if(l.ch)return !pressed(L,s,l.ch);
  if(l.tb)return !(s.tm[l.tb]>0);
  if(l.per){const p=l.per[0]+l.per[1];return ((s.t+(l.ph||0))%p)<l.per[0]}
  return true;
}
function beams(L,s,ds){
  const out=[];
  for(const l of L.lasers){if(!laserActive(L,s,l))continue;const v=DIRS[l.d];let x=l.x+v[0],y=l.y+v[1];const cells=[];
    while(!solid(L,x,y)){const d=L.doorAt[x+','+y];if(d&&!ds[d.i])break;cells.push([x,y]);x+=v[0];y+=v[1]}
    out.push({l,cells})}
  return out;
}
/* sight cone: centre column out to `view`; from distance 2 the cone is 3 wide. Walls and closed doors block (side columns are shadowed once blocked). */
function blocks(L,ds,x,y){if(solid(L,x,y))return true;const d=L.doorAt[x+','+y];return !!(d&&!ds[d.i])}
function sight(L,s,g,ds){
  const v=DIRS[g.d];const px=-v[1],py=v[0];const cells=[];
  const G=L.guards[s.guards.indexOf(g)];const n=G?G.view:4;const side={'-1':true,'1':true};
  for(let i=1;i<=n;i++){const x=g.x+v[0]*i,y=g.y+v[1]*i;if(blocks(L,ds,x,y))break;cells.push([x,y]);
    if(i>=2)for(const k of [-1,1]){if(!side[k])continue;const sx=x+px*k,sy=y+py*k;if(blocks(L,ds,sx,sy)){side[k]=false;continue}cells.push([sx,sy])}}
  return cells;
}
/* advance one step. acts[i] = action of self i ('U','D','L','R','W'). present = last self */
function step(L,s0,acts){
  const s=clone(s0);if(s.alarm||s.won)return s;
  const ds=doorStates(L,s);
  const nS=s.selves.length;
  for(let i=0;i<nS;i++){const o=s.selves[i],a=acts[i]||'W';o.lx=o.x;o.ly=o.y;o.tp=null;
    if(a!=='W')o.f=a;
    if(!canMove(L,s,ds,o,a)){o.bump=a!=='W';
      /* real paradox (zones 3-4): a past self cannot repeat its recorded move because the present changed the world */
      if(o.bump&&L.paradox&&i<nS-1&&!s.alarm)s.alarm={type:'paradox',x:o.x,y:o.y,who:i,d:a};
      continue}o.bump=false;
    const v=DIRS[a];const nx=o.x+v[0],ny=o.y+v[1];const d=L.doorAt[nx+','+ny];
    if(d&&d.kind==='key'&&!ds[d.i]&&!s.kopen[d.i]){o.keys--;s.kopen[d.i]=true;ds[d.i]=true}
    o.x=nx;o.y=ny;
    const lf=L.liftAt[nx+','+ny];if(lf){o.tp={x:nx,y:ny};o.x=lf.x;o.y=lf.y}}
  // pickups
  s.selves.forEach((o,i)=>{
    L.keys.forEach((k,j)=>{if(s.keyTaken[j]<0&&k.x===o.x&&k.y===o.y){s.keyTaken[j]=i;o.keys++}});
    L.loot.forEach((k,j)=>{if(s.taken[j]<0&&k.x===o.x&&k.y===o.y)s.taken[j]=i});
  });
  // timers
  for(const c of TBTN){if(s.tm[c]>0)s.tm[c]--;for(const b of L.tbtn[c])if(occupied(s,b.x,b.y))s.tm[c]=L.T}
  s.t++;
  const ds2=doorStates(L,s);
  // guards
  const gPrev=s.guards.map(g=>({x:g.x,y:g.y}));
  s.guards.forEach((g,gi)=>{
    const G=L.guards[gi];g.lx=g.x;g.ly=g.y;
    if(G.path.length>1){let ni=g.pi+g.dir;if(ni<0||ni>=G.path.length){g.dir=-g.dir;ni=g.pi+g.dir}
      const tp=G.path[ni];const dx=Math.sign(tp.x-g.x),dy=Math.sign(tp.y-g.y);
      if(dx||dy){const nx=g.x+dx,ny=g.y+dy;const d=L.doorAt[nx+','+ny];g.d=dx>0?'R':dx<0?'L':dy>0?'D':'U';
        if(!solid(L,nx,ny)&&!(d&&!ds2[d.i])){g.x=nx;g.y=ny;if(g.x===tp.x&&g.y===tp.y)g.pi=ni}}
      else g.pi=ni}
    else if(G.spin){const order='URDL';if(s.t%G.spin===0)g.d=order[(order.indexOf(g.d)+1)%4]}
  });
  // hazards
  if(!s.alarm)for(const b of beams(L,s,ds2)){if(s.alarm)break;for(const c of b.cells){if(s.alarm)break;for(let i=s.selves.length-1;i>=0;i--){const o=s.selves[i];if(o.x===c[0]&&o.y===c[1]){s.alarm={type:'laser',x:o.x,y:o.y,who:i};break}}}}

/* =====================================================================
   ADS ADAPTER  — one switch: PROVIDER = 'fake' (GitHub Pages demo) | 'y8' (Y8 build)
   Game calls:  Ads.available()                                   -> ad buttons are shown only when true
                Ads.rewarded(name, rewardText, onReward, onNone)   (ONLY from the player's own tap)
                Ads.interstitial(name, done)                      (only at natural breaks, >= 3 min apart, never in first 3 min)
   Reward is granted ONLY when the ad was watched to the end (fake: countdown done / Y8: adViewed).
   Game is paused + muted while any ad is on screen.
   ===================================================================== */
const PROVIDER='fake';
const Ads=(()=>{
  const INTER_GAP=180000,AD_SECONDS=5,NO_START_MS=8000;
  let busy=false,lastAdAt=0,H={pause(){},resume(){},ready(){},locale(){},blocked(){}};
  let y8Sdk=null,inited=false;
  const Y=window.Y8_CONFIG||{};
  const CONFIGURED=!!(Y.APP_ID&&Y.GAME_ID&&!/^REPLACE_WITH_/.test(Y.APP_ID)&&!/^REPLACE_WITH_/.test(Y.GAME_ID));
  function y8init(){
    if(inited)return;
    if(!CONFIGURED){console.warn('[Y8] APP_ID / GAME_ID not set yet - ads disabled, game runs normally');return}
    if(!window.y8||typeof window.y8.sdk!=='function')return;
    try{y8Sdk=y8.sdk();y8Sdk.init({appId:Y.APP_ID,autoLogin:true},{gameId:Y.GAME_ID,preloadAdBreaks:'on',sound:'on',onReady:()=>{}});
      try{y8Sdk.onAuth(()=>{})}catch(e){}
      inited=true;H.ready();
      try{const loc=y8Sdk.getPlatformLocale&&y8Sdk.getPlatformLocale();if(loc&&loc.then)loc.then(l=>H.locale(l)).catch(()=>{});else H.locale(loc)}catch(e){}
      try{const b=y8Sdk.isBlacklisted&&y8Sdk.isBlacklisted();if(b&&b.then)b.then(v=>{if(v)H.blocked()}).catch(()=>{})}catch(e){}
    }catch(e){console.warn('[Y8] init failed',e);y8Sdk=null;inited=false}
  }
  if(PROVIDER==='y8'){window.addEventListener('y8sdk.ready',y8init,{once:true});if(window.y8&&window.y8.emitReadyEvent){try{window.y8.emitReadyEvent()}catch(e){}}}
  function y8brk(type,name,onViewed,cb){
    let started=false,done=false,paused=false,viewed=false,afterT=0;
    const pause=()=>{if(!paused){paused=true;H.pause()}},resume=()=>{if(paused){paused=false;H.resume()}};
    const finish=st=>{if(done)return;done=true;clearTimeout(wd);clearTimeout(afterT);resume();busy=false;if(started)lastAdAt=performance.now();try{cb({viewed,shown:started,st})}catch(e){console.error(e)}};
    const wd=setTimeout(()=>{if(!started)finish('timeout')},NO_START_MS);
    busy=true;
    try{const o={type,name,beforeAd:()=>{started=true;clearTimeout(wd);pause()},afterAd:()=>{resume();afterT=setTimeout(()=>finish('afterAd'),1500)},adBreakDone:i=>finish((i&&i.breakStatus)||'other')};
      if(type==='reward'){o.beforeReward=f=>f();o.adViewed=()=>{if(viewed)return;viewed=true;try{onViewed()}catch(e){console.error(e)}};o.adDismissed=()=>{}}
      const p=y8Sdk.showAd(o);if(p&&p.catch)p.catch(()=>finish('error'))}catch(e){finish('error')}
  }
  let relabelAd=null;
  function fake(kind,rewardText,cb){const rt=()=>typeof rewardText==='function'?rewardText():(rewardText||'');
    const q=id=>document.getElementById(id);const ov=q('adov'),num=q('adNum'),bar=q('adBar'),cl=q('adClose');
    const labels=()=>{q('adLab').textContent=T('โฆษณาตัวอย่าง (ยังไม่ใช่โฆษณาจริง)','SAMPLE AD (not a real ad)');
      q('adKind').textContent=kind==='reward'?T('รางวัล: ','Reward: ')+rt():T('โฆษณาคั่น (ไม่มีรางวัล)','Break ad (no reward)');
      q('adS1').textContent=T('พื้นที่แสดงคลิปโฆษณา','Ad video area');
      q('adS2').textContent=T('บนเว็บเกมจริง (เช่น Y8) ตรงนี้จะเป็นคลิปโฆษณา เดโมนี้ไม่เรียกเครือข่ายโฆษณาและไม่เก็บข้อมูลใดๆ','On a real game portal (e.g. Y8) an ad video plays here. This demo calls no ad network and collects no data.')};
    const t0=performance.now();let fin=false,closed=false;
    const paint=()=>{labels();const el=(performance.now()-t0)/1000,left=Math.max(0,AD_SECONDS-el);fin=left<=0;num.textContent=fin?'OK':String(Math.ceil(left));bar.style.width=Math.min(100,el/AD_SECONDS*100)+'%';
      if(kind==='reward'){cl.disabled=false;cl.textContent=fin?T('ปิด และรับรางวัล','Close & get reward'):T('ปิด (ไม่ได้รับรางวัล)','Close (no reward)')}
      else{cl.disabled=!fin;cl.textContent=fin?T('ปิดโฆษณา','Close ad'):T('ปิดได้ใน ','Close in ')+Math.ceil(left)+T(' วินาที','s')}
      cl.classList.toggle('done',fin)};
    paint();const iv=setInterval(paint,100);relabelAd=paint;
    cl.onclick=()=>{if(closed||cl.disabled)return;closed=true;clearInterval(iv);relabelAd=null;ov.classList.remove('on');cl.onclick=null;cb(fin)};
    ov.classList.add('on');
  }
  return{
    setHooks(h){Object.assign(H,h)},
    relabel(){if(relabelAd)relabelAd()},
    available(){return PROVIDER==='fake'||(inited&&!!y8Sdk)},
    busy:()=>busy,
    canInter:()=>!busy&&Ads.available()&&performance.now()-lastAdAt>=INTER_GAP,
    rewarded(name,rewardText,onReward,onNone){
      if(busy)return;
      if(!Ads.available()){onNone&&onNone('unavailable');return}
      if(PROVIDER==='fake'){busy=true;H.pause();fake('reward',rewardText,ok=>{busy=false;lastAdAt=performance.now();H.resume();ok?onReward():(onNone&&onNone('dismissed'))});return}
      y8brk('reward',name,onReward,r=>{if(!r.viewed&&onNone)onNone(r.shown?'dismissed':'unavailable')});
    },
    interstitial(name,done){
      const go=()=>{try{done&&done()}catch(e){console.error(e)}};
      if(busy||!Ads.available()||performance.now()-lastAdAt<INTER_GAP){go();return}
      if(PROVIDER==='fake'){busy=true;H.pause();fake('inter','',()=>{busy=false;lastAdAt=performance.now();H.resume();go()});return}
      y8brk('next',name,null,()=>go());
    },
    
  };
})();

function zoneArt(c,z,now){const W=c.width,H=c.height,x=c.getContext('2d');const th=ART.THEME[z]||ART.THEME[1];x.fillStyle=th.bg;x.fillRect(0,0,W,H);

    for(let i=0;i<4;i++){x.fillStyle='#0d1024';x.beginPath();x.arc(166+i*14,H-18,6,0,7);x.fill();x.fillStyle=i%2?'#ffd23f':'#f4f1e6';x.beginPath();x.arc(166+i*14,H-18,5,0,7);x.fill();x.fillStyle='#2c3a7a';x.fillRect(164+i*14,H-20,4,4)}
    x.drawImage(ART.guardSpr('L',0),W-56,H-40)}
  else if(z===4){const vx=W-50,vy=H/2+12;x.fillStyle='#0d1024';x.beginPath();x.arc(vx,vy,30,0,7);x.fill();x.fillStyle='#7a86a8';x.beginPath();x.arc(vx,vy,27,0,7);x.fill();x.fillStyle='#4a5478';x.beginPath();x.arc(vx,vy,19,0,7);x.fill();
    x.strokeStyle='#ffd23f';x.lineWidth=3;for(let i=0;i<3;i++){const b=i*2.094+.4;x.beginPath();x.moveTo(vx,vy);x.lineTo(vx+Math.cos(b)*15,vy+Math.sin(b)*15);x.stroke()}x.fillStyle='#ffd23f';x.fillRect(vx-3,vy-3,6,6)}

 farewell(x,t){sky(x,'#ffd23f','#2c3a7a');x.fillStyle='rgba(255,255,255,.25)';x.beginPath();x.arc(96,94,40,0,7);x.fill();x.fillStyle='#1d2748';x.fillRect(0,90,192,18);
  for(let g=0;g<5;g++){const fade=Math.max(0,1-Math.max(0,t-800-g*350)/1200);x.globalAlpha=.75*fade;bigSpr(x,ART.ghost(S.gstyle,'D',Math.floor(t/250+g)%2),18+g*22+(g>1?44:0),56-(1-fade)*14,2)}
  x.globalAlpha=1;bigSpr(x,ART.hero(S.outfit,'D',0),84,56,2)},
 arcadeSaved(x,t){SCENES.soi(x,t);x.fillStyle='rgba(255,210,63,.18)';x.fillRect(60,60,72,30);
  x.fillStyle='#1d2550';x.fillRect(86,64,20,26);x.fillStyle='#ffd23f';x.fillRect(88,66,16,9);x.fillStyle='#0b0e22';x.fillRect(89,67,14,7);ART.text(x,'97',96,68,'#ffd23f',1,'c');
  for(let i=0;i<3;i++)x.drawImage(ART.hero(['classic','classic','classic'][i],'U',Math.floor(t/300+i)%2),30+i*48+(i===1?20:0),88)},
 credits(x,t){sky(x,'#0b0e22','#141a3e');for(let i=0;i<40;i++){x.fillStyle='rgba(255,210,63,'+(0.15+0.4*rnd(i))+')';x.fillRect(rnd(i+1)*192|0,(rnd(i+2)*108+t/40*rnd(i+5))%108|0,1,1)}
  const L=[["DEJAVAULT '97",2],['',1],['A GAME BY',1],['KAIRON ARCADE',2],['',1],['DESIGN  CODE',1],['PIXELS  MUSIC',1],['KAIRON ARCADE',1],['',1],['STARRING',1],['MALI',1],['AND HER ECHOES',1],['',1],['THANKS FOR PLAYING',1],['',1],['THE END',2]];
  let y=108-((t/45)%((L.length*14)+120));for(const [s,sc] of L){if(s&&y>-14&&y<108)ART.text(x,s,96,y|0,sc>1?'#ffd23f':'#f4f1e6',sc,'c');y+=sc>1?18:12}}};
/* ---------- title screen ---------- */
const tbg=$('titleBg'),tbx=tbg.getContext('2d');let TB={w:0,h:0,sc:3};
function sizeTitle(){const sc=Math.max(2,Math.round(Math.min(innerWidth,innerHeight)/200));TB={w:Math.ceil(innerWidth/sc),h:Math.ceil(innerHeight/sc),sc};tbg.width=TB.w;tbg.height=TB.h}
function drawTitleBg(now){const x=tbx,W=TB.w,H=TB.h;x.imageSmoothingEnabled=false;const th=ART.THEME[1];const off=(now/60)%32;
  for(let j=-1;j<H/16+1;j++)for(let i=-1;i<W/16+2;i++){x.fillStyle=((i+j)%2+2)%2?th.floorA:th.floorB;x.fillRect(i*16-off,j*16,16,16);x.fillStyle=th.floorC;x.fillRect(i*16-off+7,j*16+7,2,2)}
  const row=Math.floor(H*0.8/16)*16;x.fillStyle=th.wallTop;x.fillRect(0,row-16,W,16);x.fillStyle=th.trim;x.fillRect(0,row-16,W,1);x.fillStyle=th.wallFace;x.fillRect(0,row,W,6);
  const k=(now/24)%(W+120);for(let g=4;g>=0;g--){const px=Math.round(k-g*22-20);if(g){x.globalAlpha=.55;x.drawImage(ART.ghost(S.gstyle,'R',Math.floor(now/140+g)%2),px,row+14)}else{x.globalAlpha=1;x.drawImage(ART.hero(S.outfit,'R',Math.floor(now/140)%2),px,row+14)}}x.globalAlpha=1;
  for(let i=0;i<4;i++)ART.loot(x,((i*97+20)%Math.max(60,W-20))|0,row+34,now+i*400);
  x.fillStyle='rgba(5,6,15,.45)';x.fillRect(0,0,W,H)}
function drawLogo(now){const c=$('logo'),x=c.getContext('2d');x.clearRect(0,0,230,74);x.imageSmoothingEnabled=false;const sc=4;const w=ART.textW('DEJAVAULT',sc);const lx=(230-w)>>1;
  const j=Math.floor(now/2500)%7===0?Math.round(Math.sin(now/30)*2):0;
  ART.text(x,'DEJAVAULT',lx+3,8,'#05060f',sc);ART.text(x,'DEJAVAULT',lx+j+2,4,'#2c3a7a',sc);ART.text(x,'DEJAVAULT',lx,2,'#ffd23f',sc);
  x.fillStyle='#ffd23f';x.fillRect(lx,36,w,2);const w2=ART.textW("'97",3);x.fillStyle='#2c3a7a';x.fillRect(230-lx-w2-12,44,w2+12,28);ART.text(x,"'97",230-lx-w2-6,48,'#ffd23f',3)}
function renderTitle(){const prog=Object.keys(S.lv).length>0;$('bPlay').textContent=prog?T('เล่นต่อ','CONTINUE'):T('เริ่มปล้น','PLAY');$('bStory').textContent=T('ดูเรื่องราว','Story');
  $('sub').textContent=T('ปล้นวนลูปเวลา','The time-loop heist');$('tag').textContent=T('ย้อนเวลา ชวนตัวเองในอดีตมาช่วย แล้วปล้นให้เนียน','Rewind time. Team up with your past selves. Rob the bank.');
  $('brand').textContent='by '+BRAND.en+' · '+BRAND.th;document.querySelectorAll('#langT button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG))}
/* ---------- language ---------- */
function relabelStatic(){document.documentElement.lang=LANG;document.title="DEJAVAULT '97 - "+BRAND.en;
  $('bWait').textContent=T('รอ','WAIT');$('bLoop').innerHTML=T('⟲ วนลูป','⟲ LOOP');$('bUndo').textContent=T('↶ ย้อน','↶ Undo');$('bRestart').textContent=T('↺ ลูปใหม่','↺ Restart');$('bHint').textContent=T('เฉลย','Hint');
  $('keys').innerHTML=T('ลูกศร/WASD เดิน · Space รอ<br>X วนลูป · Z ย้อน · R ลูปใหม่ · Esc พัก','Arrows/WASD move · Space wait<br>X loop · Z undo · R restart · Esc pause');
  if(G.hint){$('hintLbl').textContent=T('เฉลย: ','Solution: ')+G.def.sol.length+T(' ลูป',G.def.sol.length>1?' loops':' loop');$('bHintClose').textContent=T('ปิด','Close')}
  renderTitle();if(SCR==='map')renderMap();updHud();renderOver();renderTip();relabelCut()}
function setLang(l){LANG=l==='en'?'en':'th';S.lang=LANG;langPicked=true;save();relabelStatic();renderModal();Ads.relabel()}
/* ---------- input ---------- */
const KEYMAP={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R',W:'U',S:'D',A:'L',D:'R',' ':'W'};
addEventListener('keydown',e=>{if(Ads.busy())return;AU.unlock();
  if(CUT){if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();cutNext()}else if(e.key==='Escape')endCut();return}
  if($('modal').classList.contains('on')){if(e.key==='Escape'&&MOD){MOD.on(MOD.esc||'no')}return}
  if(SCR!=='game')return;const k=e.key;
  if(G.hint){if(k==='Escape'||k==='h'||k==='H'){stopHint()}return}
  if(KEYMAP[k]){e.preventDefault();if(e.repeat&&performance.now()-G.animT0<150)return;act(KEYMAP[k]);return}
  if(k==='z'||k==='Z'||k==='Backspace'){e.preventDefault();undo()}else if(k==='x'||k==='X'||k==='e'||k==='E'||k==='Enter'){e.preventDefault();commitLoop()}else if(k==='r'||k==='R')restartLoop();else if(k==='Escape'||k==='p'||k==='P')openPause();else if(k==='h'||k==='H')openHint()});
let hold=null;
function holdStart(a){holdEnd();act(a);hold={a,t:setTimeout(function rep(){act(a);hold&&(hold.t=setTimeout(rep,160))},260)}}
function holdEnd(){if(hold){clearTimeout(hold.t);hold=null}}
document.querySelectorAll('#dpad button').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();AU.unlock();b.setPointerCapture&&b.setPointerCapture(e.pointerId);holdStart(b.dataset.a)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,holdEnd))});
let sw=null;$('board').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(G.rp&&performance.now()-G.rp.t0>400){G.rp.done();return}sw={x:e.clientX,y:e.clientY}});
$('board').addEventListener('pointerup',e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;act(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))});
const on=(id,f)=>$(id).addEventListener('click',e=>{AU.unlock();f(e)});
on('bLoop',()=>commitLoop());on('bUndo',()=>undo());on('bRestart',()=>restartLoop());on('bPause',()=>{sfx('ui');openPause()});on('bHint',()=>{sfx('ui');if(G.hint)stopHint();else openHint()});on('bHintClose',()=>{sfx('ui');stopHint()});
on('bPlay',()=>{sfx('ui');if(!S.intro){playCut('intro',()=>{S.intro=true;save();loadLevel(0);show('game')})}else show('map')});
on('bStory',()=>{sfx('ui');playCut('story',()=>{S.intro=true;save();if(SCR==='title')renderTitle()})});
on('bSetT',()=>{sfx('ui');openSettings()});on('bMapBack',()=>{sfx('ui');show('title')});on('bShop',()=>{sfx('ui');openShop()});on('bDaily',()=>{sfx('ui');claimDaily()});
on('bCutNext',()=>cutNext());on('bCutSkip',()=>{sfx('ui');endCut()});$('cutCv').addEventListener('click',()=>cutNext());
document.querySelectorAll('#langT button').forEach(b=>b.addEventListener('click',()=>{sfx('ui');setLang(b.dataset.l)}));
addEventListener('resize',()=>{fitBoard();sizeTitle()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){holdEnd();try{AU.ctx()&&AU.ctx().suspend()}catch(e){}}else if(!Ads.busy()){try{AU.ctx()&&AU.ctx().resume()}catch(e){}}});
Ads.setHooks({pause(){holdEnd();try{AU.master().gain.value=0}catch(e){}},resume(){AU.apply()},locale(l){if(!langPicked&&!S.lang&&l)setLang(String(l).toLowerCase().startsWith('th')?'th':'en')},blocked(){}});
/* ---------- main loop ---------- */
function frame(now){
  if(SCR==='game'&&G.L){if(G.q.length&&G.mode==='play'&&!G.rw&&!G.hint&&now-G.animT0>=STEP_MS*0.85)doAct(G.q.shift());drawBoard(now)}
  else if(SCR==='title'){drawTitleBg(now);drawLogo(now)}
  if(CUT)drawCut(now);
  requestAnimationFrame(frame)}
/* ---------- boot ---------- */
(function boot(){LANG=S.lang||((navigator.language||'').toLowerCase().startsWith('th')?'th':'en');langPicked=!!S.lang;
  AU.init();sizeTitle();relabelStatic();setCoins(S.coins);show('title');requestAnimationFrame(frame)})();


</script>
