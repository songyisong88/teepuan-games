*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#f4b9ae;font-family:"Kanit",system-ui,sans-serif;color:#1f2a5c;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(90,50,110,.16) 100%)}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
.scr.on{display:flex}
.scr>*{pointer-events:auto}
.top{width:100%;display:flex;justify-content:flex-end;gap:8px}
.ib{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.82);color:#1f2a5c;font:inherit;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(80,50,110,.16)}
.ib svg{width:22px;height:22px}
.ttl{margin-top:4vh;text-align:center;color:#fff;text-shadow:0 3px 22px rgba(130,70,130,.38);pointer-events:none}
.brand{font-size:14px;font-weight:600;letter-spacing:.08em;opacity:.95}
.logo{font-size:clamp(46px,13vw,92px);font-weight:800;letter-spacing:.07em;line-height:1.05;margin-top:2px}
.logoTh{font-size:clamp(22px,6vw,34px);font-weight:600;margin-top:-2px}
.mb{margin-top:auto;width:min(420px,100%);display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}
.row>*{flex:1 1 0}
.btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:14px 18px;font-size:18px;line-height:1.2;cursor:pointer;color:#1f2a5c;background:#fff;box-shadow:0 6px 18px rgba(80,50,110,.18);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.y{background:#ffd23f}
.btn.big{font-size:23px;padding:18px 22px}
.btn.gh{background:rgba(255,255,255,.8)}
.btn[disabled]{opacity:.55;cursor:default}
.stat{align-self:center;background:rgba(255,255,255,.8);border-radius:999px;padding:7px 16px;font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;color:#1f2a5c}
.orb{display:inline-block;width:18px;height:18px;border-radius:50%;flex:none;background:radial-gradient(circle at 40% 35%,#fffbe8 0,#ffe08a 45%,#ffb950 100%);box-shadow:0 0 10px rgba(255,200,90,.8)}
.card{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:26px;padding:20px;box-shadow:0 14px 44px rgba(80,50,110,.25);width:min(430px,100%)}
.card h2{font-size:24px;font-weight:800;text-align:center;line-height:1.2}
.card p{font-size:16px;line-height:1.45;text-align:center;margin-top:6px}
.sub{font-size:15px;text-align:center;opacity:.8}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pair .btn{width:100%;font-size:17px;padding:14px 8px}
.rw{background:#fff4cc;border-radius:16px;padding:12px 14px;font-weight:600;font-size:16px;display:flex;gap:10px;align-items:center;margin-top:12px;line-height:1.35;text-align:left}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud.on{display:block}
.hT{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start}
.chip{background:rgba(255,255,255,.8);border-radius:999px;padding:6px 14px 6px 9px;font-weight:600;font-size:18px;display:flex;gap:7px;align-items:center;min-width:76px;color:#1f2a5c}
#hDist{font-size:36px;font-weight:800;color:#fff;text-shadow:0 2px 14px rgba(120,60,120,.45);line-height:1;text-align:center}
#hDist small{font-size:18px;font-weight:600}
#bPause{pointer-events:auto}
.enW{position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(250px,62vw);text-align:center;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 6px rgba(100,50,110,.5)}
.en{margin-top:4px;height:14px;border-radius:999px;background:rgba(31,42,92,.3);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
.en i{display:block;height:100%;width:100%;background:#ffd23f;border-radius:999px;transform-origin:0 50%}
.en.up{box-shadow:0 0 14px rgba(255,240,200,.95)}
#hint,#warn,#pop{position:absolute;left:50%;transform:translateX(-50%);color:#fff;font-weight:600;text-align:center;border-radius:16px;padding:8px 16px;background:rgba(31,42,92,.42);font-size:16px;line-height:1.4;width:max-content;max-width:88vw;transition:opacity .4s;opacity:0}
#hint{top:24%}#warn{top:16%}
#pop{top:34%;background:none;font-size:22px;font-weight:800;text-shadow:0 2px 12px rgba(120,60,120,.5)}
.tr{position:fixed;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:2px solid rgba(255,255,255,.65);background:rgba(255,255,255,.08);pointer-events:none;display:none}
.td{position:fixed;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.75);pointer-events:none;display:none}
#sShop{justify-content:flex-end}
.sheet{width:min(560px,100%)}
.bal{display:flex;justify-content:center;align-items:center;gap:8px;font-weight:600;font-size:17px;margin-top:4px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:14px;max-height:34vh;overflow:auto;padding:2px}
.sk{font:inherit;border:2px solid transparent;border-radius:18px;background:#f3f1fa;padding:10px 6px 8px;color:#1f2a5c;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.sk.sel{border-color:#1f2a5c;background:#fff}
.sw{width:42px;height:42px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(31,42,92,.12)}
.sk b{font-size:14px;font-weight:600;line-height:1.2;text-align:center}
.sk span{font-size:13px;display:flex;align-items:center;gap:4px}
.sk .orb{width:13px;height:13px}
.big{font-size:52px;font-weight:800;text-align:center;line-height:1.05;margin-top:8px}
.big small{font-size:22px;font-weight:600}
.kv{display:flex;justify-content:space-between;font-size:16px;padding:7px 2px;border-bottom:1px solid rgba(31,42,92,.1)}
.kv:last-child{border:0}
.kv b{font-weight:600;display:flex;align-items:center;gap:6px}
.nb{display:block;margin:8px auto 0;background:#ffd23f;border-radius:999px;padding:3px 14px;font-weight:600;font-size:15px;width:max-content}
#modal{position:fixed;inset:0;background:rgba(40,30,72,.35);display:none;align-items:center;justify-content:center;padding:16px}

.how{list-style:none;margin-top:10px}
.how li{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.4;padding:6px 0}
.how i{flex:none;width:28px;height:28px;border-radius:50%;background:#eef0fb;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:600;font-size:14px}
.tg{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;font-size:17px;border-bottom:1px solid rgba(31,42,92,.1)}
.tg button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:6px 16px;background:#eef0fb;color:#1f2a5c;min-width:84px;cursor:pointer}
.tg button.on{background:#ffd23f}
#adov{position:fixed;inset:0;z-index:50;background:rgba(18,22,48,.93);display:none;align-items:center;justify-content:center;padding:18px}

.adl{font-weight:800;font-size:17px}
.adk{font-size:14px;margin-top:4px;opacity:.85}
.adv{margin:14px 0;border-radius:16px;background:#eef0fb;padding:26px 12px}
.adn{font-size:56px;font-weight:800;line-height:1}
.ads1{font-weight:600;margin-top:8px}
.ads2{font-size:13px;margin-top:6px;opacity:.8;line-height:1.4}
.adb{height:8px;border-radius:9px;background:#e5e7f3;overflow:hidden;margin-bottom:12px}
.adb i{display:block;height:100%;width:0;background:#1f2a5c}

#nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px;background:#f4b9ae;color:#1f2a5c}

 .skins{max-height:30vh}.card{padding:14px 16px}.big{font-size:40px}
 #sShop{align-items:flex-end}.sheet{width:min(470px,60vw)}
}

<script>
'use strict';
/* FOLDWIND ร่อนฟ้า — Kairon Arcade. Original game, raw WebGL, no third-party libraries. */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,now=()=>Date.now();
function rng32(s){s=s>>>0;return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hex=h=>{const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]};
const fmt=n=>Math.floor(n).toLocaleString('en-US');

/* ---------- save ---------- */
const KEY='foldwind.v1';
function defaults(){return{best:0,orbs:0,own:['paper'],skin:'paper',lang:'th',snd:true,tilt:false,caps:{day:'',n:{},at:{}},runs:0,tut:0,life:0}}
let S;
try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');S=Object.assign(defaults(),d&&typeof d==='object'?d:{})}catch(e){S=defaults()}
if(!Array.isArray(S.own))S.own=['paper'];if(!S.own.includes('paper'))S.own.push('paper');
if(!S.caps||typeof S.caps!=='object')S.caps={day:'',n:{},at:{}};if(!S.caps.n||typeof S.caps.n!=='object')S.caps.n={};if(!S.caps.at||typeof S.caps.at!=='object')S.caps.at={};
['best','orbs','runs','tut','life'].forEach(k=>{if(typeof S[k]!=='number'||!isFinite(S[k])||S[k]<0)S[k]=0});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let LANG=S.lang==='en'?'en':'th',langPicked=!!localStorage.getItem(KEY);
const T=(th,en)=>LANG==='th'?th:en;
function setLang(l,user){LANG=l==='en'?'en':'th';S.lang=LANG;if(user)langPicked=true;save();document.documentElement.lang=LANG;renderAll()}

/* ---------- rewarded-ad caps (per day + cooldown seconds) ---------- */
const CAP={revive:{day:8,cd:45},double:{day:6,cd:90}};
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function capRoll(){const d=dayKey();if(S.caps.day!==d){S.caps.day=d;S.caps.n={}}}
function capLeft(p){capRoll();return CAP[p].day-(S.caps.n[p]||0)}
function capWait(p){return Math.max(0,((S.caps.at[p]||0)+CAP[p].cd*1000-now())/1000)}
function capOk(p){return Ads.available()&&capLeft(p)>0&&capWait(p)<=0}
function capUse(p){capRoll();S.caps.n[p]=(S.caps.n[p]||0)+1;S.caps.at[p]=now();save()}

/* =====================================================================
   ADS ADAPTER  — one switch: PROVIDER = 'fake' (GitHub Pages demo) | 'y8' (Y8 build)
   Ads.available()  -> ad buttons are shown only when true
   Ads.rewarded(name, rewardText, onReward, onNone)  (ONLY from the player's own tap)
   Ads.interstitial(name, done)  (game-over only, >= 3 min apart, never in first 3 min)
   Reward is granted ONLY when the ad was watched to the end.
   ===================================================================== */
const PROVIDER='fake';
let adOn=false;
const Ads=(()=>{
  const INTER_GAP=180000,AD_SECONDS=5,NO_START_MS=8000;
  let busy=false,lastAdAt=0,H={pause(){},resume(){}};  /* lastAdAt=0 => first break ad no earlier than 3 min into the session */
  let y8Sdk=null,inited=false;
  const Y=window.Y8_CONFIG||{};
  const CONFIGURED=!!(Y.APP_ID&&Y.GAME_ID&&!/^REPLACE_WITH_/.test(Y.APP_ID)&&!/^REPLACE_WITH_/.test(Y.GAME_ID));
  function y8init(){
    if(inited)return;
    if(!CONFIGURED){console.warn('[Y8] APP_ID / GAME_ID not set yet - ads disabled, game runs normally');return}
    if(!window.y8||typeof window.y8.sdk!=='function')return;
    try{y8Sdk=y8.sdk();y8Sdk.init({appId:Y.APP_ID,autoLogin:true},{gameId:Y.GAME_ID,preloadAdBreaks:'on',sound:'on',onReady:()=>{}});
      try{y8Sdk.onAuth(()=>{})}catch(e){}
      inited=true;renderAll();
      try{const loc=y8Sdk.getPlatformLocale&&y8Sdk.getPlatformLocale();const f=l=>{if(!langPicked)setLang(/^th/i.test(l||'')?'th':'en',false)};if(loc&&loc.then)loc.then(f).catch(()=>{});else if(loc)f(loc)}catch(e){}
      try{const b=y8Sdk.isBlacklisted&&y8Sdk.isBlacklisted();if(b&&b.then)b.then(v=>{if(v)blocked()}).catch(()=>{})}catch(e){}
    }catch(e){console.warn('[Y8] init failed',e);y8Sdk=null;inited=false}
  }
  function blocked(){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:999;background:#1f2a5c;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px';d.textContent=T('เกมนี้เล่นได้ที่ Y8.com เท่านั้น','This game can only be played on Y8.com');document.body.appendChild(d)}
  if(PROVIDER==='y8'){window.addEventListener('y8sdk.ready',y8init,{once:true});if(window.y8&&window.y8.emitReadyEvent){try{window.y8.emitReadyEvent()}catch(e){}}}
  function y8brk(type,name,onViewed,cb){
    let started=false,done=false,paused=false,viewed=false,afterT=0;
    const pause=()=>{if(!paused){paused=true;H.pause()}},resume=()=>{if(paused){paused=false;H.resume()}};
    const finish=st=>{if(done)return;done=true;clearTimeout(wd);clearTimeout(afterT);resume();busy=false;if(started)lastAdAt=performance.now();try{cb({viewed,shown:started,st})}catch(e){console.error(e)}};
    const wd=setTimeout(()=>{if(!started)finish('timeout')},NO_START_MS);
    busy=true;
    try{const o={type,name,beforeAd:()=>{started=true;clearTimeout(wd);pause()},afterAd:()=>{resume();afterT=setTimeout(()=>finish('afterAd'),1500)},adBreakDone:i=>finish((i&&i.breakStatus)||'other')};
      if(type==='reward'){o.beforeReward=f=>f();o.adViewed=()=>{if(viewed)return;viewed=true;try{onViewed()}catch(e){console.error(e)}};o.adDismissed=()=>{}}
      const p=y8Sdk.showAd(o);if(p&&p.catch)p.catch(()=>finish('error'))}catch(e){finish('error')}
  }
  let relabelAd=null;
  function fake(kind,rewardText,cb){const rt=()=>typeof rewardText==='function'?rewardText():(rewardText||'');
    const ov=$('adov'),num=$('adNum'),bar=$('adBar'),cl=$('adClose');
    const labels=()=>{$('adLab').textContent=T('โฆษณาตัวอย่าง (ยังไม่ใช่โฆษณาจริง)','SAMPLE AD (not a real ad)');
      $('adKind').textContent=kind==='reward'?T('โฆษณาแลกรางวัล · รางวัล: ','Rewarded ad · reward: ')+rt():T('โฆษณาคั่น (ไม่มีรางวัล)','Break ad (no reward)');
      $('adS1').textContent=T('พื้นที่แสดงคลิปโฆษณา','Ad video area');
      $('adS2').textContent=T('บนเว็บเกมจริง (เช่น Y8) ตรงนี้จะเป็นคลิปโฆษณา เดโมนี้ไม่เรียกเครือข่ายโฆษณาและไม่เก็บข้อมูลใดๆ','On a real game portal (e.g. Y8) an ad video plays here. This demo calls no ad network and collects no data.')};
    const t0=performance.now();let fin=false,closed=false;
    const paint=()=>{labels();const el=(performance.now()-t0)/1000,left=Math.max(0,AD_SECONDS-el);fin=left<=0;num.textContent=fin?'OK':String(Math.ceil(left));bar.style.width=Math.min(100,el/AD_SECONDS*100)+'%';
      if(kind==='reward'){cl.disabled=false;cl.textContent=fin?T('ปิด และรับรางวัล','Close & get reward'):T('ปิด (ไม่ได้รับรางวัล)','Close (no reward)')}
      else{cl.disabled=!fin;cl.textContent=fin?T('ปิดโฆษณา','Close ad'):T('ปิดได้ใน ','Close in ')+Math.ceil(left)+T(' วินาที','s')}};
    paint();const iv=setInterval(paint,100);relabelAd=paint;
    cl.onclick=()=>{if(closed||cl.disabled)return;closed=true;clearInterval(iv);relabelAd=null;ov.classList.remove('on');cl.onclick=null;cb(fin)};
    ov.classList.add('on');
  }
  return{
    setHooks(h){H=h},
    relabel(){if(relabelAd)relabelAd()},
    available(){return PROVIDER==='fake'||(inited&&!!y8Sdk)},
    busy:()=>busy,
    rewarded(name,rewardText,onReward,onNone){
      if(busy)return;
      if(!Ads.available()){onNone&&onNone('unavailable');return}
      if(PROVIDER==='fake'){busy=true;H.pause();fake('reward',rewardText,ok=>{busy=false;lastAdAt=performance.now();H.resume();ok?onReward():(onNone&&onNone('dismissed'))});return}
      y8brk('reward',name,onReward,r=>{if(!r.viewed&&onNone)onNone(r.shown?'dismissed':'unavailable')});
    },
    interstitial(name,done){
      const go=()=>{try{done&&done()}catch(e){console.error(e)}};
      if(busy||!Ads.available()||performance.now()-lastAdAt<INTER_GAP){go();return}
      if(PROVIDER==='fake'){busy=true;H.pause();fake('inter','',()=>{busy=false;lastAdAt=performance.now();H.resume();go()});return}
      y8brk('next',name,null,()=>go());
    },
    _dbg:{age(ms){lastAdAt-=ms},canInter:()=>!busy&&performance.now()-lastAdAt>=INTER_GAP}
  };
})();

/* ---------- WebGL ---------- */
const cv=$('gl');
const gl=cv.getContext('webgl',{antialias:true,alpha:false,depth:true,powerPreference:'high-performance'})||cv.getContext('experimental-webgl');
const PREC='#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n';
const SKYFN=`
vec3 skyc(vec3 d,vec3 sd){float y=d.y;vec3 c;
 vec3 zen=vec3(.45,.54,.89),mid=vec3(.77,.68,.92),hor=vec3(1.,.80,.71),low=vec3(.97,.75,.80),deep=vec3(.84,.71,.89);
 if(y>0.){c=mix(hor,mid,smoothstep(0.,.22,y));c=mix(c,zen,smoothstep(.22,.9,y));}
 else{c=mix(hor,low,smoothstep(0.,-.07,y));c=mix(c,deep,smoothstep(-.07,-.55,y));}
 float s=max(dot(d,sd),0.);c+=vec3(1.,.84,.55)*(pow(s,7.)*.45+pow(s,1.6)*.07);
 return c;}`;
function shd(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)+'\n'+src);return s}
function prog(vs,fs,attrs){const p=gl.createProgram();gl.attachShader(p,shd(gl.VERTEX_SHADER,vs));gl.attachShader(p,shd(gl.FRAGMENT_SHADER,fs));attrs.forEach((a,i)=>gl.bindAttribLocation(p,i,a));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const inf=gl.getActiveUniform(p,i);u[inf.name.replace('[0]','')]=gl.getUniformLocation(p,inf.name)}return{p,u,na:attrs.length}}
let PL,PS,PP,PF,skyBuf,ptBuf,fxBuf,MAXPS=64;
function initGL(){
  PL=prog(`attribute vec3 aP;attribute vec3 aN;attribute vec3 aC;uniform mat4 uVP,uM;uniform vec3 uTint;varying vec3 vC,vN,vW;
void main(){vec4 w=uM*vec4(aP,1.);vW=w.xyz;vN=(uM*vec4(aN,0.)).xyz;vC=aC*uTint;gl_Position=uVP*w;}`,
  PREC+SKYFN+`varying vec3 vC,vN,vW;uniform vec3 uSun,uSunC,uSky,uGnd,uCam;uniform float uEm,uFogD;
void main(){vec3 N=normalize(vN);vec3 V=normalize(uCam-vW);if(dot(N,V)<0.)N=-N;
 float nd=dot(N,uSun);float wr=clamp((nd+.3)/1.3,0.,1.);
 vec3 amb=mix(uGnd,uSky,N.y*.5+.5);
 float rim=pow(1.-max(dot(N,V),0.),3.);
 vec3 c=vC*(amb+uSunC*wr*.85)+uSunC*rim*.16*wr+vec3(.06,.03,.07)*(1.-wr);
 c=mix(c,vC,uEm);
 float dist=length(vW-uCam);float fd=dist*uFogD;float f=1.-exp(-fd*fd);
 f=max(f,smoothstep(-1.,-15.,vW.y)*.9);
 gl_FragColor=vec4(mix(c,skyc(-V,uSun),clamp(f,0.,1.)),1.);}`,['aP','aN','aC']);
  PS=prog(`attribute vec2 aP;varying vec2 vU;void main(){vU=aP;gl_Position=vec4(aP,.99999,1.);}`,
  PREC+SKYFN+`varying vec2 vU;uniform vec3 uR,uU,uF,uSun;uniform vec2 uT;
void main(){vec3 d=normalize(uF+uR*vU.x*uT.x+uU*vU.y*uT.y);vec3 c=skyc(d,uSun);float s=max(dot(d,uSun),0.);
 c+=vec3(1.,.97,.86)*smoothstep(.9986,.9994,s)*.9+vec3(1.,.9,.7)*pow(s,90.)*.35;gl_FragColor=vec4(c,1.);}`,['aP']);
  PP=prog(`attribute vec3 aP;attribute float aS;attribute vec4 aC;uniform mat4 uVP;uniform float uPS,uMax,uFogD;varying vec4 vC;
void main(){gl_Position=uVP*vec4(aP,1.);float w=max(gl_Position.w,.1);gl_PointSize=clamp(aS*uPS/w,1.,uMax);float fd=w*uFogD;vC=aC*exp(-fd*fd);if(gl_Position.w<.2)vC=vec4(0.);}`,
  PREC+`varying vec4 vC;void main(){float r=length(gl_PointCoord-.5)*2.;float a=clamp(1.-r,0.,1.);a=a*a*(3.-2.*a);gl_FragColor=vC*a;}`,['aP','aS','aC']);
  PF=prog(`attribute vec3 aP;attribute vec4 aC;uniform mat4 uVP;uniform float uFogD;varying vec4 vC;
void main(){gl_Position=uVP*vec4(aP,1.);float fd=gl_Position.w*uFogD;vC=aC*exp(-fd*fd);}`,
  PREC+`varying vec4 vC;void main(){gl_FragColor=vC;}`,['aP','aC']);
  skyBuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,skyBuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  ptBuf=gl.createBuffer();fxBuf=gl.createBuffer();
  const r=gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE);MAXPS=r&&r[1]?Math.min(256,r[1]):64;
}
let attrOn=0;
function attrs(n){for(let i=0;i<3;i++){if(i<n&&!(attrOn&1<<i)){gl.enableVertexAttribArray(i);attrOn|=1<<i}else if(i>=n&&(attrOn&1<<i)){gl.disableVertexAttribArray(i);attrOn&=~(1<<i)}}}

/* ---------- math ---------- */
function persp(o,fy,a,n,f){const t=1/Math.tan(fy/2);o.fill(0);o[0]=t/a;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f)}
function norm3(v){const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l]}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function lookAt(o,e,c,u){const z=norm3([e[0]-c[0],e[1]-c[1],e[2]-c[2]]),x=norm3(cross(u,z)),y=cross(z,x);
  o[0]=x[0];o[1]=y[0];o[2]=z[0];o[3]=0;o[4]=x[1];o[5]=y[1];o[6]=z[1];o[7]=0;o[8]=x[2];o[9]=y[2];o[10]=z[2];o[11]=0;
  o[12]=-(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]);o[13]=-(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]);o[14]=-(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]);o[15]=1;return{x,y,z}}
function mul4(o,a,b){for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s}}

/* floating island: grassy top with trees (AO baked under trees), layered pastel earth underside */
const GRASS=[hex('#b5e08f'),hex('#a9dc97'),hex('#c6e48c'),hex('#f2c9cf')];
function makeIsland(r,R){
  const g=GB(),n=11,D=R*(1+r()*.5);const ang=[],rad=[];for(let i=0;i<n;i++){ang.push(i/n*Math.PI*2+(r()-.5)*.25);rad.push(.86+r()*.28)}
  const grass=r()<.18?GRASS[3]:GRASS[Math.floor(r()*3)];
  const trees=[];const nt=Math.floor(R*.45+r()*R*.35);
  for(let k=0;k<nt*3&&trees.length<nt;k++){const a=r()*Math.PI*2,d=Math.sqrt(r())*R*.68;const x=Math.cos(a)*d,z=Math.sin(a)*d;const pine=r()<.5;const cr=pine?.9+r()*.5:1+r()*.6;
    if(trees.some(t=>Math.hypot(t.x-x,t.z-z)<t.r+cr+.2))continue;trees.push({x,z,r:cr,h:pine?2.6+r()*1.6:2.4+r()*1.2,pine,col:Math.floor(r()*3)})}
  const ao=(x,z)=>{let a=1;for(const t of trees){const d=Math.hypot(t.x-x,t.z-z);a-=.38*Math.max(0,1-d/(t.r*2.3))}return Math.max(.55,a)};
  const ringF=[0,.42,.78,1],T=[];
  for(let ri=0;ri<4;ri++){T.push([]);for(let i=0;i<n;i++){const f=ringF[ri],rr=R*f*(ri?rad[i]:1),x=Math.cos(ang[i])*rr,z=Math.sin(ang[i])*rr;const y=ri===0?.4:ri===3?-.12:.18+r()*.24;T[ri].push([x,y,z])}}
  const gc=(p,edge)=>sc(grass,ao(p[0],p[2])*(edge?.93:1));const up=[0,-1e3,0];
  for(let i=0;i<n;i++){const j=(i+1)%n;tri(g,T[0][0],T[1][i],T[1][j],[gc(T[0][0]),gc(T[1][i]),gc(T[1][j])],up);
    for(let ri=1;ri<3;ri++)quad(g,T[ri][i],T[ri][j],T[ri+1][j],T[ri+1][i],[gc(T[ri][i]),gc(T[ri][j]),gc(T[ri+1][j],ri==2),gc(T[ri+1][i],ri==2)],up)}
  const lv=[{f:.99,y:-.75,c:sc(grass,.78)},{f:.9,y:-D*.27,c:hex('#f0b896')},{f:.68,y:-D*.56,c:hex('#d8999f')},{f:.38,y:-D*.84,c:hex('#b48aa8')}];
  let prev=T[3];const pc=[sc(grass,.9)];
  for(let L=0;L<lv.length;L++){const cur=[];for(let i=0;i<n;i++){const a=ang[i]+(r()-.5)*.12,rr=R*lv[L].f*rad[i]*(.9+r()*.2);cur.push([Math.cos(a)*rr,lv[L].y+(r()-.5)*R*.12,Math.sin(a)*rr])}
    const ca=L===0?sc(grass,.9):lv[L-1].c,cb=lv[L].c;
    for(let i=0;i<n;i++){const j=(i+1)%n;quad(g,prev[i],prev[j],cur[j],cur[i],[ca,ca,cb,cb],[0,(prev[i][1]+cur[i][1])/2,0])}prev=cur}
  const tip=[(r()-.5)*R*.2,-D,(r()-.5)*R*.2],tc=hex('#9a7aa3');for(let i=0;i<n;i++){const j=(i+1)%n;tri(g,prev[i],prev[j],tip,[lv[3].c,lv[3].c,tc],[0,-D*.8,0])}
  const PINE=[hex('#7fcfae'),hex('#93d6b9'),hex('#6fc2a8')],ROUND=[hex('#ffbcd2'),hex('#ffd2a6'),hex('#c8e89a')],TRUNK=hex('#b98d7d');
  for(const t of trees){const y0=.22;addCyl(g,t.x,y0-.1,t.z,.18,t.pine?.8:1.1,5,TRUNK);
    if(t.pine){const c=PINE[t.col];addCone(g,t.x,y0+.5,t.z,t.r,t.h*.6,6,sc(c,.92),mixc(c,[1,1,1],.25),r()*3);addCone(g,t.x,y0+.5+t.h*.38,t.z,t.r*.7,t.h*.55,6,c,mixc(c,[1,1,1],.35),r()*3)}

  if(r()<.5){const a=r()*Math.PI*2,d=R*.55;const x=Math.cos(a)*d,z=Math.sin(a)*d;if(!trees.some(t=>Math.hypot(t.x-x,t.z-z)<t.r+.8))addIco(g,x,.3,z,.55,.4,.5,0,r,.2,nn=>nn[1]>.3?hex('#e4dcef'):hex('#c2b5d6'))}
  return{m:mk(g),R,D,trees}
}
function makeRock(r){const g=GB();const top=r()<.5;addIco(g,0,0,0,1,.85+r()*.3,1,1,r,.22,nn=>nn[1]>.55?(top?hex('#b9e39a'):hex('#ece4f4')):mixc(hex('#a596c2'),hex('#cfc3e2'),nn[1]*.5+.5));return mk(g)}

  const wc=hex('#cfcaea'),wt=hex('#b7b0dd');tri(w,[0,0,-.25],[0,0,.2],[-.6,.04,.02],wc,[0,-1,0]);tri(w,[0,0,.2],[-.6,.04,.02],[-1.15,.02,.28],[wc,wc,wt],[0,-1,0]);

function makeGlider(sk){const g=GB(),c=hex(sk.c),a=hex(sk.a);

/* ---------- assets ---------- */
const DEG=Math.PI/180,FAR=430,CL=70;
let ISL=[],ROCK=[],CLOUD=[],TOR,BIRD,GLD={};
function buildAssets(){const r=rng32(20261023);
  [5,6,7,8,9,10,12,6.5,8.5,11].forEach(R=>ISL.push(makeIsland(r,R)));
  for(let i=0;i<4;i++)ROCK.push(makeRock(r));for(let i=0;i<4;i++)CLOUD.push(makeCloud(r));
  TOR=makeTorus();BIRD=makeBird();SKINS.forEach(s=>GLD[s.id]=makeGlider(s))}
const skinOf=id=>SKINS.find(s=>s.id===id)||SKINS[0];

/* ---------- procedural world (70 m chunks, seeded) ---------- */
let SEED=7,chunks=new Map();
function treeTop(t){return t.pine?.72+.93*t.h:1.32+1.65*t.r}
function islHit(o,x,y,z,pr){const hd=Math.hypot(x-o.x,z-o.z);if(hd>o.R*1.25+pr+1)return 0;const top=o.y;
  if(y>=top+.3){const cy=Math.cos(o.yaw),sy=Math.sin(o.yaw);
    for(const t of o.trees){const wx=o.x+cy*t.x+sy*t.z,wz=o.z-sy*t.x+cy*t.z;if(Math.hypot(x-wx,z-wz)<t.r*.85+pr&&y<top+treeTop(t)+pr*.4)return 2}
    return(y<top+.45+pr*.6&&hd<o.R*.95)?1:0}
  if(y<top-o.D-pr)return 0;const t=clamp((top-y)/o.D,0,1),rr=o.R*(1-t*t*.88);return hd<rr*.94+pr*.4?1:0}
function genChunk(i){
  const r=rng32((SEED*7919+i*104729)>>>0),R=(a,b)=>a+(b-a)*r(),RI=n=>Math.floor(r()*n);
  const d=clamp(i/40,0,1),z0=-i*CL,z1=z0-CL;
  const c={i,isl:[],far:[],rocks:[],orbs:[],rings:[],ups:[],birds:[],clouds:[]};
  for(let k=0;k<5;k++)c.clouds.push({v:RI(4),x:R(-80,80),y:R(-17,-8),z:R(z1,z0),s:R(3.5,7),yaw:R(0,6.28)});
  for(let k=0;k<2;k++){const sd=r()<.5?-1:1;c.clouds.push({v:RI(4),x:sd*R(28,100),y:R(18,52),z:R(z1,z0),s:R(3,7),yaw:R(0,6.28)})}
  for(let k=0;k<2;k++){const sd=r()<.5?-1:1;c.far.push({v:RI(ISL.length),x:sd*R(42,100),y:R(-8,36),z:R(z1,z0),s:R(1.2,2.4),yaw:R(0,6.28)})}
  if(i<1){if(i===0)for(let k=0;k<6;k++)c.orbs.push({x:Math.sin(k*.5)*2,y:12-k*.3,z:-24-k*4.5,t:0});return c}
  if(r()<(i<3?1:lerp(.85,.55,d)))c.ups.push({x:R(-9,9),z:R(z1+12,z0-12),r:3.2,top:R(26,34)});
  const okSpot=(x,y,z,rad)=>!c.ups.some(u=>Math.hypot(u.x-x,u.z-z)<u.r+rad+1.5)&&!c.isl.some(o=>Math.hypot(o.x-x,o.z-z)<o.R+rad+1&&y>o.y-o.D-rad&&y<o.y+5+rad)&&!c.rocks.some(o=>Math.hypot(o.x-x,o.y-y,o.z-z)<o.r+rad+1)&&!c.rings.some(o=>Math.hypot(o.x-x,o.y-y,o.z-z)<rad+4);
  const ni=1+(r()<.35+.35*d?1:0);
  for(let k=0;k<ni;k++){const v=RI(ISL.length),I=ISL[v];const x=R(-17,17),y=R(-2,22),z=R(z1+I.R,z0-I.R);if(okSpot(x,y,z,I.R))c.isl.push({v,x,y,z,yaw:R(0,6.28),R:I.R,D:I.D,trees:I.trees})}
  if(r()<.55){const x=R(-10,10),y=R(4,24),z=R(z1+14,z0-14);if(okSpot(x,y,z,3)){c.rings.push({x,y,z,R:2.7,pass:0});for(let k=1;k<=4;k++)c.orbs.push({x,y,z:z+k*4,t:0});for(let k=1;k<=3;k++)c.orbs.push({x,y,z:z-k*4,t:0})}}
  const nr=Math.floor(d*4+r()*2+(i>2?1:0));
  for(let k=0;k<nr;k++){const rr=R(1.1,2.3),x=R(-13,13),y=R(0,28),z=R(z1+3,z0-3);if(okSpot(x,y,z,rr))c.rocks.push({v:RI(4),x,y,z,r:rr,yaw:R(0,6.28),sp:R(-.4,.4)})}
  if(i>4&&r()<.15+.45*d){const n=3+RI(3),dir=r()<.5?-1:1,y=R(4,24),z=R(z1+10,z0-10),v=R(3.5,6)+d*2.5,xc=R(-9,9);
    for(let j=0;j<n;j++)c.birds.push({xc:xc-dir*j*1.6,y:y+(j%2)*1.1+R(-.3,.3),z:z+j*1.4,dir,v,ph:R(0,6.28),x:0})}
  const np=1+(r()<.6?1:0);
  for(let k=0;k<np;k++){const kind=RI(3);
    if(kind===1&&c.ups.length){const u=c.ups[0];for(let j=0;j<7;j++){const a=j*.9;c.orbs.push({x:u.x+Math.cos(a)*1.6,y:1+j*3.4,z:u.z+Math.sin(a)*1.6,t:0})}}
    else if(kind===2&&c.isl.length){const o=c.isl[0];const top=o.y+(o.trees.length?5.6:2.4);for(let j=0;j<7;j++){const t=j/6;c.orbs.push({x:o.x,y:top+Math.sin(t*Math.PI)*2,z:o.z+o.R-t*o.R*2,t:0})}}
    else{const x0=R(-11,11),y0=R(2,24),zb=R(z1+30,z0-4),ax=R(-2.5,2.5),ay=R(-2,2);for(let j=0;j<7;j++)c.orbs.push({x:x0+Math.sin(j*.6)*ax,y:y0+Math.sin(j*.5)*ay,z:zb-j*4,t:0})}}
  c.orbs=c.orbs.filter(o=>o.y>-1.5&&!c.rocks.some(q=>Math.hypot(q.x-o.x,q.y-o.y,q.z-o.z)<q.r+1.3)&&!c.isl.some(q=>islHit(q,o.x,o.y,o.z,.9)));

$('bPlay').onclick=()=>{sfx.click();startRun()};$('bShop').onclick=()=>{sfx.click();openShop()};$('bHow').onclick=()=>{sfx.click();openHow()};
$('bLang').onclick=()=>setLang(LANG==='th'?'en':'th',true);$('bSnd').onclick=toggleSnd;$('bPause').onclick=pause;
$('shBack').onclick=()=>{state='menu';showScreen('sMenu');renderMenu()};

/* ---------- loop ---------- */
let lastT=performance.now(),qAcc=0,qN=0,fpsAvg=60;
function quality(dt){if(state!=='play'||qLock)return;qAcc+=dt;qN++;if(qAcc>3){const avg=qAcc/qN;fpsAvg=1/avg;qAcc=0;qN=0;if(avg>.021&&QUAL>.75){QUAL=Math.max(.75,Math.min(QUAL,DPR)-.25);resize()}}}
function frame(t){requestAnimationFrame(frame);let dt=(t-lastT)/1000;lastT=t;if(!(dt>0))dt=0;if(dt>.1)dt=.1;
  try{if(!adOn)update(dt);render();hud();quality(dt)}catch(e){console.error(e);throw e}}
window.__fw={get state(){return state},P,S,get dist(){return dist},get runOrbs(){return runOrbs},get chunks(){return chunks},start:startRun,crash:w=>crash(w),Ads,
  orbAhead(dz){const z=P.z-dz;const c=chunks.get(Math.floor(-z/CL));c.orbs.push({x:P.x,y:P.y,z,t:0})},
  rockAhead(dz){const z=P.z-dz;const c=chunks.get(Math.floor(-z/CL));c.rocks.push({v:0,x:P.x,y:P.y,z,r:1.8,yaw:0,sp:0})},
  clearAhead(){for(const c of chunks.values()){c.rocks=[];c.birds=[];c.isl=[]}},
  giveOrbs(n){S.orbs+=n;save();renderAll()},adAge(ms){Ads._dbg.age(ms)},qual(q){QUAL=q;qLock=true;resize()},get fps(){return fpsAvg},get draws(){return drawCalls},setLang};
function boot(){try{if(!gl)throw new Error('no webgl');initGL();buildAssets()}catch(e){console.error(e);const n=$('nogl');n.style.display='flex';n.textContent=T('อุปกรณ์นี้ยังไม่รองรับภาพ 3 มิติ (WebGL) ลองเปิดด้วย Chrome หรือ Safari รุ่นใหม่','This device does not support 3D graphics (WebGL). Try a recent Chrome or Safari.');return}
  if(S.tilt&&TILT_OK&&!(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'))startTilt();
  document.documentElement.lang=LANG;resetWorld(7);resetP(13);showScreen('sMenu');renderAll();resize();requestAnimationFrame(frame)}
boot();
