<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8E5DE">
<title>ตี้ป่วน — เกมแก้เบื่อ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23111%22/%3E%3Crect x=%223%22 y=%2210%22 width=%2210%22 height=%223%22 fill=%22%23E8E5DE%22/%3E%3Crect x=%224%22 y=%226%22 width=%228%22 height=%223%22 fill=%22%23FF3B1F%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kanit:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8E5DE;--ink:#111;--red:#FF3B1F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Kanit",system-ui,sans-serif;
  background-image:linear-gradient(rgba(17,17,17,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(17,17,17,.06) 1px,transparent 1px);background-size:32px 32px;
  padding:calc(env(safe-area-inset-top) + 28px) 20px 40px}
.wrap{max-width:420px;margin:0 auto}
h1{font-weight:900;font-size:64px;line-height:1}
.en{font-family:"Anton",Impact,sans-serif;font-size:22px;color:var(--red);letter-spacing:.06em;margin-top:6px}
.rule{height:5px;background:var(--ink);margin:18px 0 22px}
p.lead{font-size:16px;line-height:1.6}
a.card{display:block;margin-top:22px;text-decoration:none;color:var(--ink);background:var(--bg);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink);padding:18px 18px 16px;position:relative;transition:transform .06s,box-shadow .06s}
a.card:active{transform:translate(8px,8px);box-shadow:2px 2px 0 var(--ink)}
.no{position:absolute;top:-4px;right:-4px;background:var(--ink);color:var(--bg);font-family:"Anton",Impact,sans-serif;font-size:18px;padding:2px 10px}
.t{font-weight:900;font-size:32px;line-height:1.05}
.e{font-family:"Anton",Impact,sans-serif;font-size:18px;color:var(--red);letter-spacing:.05em}
.d{margin-top:8px;font-size:15px;line-height:1.5}
.go{display:inline-block;margin-top:12px;background:var(--ink);color:var(--bg);font-weight:900;padding:8px 16px;box-shadow:5px 5px 0 var(--red)}
.soon{margin-top:26px;border:3px dashed var(--ink);padding:14px 16px;opacity:.55;font-weight:600}
.foot{margin-top:30px;font-size:12px;letter-spacing:.12em;opacity:.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>ตี้ป่วน</h1>
  <div class="en">TEEPUAN GAMES</div>
  <div class="rule"></div>
  <p class="lead">เกมสั้นแก้เบื่อ เล่นจบใน 30–90 วินาที เล่นได้ด้วยนิ้วเดียวบนมือถือ</p>
  <a class="card" href="steel-stack/">
    <span class="no">01</span>
    <div class="t">หอคอยเหล็ก</div>
    <div class="e">STEEL STACK</div>
    <div class="d">แตะให้ถูกจังหวะ วางบล็อกเหล็กซ้อนให้สูงที่สุด วางตรงเป๊ะได้คอมโบ</div>
    <span class="go">เล่นเลย →</span>
  </a>
  <div class="soon">เกมถัดไป · เร็วๆ นี้</div>
  <div class="foot">ต้นแบบ v0.1 · ยังไม่มีตารางอันดับ</div>
</div>
</body>
</html>
