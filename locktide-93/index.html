unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
:root{--navy:#0b0e22;--navy2:#141a3e;--navy3:#1d2550;--line:#2f3a78;--yel:#ffd23f;--yel2:#d9a520;--ink:#f4f1e6;--dim:#9aa3cf;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);font-family:Kanit,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.px{font-weight:800;letter-spacing:.02em}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:44px;padding:8px 16px;border-radius:6px;font-weight:800;font-size:16px;line-height:1.15;white-space:nowrap;
 background:var(--yel);color:var(--navy);box-shadow:0 4px 0 var(--yel2),0 6px 0 #05060f;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--yel2),0 2px 0 #05060f}
.btn.ghost{background:var(--navy3);color:var(--ink);box-shadow:0 4px 0 #0a0d24,0 6px 0 #05060f;outline:2px solid var(--line);outline-offset:-2px}
.btn.sm{min-height:36px;font-size:14px;padding:6px 12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ico{width:40px;height:40px;min-height:40px;padding:0;border-radius:6px;background:var(--navy3);outline:2px solid var(--line);outline-offset:-2px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--ink)}
.ico:active{transform:translateY(2px)}
.coins{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--yel);background:var(--navy3);padding:4px 10px;border-radius:20px;outline:2px solid var(--line);outline-offset:-2px;font-size:15px}
.coin{width:14px;height:14px;border-radius:50%;background:var(--yel);box-shadow:inset -2px -2px 0 var(--yel2);display:inline-block}
/* title */
#scr-title{align-items:center;justify-content:center;background:var(--navy)}
#titleBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#titleShade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(11,14,34,.55),rgba(11,14,34,.15) 70%)}
#titleBox{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;text-align:center;width:min(92vw,520px)}
#logo{width:min(88vw,440px);height:auto}
#sub{font-size:clamp(16px,4.6vw,22px);font-weight:800;color:var(--yel);text-shadow:0 2px 0 #05060f}
#tag{font-size:14px;color:var(--ink);text-shadow:0 2px 0 #05060f;margin-top:-4px}
#titleBtns{display:grid;gap:12px;width:min(78vw,300px);margin-top:12px}
#titleBtns .btn{width:100%;font-size:18px;min-height:52px}
#titleRow{display:flex;gap:10px;justify-content:center}
#brand{position:absolute;bottom:calc(10px + var(--safe-b));left:0;right:0;text-align:center;font-size:13px;color:var(--ink);text-shadow:0 2px 0 #05060f}
#brand b{color:var(--yel)}
.lang{display:inline-flex;border-radius:6px;overflow:hidden;outline:2px solid var(--line);outline-offset:-2px}
.lang button{min-width:52px;min-height:40px;font-weight:800;font-size:14px;color:var(--dim);background:var(--navy3)}
.lang button.on{background:var(--yel);color:var(--navy)}
/* map */
#scr-map{background:linear-gradient(#0b0e22,#10153a)}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(11,14,34,.92);border-bottom:2px solid var(--line);z-index:2}
.top .ttl{flex:1;min-width:0;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mapScroll{flex:1;overflow-y:auto;padding:12px 12px calc(24px + var(--safe-b));-webkit-overflow-scrolling:touch}
.zone{max-width:760px;margin:0 auto 18px;background:var(--navy2);border-radius:10px;outline:2px solid var(--line);outline-offset:-2px;overflow:hidden}
.zhead{position:relative;height:100px}
.zhead canvas{width:100%;height:100%;object-fit:cover}
.zhead .zt{position:absolute;left:12px;bottom:8px;right:12px;text-shadow:0 2px 0 #05060f}
.zt .zn{font-size:12px;color:var(--yel);font-weight:800;letter-spacing:.12em}
.zt .zname{font-size:20px;font-weight:800;line-height:1.15}
.zprog{position:absolute;right:10px;top:8px;font-weight:800;color:var(--yel);background:rgba(11,14,34,.85);padding:2px 8px;border-radius:12px;font-size:13px}
.lvgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
@media (min-width:600px){.lvgrid{grid-template-columns:repeat(7,1fr)}}
.lv{position:relative;aspect-ratio:1/1.05;border-radius:8px;background:var(--navy3);outline:2px solid var(--line);outline-offset:-2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800}
.lv .n{font-size:clamp(16px,4.6vw,22px);color:var(--ink)}
.lv .st{font-size:11px;letter-spacing:1px;color:var(--yel)}
.lv .st i{font-style:normal;opacity:.25}
.lv.cur{outline-color:var(--yel);animation:pulse 1.2s infinite}

<script>
/* LOCKTIDE '93 — deterministic harbour simulation (Kairon Arcade). Shared by the game and the level verifier. */
const SIM=(()=>{
const KINDS={
  dinghy:{L:2.4,draft:0.7,h:1.9,v:1.7,fr:1},
  sail:{L:3.0,draft:1.1,h:5.2,v:1.4,fr:1},
  tug:{L:2.6,draft:1.3,h:2.6,v:2.1,fr:1},
  barge:{L:3.6,draft:0.9,h:2.0,v:1.1,fr:1,cap:2},
  pirate:{L:3.6,draft:1.6,h:5.8,v:1.5,fr:0},
  raider:{L:2.4,draft:0.9,h:2.4,v:2.2,fr:0}
};
const RATE=1.6,EPS=0.35,GZ=1.7,DT=1/60,CRATE=0.6;
function make(def){
  const s={t:0,def,status:'play',why:null,ev:[],
    basins:def.basins.map(b=>({x0:b.x0,x1:b.x1,h:b.L0,tg:b.L0,min:b.min==null?1:b.min,max:b.max==null?10:b.max,auto:b.auto||null})),
    gates:def.basins.slice(1).map(b=>({x:b.x0,open:false,pd:0})),
    boats:def.boats.map((b,i)=>{const k=KINDS[b.k];return{i,k:b.k,x:b.x==null?-2:b.x,dir:b.dir||1,L:k.L,draft:k.draft,h:k.h,v:b.v||k.v,fr:k.fr,dock:b.dock,delay:b.delay||0,need:b.need||0,cap:k.cap||0,crates:0,st:'idle',cr:[],ph:i*1.7}})};
  s.basins.forEach(b=>{if(b.auto){b.h=autoH(b,0);b.tg=b.h}});
  s.gates.forEach((g,i)=>g.pd=s.basins[i].h-s.basins[i+1].h);
  return s;
}
function autoH(b,t){const a=b.auto;return a.base+a.amp*Math.sin(2*Math.PI*t/a.per+(a.ph||0))}
function basinAt(s,x){const B=s.basins;for(let i=0;i<B.length;i++)if(x<B[i].x1)return i;return B.length-1}
function wave(s,x,t){const w=s.def.waves;return w?w.A*Math.sin(w.k*x-w.w*t):0}
function levelAt(s,x){return s.basins[basinAt(s,x)].h+wave(s,x,s.t)}
function groups(s){const n=s.basins.length,g=[];let cur=[0];for(let i=1;i<n;i++){if(s.gates[i-1].open)cur.push(i);else{g.push(cur);cur=[i]}}g.push(cur);return g}
function groupOf(s,bi){return groups(s).find(g=>g.includes(bi))}
function setTarget(s,bi,v){const b=s.basins[bi];if(!b||b.auto)return false;const g=groupOf(s,bi);if(g.some(i=>s.basins[i].auto))return false;
  v=Math.max(b.min,Math.min(b.max,Math.round(v*10)/10));g.forEach(i=>s.basins[i].tg=v);return true}
function active(b){return b.st==='idle'||b.st==='sail'||b.st==='ground'||b.st==='lock'}
function span(b,x){return[x-b.L/2,x+b.L/2]}
function ov(a0,a1,b0,b1){return a0<b1&&a1>b0}
function vert(s,b,x){const lv=levelAt(s,x);const bot=lv-b.draft;return{lv,bot,top:bot+b.h}}
function hazards(s,b,x){const[a0,a1]=span(b,x),{bot,top}=vert(s,b,x);let rock=false,sand=bot<0,bridge=false;
  for(const f of s.def.bed||[])if(ov(a0,a1,f.x0,f.x1)&&bot<f.y){if(f.t==='rock')rock=true;else sand=true}
  for(const br of s.def.bridges||[])if(ov(a0,a1,br.x0,br.x1)&&top>br.y)bridge=true;
  return{rock,sand,bridge}}
function E(s,type,b,extra){s.ev.push(Object.assign({t:Math.round(s.t*100)/100,type,i:b?b.i:-1},extra||{}))}
function kill(s,b,why){b.st=b.fr?'sunk':'wreck';E(s,b.fr?'sunk':'wreck',b,{why});if(b.fr&&s.status==='play'){s.status='fail';s.why=why}}
function step(s){if(s.status!=='play')return;s.t+=DT;const t=s.t,B=s.basins;
  // water
  for(const g of groups(s)){const au=g.find(i=>B[i].auto);
    if(au!=null){const h=autoH(B[au],t);g.forEach(i=>{B[i].h=h;if(!B[i].auto)B[i].tg=h})}
    else{const tg=B[g[0]].tg;let h=B[g[0]].h;const d=tg-h,m=RATE*DT;h=Math.abs(d)<=m?tg:h+Math.sign(d)*m;g.forEach(i=>B[i].h=h)}}
  // gates
  s.gates.forEach((gt,i)=>{const a=B[i],c=B[i+1];const near=s.boats.some(b=>active(b)&&b.st!=='idle'&&ov(b.x-b.L/2,b.x+b.L/2,gt.x-GZ,gt.x+GZ));const d=a.h-c.h;
    if(!gt.open){if(near&&(Math.abs(d)<EPS||(d*gt.pd<0))){gt.open=true;const h=a.auto?a.h:c.auto?c.h:(a.h+c.h)/2;a.h=c.h=h;if(!a.auto)a.tg=h;if(!c.auto)c.tg=h;E(s,'open',null,{g:i})}}
    else if(!near){gt.open=false;if(!a.auto)a.tg=a.h;if(!c.auto)c.tg=c.h;E(s,'close',null,{g:i})}
    gt.pd=a.h-c.h});
  // boats
  for(const b of s.boats){if(!active(b))continue;
    if(t<b.delay){b.st='idle';continue}
    if(b.st==='idle'){b.st='sail';E(s,'start',b)}
    let hz=hazards(s,b,b.x);
    if(hz.rock){kill(s,b,'rock');continue}
    if(hz.bridge){kill(s,b,'bridge');continue}
    if(hz.sand){if(!b.fr){b.st='beached';E(s,'beached',b);continue}if(b.st!=='ground')E(s,'ground',b);b.st='ground';continue}
    let nx=b.x+b.dir*b.v*DT;const fr=b.x+b.dir*b.L/2,nf=nx+b.dir*b.L/2;
    let blocked=false;s.gates.forEach(g=>{if(!g.open&&(b.dir>0?(fr<=g.x+1e-6&&nf>g.x-0.05):(fr>=g.x-1e-6&&nf<g.x+0.05)))blocked=true});
    if(blocked){if(b.st!=='lock')E(s,'lock',b);b.st='lock';continue}
    hz=hazards(s,b,nx);
    if(hz.sand&&!hz.rock){if(!b.fr){b.x=nx;b.st='beached';E(s,'beached',b);continue}if(b.st!=='ground')E(s,'ground',b);b.st='ground';continue}
    const ox=b.x;b.x=nx;if(b.st!=='sail'){b.st='sail'}
    if(hz.rock){kill(s,b,'rock');continue}
    if(hz.bridge){kill(s,b,'bridge');continue}
    if(b.cap)(s.def.cranes||[]).forEach((c,ci)=>{if(!b.cr.includes(ci)&&(ox-c.x)*(b.x-c.x)<=0){b.cr.push(ci);const{top}=vert(s,b,b.x);
      if(top>=c.hook){b.crates++;b.draft+=CRATE;E(s,'load',b,{c:ci});if(b.crates>b.cap){kill(s,b,'overload')}}else E(s,'miss',b,{c:ci})}});
    if(!active(b))continue;
    if(b.fr&&b.dock!=null&&(b.dir>0?b.x>=b.dock:b.x<=b.dock)){if(b.crates<b.need){kill(s,b,'empty');continue}b.x=b.dock;b.st='docked';E(s,'dock',b)}
    if(!b.fr&&s.def.village!=null&&(b.dir>0?b.x>=s.def.village:b.x<=s.def.village)){b.st='raid';E(s,'raid',b);if(s.status==='play'){s.status='fail';s.why='raid'}}
  }
  if(s.status!=='play')return;
  const fr=s.boats.filter(b=>b.fr),pi=s.boats.filter(b=>!b.fr);
  if(fr.every(b=>b.st==='docked')&&pi.every(b=>!active(b))){s.status='win';E(s,'win')}
  else if(t>=(s.def.limit||150)){s.status='fail';s.why='time';E(s,'time')}
}
function run(def,sol,maxT){const s=make(def);let k=0;const cmds=(sol||[]).slice().sort((a,b)=>a[0]-b[0]);
  while(s.status==='play'&&s.t<(maxT||400)){while(k<cmds.length&&s.t>=cmds[k][0]-1e-9){setTarget(s,cmds[k][1],cmds[k][2]);k++}step(s)}
  return s}
return{KINDS,RATE,DT,EPS,make,step,setTarget,run,levelAt,basinAt,vert,groups,groupOf,active,hazards,autoH,wave};
})();

/* =====================================================================
   ADS ADAPTER  — one switch: PROVIDER = 'fake' (GitHub Pages demo) | 'y8' (Y8 build)
   Game calls:  Ads.available()                                   -> ad buttons are shown only when true
                Ads.rewarded(name, rewardText, onReward, onNone)   (ONLY from the player's own tap)
                Ads.interstitial(name, done)                      (only at natural breaks, >= 3 min apart, never in first 3 min)
   Reward is granted ONLY when the ad was watched to the end (fake: countdown done / Y8: adViewed).
   Game is paused + muted while any ad is on screen.
   ===================================================================== */
const PROVIDER='fake';
const Ads=(()=>{
  const INTER_GAP=180000,AD_SECONDS=5,NO_START_MS=8000;
  let busy=false,lastAdAt=0,H={pause(){},resume(){},ready(){},locale(){},blocked(){}};
  let y8Sdk=null,inited=false;
  const Y=window.Y8_CONFIG||{};
  const CONFIGURED=!!(Y.APP_ID&&Y.GAME_ID&&!/^REPLACE_WITH_/.test(Y.APP_ID)&&!/^REPLACE_WITH_/.test(Y.GAME_ID));
  function y8init(){
    if(inited)return;
    if(!CONFIGURED){console.warn('[Y8] APP_ID / GAME_ID not set yet - ads disabled, game runs normally');return}
    if(!window.y8||typeof window.y8.sdk!=='function')return;
    try{y8Sdk=y8.sdk();y8Sdk.init({appId:Y.APP_ID,autoLogin:true},{gameId:Y.GAME_ID,preloadAdBreaks:'on',sound:'on',onReady:()=>{}});
      try{y8Sdk.onAuth(()=>{})}catch(e){}
      inited=true;H.ready();
      try{const loc=y8Sdk.getPlatformLocale&&y8Sdk.getPlatformLocale();if(loc&&loc.then)loc.then(l=>H.locale(l)).catch(()=>{});else H.locale(loc)}catch(e){}
      try{const b=y8Sdk.isBlacklisted&&y8Sdk.isBlacklisted();if(b&&b.then)b.then(v=>{if(v)H.blocked()}).catch(()=>{})}catch(e){}
    }catch(e){console.warn('[Y8] init failed',e);y8Sdk=null;inited=false}
  }
  if(PROVIDER==='y8'){window.addEventListener('y8sdk.ready',y8init,{once:true});if(window.y8&&window.y8.emitReadyEvent){try{window.y8.emitReadyEvent()}catch(e){}}}
  function y8brk(type,name,onViewed,cb){
    let started=false,done=false,paused=false,viewed=false,afterT=0;
    const pause=()=>{if(!paused){paused=true;H.pause()}},resume=()=>{if(paused){paused=false;H.resume()}};
    const finish=st=>{if(done)return;done=true;clearTimeout(wd);clearTimeout(afterT);resume();busy=false;if(started)lastAdAt=performance.now();try{cb({viewed,shown:started,st})}catch(e){console.error(e)}};
    const wd=setTimeout(()=>{if(!started)finish('timeout')},NO_START_MS);
    busy=true;
    try{const o={type,name,beforeAd:()=>{started=true;clearTimeout(wd);pause()},afterAd:()=>{resume();afterT=setTimeout(()=>finish('afterAd'),1500)},adBreakDone:i=>finish((i&&i.breakStatus)||'other')};
      if(type==='reward'){o.beforeReward=f=>f();o.adViewed=()=>{if(viewed)return;viewed=true;try{onViewed()}catch(e){console.error(e)}};o.adDismissed=()=>{}}
      const p=y8Sdk.showAd(o);if(p&&p.catch)p.catch(()=>finish('error'))}catch(e){finish('error')}
  }
  let relabelAd=null;
  function fake(kind,rewardText,cb){const rt=()=>typeof rewardText==='function'?rewardText():(rewardText||'');
    const q=id=>document.getElementById(id);const ov=q('adov'),num=q('adNum'),bar=q('adBar'),cl=q('adClose');
    const labels=()=>{q('adLab').textContent=T('โฆษณาตัวอย่าง (ยังไม่ใช่โฆษณาจริง)','SAMPLE AD (not a real ad)');
      q('adKind').textContent=kind==='reward'?T('รางวัล: ','Reward: ')+rt():T('โฆษณาคั่น (ไม่มีรางวัล)','Break ad (no reward)');
      q('adS1').textContent=T('พื้นที่แสดงคลิปโฆษณา','Ad video area');
      q('adS2').textContent=T('บนเว็บเกมจริง (เช่น Y8) ตรงนี้จะเป็นคลิปโฆษณา เดโมนี้ไม่เรียกเครือข่ายโฆษณาและไม่เก็บข้อมูลใดๆ','On a real game portal (e.g. Y8) an ad video plays here. This demo calls no ad network and collects no data.')};
    const t0=performance.now();let fin=false,closed=false;
    const paint=()=>{labels();const el=(performance.now()-t0)/1000,left=Math.max(0,AD_SECONDS-el);fin=left<=0;num.textContent=fin?'OK':String(Math.ceil(left));bar.style.width=Math.min(100,el/AD_SECONDS*100)+'%';
      if(kind==='reward'){cl.disabled=false;cl.textContent=fin?T('ปิด และรับรางวัล','Close & get reward'):T('ปิด (ไม่ได้รับรางวัล)','Close (no reward)')}
      else{cl.disabled=!fin;cl.textContent=fin?T('ปิดโฆษณา','Close ad'):T('ปิดได้ใน ','Close in ')+Math.ceil(left)+T(' วินาที','s')}
      cl.classList.toggle('done',fin)};
    paint();const iv=setInterval(paint,100);relabelAd=paint;
    cl.onclick=()=>{if(closed||cl.disabled)return;closed=true;clearInterval(iv);relabelAd=null;ov.classList.remove('on');cl.onclick=null;cb(fin)};
    ov.classList.add('on');
  }
  return{
    setHooks(h){Object.assign(H,h)},
    relabel(){if(relabelAd)relabelAd()},
    available(){return PROVIDER==='fake'||(inited&&!!y8Sdk)},
    busy:()=>busy,
    canInter:()=>!busy&&Ads.available()&&performance.now()-lastAdAt>=INTER_GAP,
    rewarded(name,rewardText,onReward,onNone){
      if(busy)return;
      if(!Ads.available()){onNone&&onNone('unavailable');return}
      if(PROVIDER==='fake'){busy=true;H.pause();fake('reward',rewardText,ok=>{busy=false;lastAdAt=performance.now();H.resume();ok?onReward():(onNone&&onNone('dismissed'))});return}
      y8brk('reward',name,onReward,r=>{if(!r.viewed&&onNone)onNone(r.shown?'dismissed':'unavailable')});
    },
    interstitial(name,done){
      const go=()=>{try{done&&done()}catch(e){console.error(e)}};
      if(busy||!Ads.available()||performance.now()-lastAdAt<INTER_GAP){go();return}
      if(PROVIDER==='fake'){busy=true;H.pause();fake('inter','',()=>{busy=false;lastAdAt=performance.now();H.resume();go()});return}
      y8brk('next',name,null,()=>go());
    },
    
  };
})();

  const g=SIM.groupOf(s,bi);if(g.some(i=>s.basins[i].auto)){const n=performance.now();if(n-G.warnSea>1500){G.warnSea=n;toast(T('ประตูเปิดสู่ทะเลอยู่ ทะเลคุมระดับน้ำ','The gate is open to the sea. The tide is in control'))}return}
  v=Math.max(b.min,Math.min(b.max,v));
  const old=b.tg;SIM.setTarget(s,bi,v);if(Math.abs(b.tg-old)<.01)return;
  const now=performance.now();if(!G.mv||G.mv.bi!==bi||(how!=='drag'&&now-G.mv.last>700)||(how==='drag'&&!G.mv.drag)){G.moves++;G.mv={bi,last:now,drag:how==='drag'}}else G.mv.last=now;
  sfx('water',b.tg>old);G.sel=bi;updHud()}
function endDrag(){if(G.mv){G.mv.drag=false;G.mv.last=performance.now()}sfx('commit')}
function nudge(bi,d){const b=G.s&&G.s.basins[bi];if(!b)return;const q=Math.abs(d)<.5?10:2;setT(bi,Math.round((b.tg+d)*q)/q,'key')}
/* ---------- levers ---------- */
const LMAX=11;
function buildLevers(){const s=G.s;let h='';s.basins.forEach((b,i)=>{let tk='';for(let v=1;v<=10;v++)tk+='<i class="tk'+(v%2?'':' m')+'" style="bottom:'+(v/LMAX*100)+'%"></i>'+(v%2?'':'<span class="tn" style="bottom:'+(v/LMAX*100)+'%">'+v+'</span>');
    h+='<div class="lev'+(b.auto?' auto':'')+'" data-b="'+i+'"><div class="lh"></div><button class="ar" data-d="1" aria-label="up">▲</button><div class="trk">'+tk+'<div class="wf"></div><div class="gh"></div>'+(b.auto?'':'<div class="th"></div>')+'</div><button class="ar" data-d="-1" aria-label="down">▼</button></div>'});
  $('levers').innerHTML=h;
  $('levers').querySelectorAll('.lev').forEach(el=>{const bi=+el.dataset.b;const trk=el.querySelector('.trk');
    el.querySelectorAll('.ar').forEach(a=>{let rep=0;const stop=()=>{clearTimeout(rep);rep=0};a.addEventListener('pointerdown',e=>{e.preventDefault();AU.unlock();a.setPointerCapture&&a.setPointerCapture(e.pointerId);const d=+a.dataset.d*.1;nudge(bi,d);let n=0;rep=setTimeout(function r(){n++;nudge(bi,n>8?d*2:d);rep=setTimeout(r,90)},400)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>a.addEventListener(ev,stop))});
    let drag=false;const val=e=>{const r=trk.getBoundingClientRect();return Math.round((r.bottom-e.clientY)/r.height*LMAX*10)/10};
    trk.addEventListener('pointerdown',e=>{e.preventDefault();AU.unlock();if(G.s.basins[bi].auto){setT(bi,0);return}drag=true;trk.setPointerCapture&&trk.setPointerCapture(e.pointerId);G.mv=null;setT(bi,val(e),'drag')});
    trk.addEventListener('pointermove',e=>{if(drag)setT(bi,val(e),'drag')});
    ['pointerup','pointercancel'].forEach(ev=>trk.addEventListener(ev,()=>{if(drag){drag=false;endDrag()}}))});
  LV=null;updLevers()}
let LV=null;
function updLevers(){const s=G.s;if(!s)return;const els=$('levers').children;const hint=G.hint?hintTargets():null;
  for(let i=0;i<els.length;i++){const el=els[i],b=s.basins[i];if(!b)continue;const key=b.h.toFixed(2)+'|'+b.tg.toFixed(1)+'|'+(hint&&hint[i]!=null?hint[i]:'')+'|'+(G.sel===i)+LANG;
    if(el._k===key)continue;el._k=key;el.classList.toggle('sel',G.sel===i&&ctrlBasins().length>1);
    el.querySelector('.lh').innerHTML=(b.auto?T('ทะเล','SEA'):BL(i))+' <b>'+b.h.toFixed(1)+'</b>';
    el.querySelector('.wf').style.height=(b.h/LMAX*100)+'%';const th=el.querySelector('.th');if(th)th.style.bottom=(b.tg/LMAX*100)+'%';
    const gh=el.querySelector('.gh');if(hint&&hint[i]!=null&&!b.auto){gh.classList.add('on');gh.style.bottom=(hint[i]/LMAX*100)+'%'}else gh.classList.remove('on')}}
/* ---------- hints (scripted solution) ---------- */
function hintTargets(){const d=G.def,t=G.s.t;const out={};for(const c of d.sol){if(c[0]<=t+1.2)out[c[1]]=c[2]}return out}
function nextCmd(){const d=G.def,t=G.s.t;const c=d.sol.filter(c=>c[0]>=t-.4);return c.length?c[0]:null}
function renderHint(){const hb=$('hintBar');if(!G.hint||!G.s){hb.classList.remove('on');return}hb.classList.add('on');const c=nextCmd();
  let txt;if(!c)txt=T('เฉลย: ปล่อยให้เรือแล่นเข้าท่า','Hint: now let the boats sail in');
  else{const b=G.s.basins.length>1?BL(c[1])+' ':'';const when=c[0]<=0?(G.phase==='plan'?T('ก่อนปล่อยเรือ','before launch'):T('ตอนนี้','now')):c[0]-G.s.t<=.6?T('ตอนนี้!','NOW!'):T('ที่ ','at ')+c[0].toFixed(1)+T(' วิ','s');
    txt=T('เฉลย: ','Hint: ')+b+'→ '+c[2]+' · '+when}
  const l=$('hintLbl');if(l.textContent!==txt)l.textContent=txt}
function openHint(){if(!G.on||G.s.status!=='play')return;const id=G.def.id;
  if(S.hints[id]){G.hint=!G.hint;renderHint();updLevers();return}
  adOffer({cap:'hint',title:()=>T('ดูเฉลย?','Show a hint?'),reward:()=>T('เส้นเป้าหมายบนคันโยก และบอกว่าต้องปรับน้ำตอนไหน (ใช้ซ้ำในด่านนี้ได้ฟรี)','Target marks on the levers plus when to move them (free to reuse on this level)'),
    alt:{label:()=>T('ใช้ 25 เหรียญ (มี ','Use 25 coins (you have ')+S.coins+')',fn:()=>{if(S.coins<25){toast(T('เหรียญไม่พอ','Not enough coins'));sfx('err');return}setCoins(S.coins-25);sfx('coin');closeModal();S.hints[id]=1;save();G.hint=true;renderHint()}},
    onOk:()=>{S.hints[id]=1;save();G.hint=true;renderHint();toast(T('เปิดเฉลยแล้ว','Hint on'))}})}

      if(can)h+='<div class="btns">'+B('watch',T('▶ ดูโฆษณา','▶ Watch ad'))+B('no',T('ไม่เป็นไร','No thanks'),'ghost')+'</div><div class="note">'+T('ดูจนจบเพื่อรับรางวัล · เหลือวันนี้ ','Watch to the end to get the reward · left today: ')+ci.left+'</div>';
      else if(Ads.available()&&ci.left>0&&ci.cd>0)h+='<div class="note">'+T('โฆษณาถัดไปได้ในอีก '+ci.cd+' วินาที','Next ad in '+ci.cd+'s')+'</div>';
      else if(Ads.available())h+='<div class="note">'+T('ครบโควตาโฆษณาวันนี้แล้ว','Daily ad limit reached')+'</div>';
      if(o.alt)h+='<div class="btns one" style="margin-top:10px">'+B('alt',o.alt.label(),'ghost')+'</div>';
      if(!can)h+='<div class="btns one" style="margin-top:10px">'+B('no',T('ปิด','Close'),'ghost')+'</div>';

    on(k){if(k==='no'){closeModal();o.onNo&&o.onNo()}else if(k==='alt'){o.alt.fn()}else if(k==='watch'){closeModal();Ads.rewarded(o.cap,o.reward,()=>{capUse(o.cap);o.onOk()},why=>{toast(why==='dismissed'?T('ปิดก่อนจบ ไม่ได้รับรางวัล','Closed early - no reward'):T('ตอนนี้ไม่มีโฆษณา','No ad available right now'));o.onNo&&o.onNo()})}}})}

  after(m){m.querySelectorAll('canvas[data-pv]').forEach(c=>{const x=c.getContext('2d');x.clearRect(0,0,36,30);x.fillStyle='#1f6fb8';x.fillRect(0,23,36,7);ART._set(x);x.save();x.translate(18,27);ART.boatSprite({k:'tug',L:2.6,fr:1,i:0},ART.SKINS.find(s=>s.id===c.dataset.pv),0,0);x.restore()})},
  on(k){if(k.startsWith('buy_')){const id=k.slice(4),it=ART.SKINS.find(s=>s.id===id);if(S.coins<it.cost){toast(T('เหรียญไม่พอ','Not enough coins'));sfx('err');return}setCoins(S.coins-it.cost);S.own[id]=1;S.skin=id;save();sfx('coin');renderModal()}
    else if(k.startsWith('eq_')){S.skin=k.slice(3);save();renderModal()}else back?back():closeModal()}})}
/* ---------- level clear ---------- */
function winLevel(){const d=G.def,s=G.s,p=par(d);const tOK=s.t<=p.t,mOK=G.moves<=p.m;const st=1+(tOK?1:0)+(mOK?1:0);
  const prev=lvRec(d.id)||{};const first=!(prev.st>0);const gain=Math.max(0,st-(prev.st||0));const earn=(first?10:0)+gain*5;
  S.lv[d.id]={st:Math.max(st,prev.st||0),t:Math.min(prev.t||999,+s.t.toFixed(1)),m:Math.min(prev.m||999,G.moves)};S.stats.clears++;S.stats.boats+=s.boats.filter(b=>b.st==='docked').length;save();
  if(earn)setCoins(S.coins+earn);sessionClears++;G.result={st,t:s.t,m:G.moves,tOK,mOK,earn,dbl:false};showClear()}
function showClear(quiet){const r=G.result,d=G.def,p=par(d);if(!quiet)sfx('win');
  openModal({html(){const last=G.idx>=LEVELS.length-1;
      let h='<h2>'+T('เรือเข้าท่าครบ!','ALL BOATS DOCKED!')+'</h2>'+starsHtml(r.st)+'<div class="res"><div>'+T('เวลา','Time')+'<b>'+r.t.toFixed(1)+T(' วิ','s')+'</b></div><div>'+T('ปรับน้ำ','Moves')+'<b>'+r.m+'</b></div></div>';
      h+='<div class="goal">★ '+T('ผ่านด่าน','Clear the level')+'<br><span class="'+(r.tOK?'ok':'')+'">★ '+T('ภายใน '+p.t+' วินาที','Within '+p.t+'s')+'</span><br><span class="'+(r.mOK?'ok':'')+'">★ '+T('ปรับน้ำไม่เกิน '+p.m+' ครั้ง','In '+p.m+' moves or fewer')+'</span></div>';
      h+='<p>'+(r.earn?T('ได้รับ ','Earned ')+'<b>+'+r.earn+'</b> '+T('เหรียญ','coins')+(r.dbl?' (x2)':''):T('ทำดาวเพิ่มเพื่อรับเหรียญ','Earn new stars to get coins'))+'</p>';
      if(r.earn&&!r.dbl&&Ads.available()&&capOK('dbl'))h+='<div class="btns one" style="margin-bottom:10px">'+B('dbl',T('▶ ดูโฆษณา รับเหรียญ x2','▶ Watch ad: double coins'),'ghost')+'</div>';
      h+='<div class="btns">'+B('replay',T('เล่นอีกครั้ง','Replay'),'ghost')+B('next',last?T('จบเกม ★','Finish ★'):T('ด่านต่อไป ▶','Next ▶'))+'</div>';return h},
    after:paintStars,
    on(k){if(k==='replay'){closeModal();loadLevel(G.idx)}else if(k==='next'){closeModal();nextLevel(false)}
      else if(k==='dbl'){adOffer({cap:'dbl',title:()=>T('เหรียญสองเท่า','Double coins'),reward:()=>'+'+r.earn+' '+T('เหรียญ','coins'),onNo:()=>showClear(1),onOk:()=>{setCoins(S.coins+r.earn);r.dbl=true;sfx('coin');toast('+'+r.earn);showClear(1)}})}}})
  if(!quiet)setTimeout(()=>{for(let i=0;i<r.st;i++)setTimeout(()=>sfx('star',i),i*180)},300)}
function nextLevel(skipped){const go=()=>{const i=G.idx;if(i>=LEVELS.length-1){showEnd();return}loadLevel(i+1);if(SCR!=='game')show('game')};
  if(!skipped&&sessionClears>=2&&Ads.canInter())Ads.interstitial('next_level',go);else go()}
function showEnd(){S.end=true;save();AU.play('end');openModal({html(){return '<h2>'+T('ท่าเรือปลอดภัยแล้ว!','THE HARBOUR IS SAFE!')+'</h2><p>'+T('คุณพาเรือทุกลำผ่านหมู่บ้าน อ่าวโจรสลัด และคืนพายุ ด้วยระดับน้ำล้วนๆ','You guided every boat through the village, the pirate cove and the storm using nothing but water.')+'</p>'+starsHtml(3)+'<p>'+T('ดาวรวม ','Total stars ')+'<b>'+totalStars()+' / '+LEVELS.length*3+'</b></p><div class="btns one">'+B('map',T('กลับไปเลือกด่าน','Back to levels'))+'</div><div class="note">LOCKTIDE \'93 · '+BRAND.en+' · '+BRAND.th+'</div>'},after:paintStars,on(){closeModal();show('map')}})}
/* ---------- map ---------- */
function renderMap(){$('mapTtl').textContent=T('เลือกด่าน','LEVELS');
  $('bDaily').style.display=S.daily===today()?'none':'';$('bDaily').textContent=T('★ รายวัน','★ Daily');
  let h='';for(const z of ZONES){const lv=LEVELS.filter(l=>l.z===z.z);const got=lv.reduce((a,l)=>a+((lvRec(l.id)||{}).st||0),0);const zf=LEVELS.findIndex(l=>l.z===z.z);
    h+='<div class="zone"><div class="zhead"><canvas width="320" height="100" data-z="'+zf+'"></canvas><div class="zt"><div class="zn">'+T('โซน ','ZONE ')+(z.z+1)+'</div><div class="zname">'+esc(tx(z))+'</div></div><div class="zprog">★ '+got+' / '+lv.length*3+'</div></div><div class="lvgrid">';
    lv.forEach(l=>{const i=lvIndex(l.id);const r=lvRec(l.id);const un=unlocked(i);const nxt=un&&!isDone(l.id);let st='';for(let k=0;k<3;k++)st+=k<(r&&r.st||0)?'★':'<i>★</i>';
      h+='<button class="lv '+(un?(nxt?'cur':'done'):'lock')+'" data-i="'+i+'" '+(un?'':'disabled')+' aria-label="'+l.id+'"><span class="n">'+(un?l.id:'🔒')+'</span><span class="st">'+(un?(r&&r.skip&&!r.st?T('ข้าม','SKIP'):st):'&nbsp;')+'</span></button>'});h+='</div></div>'}
  h+='<div class="note" style="text-align:center">'+T('ดาวรวม ','Total stars ')+totalStars()+' / '+LEVELS.length*3+' · '+BRAND.en+'</div>';
  $('mapScroll').innerHTML=h;$('mapScroll').querySelectorAll('canvas[data-z]').forEach(c=>ART.zoneArt(c,LEVELS[+c.dataset.z]));
  $('mapScroll').querySelectorAll('.lv[data-i]').forEach(b=>b.onclick=()=>{sfx('ui');AU.unlock();loadLevel(+b.dataset.i);show('game')});setCoins(S.coins)}
function claimDaily(){adOffer({cap:'daily',title:()=>T('รางวัลรายวัน','Daily bonus'),reward:()=>T('+100 เหรียญ (ปกติ +50)','+100 coins (instead of +50)'),
  alt:{label:()=>T('รับ +50 เหรียญ (ไม่ดูโฆษณา)','Take +50 coins (no ad)'),fn:()=>{S.daily=today();setCoins(S.coins+50);sfx('coin');closeModal();toast('+50');renderMap()}},
  onOk:()=>{S.daily=today();setCoins(S.coins+100);sfx('coin');toast('+100');renderMap()}})}
/* ---------- title ---------- */
let TD=null;
function renderTitle(){const prog=Object.keys(S.lv).length>0;$('bPlay').textContent=prog?T('เล่นต่อ','CONTINUE'):T('เริ่มเล่น','PLAY');$('bHelpT').textContent=T('วิธีเล่น','How to play');
  $('sub').textContent=T("ประตูน้ำ '93 · คุมน้ำ พาเรือเข้าท่า","Control the tide. Dock every boat.");$('tag').textContent=T('เกมปริศนาท่าเรือพิกเซล 20 ด่าน','A 20-level pixel harbour puzzle');
  $('brand').innerHTML='by <b>'+BRAND.en+'</b> · '+BRAND.th;document.querySelectorAll('#langT button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  const lc=$('logo').getContext('2d');lc.clearRect(0,0,200,64);ART.logo(lc,100,4,6)}
function drawTitle(now){if(!TD||TD.s.status!=='play'&&now-TD.end>2500){const d=LEVELS[5];TD={d,s:SIM.make(d),k:0,acc:0,end:0}}
  const s=TD.s;TD.acc+=Math.min(.1,(now-(TD.last||now))/1000);TD.last=now;while(TD.acc>=SIM.DT){TD.acc-=SIM.DT;if(s.status!=='play')break;while(TD.k<TD.d.sol.length&&s.t>=TD.d.sol[TD.k][0]){SIM.setTarget(s,TD.d.sol[TD.k][1],TD.d.sol[TD.k][2]);TD.k++}SIM.step(s);if(s.status!=='play')TD.end=now}
  ART.scene($('titleBg').getContext('2d'),s,{now:now/1000,skin:S.skin})}
/* ---------- board drawing ---------- */
const OFF=document.createElement('canvas');OFF.width=ART.W;OFF.height=ART.H;const OX=OFF.getContext('2d');
function fitBoard(){const bd=$('board'),cv=$('cv');const land=matchMedia('(min-aspect-ratio:4/3)').matches;const r=bd.getBoundingClientRect();if(!r.width)return;
  let w=r.width,h=w*ART.H/ART.W;if(land&&h>r.height){h=r.height;w=h*ART.W/ART.H}
  cv.style.width=Math.floor(w)+'px';cv.style.height=Math.floor(h)+'px';const k=Math.max(1,Math.ceil(w*(window.devicePixelRatio||1)/ART.W));if(cv.width!==ART.W*k){cv.width=ART.W*k;cv.height=ART.H*k}}
function drawBoard(now){const s=G.s;const o={now:now/1000,ui:true,warn:true,sel:G.sel,skin:S.skin,fx:G.fx,taken:G.taken,gop:G.gop,flash:G.flash,hint:G.hint?hintTargets():null,
    wait:s.gates.map(g=>s.boats.some(b=>b.st==='lock'&&Math.abs(b.x+b.dir*b.L/2-g.x)<.4))};
  ART.scene(OX,s,o);const cv=$('cv'),c=cv.getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(OFF,0,0,cv.width,cv.height)}
/* ---------- sim tick + event juice ---------- */
function tick(dt){const s=G.s;if(!s)return;const blocked=$('modal').classList.contains('on')||Ads.busy()||document.hidden;
  G.gop.forEach((v,i)=>{const t=s.gates[i].open?1:0;G.gop[i]=v+(t-v)*Math.min(1,dt*4)});
  if(G.def.z===2){G.nextFlash-=dt;if(G.nextFlash<=0){G.flash=1;G.nextFlash=7+Math.random()*8;setTimeout(()=>sfx('thunder'),200+Math.random()*500)}G.flash=Math.max(0,G.flash-dt*2.2)}
  if(G.phase==='run'&&s.status==='play'&&!blocked&&!G.frozen){G.acc+=dt*G.speed;let n=0;while(G.acc>=SIM.DT&&n<12){G.acc-=SIM.DT;SIM.step(s);n++;if(s.status!=='play')break}if(n>=12)G.acc=0}
  while(G.evi<s.ev.length)onEv(s.ev[G.evi++]);
  s.boats.forEach(b=>{if(b.k==='tug'&&SIM.active(b)&&Math.random()<dt*3)ART.smoke(b.x-b.dir*.2,SIM.vert(s,b,b.x).bot+2.7)});
  if(s.status!=='play'&&!G.doneAt){G.doneAt=performance.now()+(s.status==='win'?1100:1400)}
  if(G.doneAt&&performance.now()>=G.doneAt&&!G.result&&!OVER&&!blocked){if(s.status==='win')winLevel();else{OVER={why:s.why};sfx('fail');renderOver()}G.doneAt=-1}}
function onEv(e){const s=G.s,b=s.boats[e.i];const lv=b?SIM.levelAt(s,b.x):0;
  if(e.type==='open'||e.type==='close')sfx('gate',e.type==='open');
  else if(e.type==='load'){G.taken[e.c]=1;sfx('load');ART.splash(b.x,lv,6)}
  else if(e.type==='miss')sfx('miss');
  else if(e.type==='dock'){sfx('dock');ART.splash(b.x+b.L/2,lv,8);vib(20)}
  else if(e.type==='sunk'||e.type==='wreck'){G.fx[e.i]={at:performance.now()/1000,bot:SIM.vert(s,b,b.x).bot,why:e.why};sfx(e.type==='sunk'?'crash':'wreck');ART.debris(b.x+b.dir*b.L/2,lv);ART.splash(b.x,lv,12);vib(e.type==='sunk'?[60,40,60]:30)}
  else if(e.type==='beached'){G.fx[e.i]={gb:SIM.vert(s,b,b.x).bot};sfx('beached');ART.splash(b.x+b.dir*b.L/2,lv,8,'#ecca7c')}
  else if(e.type==='ground'){const n=performance.now();if(!G.gsfx[e.i]||n-G.gsfx[e.i]>1500){G.gsfx[e.i]=n;sfx('ground')}}
  else if(e.type==='raid'){sfx('raid');vib([80,40,80])}
  else if(e.type==='start'&&e.i>0&&!s.boats[e.i].fr)sfx('horn')}
/* ---------- language ---------- */
function relabelStatic(){document.documentElement.lang=LANG;document.title="LOCKTIDE '93 - "+T("ประตูน้ำ '93","Harbour Tide Puzzle")+' | '+BRAND.en;
  $('keys').innerHTML=T('▲▼ ปรับน้ำ · ◀▶ เลือกแอ่ง<br>Space ปล่อย/หยุดเวลา · F เร่ง · R ใหม่','▲▼ water · ◀▶ basin<br>Space launch/freeze · F fast · R restart');
  renderTitle();if(SCR==='map')renderMap();if(G.def){updHud();renderTip();renderHint();if(G.s)updLevers()}renderOver()}
function setLang(l){LANG=l==='en'?'en':'th';S.lang=LANG;langPicked=true;save();relabelStatic();renderModal();Ads.relabel()}
/* ---------- input ---------- */
addEventListener('keydown',e=>{if(Ads.busy())return;AU.unlock();
  if($('modal').classList.contains('on')){if(e.key==='Escape'&&MOD){MOD.on(MOD.esc||'no')}return}
  if(SCR!=='game'||!G.s)return;const k=e.key;const cb=ctrlBasins();
  if(OVER){if(k==='r'||k==='R'||k==='Enter'||k===' '){e.preventDefault();restart()}return}
  if(k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();nudge(G.sel,e.shiftKey?.1:.5)}
  else if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();nudge(G.sel,e.shiftKey?-.1:-.5)}
  else if(k==='ArrowLeft'||k==='ArrowRight'||k==='Tab'||k==='a'||k==='A'||k==='d'||k==='D'){e.preventDefault();if(cb.length){const j=cb.indexOf(G.sel);const d=(k==='ArrowLeft'||k==='a'||k==='A'||(k==='Tab'&&e.shiftKey))?-1:1;G.sel=cb[(j+d+cb.length)%cb.length];sfx('tick');updLevers()}}
  else if(k>='1'&&k<='3'){const i=+k-1;if(G.s.basins[i]&&!G.s.basins[i].auto){G.sel=i;sfx('tick');updLevers()}}
  else if(k===' '||k==='Enter'){e.preventDefault();if(G.phase==='plan')launch();else toggleFreeze()}
  else if(k==='f'||k==='F')cycleSpeed();else if(k==='r'||k==='R')restart();else if(k==='Escape'||k==='p'||k==='P')openPause();else if(k==='h'||k==='H')openHint()});
function cycleSpeed(){G.speed=G.speed>=3?1:G.speed+1;sfx('tick');updHud()}
function toggleFreeze(){if(G.phase!=='run'||G.s.status!=='play')return;G.frozen=!G.frozen;sfx('ui');updHud()}
let sd=null;
$('cv').addEventListener('pointerdown',e=>{AU.unlock();if(!G.s||G.s.status!=='play')return;const r=$('cv').getBoundingClientRect();const ux=(e.clientX-r.left)/r.width*ART.W/ART.SX;const bi=SIM.basinAt(G.s,ux);if(G.s.basins[bi].auto)return;
  sd={bi,r};$('cv').setPointerCapture&&$('cv').setPointerCapture(e.pointerId);G.mv=null;G.sel=bi;sceneSet(e)});
function sceneSet(e){const r=sd.r;const py=(e.clientY-r.top)/r.height*ART.H;setT(sd.bi,Math.round((ART.BASE-py)/ART.SY*10)/10,'drag')}
$('cv').addEventListener('pointermove',e=>{if(sd)sceneSet(e)});
['pointerup','pointercancel'].forEach(ev=>$('cv').addEventListener(ev,()=>{if(sd){sd=null;endDrag()}}));
const on=(id,f)=>$(id).addEventListener('click',e=>{AU.unlock();f(e)});
on('bGo',()=>launch());on('bRestart',()=>restart());on('bPause',()=>{sfx('ui');openPause()});on('bHint',()=>{sfx('ui');openHint()});on('bFast',()=>cycleSpeed());on('bFrz',()=>toggleFreeze());
on('bPlay',()=>{sfx('ui');if(!Object.keys(S.lv).length){loadLevel(0);show('game')}else show('map')});on('bHelpT',()=>{sfx('ui');openHelp()});
on('bSetT',()=>{sfx('ui');openSettings()});on('bMapBack',()=>{sfx('ui');show('title')});on('bShop',()=>{sfx('ui');openShop()});on('bDaily',()=>{sfx('ui');claimDaily()});
document.querySelectorAll('#langT button').forEach(b=>b.addEventListener('click',()=>{sfx('ui');setLang(b.dataset.l)}));
addEventListener('resize',()=>fitBoard());
document.addEventListener('visibilitychange',()=>{if(document.hidden){try{AU.ctx()&&AU.ctx().suspend()}catch(e){}}else if(!Ads.busy()){try{AU.ctx()&&AU.ctx().resume()}catch(e){}}});
Ads.setHooks({pause(){try{AU.master().gain.value=0}catch(e){}},resume(){AU.apply()},locale(l){if(!langPicked&&!S.lang&&l)setLang(String(l).toLowerCase().startsWith('th')?'th':'en')},blocked(){}});
/* ---------- main loop ---------- */
let hudT=0;
function frame(now){const dt=Math.min(.1,Math.max(0,(now-(G.lastNow||now))/1000));G.lastNow=now;
  if(SCR==='game'&&G.s){tick(dt);drawBoard(now);if(now-hudT>100){hudT=now;updHud();updLevers();renderHint()}}
  else if(SCR==='title')drawTitle(now);
  requestAnimationFrame(frame)}
/* ---------- boot ---------- */
(function boot(){LANG=S.lang||((navigator.language||'').toLowerCase().startsWith('th')?'th':'en');langPicked=!!S.lang;
  AU.init();relabelStatic();setCoins(S.coins);show('title');requestAnimationFrame(frame)})();


</script>
