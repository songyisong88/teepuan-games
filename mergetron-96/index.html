:root{--bg:#0b0820;--panel:#171236;--panel2:#211a4a;--line:#4a3b9a;--ink:#f6f0dc;--dim:#a9a2cf;--gold:#ffc83d;--cyan:#3de0ff;--pink:#ff4fa3;--green:#5dff8a;--red:#ff5a5a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:"Kanit","Noto Sans Thai","Leelawadee UI",Thonburi,Tahoma,system-ui,sans-serif;color:var(--ink);font-weight:600;
  background:#07051a;background-image:radial-gradient(circle at 50% 0,#22135a 0,#07051a 70%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 60px rgba(61,224,255,.12)}
#top{padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;background:var(--panel);border-bottom:3px solid var(--line)}
.row{display:flex;align-items:center;gap:8px}
#coinBox{flex:1;min-width:0}
#coins{font-size:30px;font-weight:800;line-height:1.05;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ips{font-size:14px;color:var(--cyan);line-height:1.2}
#stars{font-size:13px;color:var(--dim)}
.sq{width:48px;height:48px;border:2px solid var(--line);border-radius:12px;background:var(--panel2);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.sq:active{transform:translateY(2px)}
.gear{position:relative}
.gear i{width:20px;height:20px;border:4px solid var(--ink);border-radius:50%;display:block;box-shadow:0 0 0 3px var(--panel2),0 0 0 6px var(--ink)}
#goal{margin-top:6px;width:100%;min-height:46px;border:2px solid var(--line);border-radius:12px;background:#0f0b2a;display:flex;align-items:center;gap:8px;padding:5px 10px;text-align:left;position:relative;overflow:hidden}
#goal .gl{font-size:11px;color:var(--dim);flex:none;letter-spacing:.06em}
#goal .gt{flex:1;min-width:0;font-size:14px;line-height:1.2;position:relative;z-index:1}
#goal .gr{font-size:13px;color:var(--gold);flex:none;position:relative;z-index:1}
#goal .gp{position:absolute;left:0;bottom:0;height:4px;background:var(--cyan);width:0;transition:width .3s}
#goal.done{border-color:var(--gold);background:#3a2a05;animation:pulse 1s infinite}
#goal.done .gt{color:var(--gold)}
@keyframes pulse{50%{transform:scale(1.02)}}
#tabs{display:flex;gap:6px;padding:6px 10px 0;background:var(--bg)}
#tabs button{flex:1;min-height:40px;border:2px solid var(--line);border-radius:10px 10px 0 0;background:var(--panel);font-size:13px;color:var(--dim);line-height:1.1;padding:2px}
#tabs button.on{background:var(--panel2);color:var(--ink);border-color:var(--cyan)}
#tabs button.lock{opacity:.5}
#floorWrap{flex:1;position:relative;min-height:0}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#chips{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:6px;z-index:3;pointer-events:none}
.chip{pointer-events:auto;width:64px;min-height:58px;border:2px solid var(--gold);border-radius:12px;background:rgba(23,18,54,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;font-size:12px;line-height:1.1;color:var(--gold);text-align:center}
.chip b{font-size:16px;font-weight:800}
.chip.cd{border-color:var(--line);color:var(--dim)}
.chip.act{border-color:var(--green);color:var(--green)}
.tv{display:inline-block;width:18px;height:13px;border:2px solid currentColor;border-radius:3px;position:relative;vertical-align:-1px;margin-right:4px}
.tv:after{content:"";position:absolute;left:4px;top:2px;border-left:6px solid currentColor;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
#bottom{padding:6px 10px calc(env(safe-area-inset-bottom) + 8px);background:var(--panel);border-top:3px solid var(--line)}
#buy{width:100%;min-height:62px;border-radius:14px;background:var(--green);color:#082010;display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:800;box-shadow:0 5px 0 #1f8a45;position:relative}
#buy:active{transform:translateY(3px);box-shadow:0 2px 0 #1f8a45}
#buy.no{background:#3a3560;color:#9c95c8;box-shadow:0 5px 0 #24204a}
#buy canvas{width:44px;height:44px}
#buy small{font-size:13px;display:block;font-weight:600}
#nav{display:flex;gap:6px;margin-top:8px}
#nav button{flex:1;min-height:54px;border:2px solid var(--line);border-radius:12px;background:var(--panel2);font-size:13px;line-height:1.15;position:relative;padding:2px}
#nav button:active{transform:translateY(2px)}
.dot{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--red);border:2px solid var(--panel);display:none}
.dot.on{display:block}
#credit{position:absolute;left:8px;bottom:6px;font-size:10px;color:rgba(169,162,207,.55);pointer-events:none;z-index:2}
/* modal */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 10px);background:rgba(4,3,14,.78)}
.modal.on{display:flex}
.sheet{width:100%;max-width:440px;max-height:100%;overflow:auto;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:14px;animation:pop .25s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.sheet h2{font-size:22px;font-weight:800;text-align:center;line-height:1.2}
.sheet .sub{font-size:14px;color:var(--dim);text-align:center;margin-top:4px;line-height:1.4}
.big{font-size:30px;font-weight:800;color:var(--gold);text-align:center;margin:10px 0 4px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:14px;font-size:17px;font-weight:800;background:var(--panel2);border:2px solid var(--line);margin-top:10px;line-height:1.15;padding:4px 8px;text-align:center}
.btn:active{transform:translateY(2px)}
.btn.go{background:var(--green);color:#082010;border-color:#1f8a45}
.btn.ad{background:var(--gold);color:#2a1a00;border-color:#b8860b}
.btn[disabled]{opacity:.45;pointer-events:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pair .btn{margin-top:0;height:100%;min-height:64px}
.note{font-size:12px;color:var(--dim);text-align:center;margin-top:10px;line-height:1.4}
.list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:#0f0b2a;border:2px solid var(--line);border-radius:12px;padding:8px}
.item .tx{flex:1;min-width:0}
.item .nm{font-size:15px;line-height:1.2}
.item .ds{font-size:12px;color:var(--dim);line-height:1.3;margin-top:2px}
.item .btn{width:auto;min-width:104px;min-height:52px;margin:0;font-size:15px}
.ico{width:46px;height:46px;flex:none}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.days div{border:2px solid var(--line);border-radius:8px;text-align:center;font-size:11px;padding:4px 0;color:var(--dim)}
.days div.now{border-color:var(--gold);color:var(--gold)}
.days div.got{background:#1d3a26;color:var(--green);border-color:#2a6b3e}
#wheelCv{display:block;margin:10px auto 0;width:250px;height:250px}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-10px);z-index:80;background:#000;border:2px solid var(--gold);color:var(--gold);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* fake ad */
#adov{position:fixed;inset:0;z-index:100;background:#05040f;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#adov.on{display:flex}
#adov .lab{font-size:14px;color:#000;background:#ffe066;padding:6px 12px;border-radius:6px}
#adov .kind{font-size:14px;margin-top:12px;color:var(--ink);line-height:1.4}
#adov .stage{width:100%;max-width:420px;aspect-ratio:16/10;margin-top:14px;border:2px dashed #555;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#aaa}
#adov .num{font-size:56px;font-weight:800;color:#fff}
#adov .s2{font-size:12px;color:#888;padding:0 14px;line-height:1.4}
#adov .bar{width:100%;max-width:420px;height:8px;background:#222;margin-top:10px;border-radius:4px;overflow:hidden}
#adov .bar i{display:block;height:100%;width:0;background:#ffe066}
#adov .btn{max-width:420px;min-height:60px}
#adov .btn.done{background:var(--green);color:#082010}
</style>

</div>

<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;
let SIMOFF=0;const now=()=>Date.now()+SIMOFF;
const KEY='mergetron96.save',VERSION=1;

/* ---------------- language ---------------- */
let LANG=(()=>{try{const s=localStorage.getItem(KEY+'.lang');if(s==='th'||s==='en')return s}catch(e){}
  const ls=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en'];return ls.some(l=>/^th\b/i.test(l||''))?'th':'en'})();
let langPicked=false;try{langPicked=!!localStorage.getItem(KEY+'.lang')}catch(e){}
const T=(th,en)=>LANG==='th'?th:en;
function setLang(l,remember){LANG=l;document.documentElement.lang=l;if(remember){langPicked=true;try{localStorage.setItem(KEY+'.lang',l)}catch(e){}}renderAll();if(MODAL.re)MODAL.re()}

/* ---------------- numbers ---------------- */
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td'];
function fmt(n){if(!isFinite(n))return '∞';if(n<0)return '-'+fmt(-n);if(n<1000)return n<10&&n%1?n.toFixed(1):String(Math.floor(n));
  let i=0;while(n>=1000&&i<SUF.length-1){n/=1000;i++}return (n>=100?Math.floor(n):n>=10?(Math.floor(n*10)/10):(Math.floor(n*100)/100))+SUF[i]}
function ftime(s){s=Math.max(0,Math.ceil(s));if(s<60)return s+T(' วิ','s');const m=Math.floor(s/60),r=s%60;if(m<60)return m+':'+String(r).padStart(2,'0');const h=Math.floor(m/60);return h+T(' ชม. ','h ')+(m%60)+T(' น.','m')}
function fmin(m){return m>=60?(m/60)+T(' ชั่วโมง',' h'):m+T(' นาที',' min')}

/* ---------------- audio ---------------- */
const AU={c:null};
function auInit(){if(AU.c){if(AU.c.state==='suspended'&&!adOn)AU.c.resume().catch(()=>{});return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{const c=AU.c=new C();AU.m=c.createGain();AU.m.gain.value=S&&S.set.sfx?.5:0;AU.m.connect(c.destination)}catch(e){AU.c=null}}
function tone(type,f0,f1,dur,vol,dl=0){const c=AU.c;if(!c||!S.set.sfx||adOn)return;const t=c.currentTime+dl,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AU.m);o.start(t);o.stop(t+dur+.03)}
const SFX={
  buy(){tone('square',520,780,.08,.12);tone('square',780,1040,.08,.08,.06)},
  merge(t){const b=220*Math.pow(1.06,t*2);[0,4,7,12].forEach((k,i)=>tone('square',b*Math.pow(2,k/12),b*Math.pow(2,k/12)*1.01,.11,.12,i*.055))},
  tap(){tone('triangle',900,1300,.05,.08)},
  coin(){tone('square',1320,1320,.05,.07);tone('square',1760,1760,.08,.07,.05)},
  crate(){tone('sawtooth',200,600,.15,.08);tone('square',900,1400,.1,.08,.1)},
  err(){tone('square',180,120,.18,.1)},
  ui(){tone('triangle',660,660,.04,.07)},
  fan(){[0,4,7,12,7,12,16].forEach((k,i)=>tone('square',392*Math.pow(2,k/12),392*Math.pow(2,k/12),.14,.1,i*.09))},
  tick(){tone('square',1500,1500,.02,.05)},
  claim(){[0,7,12,19].forEach((k,i)=>tone('triangle',523*Math.pow(2,k/12),523*Math.pow(2,k/12),.12,.12,i*.07))}
};
const vib=p=>{if(S&&S.set.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};

/* =====================================================================
   ADS ADAPTER  — one switch: PROVIDER = 'fake' (GitHub Pages demo) | 'y8' (Y8 build)
   Game calls:  Ads.available()                     -> show ad buttons only when true
                Ads.rewarded(name, rewardText, onReward, onNone)   (ONLY from the player's own tap)
                Ads.interstitial(name, done)        (only at natural breaks, >= 3 min apart)
   Reward is granted ONLY when the ad was watched to the end (fake: countdown done / Y8: adViewed).
   Game is paused + muted while any ad is on screen.
   Y8 docs: https://docs.y8.com/sdk/intro/  https://docs.y8.com/sdk/advertising/
   ===================================================================== */
const PROVIDER='fake';
let adOn=false;
const Ads=(()=>{
  const INTER_GAP=180000,AD_SECONDS=5,NO_START_MS=8000;
  let busy=false,lastAdAt=-1e12,H={pause(){},resume(){}};
  let y8Sdk=null,inited=false;
  const Y=window.Y8_CONFIG||{};
  const CONFIGURED=!!(Y.APP_ID&&Y.GAME_ID&&!/^REPLACE_WITH_/.test(Y.APP_ID)&&!/^REPLACE_WITH_/.test(Y.GAME_ID));
  function y8init(){
    if(inited)return;
    if(!CONFIGURED){console.warn('[Y8] APP_ID / GAME_ID not set yet - ads disabled, game runs normally');return}
    if(!window.y8||typeof window.y8.sdk!=='function')return;
    try{y8Sdk=y8.sdk();y8Sdk.init({appId:Y.APP_ID,autoLogin:true},{gameId:Y.GAME_ID,preloadAdBreaks:'on',sound:'on',onReady:()=>{}});
      try{y8Sdk.onAuth(()=>{})}catch(e){}
      inited=true;
      try{const loc=y8Sdk.getPlatformLocale&&y8Sdk.getPlatformLocale();const f=l=>{if(!langPicked&&/^th/i.test(l||''))setLang('th',false)};if(loc&&loc.then)loc.then(f).catch(()=>{});else f(loc)}catch(e){}
      try{const b=y8Sdk.isBlacklisted&&y8Sdk.isBlacklisted();if(b&&b.then)b.then(v=>{if(v)blocked()}).catch(()=>{})}catch(e){}
    }catch(e){console.warn('[Y8] init failed',e);y8Sdk=null;inited=false}
  }
  function blocked(){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:999;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px';d.textContent=T('เกมนี้เล่นได้ที่ Y8.com เท่านั้น','This game can only be played on Y8.com');document.body.appendChild(d)}
  if(PROVIDER==='y8'){window.addEventListener('y8sdk.ready',y8init,{once:true});if(window.y8&&window.y8.emitReadyEvent){try{window.y8.emitReadyEvent()}catch(e){}}}
  /* Y8 ad break; cb({viewed}) exactly once */
  function y8brk(type,name,onViewed,cb){
    let started=false,done=false,paused=false,viewed=false,afterT=0;
    const pause=()=>{if(!paused){paused=true;H.pause()}},resume=()=>{if(paused){paused=false;H.resume()}};
    const finish=st=>{if(done)return;done=true;clearTimeout(wd);clearTimeout(afterT);resume();busy=false;if(started)lastAdAt=performance.now();try{cb({viewed,shown:started,st})}catch(e){console.error(e)}};
    const wd=setTimeout(()=>{if(!started)finish('timeout')},NO_START_MS);
    busy=true;
    try{const o={type,name,beforeAd:()=>{started=true;clearTimeout(wd);pause()},afterAd:()=>{resume();afterT=setTimeout(()=>finish('afterAd'),1500)},adBreakDone:i=>finish((i&&i.breakStatus)||'other')};
      if(type==='reward'){o.beforeReward=f=>f();o.adViewed=()=>{if(viewed)return;viewed=true;try{onViewed()}catch(e){console.error(e)}};o.adDismissed=()=>{}}
      const p=y8Sdk.showAd(o);if(p&&p.catch)p.catch(()=>finish('error'))}catch(e){finish('error')}
  }
  /* fake ad: clearly labelled sample, 5 s countdown, close early = no reward */
  function fake(kind,rewardText,cb){
    const ov=$('adov'),num=$('adNum'),bar=$('adBar'),cl=$('adClose');
    $('adLab').textContent=T('โฆษณาตัวอย่าง (ยังไม่ใช่โฆษณาจริง)','SAMPLE AD (not a real ad)');
    $('adKind').textContent=kind==='reward'?T('โฆษณาแลกรางวัล · รางวัล: ','Rewarded ad · reward: ')+rewardText:T('โฆษณาคั่น (ไม่มีรางวัล)','Break ad (no reward)');
    $('adS1').textContent=T('พื้นที่แสดงคลิปโฆษณา','Ad video area');
    $('adS2').textContent=T('บนเว็บเกมจริง (เช่น Y8) ตรงนี้จะเป็นคลิปโฆษณา เดโมนี้ไม่เรียกเครือข่ายโฆษณาและไม่เก็บข้อมูลใดๆ','On a real game portal (e.g. Y8) an ad video plays here. This demo calls no ad network and collects no data.');
    const t0=performance.now();let fin=false,closed=false;
    const paint=()=>{const el=(performance.now()-t0)/1000,left=Math.max(0,AD_SECONDS-el);fin=left<=0;num.textContent=fin?'OK':String(Math.ceil(left));bar.style.width=Math.min(100,el/AD_SECONDS*100)+'%';
      if(kind==='reward'){cl.disabled=false;cl.textContent=fin?T('ปิด และรับรางวัล','Close & get reward'):T('ปิด (ไม่ได้รับรางวัล)','Close (no reward)')}
      else{cl.disabled=!fin;cl.textContent=fin?T('ปิดโฆษณา','Close ad'):T('ปิดได้ใน ','Close in ')+Math.ceil(left)+T(' วินาที','s')}
      cl.classList.toggle('done',fin)};
    paint();const iv=setInterval(paint,100);
    cl.onclick=()=>{if(closed||cl.disabled)return;closed=true;clearInterval(iv);ov.classList.remove('on');cl.onclick=null;cb(fin)};
    ov.classList.add('on');
  }
  return{
    setHooks(h){H=h},
    available(){return PROVIDER==='fake'||(inited&&!!y8Sdk)},
    busy:()=>busy,
    rewarded(name,rewardText,onReward,onNone){
      if(busy)return;
      if(!Ads.available()){onNone&&onNone('unavailable');return}
      if(PROVIDER==='fake'){busy=true;H.pause();fake('reward',rewardText,ok=>{busy=false;lastAdAt=performance.now();H.resume();ok?onReward():(onNone&&onNone('dismissed'))});return}
      y8brk('reward',name,onReward,r=>{if(!r.viewed&&onNone)onNone(r.shown?'dismissed':'unavailable')});
    },
    interstitial(name,done){
      const go=()=>{try{done&&done()}catch(e){console.error(e)}};
      if(busy||!Ads.available()||performance.now()-lastAdAt<INTER_GAP){go();return}
      try{adStat(name,'o');adStat(name,'w')}catch(e){}
      if(PROVIDER==='fake'){busy=true;H.pause();fake('inter','',()=>{busy=false;lastAdAt=performance.now();H.resume();go()});return}
      y8brk('next',name,null,()=>go());
    },
    _dbg:{age(ms){lastAdAt-=ms},canInter:()=>!busy&&performance.now()-lastAdAt>=INTER_GAP}
  };
})();
Ads.setHooks({
  pause(){adOn=true;drag=null;if(AU.c){try{AU.m.gain.setValueAtTime(0,AU.c.currentTime);AU.c.suspend()}catch(e){}}},
  resume(){adOn=false;lastT=performance.now();if(AU.c){try{AU.c.resume();AU.m.gain.setValueAtTime(S.set.sfx?.5:0,AU.c.currentTime)}catch(e){}}}
});

/* ---------------- game data ---------------- */
const TIERS=[
 ['ตู้ลูกอม','Gumball Globe','#ff5a6e'],['ม้าโยกหยอดเหรียญ','Pony Ride','#ffa53d'],['ตู้คีบตุ๊กตา','Claw Crane','#ff4fa3'],
 ['โต๊ะพินบอล','Pinball Table','#3ddc84'],['ตู้เกมตั้งพื้น','Upright Cabinet','#a66bff'],['ตู้ขับรถแข่ง','Racer Seat','#ff8a1f'],
 ['ตู้ยิงปืน','Blaster Cabinet','#4d7cff'],['ตู้เต้น','Dance Pad','#c95bff'],['โต๊ะแอร์ฮอกกี้','Air Hockey','#22c8e0'],
 ['ตู้ชู้ตบาส','Hoop Shot','#ff7a2e'],['ตู้ชกวัดแรง','Punch Meter','#ff3b4e'],['ตู้ถ่ายสติกเกอร์','Photo Booth','#ff7fc0'],
 ['ตู้ตีกลอง','Drum Rush','#ff4d7a'],['แคปซูลคู่','Twin Pod','#19d1b0'],['ห้องบังคับหุ่นยนต์','Mech Cockpit','#9aa7bd'],
 ['โดมโฮโลแกรม','Holo Dome','#7b5cff'],['ตู้จำลองจรวด','Rocket Sim','#ff6b4a'],['ตู้ตำนานรุ่นทอง','Golden Legend','#ffc83d']
];
const MAXT=TIERS.length;
const tname=t=>LANG==='th'?TIERS[t-1][0]:TIERS[t-1][1];
const INC_R=2.7,COST_R=5.0,COST_N=1.07,COST_B=12,COST_Q=1;const inc=t=>Math.pow(INC_R,t-1);
const COLS=4,ROWS=5,SLOTS=COLS*ROWS;
const HALLS=[
 {th:'ซอยหน้าโรงเรียน',en:'School Lane',mult:1,cost:0,build:0},
 {th:'ชั้นใต้ดินห้าง',en:'Mall Basement',mult:2,cost:1e7,build:300},
 {th:'ลานนีออน',en:'Neon Plaza',mult:4,cost:1e11,build:900},
 {th:'สถานีอวกาศ',en:'Orbit Station',mult:8,cost:1e15,build:1800}
];
const UPS=[
 {id:'price',th:'ขึ้นค่าเล่น',en:'Ticket Price',max:60,cost:l=>40*Math.pow(3.2,l),dth:l=>'รายได้ทุกตู้ +15% (ตอนนี้ +'+(l*15)+'%)',den:l=>'All income +15% (now +'+(l*15)+'%)'},
 {id:'van',th:'รถส่งตู้',en:'Delivery Van',max:8,cost:l=>90*Math.pow(3.4,l),dth:l=>'ส่งกล่องตู้ฟรีทุก '+vanInt(l).toFixed(1)+' วิ',den:l=>'Free machine box every '+vanInt(l).toFixed(1)+'s'},
 {id:'floor',th:'ขยายพื้นที่',en:'Expand Floor',max:4,cost:l=>[250,8000,1e6,1e9][l],dth:l=>'ช่องวางตู้ '+slotsOpen(l)+' ช่อง (+2)',den:l=>slotsOpen(l)+' slots per hall (+2)'},
 {id:'supply',th:'ซัพพลายเออร์',en:'Supplier',max:3,cost:l=>[3e4,1e8,1e12][l],dth:l=>'กล่องจากรถส่งเป็นตู้ระดับ '+(1+3*l)+' (ถัดไป '+(4+3*l)+')',den:l=>'Van boxes contain tier '+(1+3*l)+' (next '+(4+3*l)+')'},
 {id:'offline',th:'ผู้จัดการกะดึก',en:'Night Manager',max:5,cost:l=>1500*Math.pow(5,l),dth:l=>'เก็บเงินตอนออฟไลน์ได้สูงสุด '+offCap(l)+' ชม.',den:l=>'Offline earnings up to '+offCap(l)+'h'},
 {id:'vip',th:'ป้ายไฟเรียกแขก',en:'Neon Sign',max:5,cost:l=>5000*Math.pow(4,l),dth:l=>'แขก VIP มาบ่อยขึ้น (ทุก ~'+Math.round(vipInt(l)/60*10)/10+' นาที)',den:l=>'VIP guests come more often (~every '+Math.round(vipInt(l)/60*10)/10+' min)'}
];
function vanInt(l){return Math.max(8,20*Math.pow(.88,l))}
function slotsOpen(l){return 12+2*l}
function offCap(l){return 2+2*l}
function vipInt(l){return 210*Math.pow(.86,l)}
/* rewarded-ad caps */
const CAP={boostAdd:180,boostMax:1800,crateCd:240,cashCd:180,cashMin:10,wheelFreeCd:3*3600,wheelAdCd:90,wheelAdDay:8,skipSec:600};
const WHEEL=[
 {k:'coin',m:5,w:20},{k:'boost',m:3,w:14},{k:'coin',m:15,w:14},{k:'crate',m:0,w:10},
 {k:'coin',m:5,w:18},{k:'boost',m:5,w:10},{k:'coin',m:30,w:9},{k:'coin',m:60,w:5}
];
const DAILY=[5,10,15,20,30,45,60];
/* ---------------- state ---------------- */
function newHall(i){return{g:new Array(SLOTS).fill(0),built:i===0,buildEnd:0}}
function freshRun(){return{coins:0,runEarned:0,halls:HALLS.map((h,i)=>newHall(i)),up:{price:0,van:0,floor:0,supply:0,offline:0,vip:0},bought:0,boughtTier:1,maxTier:1,view:0,vanT:0}}
function defaults(){
  const r=freshRun();r.halls[0].g[5]=1;r.halls[0].g[6]=1;
  return Object.assign(r,{v:VERSION,stars:0,allEarned:0,seen:1,boost:0,crateAt:0,cashAt:0,
    wheel:{freeAt:0,adAt:0,day:'',n:0},daily:{last:'',streak:0,dbl:''},goalIdx:0,goal:null,
    stats:{merges:0,buys:0,taps:0,spins:0,prestiges:0,boxes:0,vip:0,tokens:0,playSec:0},
    ads:{},adLog:[],set:{sfx:true,vib:true},lastSeen:now(),tut:0,created:now()})
}
let S;
function load(){
  let d=null;try{const raw=localStorage.getItem(KEY);if(raw)d=JSON.parse(raw)}catch(e){d=null}
  const base=defaults();
  if(!d||typeof d!=='object'){S=base;return false}
  d=migrate(d);
  S=Object.assign(base,d);
  for(const k of['wheel','daily','stats','set','up'])S[k]=Object.assign(base[k],d[k]||{});
  if(!Array.isArray(S.halls)||S.halls.length!==HALLS.length)S.halls=base.halls;
  S.halls.forEach((h,i)=>{if(!Array.isArray(h.g)||h.g.length!==SLOTS)h.g=new Array(SLOTS).fill(0);h.g=h.g.map(v=>Number.isFinite(v)?clamp(Math.round(v),-MAXT,MAXT):0);if(i===0)h.built=true});
  if(!Number.isFinite(S.coins)||S.coins<0)S.coins=0;
  S.view=clamp(S.view|0,0,HALLS.length-1);if(!S.halls[S.view].built)S.view=0;
  return true;
}
function migrate(d){if(!d.v)d.v=1;/* future: if(d.v<2){...;d.v=2} */return d}
let saveT=0;
function save(){try{S.lastSeen=now();S.v=VERSION;localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------------- economy ---------------- */
const shopTier=()=>Math.max(1,S.maxTier-3);
function buyCost(){const s=shopTier();return Math.ceil(COST_B*Math.pow(COST_R,s-1)*Math.pow(COST_N,S.boughtTier===s?S.bought:0)*Math.pow(COST_Q,(s-1)*(s-1)))}
const starMult=()=>1+.1*S.stars;
const priceMult=()=>1+.15*S.up.price;
function baseIps(){let sum=0;S.halls.forEach((h,i)=>{if(!h.built)return;let s=0;for(let k=0;k<SLOTS;k++){const v=h.g[k];if(v>0)s+=inc(v)}sum+=s*HALLS[i].mult});return sum*priceMult()*starMult()}
const boostMult=()=>S.boost>0?2:1;
const ips=()=>baseIps()*boostMult();
function machineIps(hi,t){return inc(t)*HALLS[hi].mult*priceMult()*starMult()*boostMult()}
function earn(x){if(!(x>0))return;S.coins+=x;S.runEarned+=x;S.allEarned+=x}
function minutesOf(m,floor){return Math.max(Math.ceil(baseIps()*60*m),floor||0)}
const openSlots=()=>slotsOpen(S.up.floor);
function emptySlot(hi){const h=S.halls[hi],n=openSlots();for(let k=0;k<n;k++){const idx=slotOrder[k];if(!h.g[idx])return idx}return -1}
/* open slot order: centre-out so a fresh hall looks tidy */
const slotOrder=(()=>{const o=[];for(let k=0;k<SLOTS;k++)o.push(k);const rank=k=>{const c=k%COLS,r=(k/COLS)|0;return Math.abs(r-1.6)*1.2+Math.abs(c-1.5)};return o.sort((a,b)=>rank(a)-rank(b)||a-b)})();
const isOpen=idx=>slotOrder.indexOf(idx)<openSlots();
const hallReady=i=>S.halls[i].built;
function setMax(t){if(t>S.maxTier){S.maxTier=t}if(t>S.seen){S.seen=t;queue(()=>newMachineModal(t))}}

function buy(){
  auInit();const hi=S.view;
  if(!hallReady(hi)){toast(T('ห้องนี้ยังสร้างไม่เสร็จ','This hall is not ready yet'));return}
  const c=buyCost();if(S.coins<c){SFX.err();toast(T('เหรียญยังไม่พอ','Not enough coins'));bump($('buy'));return}
  const idx=emptySlot(hi);if(idx<0){SFX.err();toast(T('ห้องเต็ม! ลากตู้ที่เหมือนกันมารวมร่างก่อน','Hall full! Merge matching machines first'));hintPulse=2.5;return}
  const s=shopTier();if(S.boughtTier!==s){S.boughtTier=s;S.bought=0}
  S.coins-=c;S.bought++;S.stats.buys++;S.halls[hi].g[idx]=s;pop(hi,idx,1);SFX.buy();vib(8);setMax(s);renderAll();
}
function mergeAt(hi,from,to){
  const g=S.halls[hi].g,a=g[from],b=g[to];
  if(a>0&&a===b&&a<MAXT){g[from]=0;g[to]=a+1;S.stats.merges++;pop(hi,to,1.5);burst(hi,to,TIERS[a][2]);SFX.merge(a+1);vib(15);setMax(a+1);if(S.tut===0)S.tut=1;renderAll();return 'merge'}
  if(!b){g[to]=a;g[from]=0;return 'move'}
  g[to]=a;g[from]=b;return 'swap';
}
function openBox(hi,idx){const g=S.halls[hi].g;if(g[idx]>=0)return;const t=-g[idx];g[idx]=t;S.stats.boxes++;pop(hi,idx,1.6);burst(hi,idx,'#ffc83d');SFX.crate();vib(10);setMax(t);renderAll()}
function placeBox(t,hi){hi=hi==null?S.view:hi;if(!hallReady(hi))hi=0;const idx=emptySlot(hi);if(idx<0)return false;S.halls[hi].g[idx]=-clamp(t,1,MAXT);pop(hi,idx,1.2);return true}
function vanTier(){return clamp(1+3*S.up.supply,1,Math.max(1,shopTier()-1))}
function crateTier(){return clamp(S.maxTier-2,shopTier()+1,MAXT)}

function buyUp(id){const u=UPS.find(x=>x.id===id),l=S.up[id];if(l>=u.max)return;const c=Math.ceil(u.cost(l));if(S.coins<c){SFX.err();toast(T('เหรียญยังไม่พอ','Not enough coins'));return}
  S.coins-=c;S.up[id]++;SFX.claim();vib(10);if(id==='van')S.vanT=Math.min(S.vanT,vanInt(S.up.van));renderAll();MODAL.re&&MODAL.re()}
function buyHall(i){const h=S.halls[i];if(h.built||h.buildEnd)return;for(let k=1;k<i;k++)if(!S.halls[k].built&&!S.halls[k].buildEnd){toast(T('ปลดล็อกห้องก่อนหน้าก่อน','Unlock the previous hall first'));return}
  const c=HALLS[i].cost;if(S.coins<c){SFX.err();toast(T('เหรียญยังไม่พอ','Not enough coins'));return}
  S.coins-=c;h.buildEnd=now()+HALLS[i].build*1000;SFX.claim();renderAll();MODAL.re&&MODAL.re()}
function finishHall(i){const h=S.halls[i];h.built=true;h.buildEnd=0;h.g[slotOrder[0]]=shopTier();h.g[slotOrder[1]]=shopTier();SFX.fan();
  queue(()=>simpleModal(T('ห้องใหม่เปิดแล้ว!','New hall open!'),(LANG==='th'?HALLS[i].th:HALLS[i].en)+' · '+T('รายได้ x','income x')+HALLS[i].mult,T('ไปดูเลย','Go there'),()=>{S.view=i;renderAll()}));renderAll()}

/* prestige ("Grand Reopening") */
const starGain=()=>Math.floor(Math.sqrt(S.runEarned/1e10));
function doPrestige(){const g=starGain();if(g<1)return;const keep={stars:S.stars+g};
  const r=freshRun();r.halls[0].g[slotOrder[0]]=1;r.halls[0].g[slotOrder[1]]=1;Object.assign(S,r);S.stars=keep.stars;S.stats.prestiges++;S.seen=Math.max(S.seen,1);
  closeModal();SFX.fan();save();renderAll();
  Ads.interstitial('after_reopen',()=>{toast(T('เปิดร้านใหม่! รายได้ถาวร +','Grand reopening! Permanent income +')+(S.stars*10)+'%')});
}

/* goals */
const GOALS=[
 ['merge',1,1,20],['buy',3,1,30],['tier',3,2,40],['up_price',1,2,60],['tier',4,2,80],['merge',8,2,0],['up_floor',1,2,0],['tier',5,3,0],
 ['up_van',1,3,0],['boxes',3,2,0],['tier',6,3,0],['tokens',1,2,0],['ips',100,3,0],['tier',7,3,0],['spins',1,3,0],
 ['tier',8,3,0],['vip',1,3,0],['ips',2000,4,0],['tier',9,4,0],['up_supply',1,4,0],['tier',10,4,0],['hall',1,4,0],['ips',5e4,4,0]
];
function makeGoal(){const i=S.goalIdx;if(i<GOALS.length){const g=GOALS[i];return{k:g[0],n:g[1],m:g[2],f:g[3]}}
  if(!S.stats.prestiges&&starGain()>=5&&i%3===0)return{k:'prestige',n:1,m:8,f:0};
  if(i%2&&S.maxTier<MAXT)return{k:'tier',n:S.maxTier+1,m:6,f:0};
  const cur=ips()||1;return{k:'ips',n:Math.pow(10,Math.ceil(Math.log10(cur*5))),m:6,f:0}}
function goalVal(g){switch(g.k){case'merge':return S.stats.merges;case'buy':return S.stats.buys;case'tier':return S.maxTier;case'ips':return baseIps();case'boxes':return S.stats.boxes;
  case'tokens':return S.stats.tokens;case'spins':return S.stats.spins;case'vip':return S.stats.vip;case'prestige':return S.stats.prestiges;case'hall':return S.halls.filter(h=>h.built).length-1;
  default:if(g.k.startsWith('up_'))return S.up[g.k.slice(3)];return 0}}
function goalBase(g){if(['merge','buy','boxes','tokens','spins','vip'].includes(g.k))return g.b||0;return 0}
function goalProg(g){const b=goalBase(g);return clamp((goalVal(g)-b)/(g.n-b||1),0,1)}
function goalText(g){const n=g.n;switch(g.k){
  case'merge':return T('รวมร่างตู้ '+n+' ครั้ง','Merge machines '+n+'x');case'buy':return T('ซื้อตู้ '+n+' ตู้','Buy '+n+' machines');
  case'tier':return T('ได้ '+tname(n)+' (ระดับ '+n+')','Get '+tname(n)+' (tier '+n+')');case'ips':return T('รายได้ถึง '+fmt(n)+'/วิ','Reach '+fmt(n)+'/s income');
  case'boxes':return T('เปิดกล่องตู้ '+n+' กล่อง','Open '+n+' machine boxes');case'tokens':return T('เก็บเหรียญทองลอยฟ้า '+n+' ครั้ง','Catch a golden token');
  case'spins':return T('หมุนวงล้อ 1 ครั้ง','Spin the wheel once');case'vip':return T('ต้อนรับแขก VIP 1 คน','Serve a VIP guest');
  case'prestige':return T('เปิดร้านใหม่ (รับดาว)','Grand reopening (earn stars)');case'hall':return T('เปิดห้องที่ 2','Open hall #2');
  default:{const u=UPS.find(x=>'up_'+x.id===g.k);return T('อัปเกรด '+u.th+' เลเวล '+n,'Upgrade '+u.en+' to Lv '+n)}}}
function ensureGoal(){if(!S.goal){S.goal=makeGoal();S.goal.b=goalVal(S.goal);if(['tier','ips','hall','prestige'].includes(S.goal.k)||S.goal.k.startsWith('up_'))S.goal.b=0}}
/* counters use base snapshot; levels use absolute */
function goalDone(){const g=S.goal;if(!g)return false;if(['merge','buy','boxes'].includes(g.k))return goalVal(g)-g.b>=g.n;return goalVal(g)>=g.n}
function goalPct(){const g=S.goal;if(['merge','buy','boxes'].includes(g.k))return clamp((goalVal(g)-g.b)/g.n,0,1);if(g.k==='ips')return clamp(Math.log10(1+goalVal(g))/Math.log10(1+g.n),0,1);return clamp(goalVal(g)/g.n,0,1)}
const goalReward=()=>minutesOf(S.goal.m,S.goal.f);
function claimGoal(){if(!goalDone())return;const r=goalReward();earn(r);fly(T('+'+fmt(r)+' เหรียญ','+'+fmt(r)+' coins'));SFX.claim();vib(20);S.goalIdx++;S.goal=null;ensureGoal();renderAll()}

  let alive=true;const loop=ts=>{if(!alive||!c.isConnected)return;const x=c.getContext('2d');x.clearRect(0,0,300,300);x.save();x.translate(150,150);x.rotate(ts/3000);x.fillStyle='rgba(255,200,61,.12)';for(let i=0;i<10;i++){x.rotate(TAU/10);x.beginPath();x.moveTo(0,0);x.lineTo(150,-30);x.lineTo(150,30);x.fill()}x.restore();drawMachine(x,t,150,156,230,ts/1000,false);requestAnimationFrame(loop)};requestAnimationFrame(loop);
  el('div','big',tname(t),s);el('div','sub',T('ระดับ ','Tier ')+t+' · '+fmt(inc(t))+T(' เหรียญ/วิ ต่อตู้ (ก่อนตัวคูณ)',' coins/s each (before multipliers)')+(t<MAXT?T(' · รวม 2 ตู้เพื่อได้ระดับ ',' · merge 2 for tier ')+(t+1):T(' · ระดับสูงสุดแล้ว!',' · top tier!')),s);
  el('div','note',T('สะสมแล้ว ','Collection ')+S.seen+'/'+MAXT,s);btn(s,'go',T('เยี่ยม!','Awesome!'),()=>{alive=false;closeModal()})})}

/* upgrades sheet */
function upModal(){MODAL.closable=true;openModal(s=>{el('h2','',T('อัปเกรด','Upgrades'),s);const ls=el('div','list',null,s);
  UPS.forEach(u=>{const l=S.up[u.id],it=el('div','item',null,ls),tx=el('div','tx',null,it);el('div','nm',(LANG==='th'?u.th:u.en)+'  Lv '+l+(l>=u.max?' (MAX)':''),tx);el('div','ds',LANG==='th'?u.dth(l):u.den(l),tx);
    const c=Math.ceil(u.cost(l)||0),b=btn(it,S.coins>=c&&l<u.max?'go':'',l>=u.max?'MAX':fmt(c),()=>buyUp(u.id));if(l>=u.max||S.coins<c)b.disabled=true});
  btn(s,'',T('ปิด','Close'),closeModal)})}
/* halls sheet (placement 8: skip build timer) */
function hallModal(){MODAL.closable=true;openModal(s=>{el('h2','',T('ห้องเกม','Halls'),s);el('div','sub',T('แต่ละห้องมีตู้ของตัวเอง และคูณรายได้ทั้งห้อง','Each hall has its own floor and multiplies its income'),s);const ls=el('div','list',null,s);
  HALLS.forEach((H,i)=>{const h=S.halls[i],it=el('div','item',null,ls),tx=el('div','tx',null,it);el('div','nm',(LANG==='th'?H.th:H.en)+'  x'+H.mult,tx);
    if(h.built){el('div','ds',T('เปิดแล้ว','Open'),tx);btn(it,'',T('ไปดู','Visit'),()=>{S.view=i;closeModal();renderAll()})}
    else if(h.buildEnd){const left=(h.buildEnd-now())/1000;el('div','ds',T('ก่อสร้างอีก ','Ready in ')+ftime(left),tx);
      const b=btn(it,'ad',T('ข้าม 10 นาที','Skip 10 min'),()=>{adStat('skip_build','o');Ads.rewarded('skip_build',T('ก่อสร้างเร็วขึ้น 10 นาที','build 10 min faster'),()=>{adStat('skip_build','w');h.buildEnd-=CAP.skipSec*1000;if(now()>=h.buildEnd)finishHall(i);save();renderAll();if(MODAL.on&&MODAL.re)MODAL.re()},()=>toast(T('ดูไม่จบ จึงไม่ได้ข้ามเวลา','Ad not finished - no skip')))},true);if(!Ads.available())b.disabled=true}
    else{el('div','ds',T('ใช้เวลาสร้าง ','Build time ')+ftime(H.build),tx);const prevOk=i===1||S.halls[i-1].built||S.halls[i-1].buildEnd;const b=btn(it,S.coins>=H.cost&&prevOk?'go':'',fmt(H.cost),()=>buyHall(i));if(S.coins<H.cost||!prevOk)b.disabled=true}});
  btn(s,'',T('ปิด','Close'),closeModal)})}
/* prestige sheet */
function presModal(){MODAL.closable=true;openModal(s=>{const g=starGain();el('h2','',T('เปิดร้านใหม่','Grand Reopening'),s);el('div','big','+★'+g,s);
  el('div','sub',T('เริ่มร้านใหม่ตั้งแต่ต้น แต่ได้ดาวถาวร ดาวละ +10% รายได้ตลอดไป (ตอนนี้ ★'+S.stars+' = +'+S.stars*10+'%)','Start the arcade over, but keep stars forever: each star = +10% income (now ★'+S.stars+' = +'+S.stars*10+'%)'),s);
  el('div','note',T('เก็บไว้: ดาว ภารกิจ สถิติ คอลเลกชัน รางวัลรายวัน · รีเซ็ต: เหรียญ ตู้ ห้อง อัปเกรด','Kept: stars, goals, stats, collection, daily streak · Reset: coins, machines, halls, upgrades'),s);
  el('div','note',g<1?T('ต้องหาเงินในรอบนี้ให้ได้ 1M ก่อน (ตอนนี้ ','Earn 1M this run first (now ')+fmt(S.runEarned)+')':T('ดาวรอบหน้าจะได้มากขึ้นถ้าหาเงินได้มากขึ้น','More earnings this run = more stars'),s);
  const pr=el('div','pair',null,s);btn(pr,'',T('ยังก่อน','Not yet'),closeModal);const b=btn(pr,'go',T('เปิดร้านใหม่','Reopen'),()=>{if(starGain()>=1)doPrestige()});if(g<1)b.disabled=true})}
/* settings */
function setModal(){MODAL.closable=true;openModal(s=>{el('h2','',T('ตั้งค่า','Settings'),s);
  btn(s,'',T('เสียง: ','Sound: ')+(S.set.sfx?T('เปิด','On'):T('ปิด','Off')),()=>{S.set.sfx=!S.set.sfx;if(AU.m)AU.m.gain.value=S.set.sfx?.5:0;MODAL.re()});
  btn(s,'',T('สั่น: ','Vibration: ')+(S.set.vib?T('เปิด','On'):T('ปิด','Off')),()=>{S.set.vib=!S.set.vib;MODAL.re()});
  btn(s,'',LANG==='th'?'Language: English':'ภาษา: ไทย',()=>setLang(LANG==='th'?'en':'th',true));
  const st=S.stats;el('div','note',T('เล่นแล้ว ','Played ')+ftime(st.playSec)+' · '+T('รวมร่าง ','merges ')+st.merges+' · '+T('สะสมตู้ ','collection ')+S.seen+'/'+MAXT+' · ★'+S.stars,s);
  el('div','note','MERGETRON \u201996 · Kairon Arcade · v1',s);
  const r=btn(s,'',T('ลบเซฟ เริ่มใหม่ทั้งหมด','Erase save & restart'),()=>{if(r.dataset.ok){try{localStorage.removeItem(KEY)}catch(e){}S=defaults();closeModal();renderAll();save()}else{r.dataset.ok=1;r.textContent=T('แตะอีกครั้งเพื่อยืนยัน','Tap again to confirm')}});
  btn(s,'go',T('ปิด','Close'),closeModal)})}

$('buy').onclick=buy;$('nUp').onclick=()=>{auInit();SFX.ui();upModal()};$('nWheel').onclick=()=>{auInit();SFX.ui();wheelModal()};$('nHall').onclick=()=>{auInit();SFX.ui();hallModal()};$('nPres').onclick=()=>{auInit();SFX.ui();presModal()};
$('bSet').onclick=()=>{auInit();SFX.ui();setModal()};$('bLang').onclick=()=>{auInit();SFX.ui();setLang(LANG==='th'?'en':'th',true)};
$('goal').onclick=()=>{auInit();if(goalDone())claimGoal();else{SFX.ui();toast(goalText(S.goal))}};

/* ---------------- boot ---------------- */
const fresh=!load();document.documentElement.lang=LANG;ensureGoal();
window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe($('floorWrap'));resize();renderAll();
if(!fresh){offlineCheck((now()-S.lastSeen)/1000)}
dailyCheck();
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.addEventListener('pagehide',save);window.addEventListener('beforeunload',save);
/* hidden tabs stop rAF: measure away time by wall clock */
hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=now();else if(hiddenAt){const sec=(now()-hiddenAt)/1000;hiddenAt=0;lastT=performance.now();if(sec>5)offlineCheck(sec)}});
document.fonts&&document.fonts.ready&&document.fonts.ready.then(()=>{buyIcoT=0;renderHud()});
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(frame)});

})();
</script>
