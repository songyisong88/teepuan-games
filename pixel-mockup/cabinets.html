<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12141F"><title>ห้องเกม ไครอน</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--wall:#181B2A;--deep:#10121C;--amb:#FFC13D;--tx:#fff;--mut:#9AA0B8;--body:#262B44}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--wall);color:var(--tx);font-family:Kanit,sans-serif;min-height:100vh;
 background-image:radial-gradient(rgba(255,193,61,.10) 1px,transparent 1.4px);background-size:22px 22px}
.sign{text-align:center;padding:calc(env(safe-area-inset-top) + 22px) 16px 6px}
.sign .box{display:inline-flex;align-items:center;gap:12px;border:3px solid var(--amb);border-radius:16px;padding:10px 18px;box-shadow:0 0 24px rgba(255,193,61,.35),inset 0 0 14px rgba(255,193,61,.15)}
.sign img{width:46px;height:46px;border-radius:50%}
.sign b{font-size:24px;font-weight:800;display:block;line-height:1.05}.sign small{font:9px 'Press Start 2P';color:var(--mut);letter-spacing:.05em}
.sub{color:var(--mut);font-size:14px;margin-top:12px}
.tabs{display:flex;justify-content:center;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.tab{background:none;border:2px solid #3A4066;color:var(--tx);font:600 14px Kanit;padding:5px 14px;border-radius:10px}
.tab.on{border-color:var(--amb);background:var(--amb);color:var(--deep)}
.room{max-width:480px;margin:0 auto;padding:14px 14px 0;display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}
.cab{text-decoration:none;color:var(--tx);display:block;transition:transform .12s}.cab:active{transform:translateY(3px) scale(.98)}
.mq{background:var(--amb);color:var(--deep);font-weight:800;font-size:14px;text-align:center;padding:6px 4px;border-radius:12px 12px 4px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 0 14px rgba(255,193,61,.45)}
.bd{background:var(--body);border-radius:4px 4px 10px 10px;padding:9px 9px 10px;border:2px solid #31375A;border-top:0}
.scr{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;border:4px solid var(--deep);background:#000}
.scr img{width:100%;height:100%;object-fit:cover;display:block}
.scr:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.badge{position:absolute;z-index:2;top:6px;right:6px;background:var(--amb);color:var(--deep);font-size:11px;font-weight:800;padding:1px 8px;border-radius:99px}
.pan{display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding:0 4px}
.joy{width:16px;height:16px;border-radius:50%;background:var(--deep);box-shadow:0 0 0 4px #31375A}
.bt{display:flex;gap:6px}.bt i{width:12px;height:12px;border-radius:50%;background:var(--amb)}.bt i+i{background:var(--deep)}
.go{font-size:12px;font-weight:800;color:var(--amb)}
.cat{font-size:11px;color:var(--mut);text-align:center;margin-top:6px}
.floor{height:70px;margin-top:22px;background:linear-gradient(transparent,rgba(0,0,0,.35)),repeating-linear-gradient(90deg,#1E2236 0 40px,#181B2A 40px 80px)}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:14px 0 30px;background:rgba(0,0,0,.35)}
</style></head><body>
<div class="sign"><div class="box"><img src="logo.png" alt=""><div><b>ห้องเกม ไครอน</b><small>KAIRON ARCADE</small></div></div>
<div class="sub">เดินเลือกตู้ แตะแล้วเล่นได้ทันที ไม่ต้องโหลดแอป</div></div>
<div class="tabs" id="tabs"><button class="tab on" data-c="">ทุกตู้</button><button class="tab" data-c="แอคชัน">แอคชัน</button><button class="tab" data-c="จังหวะไว">จังหวะไว</button><button class="tab" data-c="วางแผน">วางแผน</button><button class="tab" data-c="ไขปริศนา">ไขปริศนา</button></div>
<div class="room" id="room"></div><div class="floor"></div>
<div class="foot">เล่นฟรี · © Kairon Arcade</div>
<script src="games.js"></script><script>
function draw(c){room.innerHTML=G.filter(g=>!c||g[2]==c).map(g=>`<a class="cab" href="${BASE}${g[0]}/"><div class="mq">${g[1]}</div><div class="bd"><div class="scr"><img src="../v2/thumbs/${g[0]}.webp" alt="">${g[4]?`<span class="badge">${g[4]}</span>`:''}</div><div class="pan"><span class="joy"></span><span class="go">แตะเล่น</span><span class="bt"><i></i><i></i></span></div></div><div class="cat">${g[2]}</div></a>`).join('')}
tabs.onclick=e=>{const b=e.target.closest('.tab');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x==b));draw(b.dataset.c)};draw('');
</script></body></html>
