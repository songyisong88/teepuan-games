<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>PIXTRON Brick Game 9999 in 1 · ตี้ป่วน</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#14110f;overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c" aria-label="เกมบริคเกมยุค 90"></canvas>
<script>
(function(){
'use strict';
// ===== Canvas & layout (virtual device = 360 x 780) =====
var VW=360,VH=780;
var C=document.getElementById('c'),X=C.getContext('2d');
var W=0,H=0,DPR=1,S=1,OX=0,OY=0;
function resize(){
  W=window.innerWidth;H=window.innerHeight;DPR=Math.min(window.devicePixelRatio||1,3);
  C.width=Math.round(W*DPR);C.height=Math.round(H*DPR);C.style.width=W+'px';C.style.height=H+'px';
  S=Math.min(W/VW,H/VH);OX=(W-VW*S)/2;OY=(H-VH*S)/2;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,150);});
resize();

var FONT='"Kanit","Prompt","Sarabun","Noto Sans Thai",Tahoma,sans-serif';
var LCD_BG='#9da98a',ON='#1b2216',GHOST='rgba(27,34,22,0.085)',SHADOW='rgba(27,34,22,0.16)';
var LCD={x:42,y:86,w:276,h:356};
var CS=16, FX=52, FY=100; // field cell size & origin (10 x 20)
var FW=10,FH=20;

var BTN={
  start:{x:120,y:527,r:14,label:'START',kind:'small'},
  sound:{x:180,y:527,r:14,label:'SOUND',kind:'small'},
  reset:{x:240,y:527,r:14,label:'RESET',kind:'small'},
  up:{x:110,y:600,r:30,label:'up',kind:'dir'},
  down:{x:110,y:712,r:30,label:'down',kind:'dir'},
  left:{x:54,y:656,r:30,label:'left',kind:'dir'},
  right:{x:166,y:656,r:30,label:'right',kind:'dir'},
  a:{x:290,y:628,r:44,label:'A',kind:'big'},
  b:{x:222,y:704,r:28,label:'B',kind:'big'}
};
var BTN_KEYS=Object.keys(BTN);

// ===== Storage =====
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var hiS=[parseInt(lsGet('retro90_hi_A','0'),10)||0,parseInt(lsGet('retro90_hi_B','0'),10)||0];
var soundOn=lsGet('retro90_sound','1')==='1';

// ===== Audio (square-wave beeps) =====
var AC=null;
function unlockAudio(){
  if(!AC){try{var A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
}
function tone(f,d,t0,vol,slideTo){
  if(!AC||!soundOn)return;
  try{
    var t=AC.currentTime+(t0||0),v=vol||0.05;
    var o=AC.createOscillator(),g=AC.createGain();
    o.type='square';o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.004);
    g.gain.setValueAtTime(v,t+d*0.85);g.gain.linearRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);
  }catch(e){}
}
var SFX={
  click:function(){tone(2400,0.018,0,0.03);},
  move:function(){tone(1320,0.03,0,0.045);},
  pass:function(){tone(1760,0.035,0,0.04);tone(2350,0.045,0.04,0.04);},
  eat:function(){tone(990,0.04,0,0.05);tone(1480,0.05,0.045,0.05);},
  level:function(){var n=[1046,1318,1568,2093];for(var i=0;i<4;i++)tone(n[i],0.06,i*0.065,0.045);},
  crash:function(){for(var i=0;i<9;i++)tone(520-i*45,0.06,i*0.07,0.07);tone(90,0.35,0.63,0.06,40);},
  over:function(){var n=[784,659,523,392,330,262];for(var i=0;i<n.length;i++)tone(n[i],0.13,0.1+i*0.15,0.05);},
  boot:function(){var n=[523,659,784,1046,0,784,1046];var d=[.09,.09,.09,.16,.06,.09,.28],t=0;for(var i=0;i<n.length;i++){if(n[i])tone(n[i],d[i],t,0.05);t+=d[i]+0.02;}},
  start:function(){tone(784,0.07,0,0.05);tone(1046,0.07,0.08,0.05);tone(1568,0.12,0.16,0.05);}
};
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

// ===== Game state =====
var st='off',stT=0,now=0;      // off | boot | select | play | crash | over
var game=0,sel=0,startSpeed=1; // 0 = A racing, 1 = B snake
var score=0,speed=1,level=1,lives=4,paused=false,newHi=false,acc=0;
var crashPos={x:0,y:16},crashFrom='';
function setSt(s){st=s;stT=now;}

// --- Racing ---
var LX=[2,5],PY=16;
var CAR=[[1,0],[0,1],[1,1],[2,1],[1,2],[0,3],[2,3]];
var R={lane:0,en:[],off:0,dist:0,next:10,nextLane:0,passed:0};
function rnd(n){return Math.floor(Math.random()*n);}
function raceRound(){
  R.lane=0;R.en=[];R.off=0;R.dist=0;
  var l=rnd(2);R.en.push({lane:l,y:-4});
  R.nextLane=rnd(2);R.next=R.nextLane!==l?11+rnd(3):7+rnd(3);
}
function raceInterval(){var b=Math.max(45,175-(speed-1)*17);return boostHeld()?Math.max(26,b/2.2):b;}
function boostHeld(){return !!(held.a||held.up);}
function carHits(lane,y){
  for(var i=0;i<R.en.length;i++){var e=R.en[i];if(e.lane!==lane)continue;
    for(var a=0;a<CAR.length;a++)for(var b=0;b<CAR.length;b++){
      if(CAR[a][0]===CAR[b][0]&&e.y+CAR[a][1]===y+CAR[b][1])return true;}}
  return false;
}
function raceStep(){
  R.off++;R.dist++;
  for(var i=0;i<R.en.length;i++)R.en[i].y++;
  var keep=[];
  for(i=0;i<R.en.length;i++){var e=R.en[i];
    if(e.y>FH-1){R.passed++;score+=boostHeld()?20:10;SFX.pass();
      if(R.passed%6===0)levelUp();}
    else keep.push(e);}
  R.en=keep;
  if(R.dist>=R.next){
    var l=R.nextLane;R.en.push({lane:l,y:-4});R.dist=0;
    R.nextLane=rnd(2);R.next=R.nextLane!==l?10+rnd(3):6+rnd(4);
  }
  if(carHits(R.lane,PY))crash(LX[R.lane],PY,'car');
}
function raceMove(l){
  if(l===R.lane)return;R.lane=l;SFX.move();
  if(carHits(R.lane,PY))crash(LX[R.lane],PY,'car');
}

// --- Snake ---
var N={body:[],dir:[0,-1],q:[],food:null,eaten:0,grow:0};
function snakeRound(){
  N.body=[{x:4,y:12},{x:4,y:13},{x:4,y:14}];N.dir=[0,-1];N.q=[];N.grow=0;placeFood();
}
function placeFood(){
  var free=[];for(var y=0;y<FH;y++)for(var x=0;x<FW;x++){var hit=false;
    for(var i=0;i<N.body.length;i++)if(N.body[i].x===x&&N.body[i].y===y){hit=true;break;}
    if(!hit)free.push({x:x,y:y});}
  N.food=free.length?free[rnd(free.length)]:null;
}
function snakeInterval(){return Math.max(70,290-(speed-1)*25);}
function lastDir(){return N.q.length?N.q[N.q.length-1]:N.dir;}
function snakeTurn(d){
  var ld=lastDir();if(N.q.length>=3)return;
  if(d[0]===-ld[0]&&d[1]===-ld[1])return;if(d[0]===ld[0]&&d[1]===ld[1])return;
  N.q.push(d);SFX.click();
}
function snakeStep(){
  if(N.q.length)N.dir=N.q.shift();
  var h=N.body[0],nx=h.x+N.dir[0],ny=h.y+N.dir[1];
  var eating=N.food&&N.food.x===nx&&N.food.y===ny;
  var lim=N.body.length-(eating?0:1);
  var bad=nx<0||ny<0||nx>=FW||ny>=FH;
  for(var i=0;i<lim&&!bad;i++)if(N.body[i].x===nx&&N.body[i].y===ny)bad=true;
  if(bad){crash(Math.max(0,Math.min(FW-4,h.x-1)),Math.max(0,Math.min(FH-4,h.y-1)),'snake');return;}
  N.body.unshift({x:nx,y:ny});
  if(eating){N.eaten++;score+=10*speed;SFX.eat();buzz(15);placeFood();if(N.eaten%5===0)levelUp();}
  else N.body.pop();
}

function levelUp(){level++;if(speed<9){speed++;}SFX.level();}

// --- Flow ---
function powerOn(){unlockAudio();setSt('boot');SFX.boot();}
function toSelect(){paused=false;setSt('select');}
function startGame(g){
  game=g;sel=g;score=0;speed=startSpeed;level=1;lives=4;paused=false;newHi=false;acc=0;R.passed=0;N.eaten=0;
  if(g===0)raceRound();else snakeRound();
  setSt('play');SFX.start();buzz(20);
}
function crash(x,y,from){
  crashPos={x:x,y:y};crashFrom=from;setSt('crash');SFX.crash();buzz([90,50,160]);
}
var BOOM=1000,ROWT=38;
function crashDone(){
  lives--;
  if(lives>0){acc=0;if(game===0)raceRound();else snakeRound();setSt('play');}
  else{
    if(score>hiS[game]){hiS[game]=score;newHi=true;lsSet(game?'retro90_hi_B':'retro90_hi_A',score);}
    setSt('over');SFX.over();
  }
}

// ===== Input =====
var held={},ptr={};
function toV(e){var r=C.getBoundingClientRect();return{x:(e.clientX-r.left-OX)/S,y:(e.clientY-r.top-OY)/S};}
function hitBtn(p){
  var best=null,bd=1e9;
  for(var i=0;i<BTN_KEYS.length;i++){var k=BTN_KEYS[i],b=BTN[k];
    var d=Math.hypot(p.x-b.x,p.y-b.y),lim=b.r+(b.kind==='small'?12:12);
    if(d<lim&&d<bd){bd=d;best=k;}}
  return best;
}
function inLCD(p){return p.x>=LCD.x&&p.x<=LCD.x+LCD.w&&p.y>=LCD.y&&p.y<=LCD.y+LCD.h;}
function press(k){
  held[k]=(held[k]||0)+1;if(held[k]>1)return;
  buzz(8);
  if(st!=='play'||k==='start'||k==='sound'||k==='reset')SFX.click();
  action(k);
}
function release(k){if(!held[k])return;held[k]--;if(held[k]<=0)delete held[k];}
function action(k){
  if(st==='off'){powerOn();return;}
  if(k==='sound'){soundOn=!soundOn;lsSet('retro90_sound',soundOn?'1':'0');unlockAudio();if(soundOn)SFX.move();return;}
  if(k==='reset'){toSelect();return;}
  if(st==='boot'){toSelect();return;}
  if(st==='select'){
    if(k==='up'||k==='down'){sel^=1;SFX.move();}
    else if(k==='left'){startSpeed=Math.max(1,startSpeed-1);SFX.move();}
    else if(k==='right'){startSpeed=Math.min(9,startSpeed+1);SFX.move();}
    else if(k==='a')startGame(0);
    else if(k==='b')startGame(1);
    else if(k==='start')startGame(sel);
    return;
  }
  if(st==='play'){
    if(k==='start'){paused=!paused;SFX.move();return;}
    if(paused)return;
    if(game===0){if(k==='left')raceMove(0);else if(k==='right')raceMove(1);}
    else{
      if(k==='up')snakeTurn([0,-1]);else if(k==='down')snakeTurn([0,1]);
      else if(k==='left')snakeTurn([-1,0]);else if(k==='right')snakeTurn([1,0]);
      else if(k==='a'){var d=lastDir();snakeTurn([-d[1],d[0]]);}
      else if(k==='b'){d=lastDir();snakeTurn([d[1],-d[0]]);}
    }
    return;
  }
  if(st==='over'){
    if(k==='start'||k==='a'||k==='b'){if(now-stT>700)startGame(game);}
    else if(k==='up'||k==='down')toSelect();
  }
}
function lcdTap(p){
  if(st==='off'){powerOn();return;}
  if(st==='boot'){toSelect();return;}
  if(st==='select'){SFX.click();startGame(sel);return;}
  if(st==='over'){if(now-stT>700){SFX.click();startGame(game);}return;}
  if(st!=='play'||paused)return;
  if(game===0){raceMove(p.x<LCD.x+LCD.w*0.42?0:1);}
  else{
    var cx=Math.floor((p.x-FX)/CS),cy=Math.floor((p.y-FY)/CS),h=N.body[0],d=lastDir();
    if(d[0]!==0)snakeTurn([0,cy<h.y?-1:1]);else snakeTurn([cx<h.x?-1:1,0]);
  }
}
C.addEventListener('pointerdown',function(e){
  e.preventDefault();unlockAudio();
  try{C.setPointerCapture(e.pointerId);}catch(_){}
  var p=toV(e),k=hitBtn(p);
  ptr[e.pointerId]=k;
  if(k)press(k);else if(inLCD(p))lcdTap(p);
},{passive:false});
function up(e){var k=ptr[e.pointerId];if(k)release(k);delete ptr[e.pointerId];}
C.addEventListener('pointerup',up);C.addEventListener('pointercancel',up);
C.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('dblclick',function(e){e.preventDefault();});
var KEYMAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down',' ':'a',z:'a',x:'b',Enter:'start',p:'start',m:'sound',r:'reset'};
window.addEventListener('keydown',function(e){var k=KEYMAP[e.key];if(!k)return;e.preventDefault();if(e.repeat)return;unlockAudio();press(k);});
window.addEventListener('keyup',function(e){var k=KEYMAP[e.key];if(!k)return;held[k]=1;release(k);});
document.addEventListener('visibilitychange',function(){if(document.hidden){held={};ptr={};if(st==='play')paused=true;}});
window.addEventListener('blur',function(){held={};ptr={};});

// ===== Update =====
function update(dt){
  if(st==='boot'&&now-stT>2300)toSelect();
  if(st==='play'&&!paused){
    acc+=dt;var guard=0;
    while(st==='play'&&guard++<6){
      var iv=game===0?raceInterval():snakeInterval();
      if(acc<iv)break;acc-=iv;
      if(game===0)raceStep();else snakeStep();
    }
    if(acc>400)acc=0;
  }
  if(st==='crash'&&now-stT>BOOM+FH*ROWT*2+150)crashDone();
}

// ===== Field composition =====
var G=[];for(var gy=0;gy<FH;gy++){G.push([]);for(var gx=0;gx<FW;gx++)G[gy].push(0);}
function clearG(){for(var y=0;y<FH;y++)for(var x=0;x<FW;x++)G[y][x]=0;}
function setG(x,y){if(x>=0&&x<FW&&y>=0&&y<FH)G[y][x]=1;}
function drawCar(x,y){for(var i=0;i<CAR.length;i++)setG(x+CAR[i][0],y+CAR[i][1]);}
function roadEdges(off){for(var y=0;y<FH;y++){if(((y-off)%4+4)%4!==0){setG(0,y);setG(FW-1,y);}}}
var LET={A:['.###.','#...#','#...#','#####','#...#','#...#','#...#'],B:['####.','#...#','#...#','####.','#...#','#...#','####.']};
function drawLetter(L,x0,y0){var b=LET[L];for(var y=0;y<b.length;y++)for(var x=0;x<5;x++)if(b[y][x]==='#')setG(x0+x,y0+y);}
var SNAKE_PATH=(function(){var p=[];for(var x=1;x<=8;x++)p.push([x,11]);for(var y=12;y<=18;y++)p.push([8,y]);for(x=7;x>=1;x--)p.push([x,18]);for(y=17;y>=12;y--)p.push([1,y]);return p;})();
function composeField(){
  clearG();
  if(st==='off')return;
  if(st==='boot'){
    var t=now-stT;
    if(t<700){for(var y=0;y<FH;y++)for(var x=0;x<FW;x++)G[y][x]=1;return;}
    var k=Math.floor((t-700)/40);
    for(y=0;y<FH;y++)for(x=0;x<FW;x++){
      if(k<FH){if(y>=FH-k)continue;G[y][x]=1;} // clear bottom->top
      else if(k<FH*2){if(y<k-FH)G[y][x]=1;} // fill top->bottom
      else if(k<FH*3){if(y>=k-FH*2)G[y][x]=1;}
    }
    return;
  }
  if(st==='select'){
    drawLetter(sel?'B':'A',2,1);
    // little arrows
    var f=Math.floor(now/160);
    if(sel===0){
      for(y=10;y<FH;y++)if(((y-f)%4+4)%4!==0){setG(0,y);setG(FW-1,y);}
      var ly=Math.floor(now/1600)%2;drawCar(LX[ly],16);
      var ey=10+(f%14)-4;var el=Math.floor(now/(160*14))%2;
      for(var i=0;i<CAR.length;i++){var yy=ey+CAR[i][1];if(yy>=10)setG(LX[el]+CAR[i][0],yy);}
    }else{
      var len=6,pos=Math.floor(now/140)%SNAKE_PATH.length;
      for(i=0;i<len;i++){var q=SNAKE_PATH[(pos-i+SNAKE_PATH.length)%SNAKE_PATH.length];setG(q[0],q[1]);}
      if(Math.floor(now/250)%2)setG(4,14);
    }
    for(x=0;x<FW;x++)setG(x,9);
    return;
  }
  if(st==='play'||st==='crash'||st==='over'){
    if(game===0){
      roadEdges(R.off);drawCar(LX[R.lane],PY);
      for(i=0;i<R.en.length;i++)drawCar(LX[R.en[i].lane],R.en[i].y);
    }else{
      for(i=0;i<N.body.length;i++)setG(N.body[i].x,N.body[i].y);
      if(N.food&&(Math.floor(now/180)%2||paused))setG(N.food.x,N.food.y);
    }
  }
  if(st==='crash'){
    var tc=now-stT;
    if(tc<BOOM){
      var ph=Math.floor(tc/120)%2;
      for(y=0;y<4;y++)for(x=0;x<4;x++){
        var cx=crashPos.x-(game===0?0:0)+x-(game===0?0:0),cy=crashPos.y+y;
        if(game===0)cx=crashPos.x-0+x-(x===3?0:0);
        var pat=(x===y||x+y===3);
        if(cx>=0&&cx<FW&&cy>=0&&cy<FH)G[cy][cx]=(ph?pat:!pat)?1:0;
      }
    }else{
      var r=Math.floor((tc-BOOM)/ROWT);
      for(y=0;y<FH;y++){
        if(r<FH){if(y>=FH-1-r)for(x=0;x<FW;x++)G[y][x]=1;}
        else{var c=r-FH;if(y>c)for(x=0;x<FW;x++)G[y][x]=1;else for(x=0;x<FW;x++)G[y][x]=0;}
      }
    }
  }
  if(st==='over'){clearG();}
}

// ===== Drawing helpers =====
function rr(x,y,w,h,r){
  var tl,tr,br,bl;if(typeof r==='number'){tl=tr=br=bl=r;}else{tl=r[0];tr=r[1];br=r[2];bl=r[3];}
  X.beginPath();X.moveTo(x+tl,y);X.lineTo(x+w-tr,y);X.quadraticCurveTo(x+w,y,x+w,y+tr);
  X.lineTo(x+w,y+h-br);X.quadraticCurveTo(x+w,y+h,x+w-br,y+h);X.lineTo(x+bl,y+h);
  X.quadraticCurveTo(x,y+h,x,y+h-bl);X.lineTo(x,y+tl);X.quadraticCurveTo(x,y,x+tl,y);X.closePath();
}
function brick(px,py,s,lit){
  var m=s*0.07,b=Math.max(1,s*0.13),i=s*0.32;
  if(lit){
    X.fillStyle=SHADOW;var o=s*0.09;
    X.fillRect(px+m+o,py+m+o,s-2*m,s-2*m);
  }
  X.fillStyle=lit?ON:GHOST;
  X.fillRect(px+m,py+m,s-2*m,b);X.fillRect(px+m,py+s-m-b,s-2*m,b);
  X.fillRect(px+m,py+m+b,b,s-2*m-2*b);X.fillRect(px+s-m-b,py+m+b,b,s-2*m-2*b);
  X.fillRect(px+i,py+i,s-2*i,s-2*i);
}
var SEGS={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcfgd',' ':''};
function digit(x,y,w,h,ch,allOn){
  var t=Math.max(1.5,w*0.2),on=allOn?'abcdefg':(SEGS[ch]||''),hh=h/2;
  var R2={a:[x+t*0.7,y,w-t*1.4,t],g:[x+t*0.7,y+hh-t/2,w-t*1.4,t],d:[x+t*0.7,y+h-t,w-t*1.4,t],
    f:[x,y+t*0.7,t,hh-t*1.1],b:[x+w-t,y+t*0.7,t,hh-t*1.1],e:[x,y+hh+t*0.4,t,hh-t*1.1],c:[x+w-t,y+hh+t*0.4,t,hh-t*1.1]};
  for(var k in R2){var q=R2[k],lit=on.indexOf(k)>=0;

}
function number(x,y,n,digits,w,h,gap,allOn){
  var s=String(Math.max(0,Math.floor(n))%Math.pow(10,digits));

function drawLCD(){
  var allOn=st==='boot'&&now-stT<700, off=st==='off';
  composeField();
  // field frame
  X.strokeStyle=off?GHOST:'rgba(27,34,22,0.55)';X.lineWidth=1.2;X.strokeRect(FX-3,FY-3,FW*CS+6,FH*CS+6);
  for(var y=0;y<FH;y++)for(var x=0;x<FW;x++)brick(FX+x*CS,FY+y*CS,CS,!off&&G[y][x]===1);
  // side panel
  var px=224,lit=!off;
  lcdText('SCORE',px,108,10,lit);
  number(px,118,(st==='select'||st==='boot'||off)?0:score,6,11,20,3,allOn);
  lcdText('HI-SCORE',px,152,10,lit);
  number(px,162,hiS[(st==='select')?sel:game],6,11,20,3,allOn);
  // preview 4x4 (lives / next)
  lcdText(st==='select'?'GAME':'LIFE',px,200,10,lit);
  var pc=12,py=210;
  for(var r=0;r<4;r++)for(var c=0;c<4;c++){
    var on=false;
    if(allOn)on=true;
    else if(st==='select'){on=(sel===0)?CAR.some(function(q){return q[0]+1===c&&q[1]===r;}):(r===1&&c<3)||(r===2&&c===2)||(r===0&&c===0&&Math.floor(now/250)%2);}
    else if(st==='play'||st==='crash'||st==='over'){on=r>=4-lives;}

  var gl=st==='select'?(sel?'B':'A'):(game?'B':'A');

  lcdText('SPEED',px,284,10,lit);
  digit(px,294,11,20,String(st==='select'?startSpeed:speed),allOn||off&&false);
  if(off){digit(px,294,11,20,' ');}
  lcdText('LEVEL',px+44,284,10,lit);
  number(px+44,294,st==='select'?1:level,2,11,20,3,allOn);

  if(st==='over')drawOver();

  else if(off)drawOff();
}
function drawCup(x,y,on){
  X.fillStyle=on?ON:GHOST;X.strokeStyle=on?ON:GHOST;X.lineWidth=2.4;
  X.beginPath();X.moveTo(x,y+4);X.lineTo(x+20,y+4);X.lineTo(x+17,y+22);X.lineTo(x+3,y+22);X.closePath();X.fill();

}

  X.beginPath();X.moveTo(x+8.5,y+2);X.lineTo(x+25,y-2);X.lineTo(x+25,y+4);X.lineTo(x+8.5,y+8);X.closePath();X.fill();
}

function hintText(){
  if(st==='off')return'กดปุ่มไหนก็ได้ เพื่อเปิดเครื่อง';
  if(st==='boot')return'กำลังเปิดเครื่อง...';

  if(st==='play'||st==='crash')return game===0?'◀ ▶ หรือแตะซ้าย/ขวาจอ หลบรถ · กด A ค้าง เร่ง x2':'ปุ่มลูกศรหรือแตะจอ เลี้ยวงู · กินจุดที่กะพริบ';

}

function arrow(cx,cy,dir,s,col){
  X.fillStyle=col;X.beginPath();
  var a={up:-Math.PI/2,down:Math.PI/2,left:Math.PI,right:0}[dir];
  for(var i=0;i<3;i++){var ang=a+i*2*Math.PI/3;var px=cx+Math.cos(ang)*s,py=cy+Math.sin(ang)*s;if(i)X.lineTo(px,py);else X.moveTo(px,py);}
  X.closePath();X.fill();
}
function drawButtons(){
  for(var i=0;i<BTN_KEYS.length;i++){
    var k=BTN_KEYS[i],b=BTN[k],p=!!held[k],dy=p?2.5:0;

      X.fillStyle='rgba(255,230,220,0.9)';X.fillText(b.label,b.x,b.y+dy+1);}
  }
  X.font='bold 8px Arial,sans-serif';X.textAlign='center';X.fillStyle='#5a3a00';
  X.fillText('ROTATE / BOOST',290,686);

  X.save();X.translate(300,730);X.rotate(-0.5);
  for(var s=0;s<6;s++){rr(-26,-14+s*6,52,3,1.5);X.fillStyle='rgba(90,55,0,0.55)';X.fill();}
  X.restore();
  X.font='bold 8px Arial,sans-serif';X.textAlign='left';X.fillStyle='rgba(90,55,0,0.7)';
  X.fillText('ตี้ป่วน · RETRO 90',30,758);
}
function lighten(h){var n=parseInt(h.slice(1),16),r=Math.min(255,(n>>16)+60),g=Math.min(255,((n>>8)&255)+60),b=Math.min(255,(n&255)+60);return'rgb('+r+','+g+','+b+')';}

function draw(){

}

// ===== Loop =====
var last=performance.now();
function frame(t){
  var dt=Math.min(100,t-last);last=t;now=t;
  try{update(dt);draw();}catch(e){console.error(e);}
  requestAnimationFrame(frame);
}
now=last;requestAnimationFrame(frame);

// test hook (harmless)
window.__retro={press:press,release:release,state:function(){return{st:st,game:game,score:score,lives:lives,speed:speed,lane:R.lane,en:R.en.map(function(e){return[e.lane,e.y];}),paused:paused,snake:N.body.slice(0,1),food:N.food};},setLives:function(n){lives=n;},forceCrash:function(){if(st==='play')crash(game===0?LX[R.lane]:3,PY,'t');}};
})();
