<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script data-kz src="../no-zoom.js"></script>
<meta name="theme-color" content="#0c1b3d">
<link rel="icon" href="logo.png">
<title>อู่ซ่อมหุ่นยนต์ใต้ทะเล · Deep Sea Robot Repair · Kairon Arcade</title>
<meta name="description" content="อู่ซ่อมหุ่นยนต์ใต้ทะเล เกมซ่อมหุ่นยนต์ใต้น้ำ จาก Kairon Arcade">
<link rel="stylesheet" href="style.css?v=be29dbb3">
</head>
<body>
<div id="side-bg"></div>
<div id="game">
  <canvas id="scene"></canvas>
  <div id="hud">
    <div class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd24a"/><circle cx="12" cy="12" r="7" fill="none" stroke="#c98d12" stroke-width="2"/><path d="M10 8h4v8h-4z" fill="#c98d12"/></svg><span id="coins">0</span></div>
    <div class="pill" id="pill-floor"><span id="floorname"></span></div>
    <div class="sp"></div>
    <button class="round" id="btn-zoom" aria-label="zoom"><svg viewBox="0 0 24 24"><path id="zoom-ico" d=""/></svg></button>
    <button class="round" id="btn-mute" aria-label="sound"><svg viewBox="0 0 24 24"><path id="mute-ico" d=""/></svg></button>
    <button class="round" id="btn-lang">EN</button>
  </div>
  <button id="adbtn" class="hidden"><svg viewBox="0 0 24 24"><path d="M3 6h18v12H3zM10 9v6l5-3z"/></svg><span id="adbtn-t"></span></button>
  <div id="rbtns" class="hidden"><button id="b-rare"><svg viewBox="0 0 24 24"><path d="M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1z"/></svg><span id="rare-t"></span></button><button id="b-time" class="hidden"><svg viewBox="0 0 24 24"><path d="M3 6h18v12H3zM10 9v6l5-3z"/></svg><span id="time-t"></span></button></div>
  <nav id="bar">
    <button class="nb" data-p="upg"><svg viewBox="0 0 24 24"><path d="M22 6.5l-3.6 3.6-2.5-.4-.4-2.5L19.1 3.6A6 6 0 0 0 11.6 11L3 19.6 4.4 21l8.6-8.6a6 6 0 0 0 9-5.9z"/></svg><span data-t="nUpg"></span><i class="dot"></i></button>
    <button class="nb" data-p="floors"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5zM2 12l10 5 10-5M2 17l10 5 10-5" fill="none" stroke="#ffd24a" stroke-width="2.2" stroke-linejoin="round"/></svg><span data-t="nFloor"></span><i class="dot"></i></button>
    <button class="nb" data-p="ord"><svg viewBox="0 0 24 24"><path d="M9 2h6v2h4v18H5V4h4zm1 2v2h4V4zM8 11h8v2H8zm0 4h8v2H8z"/></svg><span data-t="nOrd"></span><i class="dot"></i></button>
    <button class="nb" data-p="regs"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/></svg><span data-t="nRegs"></span><i class="dot"></i></button>
  </nav>
  <div id="brand"><img src="logo.png" alt="">Kairon Arcade</div>
  <div id="tip" class="hidden"></div>
  <div id="banner" class="hidden"><b id="banner-t"></b></div>
  <div id="toast"></div>
  <div id="modal" class="hidden"><div id="sheet"></div></div>
  <div id="ad" class="hidden"></div>
  <div id="splash">
    <div>
      <canvas id="spc" width="440" height="340"></canvas>
      <h1 data-t="title"></h1>
      <div class="sub" data-t="sub"></div>
      <div class="go" data-t="tapStart"></div>
    </div>
    <div class="br"><img src="logo.png" alt="">Kairon Arcade · ห้องเกม ไครอน</div>
  </div>
</div>
<script>/* ad backend: mock (website build) - no SDK, no network, no ad IDs; the game shows its own clearly-labelled test ad */
window.SRRAds={name:'mock',ready:function(){return true;}};</script>

</body>
</html>
