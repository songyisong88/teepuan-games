<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script data-kz src="../no-zoom.js"></script>
<meta name="theme-color" content="#2a78c8">
<link rel="icon" href="logo.png">
<title>สาวโจรสลัดเรือเหาะ · Sky Pirate Girls · Kairon Arcade</title>
<meta name="description" content="สาวโจรสลัดเรือเหาะ เกมลากเรือเหาะ ยิงถังเลข ระเบิดสนั่นฟ้า จาก Kairon Arcade">
<link rel="stylesheet" href="style.css?v=02509eb9">
</head>
<body>
<div id="game">
  <canvas id="scene"></canvas>
  <div id="hud" class="hidden">
    <div class="hudtop">
      <button class="round" id="btn-pause" aria-label="pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.6"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.6"/></svg></button>
      <div class="plate coinplate"><img src="art/i_coin.webp" alt=""><b id="coins">0</b></div>
      <div class="plate lvplate">ด่าน <b id="lvn">1</b></div>
      <div id="hearts"></div>
    </div>
    <div id="prog"><i id="progfill"></i><img id="progboss" alt="" src="art/boss1.webp"></div>
    <div id="fever"><i id="feverfill"></i><span id="fevertx">ไฟลุก!</span></div>
    <div id="bossbox" class="hidden"><div id="bossname"></div><div class="bar"><i id="bossfill"></i></div></div>
    <div id="talk" class="hidden"><div class="pt"><img id="talkimg" alt=""></div><div class="bub"><b id="talkname"></b><span id="talktx"></span></div></div>
    <div id="skills">
      <button class="sk" id="sk0" data-sk="0" aria-label="storm"><img src="art/i_storm.webp" alt=""><em></em><span>พายุ</span></button>
      <button class="sk" id="sk1" data-sk="1" aria-label="blackhole"><img src="art/i_hole.webp" alt=""><em></em><span>หลุมดำ</span></button>
      <button class="sk" id="sk2" data-sk="2" aria-label="parrot"><img src="art/i_parrot.webp" alt=""><em></em><span>นกแก้ว</span></button>
    </div>
  </div>
  <div id="banner" class="hidden"><b id="banner-t"></b><small id="banner-s"></small></div>
  <div id="letter" class="hidden"><i></i><i></i></div>
  <div id="toast"></div>
  <div id="screen" class="hidden"></div>
  <div id="modal" class="hidden"><div id="sheet"></div></div>
  <div id="ad" class="hidden"></div>
  <div id="splash">
    <div class="sp-top"><div class="t1" data-t="title"></div><div class="t2" data-t="title2"></div><div class="tsub" data-t="sub"></div></div>
    <div class="sp-bot">
      <div class="loadbox"><span data-t="loading"></span><div class="lb"><i id="loadp"></i></div></div>
      <button class="btn yellow big hidden" id="btn-start" data-t="tapStart"></button>
      <div class="brand"><img src="logo.png" alt="">Kairon Arcade · ห้องเกม ไครอน</div>
    </div>
  </div>
</div>
<script>/* ad backend: mock (website build) - no SDK, no network, no ad IDs; the game shows its own clearly-labelled test ad */
window.DDAds={name:'mock',ready:function(){return true;}};</script>
<script src="game.js?v=02509eb9"></script>
</body>
</html>
