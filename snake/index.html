<script>
(function(){
'use strict';
// ================= layout: virtual phone 360 x 780 =================
var VW=360,VH=780;
var C=document.getElementById('c'),X=C.getContext('2d');
var W=0,H=0,DPR=1,S=1,OX=0,OY=0;
var FONT='"Kanit","Prompt","Sarabun","Noto Sans Thai","Thonburi",Tahoma,sans-serif';
var LABEL='#aeb7c6';           // the ONE text colour used on the phone body
var INK='rgba(22,34,6,0.92)';  // LCD pixel ink
var LCD={x:48,y:104,w:264,h:264};
var FB=88,PX=3;                // LCD framebuffer 88x88, 3 virtual px per LCD pixel
var ghostCv=null;
function resize(){
  W=window.innerWidth;H=window.innerHeight;DPR=Math.min(window.devicePixelRatio||1,3);
  C.width=Math.round(W*DPR);C.height=Math.round(H*DPR);C.style.width=W+'px';C.style.height=H+'px';
  S=Math.min(W/VW,H/VH);OX=(W-VW*S)/2;OY=(H-VH*S)/2;ghostCv=null;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,150);});
resize();

// ================= storage =================
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var MODES=['CLASSIC','NO WALLS','MAZE'];
var MODE_TH=['ชนขอบจอหรือชนตัวเอง = ตาย','ไม่มีกำแพง ทะลุขอบไปโผล่อีกฝั่ง','มีกำแพงในด่าน ต้องเลี้ยวหลบ'];
var hiS=[0,1,2].map(function(i){return parseInt(lsGet('snake98_hi_'+i,'0'),10)||0;});
var soundOn=lsGet('snake98_sound','1')==='1';

// ================= monophonic square-wave audio =================
var AC=null,voiceEnd=0;
function unlockAudio(){
  if(!AC){try{var A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
}
// one voice: a new sound starts after cutting whatever is still playing
var cur=[];
function play(notes){ // notes: [[freq,dur],...] freq 0 = rest
  if(!AC||!soundOn)return;
  try{
    var t=AC.currentTime+0.005;
    for(var i=0;i<cur.length;i++){try{cur[i].g.gain.cancelScheduledValues(t);cur[i].g.gain.setValueAtTime(0.0001,t);cur[i].o.stop(t+0.01);}catch(e){}}
    cur=[];
    var o=AC.createOscillator(),g=AC.createGain();o.type='square';
    g.gain.setValueAtTime(0.0001,t);
    for(i=0;i<notes.length;i++){var f=notes[i][0],d=notes[i][1];
      if(f>0){o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.05,t);g.gain.setValueAtTime(0.05,t+d*0.82);g.gain.setValueAtTime(0.0001,t+d*0.85);}
      t+=d;}
    o.connect(g);g.connect(AC.destination);o.start();o.stop(t+0.02);cur.push({o:o,g:g});
  }catch(e){}
}
var SFX={
  key:function(){play([[1950,0.025]]);},
  move:function(){play([[1400,0.03]]);},
  eat:function(){play([[1047,0.035],[1568,0.045]]);},
  bonusOn:function(){play([[1760,0.05],[0,0.03],[1760,0.05],[0,0.03],[2093,0.07]]);},
  bonus:function(){play([[1047,0.05],[1319,0.05],[1568,0.05],[2093,0.05],[2637,0.1]]);},
  die:function(){play([[880,0.09],[784,0.09],[659,0.09],[523,0.09],[392,0.12],[262,0.25]]);},
  boot:function(){play([[659,0.12],[587,0.12],[370,0.24],[415,0.24],[554,0.12],[494,0.12],[294,0.24],[330,0.24],[494,0.12],[440,0.12],[277,0.24],[330,0.24],[440,0.48]]);},
  start:function(){play([[784,0.06],[1047,0.06],[1568,0.1]]);}
};
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

// ================= pixel fonts =================
var F5={A:'0E11111F111111',B:'1E11111E11111E',C:'0E11101010110E',D:'1C12111111121C',E:'1F10101E10101F',F:'1F10101E101010',
G:'0E11101711110F',H:'1111111F111111',I:'0E04040404040E',J:'0702020202120C',K:'11121418141211',L:'1010101010101F',
M:'111B1515111111',N:'11111915131111',O:'0E11111111110E',P:'1E11111E101010',Q:'0E11111115120D',R:'1E11111E141211',
S:'0F10100E01011E',T:'1F040404040404',U:'1111111111110E',V:'11111111110A04',W:'1111111515150A',X:'11110A040A1111',
Y:'11110A04040404',Z:'1F01020408101F','0':'0E11131519110E','1':'040C040404040E','2':'0E11010204081F','3':'1F02040201110E',
'4':'02060A121F0202','5':'1F101E0101110E','6':'0608101E11110E','7':'1F010204080808','8':'0E11110E11110E','9':'0E11110F01020C',
':':'000C0C000C0C00','!':'04040404040004','-':'0000001F000000','.':'00000000000C0C',"'":'0C040800000000','>':'08040201020408',
'<':'02040810080402','/':'01010204081010',' ':'00000000000000'};
var F3={'0':[7,5,5,5,7],'1':[2,6,2,2,7],'2':[7,1,7,4,7],'3':[7,1,3,1,7],'4':[5,5,7,1,1],'5':[7,4,7,1,7],'6':[7,4,7,5,7],'7':[7,1,1,2,2],'8':[7,5,7,5,7],'9':[7,5,7,1,7]};

// ================= framebuffer =================
var fb=new Uint8Array(FB*FB);
function cls(){fb.fill(0);}
function pset(x,y,v){if(x>=0&&y>=0&&x<FB&&y<FB)fb[y*FB+x]=v===undefined?1:v;}
function pxor(x,y){if(x>=0&&y>=0&&x<FB&&y<FB)fb[y*FB+x]^=1;}
function rect(x,y,w,h,v){for(var j=0;j<h;j++)for(var i=0;i<w;i++)pset(x+i,y+j,v);}
function frame(x,y,w,h){for(var i=0;i<w;i++){pset(x+i,y);pset(x+i,y+h-1);}for(var j=0;j<h;j++){pset(x,y+j);pset(x+w-1,y+j);}}
function invert(x,y,w,h){for(var j=0;j<h;j++)for(var i=0;i<w;i++)pxor(x+i,y+j);}
function text5(t,x,y,sc,v){sc=sc||1;
  for(var n=0;n<t.length;n++){var g=F5[t[n]]||F5[' '];
    for(var r=0;r<7;r++){var b=parseInt(g.substr(r*2,2),16);
      for(var c=0;c<5;c++)if(b&(16>>c))rect(x+n*6*sc+c*sc,y+r*sc,sc,sc,v===undefined?1:v);}}
}
function w5(t,sc){return t.length*6*(sc||1)-(sc||1);}
function text5c(t,y,sc,v){text5(t,Math.floor((FB-w5(t,sc))/2),y,sc,v);}
function num3(n,x,y,digits){var s=String(n);while(s.length<digits)s='0'+s;
  for(var i=0;i<s.length;i++){var g=F3[s[i]];for(var r=0;r<5;r++)for(var c=0;c<3;c++)if(g[r]&(4>>c))pset(x+i*4+c,y+r);}}
// Thai text rasterised to LCD pixels (cached)
var thaiCache={};
function thai(t,cy,size,v){
  var key=t+'|'+size,bm=thaiCache[key];
  if(!bm){
    var cv=document.createElement('canvas');cv.width=FB;cv.height=size+10;var c=cv.getContext('2d');
    c.font='600 '+size+'px '+FONT;c.textAlign='center';c.textBaseline='middle';c.fillStyle='#000';
    c.fillText(t,FB/2,(size+10)/2);
    var d=c.getImageData(0,0,cv.width,cv.height).data,on=[];
    for(var y=0;y<cv.height;y++)for(var x=0;x<cv.width;x++)if(d[(y*cv.width+x)*4+3]>=100)on.push(x,y);
    bm={h:cv.height,on:on};thaiCache[key]=bm;
  }
  var oy=Math.round(cy-bm.h/2);for(var i=0;i<bm.on.length;i+=2)pset(bm.on[i],bm.on[i+1]+oy,v===undefined?1:v);
}

// ================= game =================
var GW=21,GH=19,GX=2,GY=11; // grid cells of 4x4 LCD px
var st='off',stT=0,now=0;    // off boot title menu play dying over
var mode=0,menuSel=0,paused=false,acc=0;
var snake=[],dir=[1,0],q=[],food=null,critter=null,eaten=0,score=0,newHi=false,walls={};
var CRITTERS=[
  ['10011001','01111110','11011011','01000010'], // beetle
  ['00111001','01011011','01111111','00111001'], // fish
  ['00000110','01111111','11111110','10100100'], // mouse
  ['01000010','00111100','11011011','00111100']  // spider
];
var critterKind=0;
function setSt(s){st=s;stT=now;}
function key(x,y){return x+','+y;}
function buildWalls(){
  walls={};
  if(mode!==2)return;
  var i;
  for(i=3;i<=8;i++){walls[key(i,4)]=1;walls[key(i,14)]=1;}
  for(i=12;i<=17;i++){walls[key(i,4)]=1;walls[key(i,14)]=1;}
  for(i=7;i<=11;i++){walls[key(2,i)]=1;walls[key(18,i)]=1;}
  walls[key(10,0)]=walls[key(10,1)]=walls[key(10,17)]=walls[key(10,18)]=1;
}
function occupied(x,y,ignoreTail){
  if(walls[key(x,y)])return true;
  for(var i=0;i<snake.length-(ignoreTail?1:0);i++)if(snake[i].x===x&&snake[i].y===y)return true;
  return false;
}
function freeCell(w){
  for(var t=0;t<500;t++){
    var x=Math.floor(Math.random()*(GW-(w-1))),y=Math.floor(Math.random()*GH),ok=true;
    for(var k=0;k<w;k++){if(occupied(x+k,y)||(food&&food.x===x+k&&food.y===y)||(critter&&critter.y===y&&(x+k===critter.x||x+k===critter.x+1))){ok=false;break;}}
    var h=snake[0];if(h&&Math.abs(h.x-x)+Math.abs(h.y-y)<3)ok=false;
    if(ok)return{x:x,y:y};
  }
  return null;
}
function newGame(){
  mode=menuSel;buildWalls();
  snake=[];for(var i=0;i<5;i++)snake.push({x:9-i,y:9,fat:0});
  dir=[1,0];q=[];food=null;critter=null;eaten=0;score=0;newHi=false;paused=false;acc=0;
  food=freeCell(1);setSt('play');SFX.start();buzz(15);
}
function interval(){return Math.max(68,165-eaten*3.6);}
function turn(d){
  if(st!=='play'||paused)return;
  var ld=q.length?q[q.length-1]:dir;
  if(q.length>=2)return;
  if(d[0]===-ld[0]&&d[1]===-ld[1])return;
  if(d[0]===ld[0]&&d[1]===ld[1])return;
  q.push(d);
}
function step(){
  if(q.length)dir=q.shift();
  var h=snake[0],nx=h.x+dir[0],ny=h.y+dir[1];
  if(mode===1){nx=(nx+GW)%GW;ny=(ny+GH)%GH;}
  var eatsFood=food&&food.x===nx&&food.y===ny;
  if(nx<0||ny<0||nx>=GW||ny>=GH||occupied(nx,ny,!eatsFood)){die();return;}
  snake.unshift({x:nx,y:ny,fat:0});
  var grew=false;
  if(eatsFood){
    eaten++;score+=5+Math.floor(eaten/5);snake[0].fat=1;grew=true;SFX.eat();buzz(10);
    food=freeCell(1);
    if(eaten%5===0&&!critter){var c=freeCell(2);if(c){critter={x:c.x,y:c.y,t:24,k:critterKind};critterKind=(critterKind+1)%CRITTERS.length;SFX.bonusOn();}}
  }
  if(critter&&ny===critter.y&&(nx===critter.x||nx===critter.x+1)){
    var pts=10+critter.t*2;score+=pts;critter=null;SFX.bonus();buzz([15,30,15]);
  }
  if(!grew)snake.pop();
  if(critter){critter.t--;if(critter.t<=0)critter=null;}
}
function die(){
  if(score>hiS[mode]){hiS[mode]=score;newHi=true;lsSet('snake98_hi_'+mode,score);}
  setSt('dying');SFX.die();buzz([140,70,220]);
}

// ================= input =================
var held={},ptrs={};
var KEYS=[];
(function(){
  var lab=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*','+'],['0','_'],['#','']];
  for(var i=0;i<12;i++){var c=i%3,r=Math.floor(i/3);KEYS.push({id:lab[i][0],sub:lab[i][1],x:92+c*88,y:624+r*36,w:80,h:30});}
})();
// big thumb d-pad: 172 virtual px across; the whole band around it (y NAVTOP..NAVBOT) steers
var NAV={x:180,y:514,r:84,ri:27},NAVTOP=420,NAVBOT=606;
var SOFT=[{id:'menu',x:54,y:440,label:'MENU'},{id:'sound',x:306,y:440,label:'SOUND'}];
function toV(e){var r=C.getBoundingClientRect();return{x:(e.clientX-r.left-OX)/S,y:(e.clientY-r.top-OY)/S};}
function hit(p){
  for(var i=0;i<SOFT.length;i++){var s=SOFT[i];if(Math.abs(p.x-s.x)<38&&Math.abs(p.y-s.y)<26)return s.id;}
  if(p.y>=NAVTOP&&p.y<NAVBOT&&p.x>=10&&p.x<=350)return navDir(p);
  for(i=0;i<KEYS.length;i++){var k=KEYS[i];if(Math.abs(p.x-k.x)<=k.w/2+4&&Math.abs(p.y-k.y)<=k.h/2+6)return k.id;}
  return null;
}
function navDir(p){var dx=p.x-NAV.x,dy=p.y-NAV.y;
  if(Math.hypot(dx,dy)<NAV.ri+6)return'ok';
  if(Math.abs(dx)>Math.abs(dy))return dx>0?'right':'left';return dy>0?'down':'up';}
function inLCD(p){return p.x>=LCD.x-8&&p.x<=LCD.x+LCD.w+8&&p.y>=LCD.y-8&&p.y<=LCD.y+LCD.h+8;}
var MAP={'2':'up','8':'down','4':'left','6':'right','5':'ok'};
var DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function press(id){
  held[id]=(held[id]||0)+1;if(held[id]>1)return;
  buzz(6);unlockAudio();
  var a=MAP[id]||id;
  if(!(st==='play'&&DIRS[a]))SFX.key();
  action(a);
}
function release(id){if(!held[id])return;held[id]--;if(held[id]<=0)delete held[id];}
function powerOn(){setSt('boot');SFX.boot();}
function action(a){
  if(st==='off'){powerOn();return;}
  if(a==='sound'){soundOn=!soundOn;lsSet('snake98_sound',soundOn?'1':'0');if(soundOn)SFX.move();return;}
  if(st==='boot'){setSt('title');return;}
  if(st==='title'){setSt('menu');return;}
  if(a==='menu'){if(st!=='menu'){paused=false;setSt('menu');}return;}
  if(st==='menu'){
    if(a==='up'){menuSel=(menuSel+2)%3;SFX.move();}
    else if(a==='down'){menuSel=(menuSel+1)%3;SFX.move();}
    else if(a==='ok'||a==='right')newGame();
    else if(a==='1'||a==='3'){/* quick picks */}
    return;
  }
  if(st==='play'){
    if(a==='ok'){paused=!paused;SFX.move();return;}
    if(DIRS[a]){if(paused)paused=false;turn(DIRS[a]);}
    return;
  }
  if(st==='over'){
    if(now-stT<600)return;
    if(a==='ok')newGame();
    else if(a==='up'||a==='down'||a==='left'||a==='right')setSt('menu');
  }
}
function lcdTap(p){
  if(st==='off'){powerOn();return;}
  if(st==='boot'){setSt('title');return;}
  if(st==='title'){SFX.key();setSt('menu');return;}
  var fy=(p.y-LCD.y)/PX,fx=(p.x-LCD.x)/PX;
  if(st==='menu'){
    var i=Math.floor((fy-MENU_Y)/MENU_H);
    if(i>=0&&i<3){if(i===menuSel)newGame();else{menuSel=i;SFX.move();}}
    else newGame();
    return;
  }
  if(st==='over'){if(now-stT>600){SFX.key();newGame();}return;}
  if(st==='play'){
    if(paused){paused=false;return;}
    var h=snake[0],hx=GX+h.x*4+1,hy=GY+h.y*4+1,ld=q.length?q[q.length-1]:dir;
    if(ld[0]!==0)turn([0,fy<hy?-1:1]);else turn([fx<hx?-1:1,0]);
  }
}
var SW=16;
C.addEventListener('pointerdown',function(e){
  e.preventDefault();unlockAudio();try{C.setPointerCapture(e.pointerId);}catch(_){}
  var p=toV(e),k=hit(p);
  ptrs[e.pointerId]={k:k,sx:p.x,sy:p.y,swiped:false,lcd:!k&&inLCD(p)};
  if(k)press(k);
},{passive:false});
C.addEventListener('pointermove',function(e){
  var s=ptrs[e.pointerId];if(!s)return;
  if(s.k&&DIRS[s.k]){var p0=toV(e),k2=hit(p0);
    if(k2&&k2!==s.k&&DIRS[k2]){release(s.k);s.k=k2;press(k2);}return;}
  if(!s.lcd)return;
  var p=toV(e),dx=p.x-s.sx,dy=p.y-s.sy;
  if(Math.hypot(dx,dy)>=SW){
    var a=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
    s.swiped=true;s.sx=p.x;s.sy=p.y;
    if(st==='play'){if(paused)paused=false;turn(DIRS[a]);}
    else if(st==='menu'&&(a==='up'||a==='down'))action(a);
    else if(st!=='play')action('ok');
  }
});
function pend(e){var s=ptrs[e.pointerId];if(!s)return;delete ptrs[e.pointerId];
  if(s.k)release(s.k);else if(s.lcd&&!s.swiped&&e.type==='pointerup')lcdTap(toV(e));}
C.addEventListener('pointerup',pend);C.addEventListener('pointercancel',pend);
C.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('dblclick',function(e){e.preventDefault();});
var KB={ArrowUp:'2',ArrowDown:'8',ArrowLeft:'4',ArrowRight:'6',w:'2',s:'8',a:'4',d:'6',Enter:'5',' ':'5',Escape:'menu',m:'sound'};
'1234567890'.split('').forEach(function(c){KB[c]=c;});
window.addEventListener('keydown',function(e){var k=KB[e.key];if(!k)return;e.preventDefault();if(e.repeat)return;press(k);});
window.addEventListener('keyup',function(e){var k=KB[e.key];if(!k)return;held[k]=1;release(k);});
document.addEventListener('visibilitychange',function(){if(document.hidden){held={};ptrs={};if(st==='play')paused=true;}});
window.addEventListener('blur',function(){held={};ptrs={};});

// ================= update =================
function update(dt){
  if(st==='boot'&&now-stT>2600)setSt('title');
  if(st==='play'&&!paused){
    acc+=dt;var g=0;
    while(st==='play'&&g++<5){var iv=interval();if(acc<iv)break;acc-=iv;step();}
    if(acc>400)acc=0;
  }
  if(st==='dying'&&now-stT>1500)setSt('over');
}

// ================= LCD composition =================
var MENU_Y=24,MENU_H=12;
function statusBar(){
  // signal bars
  for(var i=0;i<5;i++)rect(i*2,6-i,1,i+1);
  // battery
  frame(77,1,10,6);pset(87,3);pset(87,4);rect(79,3,2,2);rect(82,3,2,2);rect(85,3,1,2);
}
function drawGridCell(cx,cy){return{x:GX+cx*4,y:GY+cy*4};}
function drawSnake(){
  for(var i=0;i<snake.length;i++){
    var s=snake[i],p=drawGridCell(s.x,s.y);
    if(s.fat){rect(p.x-1,p.y,5,3);rect(p.x,p.y-1,3,5);} else rect(p.x,p.y,3,3);
    var n=snake[i+1];
    if(n){
      if(n.y===s.y&&n.x===s.x+1)rect(p.x+3,p.y,1,3);
      else if(n.y===s.y&&n.x===s.x-1)rect(p.x-1,p.y,1,3);
      else if(n.x===s.x&&n.y===s.y+1)rect(p.x,p.y+3,3,1);
      else if(n.x===s.x&&n.y===s.y-1)rect(p.x,p.y-1,3,1);
    }
  }
  // head: eye + open mouth when food is right ahead
  var h=snake[0],hp=drawGridCell(h.x,h.y);
  if(dir[0]!==0)pset(hp.x+1,hp.y,0);else pset(hp.x,hp.y+1,0);
  var ax=h.x+dir[0],ay=h.y+dir[1];
