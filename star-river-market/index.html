<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script data-kz src="../no-zoom.js"></script>
<meta name="theme-color" content="#101a44">
<link rel="icon" href="assets/coin.webp">
<title>ตลาดน้ำอวกาศ · Star River Market · Kairon Arcade</title>
<meta name="description" content="ตลาดน้ำอวกาศ เกมเปิดร้านขายของบนแม่น้ำดวงดาว จาก Kairon Arcade">
<link rel="stylesheet" href="style.css?v=ed93ab6b">
</head>
<body>
<div id="side-bg"></div>
<div id="game">
  <canvas id="scene"></canvas>

  <div id="hud">
    <div class="pill" id="pill-coin"><img src="assets/coin.webp" alt=""><span id="coins">0</span></div>
    <div class="pill" id="pill-gem"><img src="assets/gem.webp" alt=""><span id="gems">0</span></div>
    <div class="pill" id="pill-lvl"><img src="assets/i_map.webp" alt=""><span id="lvl">Lv. 1</span></div>
  </div>
  <div id="xpbar"><i id="xpfill"></i></div>
  <div id="tools">
    <button class="round" id="btn-mute" aria-label="sound"><svg viewBox="0 0 24 24"><path id="mute-ico" d=""/></svg></button>
    <button class="round txt" id="btn-lang">EN</button>
    <button class="round" id="btn-set" aria-label="settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L14.9 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.4 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.9h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM12.9 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
  </div>
  <div id="journey"><img src="assets/i_map.webp" alt=""><div class="jbar"><i id="jfill"></i></div><img class="j2" src="assets/lock.webp" alt=""><span id="jtxt"></span></div>

  <button id="adbtn" class="hidden" data-k=""><img src="assets/tv.webp" alt=""><b id="adbtn-t">VIP</b></button>
  <div id="hint" class="hidden" data-t="hold"></div>
  <div id="stock" class="hidden">
    <div id="tripbar"><i id="tripfill"></i><span id="tripmk"></span><img id="tripboat" src="assets/i_boat.webp" alt=""><img class="tb-end" src="assets/stall.webp" alt=""></div>
    <div id="chips"></div>
  </div>
  <button id="cta"><span data-t="setoff"></span><small id="cta-sub"></small></button>

  <nav id="bar">
    <button class="nb" data-p="boat"><img src="assets/i_boat.webp" alt=""><span data-t="boat"></span><i class="dot"></i></button>
    <button class="nb" data-p="staff"><img src="assets/i_staff.webp" alt=""><span data-t="staff"></span><i class="dot"></i></button>
    <button class="nb" data-p="goods"><img src="assets/i_goods.webp" alt=""><span data-t="goods"></span><i class="dot"></i></button>
    <button class="nb" data-p="map"><img src="assets/i_map.webp" alt=""><span data-t="map"></span><i class="dot"></i></button>
  </nav>
  <div id="brand">Kairon Arcade</div>

  <div id="toast"></div>
  <div id="tut" class="hidden"><div id="tut-bub"><img src="assets/fang.webp" alt=""><div class="tb"><p id="tut-txt"></p><div class="tut-b"><button id="tut-next">ต่อไป</button><button id="tut-skip">ข้าม</button></div></div></div></div>
  <img id="hand" class="hidden" src="assets/hand.webp" alt="">
  <div id="modal" class="hidden"><div id="sheet"></div></div>
  <div id="ad" class="hidden"></div>
  <div id="splash">
    <div class="sp-in">
      <img src="assets/boat.webp" alt="" class="sp-boat">
      <h1 data-t="title"></h1>
      <p class="sp-sub" data-t="subtitle"></p>
      <div class="sp-tap" data-t="tapStart"></div>
      <div class="sp-brand">Kairon Arcade · ห้องเกม ไครอน</div>
    </div>
  </div>
</div>
<script src="game.js?v=ed93ab6b"></script>
</body>
</html>
