<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script data-kz src="../no-zoom.js"></script>
<meta name="theme-color" content="#f6d9c4">
<link rel="icon" href="logo.png">
<title>ศึกพิทักษ์อาณาจักรขนมไทย · Thai Dessert Kingdom Defense · Kairon Arcade</title>
<meta name="description" content="ศึกพิทักษ์อาณาจักรขนมไทย เกมป้องกันปราสาทเค้กด้วยฮีโร่ขนมไทย จาก Kairon Arcade">
<link rel="stylesheet" href="style.css?v=aa7c868c">
</head>
<body>
<div id="side-bg"></div>
<div id="game">
  <canvas id="scene"></canvas>
  <div id="hud" class="hidden">
    <div id="wavepill"><svg viewBox="0 0 40 40"><path d="M9 5v31" stroke="#fff5e6" stroke-width="3.5" stroke-linecap="round"/><path d="M11 7c6-3 10 3 17 0v13c-7 3-11-3-17 0z" fill="#fff5e6"/></svg><b id="wn">1</b><div id="dots"></div></div>
    <div id="coinpill"><img src="art/coin.webp" alt=""><b id="coins">0</b></div>
    <div id="hpbar"><i id="hpfill"></i></div>
    <button class="round" id="btn-pause" aria-label="pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.6"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.6"/></svg></button>
    <button class="round sm" id="btn-speed">x1</button>
    <button id="btn-call" class="hidden"></button>
  </div>
  <div id="tray" class="hidden"></div>
  <div id="tip" class="hidden"></div>
  <div id="hpanel" class="hidden"></div>
  <div id="banner" class="hidden"><b id="banner-t"></b></div>
  <div id="toast"></div>
  <div id="screen"></div>
  <div id="modal" class="hidden"><div id="sheet"></div></div>
  <div id="ad" class="hidden"></div>
  <div id="splash">
    <div class="sp-in">
      <div class="sp-heroes"><canvas class="pc" data-h="archer"></canvas><canvas class="pc big" data-h="knight"></canvas><canvas class="pc" data-h="mage"></canvas></div>
      <h1 data-t="title"></h1>
      <div class="sub" data-t="sub"></div>
      <button class="btn big mint" id="btn-start" data-t="tapStart"></button>
    </div>
    <div class="br"><img src="logo.png" alt="">Kairon Arcade</div>
  </div>
</div>
<script>/* ad backend: mock (website build) - no SDK, no network, no ad IDs; the game shows its own clearly-labelled test ad */
window.DDAds={name:'mock',ready:function(){return true;}};</script>
<script src="game.js?v=aa7c868c"></script>
</body>
</html>
