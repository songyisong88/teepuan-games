unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
:root{--navy:#0b0e22;--navy2:#141a3e;--navy3:#1d2550;--line:#2f3a78;--yel:#ffd23f;--yel2:#d9a520;--ink:#f4f1e6;--dim:#9aa3cf;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);font-family:Kanit,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:44px;padding:8px 14px;border-radius:6px;font-weight:800;font-size:16px;line-height:1.15;white-space:nowrap;background:var(--yel);color:var(--navy);box-shadow:0 4px 0 var(--yel2),0 6px 0 #05060f;transition:transform .06s}
.btn:active,.btn.hold{transform:translateY(3px);box-shadow:0 1px 0 var(--yel2),0 2px 0 #05060f}
.btn.ghost{background:var(--navy3);color:var(--ink);box-shadow:0 4px 0 #0a0d24,0 6px 0 #05060f;outline:2px solid var(--line);outline-offset:-2px}
.btn.sm{min-height:36px;font-size:14px;padding:6px 10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn[hidden]{display:none}
.ico{width:40px;height:40px;min-height:40px;flex:none;padding:0;border-radius:6px;background:var(--navy3);outline:2px solid var(--line);outline-offset:-2px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:var(--ink)}
.ico:active{transform:translateY(2px)}
.coins{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--yel);background:var(--navy3);padding:4px 10px;border-radius:20px;outline:2px solid var(--line);outline-offset:-2px;font-size:15px;white-space:nowrap;flex:none}
.coin{width:14px;height:14px;border-radius:50%;background:var(--yel);box-shadow:inset -2px -2px 0 var(--yel2);display:inline-block}
/* title */
#scr-title{align-items:center;justify-content:center}
#titleBg{position:absolute;inset:0;width:100%;height:100%}
#titleBox{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;text-align:center;width:min(94vw,560px)}
#logo{margin:0;font-weight:800;font-size:clamp(34px,11vw,72px);line-height:1;color:var(--yel);letter-spacing:.02em;text-shadow:3px 3px 0 #05060f,6px 6px 0 rgba(5,6,15,.55);white-space:nowrap}
#sub{font-size:clamp(16px,4.6vw,22px);font-weight:800;color:var(--ink)}
#tag{font-size:14px;color:var(--dim)}
#titleBtns{display:grid;gap:12px;width:min(78vw,300px);margin-top:14px}
#titleBtns .btn{width:100%;font-size:19px;min-height:54px}
#titleRow{display:flex;gap:10px;justify-content:center}
#brand{position:absolute;bottom:calc(10px + var(--safe-b));left:0;right:0;text-align:center;font-size:13px;color:var(--dim)}
.lang{display:inline-flex;border-radius:6px;overflow:hidden;outline:2px solid var(--line);outline-offset:-2px;flex:none}
.lang button{min-width:52px;min-height:40px;font-weight:800;font-size:14px;color:var(--dim);background:var(--navy3)}
.lang button.on{background:var(--yel);color:var(--navy)}
/* map */
#scr-map{background:linear-gradient(#0b0e22,#10153a)}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(11,14,34,.92);border-bottom:2px solid var(--line)}
.top .ttl{flex:1;min-width:0;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ztabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 12px 0;max-width:760px;width:100%;margin:0 auto}
#ztabs button{min-height:44px;border-radius:6px;background:var(--navy3);outline:2px solid var(--line);outline-offset:-2px;font-weight:800;font-size:13px;color:var(--dim);padding:4px;line-height:1.15}
#ztabs button.on{background:var(--yel);color:var(--navy);outline-color:var(--yel)}
#mapScroll{flex:1;overflow-y:auto;padding:12px 12px calc(24px + var(--safe-b))}
#lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;max-width:760px;margin:0 auto}
.lv{min-height:96px;border-radius:8px;background:var(--navy3);outline:2px solid var(--line);outline-offset:-2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;font-weight:800;box-shadow:0 4px 0 #05060f}
.lv .id{font-size:20px;color:var(--yel)}
.lv .nm{font-size:12px;color:var(--ink);line-height:1.15;text-align:center}
.lv .ss{font-size:15px;color:var(--yel);letter-spacing:2px}
.lv.lock{opacity:.5;cursor:default}
.lv.done{outline-color:var(--yel2)}
/* game */
#scr-game{background:var(--navy)}
#hud{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:2px solid var(--line);background:var(--navy2)}
#lvName{flex:1;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
/* ===== ENGINE (pure, deterministic; shared by game + Node level checker) ===== */
const W=256,H=144,DT=1/120,GRAV=620,JV=200,SPD=56,CW=8,CH=12,LSPD=1.6;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function lampPos(L){const t=L.t,a=L.a,b=L.b;return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function objRect(o,time){let x=o.x,y=o.y;if(o.mv){const k=Math.sin((time/o.mv.p+(o.mv.ph||0))*Math.PI*2);x+=(o.mv.dx||0)*k;y+=(o.mv.dy||0)*k}return[x,y,o.w,o.h]}
function castShadows(st){const out=[];
  st.lamps.forEach((L,i)=>{if(!L.on)return;const[lx,ly,D]=lampPos(L);
    st.objs.forEach((o,j)=>{if(o.glass&&o.glass===L.col)return;const r=objRect(o,st.time),s=D/(D-o.d);
      let x0=lx+(r[0]-lx)*s,x1=lx+(r[0]+r[2]-lx)*s,y0=ly+(r[1]-ly)*s,y1=ly+(r[1]+r[3]-ly)*s;
      x0=Math.max(0,x0);x1=Math.min(W,x1);if(x1-x0<0.5||y0>H-2)return;
      out.push({x:x0,y:y0,w:x1-x0,h:y1-y0,id:i*100+j,li:i,oj:j,col:L.col})})});
  st.shelves.forEach((s,k)=>out.push({x:s[0],y:s[1],w:s[2],h:4,id:1000+k,shelf:1}));
  return out}
function newState(def){
  const st={def,time:0,lamps:def.lamps.map(l=>({a:l.a,b:l.b,t:l.t0||0,tgt:l.t0||0,col:l.col||'w',on:l.on!==false})),
    objs:def.objs.map(o=>Object.assign({},o)),shelves:def.shelves||[],drops:(def.drops||[]).map(d=>({x:d[0],y:d[1],got:false})),
    sw:(def.sw||[]).map(s=>({x:s[0],y:s[1],lamp:s[2],kind:s[3]||'p',in:false})),wisps:def.wisps||[],door:def.door,
    c:null,pj:false,deaths:0,won:false,ev:[],sh:[]};
  st.sh=castShadows(st);spawn(st);return st}
function spawn(st){const[x,y]=st.def.start;st.c={x:x,y:y-CH,vx:0,vy:0,gnd:null,u:.5,coy:0,jb:0,face:1,air:0,cvx:0,avx:0};
  st.lamps.forEach((L,i)=>{L.on=st.def.lamps[i].on!==false;L.col=st.def.lamps[i].col||'w'});st.sw.forEach(s=>{s.in=false});
  const p=groundAt(st,st.c);if(p){st.c.gnd=p.id;st.c.y=p.y-CH;st.c.u=(st.c.x+CW/2-p.x)/p.w}}
function overlapX(c,p){return c.x+CW-1.5>p.x&&c.x+1.5<p.x+p.w}
function groundAt(st,c){const feet=c.y+CH;let best=null,bd=99;
  for(const p of st.sh){if(!overlapX(c,p))continue;const d=p.y-feet;if(d>=-3&&d<=1.5&&Math.abs(d)<bd){bd=Math.abs(d);best=p}}return best}
function find(st,id){for(const p of st.sh)if(p.id===id)return p;return null}
function step(st,inp){
  inp=inp||{};st.ev.length=0;if(st.won)return st;st.time+=DT;
  if(inp.lamp)for(const k in inp.lamp)if(st.lamps[k])st.lamps[k].tgt=clamp(inp.lamp[k],0,1);
  for(const L of st.lamps){const d=L.tgt-L.t;L.t+=clamp(d,-LSPD*DT,LSPD*DT)}
  const prev={};for(const p of st.sh)prev[p.id]=p;st.sh=castShadows(st);const c=st.c;
  // ride the platform we stand on (shadows move/scale with the lamp)
  if(c.gnd!=null){const p=find(st,c.gnd);if(p){const ox=c.x;c.x=p.x+c.u*p.w-CW/2;c.y=p.y-CH;c.cvx=clamp((c.x-ox)/DT,-160,160)}else{c.gnd=null;c.coy=.06;c.avx=c.cvx||0}}else c.cvx=0;
  const dir=(inp.r?1:0)-(inp.l?1:0);if(dir)c.face=dir;c.vx=dir*SPD;c.x=clamp(c.x+c.vx*DT,0,W-CW);
  if(c.gnd!=null){const p=find(st,c.gnd);if(!p||!overlapX(c,p)||Math.abs(p.y-(c.y+CH))>1.5){const q=groundAt(st,c);if(q){c.gnd=q.id;c.y=q.y-CH}else{c.gnd=null;c.coy=.09;c.avx=c.cvx||0}}}
  if(inp.jump&&!st.pj)c.jb=.12;st.pj=!!inp.jump;c.jb-=DT;
  if(c.jb>0&&(c.gnd!=null||c.coy>0)){c.vy=-JV;if(c.gnd!=null)c.avx=c.cvx||0;c.gnd=null;c.coy=0;c.jb=0;st.ev.push('jump')}
  if(c.gnd==null){c.coy-=DT;c.air+=DT;c.x=clamp(c.x+(c.avx||0)*DT,0,W-CW);c.vy=Math.min(c.vy+GRAV*DT,420);const of=c.y+CH;c.y+=c.vy*DT;const nf=c.y+CH;
    if(c.vy>=0){let best=null;for(const p of st.sh){if(!overlapX(c,p))continue;const pp=prev[p.id]?prev[p.id].y:p.y;
        if(of<=Math.max(pp,p.y)+.6&&nf>=p.y&&(!best||p.y<best.y))best=p}
      if(best){c.y=best.y-CH;c.vy=0;c.gnd=best.id;c.avx=0;if(c.air>.12)st.ev.push('land');c.air=0}}
    if(c.y<0){c.y=0;if(c.vy<0)c.vy=0}}
  if(c.gnd!=null){const p=find(st,c.gnd);c.u=(c.x+CW/2-p.x)/p.w;c.air=0}
  const cx=c.x+CW/2,cy=c.y+CH/2;
  if(c.y>H+14){st.deaths++;st.ev.push('fall');spawn(st);return st}
  for(const w of st.wisps){const k=(1-Math.cos(st.time/w.p*Math.PI*2+(w.ph||0)))/2,wx=w.a[0]+(w.b[0]-w.a[0])*k,wy=w.a[1]+(w.b[1]-w.a[1])*k;
    if(Math.abs(wx-cx)<7&&Math.abs(wy-cy)<9){st.deaths++;st.ev.push('zap');spawn(st);return st}}
  for(const d of st.drops)if(!d.got&&Math.abs(d.x-cx)<8&&Math.abs(d.y-cy)<10){d.got=true;st.ev.push('drop')}
  for(const s of st.sw){const inn=Math.abs(s.x+4-cx)<8&&Math.abs(s.y+5-cy)<10;if(inn&&!s.in){const L=st.lamps[s.lamp];if(s.kind==='c')L.col=L.col==='a'?'b':'a';else L.on=!L.on;st.ev.push('switch')}s.in=inn||(s.in&&Math.abs(s.x+4-cx)<14&&Math.abs(s.y+5-cy)<24)}
  const D=st.door;if(cx>D[0]+2&&cx<D[0]+12&&cy>D[1]&&cy<D[1]+20&&c.gnd!=null){st.won=true;st.ev.push('win')}
  return st}
function wispPos(st,w){const k=(1-Math.cos(st.time/w.p*Math.PI*2+(w.ph||0)))/2;return[w.a[0]+(w.b[0]-w.a[0])*k,w.a[1]+(w.b[1]-w.a[1])*k]}
/* scripted solution runner: yields one input object per fixed step */
function* runSol(st,sol){const c=()=>st.c,d0=st.deaths;
  for(let oi=0;oi<sol.length;oi++){const op=sol[oi];st.opi=oi;let n=0;const T=op[0];if(st.deaths>d0)return;
    if(T==='L'){while(Math.abs(st.lamps[op[1]].t-op[2])>1e-6&&n++<3000)yield{lamp:{[op[1]]:op[2]}}}
    else if(T==='R'){while(c().x<op[1]&&st.deaths===d0&&n++<4000)yield{r:1}}
    else if(T==='B'){while(c().x>op[1]&&st.deaths===d0&&n++<4000)yield{l:1}}
    else if(T==='J'){const d=op[1],X=op[2];yield{jump:1,r:d>0,l:d<0};
      do{const cc=c();const go=X==null||(d>0?cc.x<X:cc.x>X);yield{r:d>0&&go,l:d<0&&go}}while(c().gnd==null&&st.deaths===d0&&n++<600)}
    else if(T==='W'){const k=Math.round(op[1]/DT);for(let i=0;i<k;i++)yield{}}
    else if(T==='S'){while(n++<6000){const ph=(st.time/op[1])%1;if(Math.abs(ph-op[2])<.006)break;yield{}}}
    if(st.won)return}}
function simulate(def,sol,maxT){const st=newState(def);const it=runSol(st,sol);let deaths=0;
  for(let i=0;i<(maxT||120)/DT;i++){const r=it.next();step(st,r.done?{}:r.value);if(st.won||st.deaths)break;if(r.done&&!st.won){for(let k=0;k<120;k++){step(st,{});if(st.won)break}break}}
  return st}
/*ENGINE_END*/


/*LEVELS*/
/* helper: object whose shadow is rect (X,Y,Wd,Ht) when the lamp is at L=[lx,ly,D] */
function ob(X,Y,Wd,Ht,d,L,k,ex){const s=L[2]/(L[2]-d);return Object.assign({x:L[0]+(X-L[0])/s,y:L[1]+(Y-L[1])/s,w:Wd/s,h:Ht/s,d:d,k:k||'box'},ex||{})}
const LEVELS=[
/* ---------- ZONE 1 : BEDROOM ---------- */
{id:'1-1',z:0,n:{th:'แสงแรก',en:'First Light'},
 lamps:[{a:[180,130,160],b:[40,130,160]}],
 objs:[ob(20,110,60,40,80,[180,130,160],'book')],
 shelves:[[0,110,40],[214,110,42]],start:[10,110],door:[228,90],drops:[[200,88]],
 tip:{th:'ยืนบนเงา แล้วเลื่อนโคมไฟ เงาจะพาเราไป',en:'Stand on the shadow, then slide the lamp. The shadow carries you.'},
 sol:[['R',40],['L',0,1],['R',196],['J',0],['R',230]]},
{id:'1-2',z:0,n:{th:'เงายืดตัว',en:'Tall Tale'},
 lamps:[{a:[128,140,220],b:[128,140,100]}],
 objs:[ob(30,116,122,40,80,[128,140,220],'toy')],
 shelves:[[0,118,30],[210,60,46]],start:[8,118],door:[230,40],drops:[[120,30]],
 tip:{th:'โคมไฟที่ใกล้ของ ทำให้เงาใหญ่ขึ้น',en:'A lamp close to an object makes a bigger shadow.'},
 sol:[['R',60],['L',0,1],['R',116],['J',0],['R',196],['J',1],['R',234]]},
{id:'1-3',z:0,n:{th:'ใกล้ไกลไม่เท่ากัน',en:'Near and Far'},
 lamps:[{a:[200,120,180],b:[56,120,180]}],
 objs:[ob(40,110,50,40,30,[200,120,180],'cup'),ob(-128,84,50,70,120,[200,120,180],'mobile')],
 shelves:[[0,110,40],[212,70,44]],start:[10,110],door:[228,50],drops:[[150,60]],
 tip:{th:'ของที่อยู่ใกล้โคม เงาจะเลื่อนเร็วกว่า',en:'Things near the lamp have shadows that move faster.'},

/* =====================================================================
   ADS ADAPTER  — one switch: PROVIDER = 'fake' (GitHub Pages demo) | 'y8' (Y8 build)
   Game calls:  Ads.available()                                   -> ad buttons are shown only when true
                Ads.rewarded(name, rewardText, onReward, onNone)   (ONLY from the player's own tap)
                Ads.interstitial(name, done)                      (only at natural breaks, >= 3 min apart, never in first 3 min)
   Reward is granted ONLY when the ad was watched to the end (fake: countdown done / Y8: adViewed).
   Game is paused + muted while any ad is on screen.
   ===================================================================== */
const PROVIDER='fake';
const Ads=(()=>{
  const INTER_GAP=180000,AD_SECONDS=5,NO_START_MS=8000;
  let busy=false,lastAdAt=0,H={pause(){},resume(){},ready(){},locale(){},blocked(){}};
  let y8Sdk=null,inited=false;
  const Y=window.Y8_CONFIG||{};
  const CONFIGURED=!!(Y.APP_ID&&Y.GAME_ID&&!/^REPLACE_WITH_/.test(Y.APP_ID)&&!/^REPLACE_WITH_/.test(Y.GAME_ID));
  function y8init(){
    if(inited)return;
    if(!CONFIGURED){console.warn('[Y8] APP_ID / GAME_ID not set yet - ads disabled, game runs normally');return}
    if(!window.y8||typeof window.y8.sdk!=='function')return;
    try{y8Sdk=y8.sdk();y8Sdk.init({appId:Y.APP_ID,autoLogin:true},{gameId:Y.GAME_ID,preloadAdBreaks:'on',sound:'on',onReady:()=>{}});
      try{y8Sdk.onAuth(()=>{})}catch(e){}
      inited=true;H.ready();
      try{const loc=y8Sdk.getPlatformLocale&&y8Sdk.getPlatformLocale();if(loc&&loc.then)loc.then(l=>H.locale(l)).catch(()=>{});else H.locale(loc)}catch(e){}
      try{const b=y8Sdk.isBlacklisted&&y8Sdk.isBlacklisted();if(b&&b.then)b.then(v=>{if(v)H.blocked()}).catch(()=>{})}catch(e){}
    }catch(e){console.warn('[Y8] init failed',e);y8Sdk=null;inited=false}
  }
  if(PROVIDER==='y8'){window.addEventListener('y8sdk.ready',y8init,{once:true});if(window.y8&&window.y8.emitReadyEvent){try{window.y8.emitReadyEvent()}catch(e){}}}
  function y8brk(type,name,onViewed,cb){
    let started=false,done=false,paused=false,viewed=false,afterT=0;
    const pause=()=>{if(!paused){paused=true;H.pause()}},resume=()=>{if(paused){paused=false;H.resume()}};
    const finish=st=>{if(done)return;done=true;clearTimeout(wd);clearTimeout(afterT);resume();busy=false;if(started)lastAdAt=performance.now();try{cb({viewed,shown:started,st})}catch(e){console.error(e)}};
    const wd=setTimeout(()=>{if(!started)finish('timeout')},NO_START_MS);
    busy=true;
    try{const o={type,name,beforeAd:()=>{started=true;clearTimeout(wd);pause()},afterAd:()=>{resume();afterT=setTimeout(()=>finish('afterAd'),1500)},adBreakDone:i=>finish((i&&i.breakStatus)||'other')};
      if(type==='reward'){o.beforeReward=f=>f();o.adViewed=()=>{if(viewed)return;viewed=true;try{onViewed()}catch(e){console.error(e)}};o.adDismissed=()=>{}}
      const p=y8Sdk.showAd(o);if(p&&p.catch)p.catch(()=>finish('error'))}catch(e){finish('error')}
  }
  let relabelAd=null;
  function fake(kind,rewardText,cb){const rt=()=>typeof rewardText==='function'?rewardText():(rewardText||'');
    const q=id=>document.getElementById(id);const ov=q('adov'),num=q('adNum'),bar=q('adBar'),cl=q('adClose');
    const labels=()=>{q('adLab').textContent=T('โฆษณาตัวอย่าง (ยังไม่ใช่โฆษณาจริง)','SAMPLE AD (not a real ad)');
      q('adKind').textContent=kind==='reward'?T('รางวัล: ','Reward: ')+rt():T('โฆษณาคั่น (ไม่มีรางวัล)','Break ad (no reward)');
      q('adS1').textContent=T('พื้นที่แสดงคลิปโฆษณา','Ad video area');
      q('adS2').textContent=T('บนเว็บเกมจริง (เช่น Y8) ตรงนี้จะเป็นคลิปโฆษณา เดโมนี้ไม่เรียกเครือข่ายโฆษณาและไม่เก็บข้อมูลใดๆ','On a real game portal (e.g. Y8) an ad video plays here. This demo calls no ad network and collects no data.')};
    const t0=performance.now();let fin=false,closed=false;
    const paint=()=>{labels();const el=(performance.now()-t0)/1000,left=Math.max(0,AD_SECONDS-el);fin=left<=0;num.textContent=fin?'OK':String(Math.ceil(left));bar.style.width=Math.min(100,el/AD_SECONDS*100)+'%';
      if(kind==='reward'){cl.disabled=false;cl.textContent=fin?T('ปิด และรับรางวัล','Close & get reward'):T('ปิด (ไม่ได้รับรางวัล)','Close (no reward)')}
      else{cl.disabled=!fin;cl.textContent=fin?T('ปิดโฆษณา','Close ad'):T('ปิดได้ใน ','Close in ')+Math.ceil(left)+T(' วินาที','s')}
      cl.classList.toggle('done',fin)};
    paint();const iv=setInterval(paint,100);relabelAd=paint;
    cl.onclick=()=>{if(closed||cl.disabled)return;closed=true;clearInterval(iv);relabelAd=null;ov.classList.remove('on');cl.onclick=null;cb(fin)};
    ov.classList.add('on');
  }
  return{
    setHooks(h){Object.assign(H,h)},
    relabel(){if(relabelAd)relabelAd()},
    available(){return PROVIDER==='fake'||(inited&&!!y8Sdk)},
    busy:()=>busy,
    canInter:()=>!busy&&Ads.available()&&performance.now()-lastAdAt>=INTER_GAP,
    rewarded(name,rewardText,onReward,onNone){
      if(busy)return;
      if(!Ads.available()){onNone&&onNone('unavailable');return}
      if(PROVIDER==='fake'){busy=true;H.pause();fake('reward',rewardText,ok=>{busy=false;lastAdAt=performance.now();H.resume();ok?onReward():(onNone&&onNone('dismissed'))});return}
      y8brk('reward',name,onReward,r=>{if(!r.viewed&&onNone)onNone(r.shown?'dismissed':'unavailable')});
    },
    interstitial(name,done){
      const go=()=>{try{done&&done()}catch(e){console.error(e)}};
      if(busy||!Ads.available()||performance.now()-lastAdAt<INTER_GAP){go();return}
      if(PROVIDER==='fake'){busy=true;H.pause();fake('inter','',()=>{busy=false;lastAdAt=performance.now();H.resume();go()});return}
      y8brk('next',name,null,()=>go());
    },
    
  };
})();

function demoEnd(){G.demo=null;$('demoBar').classList.remove('on');startLevel(G.i);toast(T('ตาเราแล้ว!','Your turn!'))}
/* ---------- pause / settings / shop / daily ---------- */
function pauseMenu(){if(G.st&&G.st.won)return;G.pauseOpen=true;MODAL.open(p=>{p.appendChild(el('h2',null,T('พักเกม','Paused')));
  const r=el('div','btns one');r.append(btn(T('เล่นต่อ','Resume'),'',()=>{G.pauseOpen=false;MODAL.close()}),btn(T('เริ่มด่านใหม่','Restart level'),'ghost',()=>{G.pauseOpen=false;MODAL.close();restart()}),btn(T('เลือกด่าน','Level select'),'ghost',()=>{G.pauseOpen=false;MODAL.close();show('map')}));p.appendChild(r);
  if(skipAllowed())r.appendChild(btn(T('ข้ามด่าน (ดูโฆษณา)','Skip level (watch ad)'),'ghost',()=>{G.pauseOpen=false;MODAL.close();skipOffer()}));
  setRows(p);p.appendChild(el('div','note',T('คีย์บอร์ด: ← → เดิน, ↑/Space กระโดด, Q/E เลื่อนโคม 1, Z/C โคม 2, R เริ่มใหม่','Keys: ← → walk, ↑/Space jump, Q/E lamp 1, Z/C lamp 2, R restart')))})}
function setRows(p){const s=el('div','set');const tog=(lbl,k)=>{const l=el('label');l.append(el('span',null,lbl));const t=el('button','tog'+(S.set[k]?' on':''));t.setAttribute('aria-label',lbl);t.onclick=()=>{S.set[k]=!S.set[k];save();AU.apply();MODAL.re()};l.appendChild(t);s.appendChild(l)};
  tog(T('เพลง','Music'),'mus');tog(T('เสียงเอฟเฟกต์','Sound effects'),'sfx');const l=el('label');l.append(el('span',null,T('ภาษา','Language')));l.appendChild(langBox());s.appendChild(l);p.appendChild(s)}
function langBox(){const b=el('div','lang');['th','en'].forEach(k=>{const x=el('button',S.lang===k?'on':'',k==='th'?'ไทย':'EN');x.dataset.l=k;x.onclick=()=>setLang(k);b.appendChild(x)});return b}
function settings(){MODAL.open(p=>{p.appendChild(el('h2',null,T('ตั้งค่า','Settings')));setRows(p);const r=el('div','btns one');
  r.append(btn(T('ล้างข้อมูลการเล่น','Reset progress'),'ghost',()=>MODAL.open(q=>{q.appendChild(el('h2',null,T('ล้างข้อมูลทั้งหมด?','Erase all progress?')));const rr=el('div','btns');rr.append(btn(T('ล้างเลย','Erase'),'',()=>{localStorage.removeItem(SKEY);location.reload()}),btn(T('ยกเลิก','Cancel'),'ghost',()=>settings()));q.appendChild(rr)})),
    btn(T('ปิด','Close'),'',()=>MODAL.close()));p.appendChild(r);p.appendChild(el('div','note',"UMBRAMBLE '99 · Kairon Arcade · ห้องเกม ไครอน"))})}
function shop(){MODAL.open(p=>{p.appendChild(el('h2',null,T('ตู้ชุดหุ่นเงา','Puppet wardrobe')));const lst=el('div','list');
  SKINS.forEach(sk=>{const it=el('div','item');const cv=document.createElement('canvas');cv.width=12;cv.height=14;const cg=cv.getContext('2d');drawGuy(cg,2,1,1,'idle',sk.id,1);it.appendChild(cv);it.appendChild(el('div','nm',sk.n[S.lang]));
    const own=S.owned.includes(sk.id);let b;if(S.skin===sk.id)b=btn(T('ใส่อยู่','Wearing'),'ghost',null);else if(own)b=btn(T('ใส่','Wear'),'ghost',()=>{S.skin=sk.id;save();MODAL.re()});
    else b=btn('◉ '+sk.cost,'',()=>{if(S.coins<sk.cost){AU.sfx.err();toast(T('เหรียญไม่พอ','Not enough coins'));return}S.coins-=sk.cost;S.owned.push(sk.id);S.skin=sk.id;save();setCoins();AU.sfx.coin();MODAL.re()});
    b.classList.add('sm');it.appendChild(b);lst.appendChild(it)});p.appendChild(lst);const r=el('div','btns one');r.appendChild(btn(T('ปิด','Close'),'',()=>MODAL.close()));p.appendChild(r)})}
function daily(){rollDay();if(S.daily)return;MODAL.open(p=>{p.appendChild(el('h2',null,T('ของขวัญประจำวัน','Daily gift')));
  const claim=n=>{if(S.daily)return;S.daily=true;addCoins(n);save();MODAL.close();renderMap();toast('+'+n+' '+T('เหรียญ','coins'))};
  if(Ads.available())offer(p,T('รางวัล: ดูโฆษณาเพื่อรับ 40 เหรียญ (แทน 20)','Reward: watch an ad to get 40 coins (instead of 20)'),()=>watch('daily_bonus',()=>T('40 เหรียญ','40 coins'),()=>claim(40)),()=>claim(20),T('รับ 20 เหรียญ','Take 20'));
  else{p.appendChild(el('p',null,T('รับ 20 เหรียญฟรีวันนี้','Free 20 coins today')));const r=el('div','btns one');r.appendChild(btn(T('รับ 20 เหรียญ','Take 20'),'',()=>claim(20)));p.appendChild(r)}})}
/* ---------- map ---------- */
let zoneTab=0;
function renderMap(){rollDay();$('mapTtl').textContent=T('เลือกด่าน','Choose a level')+'  ★ '+totalStars()+'/60';$('bDaily').textContent=T('ของขวัญ','Gift');$('bDaily').hidden=S.daily;setCoins();
  const tabs=$('ztabs');tabs.innerHTML='';ZP.forEach((z,k)=>{const b=el('button','zt'+(k===zoneTab?' on':''),(k+1)+'. '+z.name[S.lang]);b.onclick=()=>{AU.sfx.ui();zoneTab=k;renderMap()};tabs.appendChild(b)});
  const gr=$('lvgrid');gr.innerHTML='';LEVELS.forEach((d,i)=>{if(d.z!==zoneTab)return;const u=unlocked(i),r=S.lv[d.id];const b=el('button','lv'+(u?'':' lock')+(r&&r.done?' done':''));b.dataset.i=i;
    b.appendChild(el('span','id',u?d.id:'🔒'));b.appendChild(el('span','nm',u?d.n[S.lang]:T('ล็อกอยู่','Locked')));const s=starsOf(i);b.appendChild(el('span','ss','★'.repeat(s)+'☆'.repeat(3-s)));
    if(u)b.onclick=()=>{AU.unlock();AU.sfx.ui();startLevel(i)};gr.appendChild(b)})}
/* ---------- language ---------- */
function setLang(l){S.lang=l;save();document.documentElement.lang=l;renderAll();MODAL.re();Ads.relabel()}
function renderAll(){document.title=T("UMBRAMBLE '99 — เดินบนเงา | Kairon Arcade","UMBRAMBLE '99 — Shadow-Walk Puzzle | Kairon Arcade");
  $('sub').textContent=T('เกมเดินบนเงา ปริศนาแสงไฟ','A shadow-walk puzzle of lamps & light');$('tag').textContent=T('เลื่อนโคมไฟ ให้เงาเป็นทางเดิน','Move the lamp. Walk the shadows.');
  $('bPlay').textContent=T('เล่นเลย','PLAY');$('brand').textContent='Kairon Arcade · ห้องเกม ไครอน';
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===S.lang));
  if(scr==='map')renderMap();if(scr==='game'&&G.st){renderHud();renderDemoBar();const tip=$('tip');tip.textContent=LEVELS[G.i].tip[S.lang]}}
/* ---------- fit ---------- */
function fit(){const b=$('board'),cv=$('cv');if(!b||!cv)return;const W=b.clientWidth,H=b.clientHeight;if(!W||!H)return;let s=Math.min(W/VW,H/VH);if(s>=2)s=Math.floor(s*2)/2;
  cv.style.width=Math.floor(VW*s)+'px';cv.style.height=Math.floor(VH*s)+'px';const tc=$('titleBg');if(tc){tc.width=Math.ceil(innerWidth/3);tc.height=Math.ceil(innerHeight/3)}}
addEventListener('resize',fit);
/* ---------- boot ---------- */
function boot(){load();document.documentElement.lang=S.lang;const cv=$('cv');cv.width=VW;cv.height=VH;g=cv.getContext('2d');tg=$('titleBg').getContext('2d');
  $('logo').textContent="UMBRAMBLE '99";
  $('bPlay').onclick=()=>{AU.unlock();AU.sfx.ui();show('map')};$('bSetT').onclick=()=>{AU.unlock();settings()};document.querySelectorAll('#langT button').forEach(b=>b.onclick=()=>{AU.unlock();setLang(b.dataset.l)});
  $('bMapBack').onclick=()=>{AU.sfx.ui();show('title')};$('bShop').onclick=()=>{AU.sfx.ui();shop()};$('bDaily').onclick=()=>{AU.sfx.ui();daily()};$('bSetM').onclick=()=>{AU.sfx.ui();settings()};
  $('bPause').onclick=()=>{AU.sfx.ui();pauseMenu()};$('bHint').onclick=()=>{AU.unlock();AU.sfx.ui();doHint()};$('bRestart').onclick=()=>{AU.sfx.ui();restart()};$('bDemoStop').onclick=()=>demoEnd();
  holdBtn('bL','l');holdBtn('bR','r');holdBtn('bJump','j');
  const bd=$('cv');let drag=false;bd.addEventListener('pointerdown',e=>{AU.unlock();if(G.demo||MODAL.fn)return;if(boardPointer(e,true)){drag=true;bd.setPointerCapture(e.pointerId);e.preventDefault()}});
  bd.addEventListener('pointermove',e=>{if(drag)boardPointer(e,false)});bd.addEventListener('pointerup',()=>drag=false);bd.addEventListener('pointercancel',()=>drag=false);
  Ads.setHooks({pause(){G.paused=true;if(AU.ctx())AU.ctx().suspend().catch(()=>{})},resume(){if(!MODAL.fn)G.paused=false;if(AU.ctx())AU.ctx().resume().catch(()=>{})},ready(){renderAll()},locale(l){},blocked(){}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&scr==='game'&&!MODAL.fn&&G.st&&!G.st.won)pauseMenu()});
  renderAll();show('title');fit();requestAnimationFrame(frame)}


</script>
<script>boot()</script>
</body>
</html>
